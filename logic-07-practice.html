</main><script id="questions-data" type="application/json">{"bank":{"version":1,"unitId":"logic-07","label":"仿公考题型 · 原创练习","questions":[{"id":"q-logic-07-001","type":"定义判断","difficulty":2,"stem":"设例：下列哪项明确构成由前提到结论的推理？","options":["甲已登记且列入名单；乙已登记且列入名单","如果甲登记就列入名单，甲是否登记仍未确定","甲登记与甲入名单这两件事，都是已知事实","凡完成登记者列入名单，甲已登记，故甲列入名单"],"answerIndex":3,"explanation":"本讲把推理看作从一个或一些判断得出另一个判断；正确项有明确的根据和推出关系。","whyWrong":["两组相伴事实没有明确由前提推出结论的关系。","只陈述条件和未知状态，尚未完成具体推出。","列举两件事实不等于把其中一件作为推出另一件的依据。","正确"],"basis":{"paras":[],"excerptIds":["e-inference","e-premise","e-sentence"],"anchors":[]},"knowledge":["premise"]},{"id":"q-logic-07-002","type":"逻辑判断","difficulty":2,"stem":"设例：甲说“名单已公布，所以所有人员都符合资格”。仅凭这句话，评价最恰当的是","options":["结论比前提包含内容多，所以不属于任何推理","使用所以标出了推断意图，但联系仍需核查","名单与资格属于同一工作，所以推断形式有效","使用所以说明结论已经获得前提的充分支持"],"answerIndex":1,"explanation":"本讲指出推理标志词不能代替前提与结论之间的真实逻辑联系。","whyWrong":["无效推断仍可作为推理加以分析。","正确","主题相关不保证逻辑蕴涵。","把语言标志误作有效性证明。"],"basis":{"paras":[],"excerptIds":["e-marker","e-invalidso"],"anchors":[]},"knowledge":["markers"]},{"id":"q-logic-07-003","type":"逻辑判断","difficulty":3,"stem":"设例：某推理形式有效，但有一个前提不真实。下列说法正确的是","options":["它的结论必定不真实，因为错误可以直接传递","它不再属于推理，因为前提必须全部得到证实","它不能保证结论真实，但结论仍可能碰巧真实","它的结论必定真实，因为有效形式保证任何结论"],"answerIndex":2,"explanation":"本讲要求同时检查前提真实性和推理形式；前提有假只使真结论失去保证，不强制结论为假。","whyWrong":["把不能保证真误作保证假。","推理可以包含待检验甚至错误的前提。","正确","忽略有效形式保真以真前提为条件。"],"basis":{"paras":[],"excerptIds":["e-two","e-notguaranteed","e-combination","e-boundary"],"anchors":[]},"knowledge":["two-checks"]},{"id":"q-logic-07-004","type":"逻辑判断","difficulty":3,"stem":"设例：甲的结论经独立调查证实为真。由此能确定甲原来的推理形式有效吗？","options":["不能，结论真实与原推导是否有效仍须分别检查","能，结论真实意味着原前提必然真实","能，独立调查补足了原来缺少的推出关系","不能，只要用过独立调查就说明原推理必定无效"],"answerIndex":0,"explanation":"本讲区分结论的真假与推导的有效性，真实结论也可能由无效推导碰巧得到。","whyWrong":["正确","真结论不能反推所有前提真。","新证据证明结论不等于修复原推导。","需调查不证明原形式无效。"],"basis":{"paras":[],"excerptIds":["e-two","e-notguaranteed","e-combination","e-boundary"],"anchors":[]},"knowledge":["two-checks"]},{"id":"q-logic-07-005","type":"常识判断","difficulty":2,"stem":"依据本讲，下列对推理作用的概括最恰当的是","options":["推理只能重复已经明说的结论，不能扩大任何认识","推理能够替代事实调查，独立保证前提本身真实","推理能够从已有认识出发形成认识，也能用于论证","推理只在发现新知识时有用，在证明中并无作用"],"answerIndex":2,"explanation":"本讲介绍推理在获得认识和证明认识方面的作用，同时不取消事实调查。","whyWrong":["忽视推理把已有判断联系起来的认识作用。","把思维工具当作事实来源的替代物。","正确","人为割裂推理与证明。"],"basis":{"paras":[],"excerptIds":["e-new","e-proof","e-premise"],"anchors":[]},"knowledge":["value"]},{"id":"q-logic-07-006","type":"定义判断","difficulty":2,"stem":"设例：先逐一核查某封闭名册的全部成员，再据此断定全体成员已登记。这主要属于","options":["由一般规则推及某个对象的演绎推理","只把同一句话换种表达的判断转换","由两个对象相似推测另一性质的类比推理","从个别情况形成一般判断的归纳推理"],"answerIndex":3,"explanation":"本讲区分演绎、归纳和类比；从全部个别对象核查走向总体判断是归纳。","whyWrong":["方向不是一般到个别。","总体判断对逐项事实作了归纳。","不是两对象间按相似性推测。","正确"],"basis":{"paras":[],"excerptIds":["e-kinds","e-boundary"],"anchors":[]},"knowledge":["types"]},{"id":"q-logic-07-007","type":"定义判断","difficulty":2,"stem":"设例：凡已备案项目都可检索，甲项目已备案，故甲可检索。这主要属于","options":["依据已知一般规则推出特定结论的演绎","根据同一概念的内涵和外延作出的定义说明","根据甲与已备案者相似推测其可检索的类比","根据甲的个别情况确立一般联系的归纳"],"answerIndex":0,"explanation":"本讲将依据一般性前提推导特定结论的这种方式归入演绎推理。","whyWrong":["正确","这里不是定义，而是规则适用于个体的推导。","甲已确属规则的适用范围，不是仅凭相似推测。","一般联系是前提，并非从甲例中总结所得。"],"basis":{"paras":[],"excerptIds":["e-kinds","e-boundary"],"anchors":[]},"knowledge":["types"]},{"id":"q-logic-07-008","type":"定义判断","difficulty":2,"stem":"设例：甲乙两个窗口业务流程相似，甲实行预约后拥堵减少，故推测乙也可能如此。这主要属于","options":["依据相关相似之处推测另一性质的类比","从已核查全部窗口概括总体规律的归纳","从普遍有效规则推出必然结果的演绎","从已知结果倒推唯一原因的条件推断"],"answerIndex":0,"explanation":"本讲将对象间由已知相似之处推测其他相似之处的推理称为类比；结论可靠性仍需检查。","whyWrong":["正确","没有核查全部窗口。","题设未提供普遍必然规则。","没有把观察结果倒推唯一原因。"],"basis":{"paras":[],"excerptIds":["e-kinds","e-boundary"],"anchors":[]},"knowledge":["types"]},{"id":"q-logic-07-009","type":"逻辑判断","difficulty":3,"stem":"设例：某段文字没有“所以”，但依次写明普遍规则、符合规则的对象和相应结果。最恰当的分析是","options":["没有标志词，最多只能识别规则而不能识别推导","只要是一般规则加个别情况，结论就一定推得出","结论恰好符合该对象事实，就说明隐含推导有效","能否构成推理应看判断间联系，而非只看标志词"],"answerIndex":3,"explanation":"本讲强调识别推理应看实际思想联系；语言标志可以省略，也可能被误用。","whyWrong":["推出关系可由语义表达，不以标志词为必要条件。","还须检查量、质及联系方向，不能凭结构轮廓担保。","事实符合不能倒推形式有效。","正确"],"basis":{"paras":[],"excerptIds":["e-marker","e-invalidso","e-inference","e-premise","e-sentence"],"anchors":[]},"knowledge":["markers","premise"]},{"id":"q-logic-07-010","type":"逻辑判断","difficulty":2,"stem":"设例：欲保证一次演绎的结论真实，下列哪组条件符合本讲要求？","options":["前提全部真实，且前提与结论主题相关","前提全部真实，且推理形式有效","推导形式有效，且部分前提经核实为真","结论已被证实，且前提与结论并不矛盾"],"answerIndex":1,"explanation":"本讲把前提真实和形式有效作为获得可靠演绎结论的两个方面。","whyWrong":["主题相关不保证有效推出。","正确","全部用于保真的前提须真，仅部分不够。","独立证实结论不证明原推导可靠。"],"basis":{"paras":[],"excerptIds":["e-two","e-notguaranteed","e-combination","e-boundary"],"anchors":[]},"knowledge":["two-checks"]},{"id":"q-logic-07-011","type":"逻辑判断","difficulty":3,"stem":"设例：甲认为“结论包含在演绎前提中，所以演绎对认识毫无作用”。哪项最能回应？","options":["凡结论不超出前提范围的活动，都只属于语句改写","前提与结论逻辑相连，不等于人已明确认识其联系","演绎能揭示联系，所以可以不以真实前提为根据","只要结论在读者看来新颖，就证明推理形式有效"],"answerIndex":1,"explanation":"本讲把从已有判断中得出结论视为认识活动；逻辑上的包含不等于认识者已经明知结果。","whyWrong":["逻辑上被包含不等于没有认识上的推出过程。","正确","认识作用不能取消前提要求。","认识上的新颖不能证明形式有效。"],"basis":{"paras":[],"excerptIds":["e-new","e-proof","e-premise","e-two","e-notguaranteed","e-combination","e-boundary"],"anchors":[]},"knowledge":["value","two-checks"]},{"id":"q-logic-07-012","type":"逻辑判断","difficulty":3,"stem":"设例：“甲项目可受理，因为材料齐全，而所有材料齐全的项目均可受理。”其中结论是","options":["甲项目提交的材料已经齐全","甲项目属于可以受理的项目","所有材料齐全的项目均可受理","凡可受理项目的材料都应齐全"],"answerIndex":1,"explanation":"本讲指出结论由推断角色决定，不必放在句子最后；本句开头就是被说明的结论。","whyWrong":["这是个别事实前提。","正确","这是一般性前提。","这是原一般规则的逆命题，原文没有推出它。"],"basis":{"paras":[],"excerptIds":["e-inference","e-premise","e-sentence"],"anchors":[]},"knowledge":["premise"]},{"id":"q-logic-07-013","type":"逻辑判断","difficulty":3,"stem":"设例：已知一个有效演绎的结论为假。关于前提必能推出的是","options":["全部前提均已真实","全部前提都不真实","至少一个前提不真实","至少一个前提真实"],"answerIndex":2,"explanation":"本讲认为真前提经有效演绎不会导出假结论；反向可知假结论时不能所有前提都真。","whyWrong":["与有效演绎的保真性冲突。","至少一个假不等于全假。","正确","也可能所有前提都假。"],"basis":{"paras":[],"excerptIds":["e-two","e-notguaranteed","e-combination","e-boundary"],"anchors":[]},"knowledge":["two-checks"]},{"id":"q-logic-07-014","type":"常识判断","difficulty":2,"stem":"依据本讲，下列关于推理识别与评价的说法错误的是","options":["识别推理要看判断之间是否存在推导意图","评价推理不能只检查是否出现推理标志词","前提真实性和推导有效性需要分别考察","结论符合实际就足以证明原推理完全可靠"],"answerIndex":3,"explanation":"本讲区分识别、形式评价与真实性检查；结论碰巧为真不能证明原过程可靠。","whyWrong":["符合实际思想联系的识别要求。","符合标志词不足以担保推理的说明。","符合获得可靠结论的两方面要求。","正确"],"basis":{"paras":[],"excerptIds":["e-marker","e-invalidso","e-two","e-notguaranteed","e-combination","e-boundary"],"anchors":[]},"knowledge":["markers","two-checks"]},{"id":"q-logic-07-015","type":"类比推理","difficulty":3,"stem":"一般规则∶个别结论","options":["已知规则∶特定应用","真实结论∶真实前提","个别事实∶一般结论","相关相似∶性质推测"],"answerIndex":0,"explanation":"本讲按推理方向比较，题干表现一般前提向特定对象的演绎应用，正确项保留这一方向。","whyWrong":["正确","从结论真不能倒推前提真。","同属认识推展，但方向为个别到一般。","同属推理，但按相似性推测而非规则应用。"],"basis":{"paras":[],"excerptIds":["e-kinds","e-boundary","e-new","e-proof","e-premise"],"anchors":[]},"knowledge":["types","value"]}],"open":[{"id":"o-logic-07-001","type":"论证分析","material":{"text":"设例：某报告写“材料已装订，所以申请一定合格”。后来核查该申请确实合格，撰写者据此认为原推理有效，且装订本身就是充分依据。","sourceIds":[]},"prompt":"区分结论真实、前提真实和推理有效，提出修正论证的办法。（150—220字）","points":["申请经核查合格，只能直接确认结论真实。","装订是否完成需核实，但即使真实也未必支持合格。","所以只表示推断意图，不能建立装订与合格的必然联系。","应列明合格标准并核查相应条件，以相关且真实的前提论证。"],"basis":{"paras":[],"excerptIds":["e-two","e-notguaranteed","e-combination","e-boundary","e-marker","e-invalidso"],"anchors":[]}},{"id":"o-logic-07-002","type":"论证分析","material":{"text":"设例：甲组逐项核实名册中全部成员已登记；乙组按凡登记者可领证及小李已登记，判断小李可领证；丙组因两个站点流程相似，推测适用于一站的安排也适用于另一站。","sourceIds":[]},"prompt":"分别辨认三种推理的根据与结论，并说明为什么不能用一种可靠性标准简单评价三者。（150—220字）","points":["甲从封闭范围内全部个别事实得到总体判断，是完全归纳的思路。","乙由一般规则和个别事实推出结论，是演绎。","丙由相关相似推测另一性质，是类比，结论需要进一步验证。","三者均须审查事实根据，但总体覆盖、形式必然性和相似性的相关程度各有侧重。"],"basis":{"paras":[],"excerptIds":["e-inference","e-premise","e-sentence","e-kinds","e-boundary","e-new","e-proof"],"anchors":[]}}]},"materials":[],"knowledge":[{"id":"premise","title":"前提与结论"},{"id":"markers","title":"别只看所以"},{"id":"value","title":"认识与论证"},{"id":"two-checks","title":"前提与形式"},{"id":"types","title":"进入不同推理"}],"links":{"q- nd":"ocr","label":"看 OCR 原书 · 推理不依赖标志词齐全","href":"./source.html#book=formal-logic-1976&from=947&to=947&ref=logic-07.html%23excerpt-e-marker"},{"kind":"excerpt","label":"所以不能制造依据","href":"./logic-07.html#excerpt-e-invalidso"},{"kind":"ocr","label":"看 OCR 原书 · 所以不能制造依据","href":"./source.html#book=formal-logic-1976&from=957&to=957&ref=logic-07.html%23excerpt-e-invalidso"}],"o-logic-07-002":[{"kind":"excerpt","label":"推理的界定","href":"./logic-07.html#excerpt-e-inference"},{"kind":"ocr","label":"看 OCR 原书 · 推理的界定","href":"./source.html#book=formal-logic-1976&from=944&to=944&ref=logic-07.html%23excerpt-e-inference"},{"kind":"excerpt","label":"前提与结论","href":"./logic-07.html#excerpt-e-premise"},{"kind":"ocr","label":"看 OCR 原书 · 前提与结论","href":"./source.html#book=formal-logic-1976&from=944&to=944&ref=logic-07.html%23excerpt-e-premise"},{"kind":"excerpt","label":"并非所有复句都是推理","href":"./logic-07.html#excerpt-e-sentence"},{"kind":"ocr","label":"看 OCR 原书 · 并非所有复句都是推理","href":"./source.html#book=formal-logic-1976&from=945&to=945&ref=logic-07.html%23excerpt-e-sentence"},{"kind":"excerpt","label":"后续推理的三种类型","href":"./logic-07.html#excerpt-e-kinds"},{"kind":"ocr","label":"看 OCR 原书 · 后续推理的三种类型","href":"./source.html#book=formal-logic-1976&from=1000&to=1000&ref=logic-07.html%23excerpt-e-kinds"},{"kind":"excerpt","label":"形式逻辑的任务与界限","href":"./logic-07.html#excerpt-e-boundary"},{"kind":"ocr","label":"看 OCR 原书 · 形式逻辑的任务与界限","href":"./source.html#book=formal-logic-1976&from=993&to=993&ref=logic-07.html%23excerpt-e-boundary"},{"kind":"excerpt","label":"推理的认识作用","href":"./logic-07.html#excerpt-e-new"},{"kind":"ocr","label":"看 OCR 原书 · 推理的认识作用","href":"./source.html#book=formal-logic-1976&from=964&to=964&ref=logic-07.html%23excerpt-e-new"},{"kind":"excerpt","label":"推理的论证作用","href":"./logic-07.html#excerpt-e-proof"},{"kind":"ocr","label":"看 OCR 原书 · 推理的论证作用","href":"./source.html#book=formal-logic-1976&from=968&to=968&ref=logic-07.html%23excerpt-e-proof"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-07","title":"第七讲·推理要有逻辑性","output":"logic-07.html"},"excerpts":[{"id":"e-inference","label":"推理的界定","lineStart":944,"lineEnd":944,"text":"在形式逻辑中，把这种从一个或几个已有判断推出一·个新判断的思维形式，，叫做推理。"},{"id":"e-premise","label":"前提与结论","lineStart":944,"lineEnd":944,"text":"任何一个推理都是由两部分组成的，一部分是已有的判断，叫做前提；另一部分是从已有判断推出的新判断，叫做结论。"},{"id":"e-sentence","label":"并非所有复句都是推理","lineStart":945,"lineEnd":945,"text":"有的复句或句群并不表达推理。"},{"id":"e-marker","label":"推理不依赖标志词齐全","lineStart":947,"lineEnd":947,"text":"有时，在一个推理中只有“因此”或“所以”，.而没有“由于”或“因为”，甚至既没有“因为”或“由于”，又没有“所以”或“因此”，但仔细分析一下，后面的判断是从前面的判断推出来的，它仍然是一个推理。"},{"id":"e-invalidso","label":"所以不能制造依据","lineStart":957,"lineEnd":957,"text":"从前者推不出后者。因此，这段话里用“所以”是不妥当的。"},{"id":"e-new","label":"推理的认识作用","lineStart":964,"lineEnd":964,"text":"在形式逻辑中，“探寻新结果”“由已知进到未知”的方法，就是推理。"},{"id":"e-proof","label":"推理的论证作用","lineStart":968,"lineEnd":968,"text":"根据真实的前提合乎逻辑地推出真实的结论。"},{"id":"e-two","label":"两项要求","lineStart":984,"lineEnd":984,"text":"一个正确的推理必须具备两个条件：第一，推理的前提是真实的；第二，推理过程是符合思维的规律、规则的，即推理的形式是正确的。"},{"id":"e-notguaranteed","label":"条件缺少时不保证真实","lineStart":984,"lineEnd":984,"text":"如果在这两个条件中有一条不具备，那么结论就不一定是真实可靠的"},{"id":"e-combination","label":"前提与形式结合","lineStart":993,"lineEnd":993,"text":"一个正确的推理必须是前提真实和形式正确二者的结合。"},{"id":"e-boundary","label":"形式逻辑的任务与界限","lineStart":993,"lineEnd":993,"text":"形式逻辑只是告诉我们：一个正确的推理应当遵守哪些规则，怎样才能保证推理形式正确，怎样提高某些推理的可律程度，避免产生逻辑错误。"},{"id":"e-kinds","label":"后续推理的三种类型","lineStart":1000,"lineEnd":1000,"text":"间接推理又可以分成三类，即：演绎推理，归纳推理，类比推理。"}]}</script></body></html>
