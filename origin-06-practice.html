in-06.html%23excerpt-r-assembly"},{"kind":"excerpt","label":"r-districts","href":"./origin-06.html#excerpt-r-districts"},{"kind":"ocr","label":"看 OCR 原书 · r-districts","href":"./source.html#book=family-origin&from=1036&to=1036&ref=origin-06.html%23excerpt-r-districts"},{"kind":"excerpt","label":"r-state","href":"./origin-06.html#excerpt-r-state"},{"kind":"ocr","label":"看 OCR 原书 · r-state","href":"./source.html#book=family-origin&from=1037&to=1037&ref=origin-06.html%23excerpt-r-state"},{"kind":"excerpt","label":"r-later","href":"./origin-06.html#excerpt-r-later"},{"kind":"ocr","label":"看 OCR 原书 · r-later","href":"./source.html#book=family-origin&from=1042&to=1042&ref=origin-06.html%23excerpt-r-later"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-06","title":"第六章·罗马的氏族和国家","output":"origin-06.html"},"excerpts":[{"id":"r-origin","label":"r-origin","lineStart":938,"lineEnd":938,"text":"一个萨伯力安部落，似乎也有一百个氏族；最后加入的是一个由各种不同的分子构成的第三个部落，据传说它也有一百个氏族。初看起来，这全部故事证明，在这里除了氏族以外，再没有自然形成的任何东西，连氏族本身在许多情况下，也只不过是在故土上继续存在的母亲氏族的分支而已。各个部落都带有人工构成的痕迹，但它们大部分都是由有亲属关系的分子构成的，并且不是按照人工造成的部落而是按照古代自然长成的部落的样子构成的：也可能，有一个真正的老部落作了三个部落中每一个部落的核心。中间环节一胞族，是由十个氏族组成的，叫做库里亚；因此，共有三十个库里亚。"},{"id":"r-law","label":"r-law","lineStart":947,"lineEnd":947,"text":"十二铜表法36，首先是子女作为直接继承人继承财产；要是没有子女，则由阿格纳蒂（男系亲属）继承；徜若连阿格纳蒂也没有，则由同氏族人继承。无论在哪种情况下，财产都是留在氏族以内的。在这里我们看到，由财富的增加和一夫一妻制所产生的新的法律规范已逐渐渗入氏族的习俗：同氏族人的原先是平等的继承权，起初一如前面所说的在很早的时期一在实践上限于阿格纳蒂，最后只限于亲生子女及其男系后裔：不言而喻，这和十二铜表法上的顺序是相反的。"},{"id":"r-burial","label":"r-burial","lineStart":948,"lineEnd":948,"text":"2.占有共同的墓地。克劳狄名门氏族，在由勒吉利城迁到罗马时，得到了一块土地，此外还在城内得到了一块共同墓地。还在奥古斯都时代，死在条多堡森林的瓦鲁斯的首级运到罗马后37，即埋在gentilitius tumulus(氏族坟山)；可见他的氏族（昆提利）还有独特的坟山。①"},{"id":"r-rites","label":"r-rites","lineStart":949,"lineEnd":949,"text":"3.共同的宗教节日。这些sacra gentilitia(氏族祭典)是众所周知的。"},{"id":"r-marriage","label":"r-marriage","lineStart":950,"lineEnd":950,"text":"4.氏族内部不得通婚。这在罗马似乎从来没有成为一种成文法，但却是一种习俗。在名字一直保存到今天的大量罗马人夫妇中，没有一对夫妇的氏族名称是相同的。继承权也证实了这一惯例。妇女出嫁后就丧失了她的阿格纳蒂的权利，而退出自己的氏族；不论她或她的子女都不能继承她的父亲或这个父亲的兄弟，因为不然的话，父亲的氏族就会失掉一部分财产。这一惯例只有在女"},{"id":"r-land","label":"r-land","lineStart":957,"lineEnd":957,"text":"5.土地共有。这在原始时代，从部落土地开始实行分配的时候起，始终是存在的。在各拉丁部落中间，我们看到，土地一部分为部落所有，一部分为氏族所有，一部分为家庭所有，那时这种家庭未必是①个体家庭。相传罗慕洛第一次把土地分配给了个人，每人大约一公顷（二罗马亩）。但是后来我们也看到为氏族所有的土地，至于那为共和国全部内政史所环绕的国有土地，就更不必说了。"},{"id":"r-help","label":"r-help","lineStart":958,"lineEnd":958,"text":"6.同氏族人有互相保护和援助的义务。关于这一点，成文历史仅有片断的记载；罗马国家，一开始就表现为这样一种强大的力量，以致防御侵害的权利就不能不落到了它的手里。当亚庇乌斯"},{"id":"r-name","label":"r-name","lineStart":960,"lineEnd":960,"text":"7.用氏族名称的权利。这种权利一直到帝政时代还保持着：被释放的奴隶，可以采用他们从前的主人的氏族名称，但不能获得氏族的权利。"},{"id":"r-adopt","label":"r-adopt","lineStart":961,"lineEnd":961,"text":"8.收养外人入族的权利。其办法是收养到某一家庭中（像印第安人所做的那样)，然后就算收养入族。"},{"id":"r-elect-gap","label":"r-elect-gap","lineStart":962,"lineEnd":962,"text":"9.关于选举和撤换首长的权利，任何地方都没有提到过。但是，由于在罗马存在的最初时期，从选举产生的王起，自上而下"},{"id":"r-elect-infer","label":"r-elect-infer","lineStart":963,"lineEnd":963,"text":"一切官职都是选举或任命的，同时，库里亚的祭司也是由库里亚选举的，因此我们可以推断，氏族首长(principes)也定然如此，"},{"id":"r-dispute","label":"r-dispute","lineStart":984,"lineEnd":984,"text":"uti Feceniae Hispalae datio,deminutio,gentis enuptio,tu-toris optioitem esset quasi ei vir testamento dedisset;utique ei ingenuo nubere liceret,neu quid ei qui eam duxisset,,ob id fraudi ignominiaeve esset》一“费策妮娅·希斯帕拉有处理她的财产、减少她的财产、在氏族以外结婚、给自己选定保护人的权利，如同她的〈已故的〉丈夫曾用遗嘱把这个权利授予她一样；她可以和一个完全自由的人结婚，不能认为娶她为妻的人是做了不好的或可耻的事情”。"},{"id":"r-hypothesis","label":"r-hypothesis","lineStart":995,"lineEnd":995,"text":"因此，剩下的只有这样一个推测，即妇女第一次结婚是嫁给别的氏族的男子，结婚后她便立即转入夫方的氏族，如蒙森事实上对于这类场合所容许的那样。这样一来，一切相互关系立刻就不言自明了。妇女由于结婚而脱离她的氏族，加入新的、夫方的氏族团体，这样她便在那里占着一个完全特殊的地位。虽然她也是氏族的一员，但她并不是血缘亲属；她加入氏族的方式，从一开始就使她不受因结婚而加入的那个氏族禁止内部通婚的一切规定的束缚：其次，她已经被接受到氏族的婚姻团体中来，可以在她的丈夫死亡时继承他的财产，即一个氏族成员的财产。为了把财产保存在氏族以内，她必须同她的第一个丈夫的同氏族人结婚而不得同别的任何人结婚，这岂不是再自然不过的事吗？如果一定要造成例外，那末除了把这份财产遗留给她的第一个丈夫之外，试问谁有资格授权她这样做呢？在他把一部分财产遗留给她，而同时允许她通过结婚或当作结婚的结果而把这一部分财产交给别的氏族的瞬"},{"id":"r-freed","label":"r-freed","lineStart":1003,"lineEnd":1003,"text":"如果这一推测是正确的，那末这段话对于完全自由的罗马妇女的地位根本就什么也没有证明；更谈不上她们应在氏族内部结婚的义务了。"},{"id":"r-ambiguous","label":"r-ambiguous","lineStart":1006,"lineEnd":1006,"text":"种虚幻的、认为罗马妇女只能在本氏族内部结婚的看法，其来源仅仅是这一段话。但是这种看法是绝对站不住脚的。因为，这段话或者只是与被释放的女奴隶所受的特殊限制有关，那末它对于完全自由的妇女(ingenuae))就根本没有证明什么东西：或者它也适用于完全自由的妇女，那末它倒证明妇女按照通例是在本氏族以"},{"id":"r-curia","label":"r-curia","lineStart":1013,"lineEnd":1013,"text":"我们已经说过，十个氏族构成一个胞族，胞族在这里叫做库里亚，它有着比希腊胞族更重要的社会职能。每一个库里亚都有自己的宗教仪式、圣物和祭司；全体祭司构成罗马祭司团之一。十个库里亚构成一个部落，这种部落，像其余的拉丁部落一样，最初大概有一个选举的首长一军事首长兼最高祭司。所有三个部落合在一起，构成罗马人民，即populus romanus"},{"id":"r-senate","label":"r-senate","lineStart":1014,"lineEnd":1014,"text":"这样，只有身为氏族成员，并且通过自己的氏族而为库里亚成员和部落成员的人，才能属于罗马人民。罗马人民最初的制度是这样的：公共事务首先由元老院处理，而元老院，正像尼布尔最先正确地叙述的那样，是由三百个氏族的首长组成的3：正因为如此，他们作为氏族的首长被称为patres,,即父老，而他们全体则构成元老院（长老议事会，由senex一老者一词而来）。氏族首长总是从每个氏族的同一家庭中选出的习俗，在这里也造成了最初的部落显贵；这些家庭自称为贵族，并且企求加入元老院和担任其他一切官职的独占权。随着时间的进展，人民容忍了这种企求，这种企求就变成实际的权利，这一点在关于罗慕洛赐给第一批元老及其子孙以贵族身分和特权的传说中得到了反映。元老院像雅典bulè〔议事会)一样，在许多事情上有决定权，有权预先讨论其中比较重要的事情，尤其是新法律。这些新法律，最后由叫做comitia"},{"id":"r-rex","label":"r-rex","lineStart":1020,"lineEnd":1020,"text":"十个库里亚各有一票表决权。库里亚大会通过或否决一切法律，选举一切高级公职人员，包括勒克斯（所谓王）在内，宣战（但由元老院媾和)，并以最高法院资格，在一切事关判处罗马公民死刑的场合，根据各方的上诉作最后的决定。最后，与元老院和人民大会并列的，还有勒克斯，他完全相当于希腊的巴赛勒斯，但决不像蒙森所描述的那样“几乎是专制君主。①他同样也是军事首长、最高祭司和某些法庭的审判长。他不掌握民政方面的权力，也决没有处理公民的生命、自由和财产的权力，除非这些权力来自军事首长的惩戒权或法庭审判长的判决执行权。勒克斯的职位不是世袭的；相反地，他大概是由其前任推荐，先由库里亚大会选出，然后在第二次大会上正式就职的。他也是可以撤换的，高傲的塔克文的命运，便是证明。"},{"id":"r-plebs","label":"r-plebs","lineStart":1028,"lineEnd":1028,"text":"这时，罗马城以及靠征服而扩大了的罗马地区上的人口日益增加；增加的人口中一部分是外来移民，一部分是被征服地区，主要是拉丁地区的居民。所有这些新的臣民（关于被保护民的问题，这里暂且不谈)，都处在旧的氏族、库里亚和部落之外，因而，不是populus romanus即道地的罗马人民的组成部分。他们是人身自由的人，可以占有地产，必须纳税和服兵役。可是他们却不能担任任何官职；既不能参加库里亚大会，也不能参与征服得来的国有土地的分配。他们构成被剥夺了一切公权的平民。由于他们的人数不断增加，由于他们受过军事训练并有武装，于是就成了一种同现在根本禁止增加外人的旧的populus相对抗的可怕力量了。加以土地看来几乎是平均分配于populus和平民之间的，而商业和工业的财富，虽然还不十分发达，也主要是在平民手中。"},{"id":"r-unknown","label":"r-unknown","lineStart":1029,"lineEnd":1029,"text":"由于全部传说的罗马上古史都被浓厚的黑暗所笼罩，这种黑暗又因后世受过法学教育的著作家们（他们的著作还是我们的材料来源)的唯理主义一实用主义的解释和报告而更加浓厚，因而，关于使古代氏族制度终结的革命发生的时间、进程和动因，都不可能说出什么确定的意见。只有一点是肯定的，这就是革命的原因在于平民和populus之间的斗争。"},{"id":"r-assembly","label":"r-assembly","lineStart":1035,"lineEnd":1035,"text":"凡是应服兵役的男子，都按其财产分为六个阶级。前五个阶级中每个阶级的最低财产额为：一、10万阿司；二、75000阿司；三、5万阿司；四、25000阿司；五、11000阿司；据杜罗·德·拉·马尔计算，这些数目大约相当于14000、10500、7000、3600和1570马克145。第六阶级为无产者，是由那些没有什么财产、不服兵役和不纳税的人构成的。在新的百人团人民大会(comitia centuriata)上，公民以军队方式按连队来编组，每队100人，称百人团，每个百人团有一票表决权。但是，第一阶级出80个百人团，第二阶级出22个，第三阶级出20个，第四阶级出22个，第五阶级出30个，而第六阶级，为了体面起见，也准出一个。此外，还有从最富裕的公民中征集的骑士所组成的18个百人团：一共有193个百人团：多数票为97票。但骑士和第一阶级合在一起就有98票，即占多数：只要他们意见一致，就可以不征询其余阶级的意见，决议也就有效了。"},{"id":"r-districts","label":"r-districts","lineStart":1036,"lineEnd":1036,"text":"以前库里亚大会的一切政治权利（除了若干名义上的权利以外)，现在都归这个新的百人团大会了；这样一来，库里亚和构成它们的各氏族，像在雅典一样，就降为纯粹私人的和宗教的团体，并且作为这样的团体还苟延残喘了很久，而库里亚大会不久就完全消失了。为了把三个旧的血族部落也从国家中排除出去，便设立了四个地区部落，每个地区部落居住罗马城的四分之一，并享有系列的政治权利。"},{"id":"r-state","label":"r-state","lineStart":1037,"lineEnd":1037,"text":"这样，在罗马也是在所谓王政被废除之前，以个人血缘关系为基础的古代社会制度就已经被破坏了，代之而起的是一个新的、以地区划分和财产差别为基础的真正的国家制度。公共权力在这里体现在服兵役的公民身上，它不仅被用来反对奴隶，而且被用来反对不许服兵役和不许有武装的所谓无产者。"},{"id":"r-later","label":"r-later","lineStart":1042,"lineEnd":1042,"text":"只是在那一位僭取了真正王权的最后一个勒克斯，即高傲的塔克文被驱逐以后，在两个拥有同等权力（像在易洛魁人那里那样)的军事首长执政官)代替了一个勒克斯以后，这个新制度才得到了进一步的发展，而罗马共和国的全部历史也就在这个制度的范围内演变，这里包括，共和国的贵族与平民为了担任官职以及分享国有土地而进行种种斗争，最后贵族溶化在大土地所有者和金钱巨头的新阶级中，这种大土地所有者和金钱巨头逐渐吞并了因兵役而破产的农民的一切地产，并使用奴隶来耕种由此产生的广大庄园，把意大利弄到十室九空的地步，从而不仅给帝政而且也给帝政的后继者德意志野蛮人开辟了道路。"}]}</script></body></html>
