ty":2,"stem":"有人未专门学过逻辑也能写好文章。本讲据此主张：","options":["自觉学习能改善已有规则运用","既有写作能力说明规则已获系统掌握","实际经验已足够，理论只负责命名","写作成功即可担保其他推理可靠"],"answerIndex":0,"explanation":"本讲认为未专门学习者也可能不自觉遵守规则，学习可使运用更自觉。","whyWrong":["正确","不自觉运用不等于系统掌握规则。","理论学习还能帮助自觉检查、纠正已有运用。","一种活动成功不保证各种推理都可靠。"],"basis":{"paras":[],"excerptIds":["l-conscious","l-reading","l-practice"],"anchors":[]},"knowledge":["logic-learning"]},{"id":"q-logic-01-006","type":"定义判断","difficulty":2,"stem":"设例：某人说“按事情发展的逻辑，这一步迟早出现”。这里的“逻辑”最接近：","options":["研究概念判断推理的专门学科","个人在讨论中提出的特殊说法","客观事物发展中的必然规律","某个论证所采用的形式结构"],"answerIndex":2,"explanation":"本讲列举客观规律、观点说法、思维规律、学科等不同词义，题句指向事物发展的规律。","whyWrong":["题句未讨论学科研究。","虽是某人说的话，所指仍是事物规律。","正确","题句未指出某个推理结构。"],"basis":{"paras":[],"excerptIds":["l-meanings","l-law-word","l-view-word","l-science-word","l-thinking","l-definition"],"anchors":[]},"knowledge":["logic-meanings"]},{"id":"q-logic-01-007","type":"类比推理","difficulty":3,"stem":"思维内容∶思维形式","options":["推理前提∶推理结论","具体对象∶共同结构","实际结论∶事实证据","调查材料∶经验概括"],"answerIndex":1,"explanation":"本讲以反映的具体事物对应内容，以一般逻辑结构对应形式；不是材料加工或前提推出结论的先后关系。","whyWrong":["同属推理组成，但不是内容形式两面。","正确","是结论与根据，不是内容与结构。","有由具体到概括的次序，却不是同一思维的两面。"],"basis":{"paras":[],"excerptIds":["l-content-form","l-form","l-laws","l-definition"],"anchors":[]},"knowledge":["logic-form"]},{"id":"q-logic-01-008","type":"常识判断","difficulty":3,"stem":"下列对形式逻辑作用的理解，不符合本讲的是：","options":["可帮助检查推理是否遵守规则","可凭结构合规完成具体事实认定","可帮助识别论述中的概念混淆","可帮助使文章表达更清楚严密"],"answerIndex":1,"explanation":"本讲将形式逻辑定位为辅助工具，不能包办具体调查及认识工作。","whyWrong":["这属于其形式研究任务。","正确","这属于辅助分析作用。","这属于辅助表达作用。"],"basis":{"paras":[],"excerptIds":["l-knowing","l-expression","l-criticism","l-boundary"],"anchors":[]},"knowledge":["logic-uses"]},{"id":"q-logic-01-009","type":"逻辑判断","difficulty":3,"stem":"设例：只背规则的学习者遇到实际论证仍不会分析。哪项改进最契合本讲？","options":["先用作者结论作标准，再判断自己的推导是否正确","先分析实际论证的结构，再用规则解释和修正","先把例句替换为熟悉对象，以对象相近判定形式相同","先积累更多有效例句，再按词语相似度套用现成规则"],"answerIndex":1,"explanation":"本讲主张联系阅读和实践学习，使规则由不自觉运用转为自觉运用。","whyWrong":["结论相同不能保证过程有效，仍须分析推导。","正确","对象相近不能保证结构相同。","应识别判断联系而非按词语相似套用。"],"basis":{"paras":[],"excerptIds":["l-conscious","l-reading","l-practice","l-knowing","l-expression","l-criticism","l-boundary"],"anchors":[]},"knowledge":["logic-learning","logic-uses"]},{"id":"q-logic-01-010","type":"逻辑判断","difficulty":3,"stem":"设例：所有志愿者均登记，甲是志愿者，故甲登记。与之同形式的是：","options":["有些编辑已受训，乙是编辑，故乙受训","所有编辑均受训，乙是编辑，故乙受训","所有编辑均受训，乙受训，故乙是编辑","所有编辑均受训，乙非编辑，故乙未受训"],"answerIndex":1,"explanation":"本讲通过抽出共同结构比较推理，题干是全称规则适用于其类成员。","whyWrong":["将全称前提换为特称前提。","正确","肯定谓项倒推成员，不同于题干。","否定类成员身份后推否定性质，结构不同。"],"basis":{"paras":[],"excerptIds":["l-content-form","l-form","l-laws","l-definition"],"anchors":[]},"knowledge":["logic-form"]},{"id":"q-logic-01-011","type":"常识判断","difficulty":2,"stem":"依据本讲，概念、判断、推理之间的关系是：","options":["概念只负责给对象命名，判断负责确定名称是否统一","判断列出已有概念，推理就是把这些判断并列在一起","概念构成判断的思想要素，判断通过联系形成推理","判断有真假，推理只要包含真判断就必定得出真结论"],"answerIndex":2,"explanation":"本讲指出思维运用概念进行判断和推理；三者是相关的形式层次。","whyWrong":["把概念误作词语，并把判断缩为名称核对。","并列判断不一定具有推出关系。","正确","推理还须有有效的形式联系。"],"basis":{"paras":[],"excerptIds":["l-meanings","l-law-word","l-view-word","l-science-word","l-thinking","l-definition","l-content-form","l-form","l-laws"],"anchors":[]},"knowledge":["logic-meanings","logic-form"]},{"id":"q-logic-01-012","type":"逻辑判断","difficulty":2,"stem":"设例：文章中心明确却使用了未经核实的材料。下列评价最恰当的是：","options":["材料未经核实就足以判定结论为假","中心和结论一致足以补足证据缺口","形式清楚意味着事实之间必有联系","形式已有优点但仍需核实材料"],"answerIndex":3,"explanation":"本讲分别强调表达条理和正确认识，不能用一方面的优点保证另一面。","whyWrong":["未证实不等于已证伪。","表达一致不能替代前提核实。","清楚表达并不保证实际根据成立。","正确"],"basis":{"paras":[],"excerptIds":["l-knowing","l-expression","l-criticism","l-boundary"],"anchors":[]},"knowledge":["logic-uses"]},{"id":"q-logic-01-013","type":"常识判断","difficulty":2,"stem":"本讲提出联系实践学习，重点意味着：","options":["用已有成功结论判定推导形式","从熟悉例子的词语判断共同结构","把规则记忆当作实际分析的完成","把规则运用到实际思想材料中"],"answerIndex":3,"explanation":"本讲强调在具体阅读、实际论辩中学会自觉运用规则，而非取消理论学习。","whyWrong":["结论真不能倒推推导有效。","词语相近不等于形式相同。","熟记不等于会分析与运用。","正确"],"basis":{"paras":[],"excerptIds":["l-conscious","l-reading","l-practice"],"anchors":[]},"knowledge":["logic-learning"]},{"id":"q-logic-01-014","type":"逻辑判断","difficulty":3,"stem":"设例：两个论证结论相反，因此有人认定其中必有形式错误。缺少的区分是：","options":["思维形式相同与结论内容相同，两者是否被混为一谈","表达方式不同与概念含义不同，两者是否被混为一谈","相反结论与相互矛盾的前提，两者是否被混为一谈","前提具体真值与推理形式有效，两者是否被混为一谈"],"answerIndex":3,"explanation":"本讲研究形式而不代替前提事实核实；相反结论可能源自内容不同甚至虚假的前提，未必是形式不同。","whyWrong":["这也是须区分的关系，但题设未给出两论证形式相同。","题设未以表达差异推断概念差异。","题设的错误不只是未比较前提是否相互矛盾，而是把结论冲突直接归于形式。","正确"],"basis":{"paras":[],"excerptIds":["l-content-form","l-form","l-laws","l-definition","l-knowing","l-expression","l-criticism","l-boundary"],"anchors":[]},"knowledge":["logic-form","logic-uses"]},{"id":"q-logic-01-015","type":"常识判断","difficulty":2,"stem":"下列学习目标中，最符合本讲定位的是：","options":["以自觉运用规则辅助认识和表达","以有效推导保证所用前提真实","以结论符合经验确认形式有效","以前提均真代替推导形式检查"],"answerIndex":0,"explanation":"本讲把逻辑作为辅助工具，强调自觉运用，而非代替调查或统一全部观点。","whyWrong":["正确","有效性保真以真实前提为条件，不能倒推前提真。","真结论也可能由无效推导偶然得出。","真实前提仍需有效联系才能保证结论真。"],"basis":{"paras":[],"excerptIds":["l-knowing","l-expression","l-criticism","l-boundary","l-conscious","l-reading","l-practice"],"anchors":[]},"knowledge":["logic-uses","logic-learning"]}],"open":[{"id":"o-logic-01-001","type":"论证分析","material":{"text":"设例：甲说：这份报告用了规范的三段式，而且语句流畅，因此所有材料均已证实。乙说：既然仍需核实材料，学习形式逻辑就没有用途。","sourceIds":[]},"prompt":"分别分析两人的推断，并提出兼顾形式与内容的审查方法。（150—220字）","points":["甲把结构及表达优点扩大为事实真实性保证。","乙把不能包办事实核实误解为没有辅助价值。","依据本讲，应分别核实材料与检查概念、判断、推理的形式。","指出哪项材料尚未证实、哪条推出关系有问题，避免笼统肯定或否定。"],"basis":{"paras":[],"excerptIds":["l-content-form","l-form","l-laws","l-definition","l-knowing","l-expression","l-criticism","l-boundary"],"anchors":[]}},{"id":"o-logic-01-002","type":"论证分析","material":{"text":"设例：学习组准备背熟所有含“逻辑”的句子，认为同一语词必然指同一门学科；随后把背诵正确当作会分析实际文章的证明。","sourceIds":[]},"prompt":"指出计划中的两处问题，并给出可操作的改进路径。（150—220字）","points":["本讲区分“逻辑”的多种用法，应结合语境判断所指。","背诵不能直接证明掌握辨认形式和检查规则的能力。","用不同具体内容的论证练习抽取共同结构。","结合阅读和实际问题，分别说明前提、结论及推出根据。"],"basis":{"paras":[],"excerptIds":["l-conscious","l-reading","l-practice","l-meanings","l-law-word","l-view- rpt","label":"思维中的概念、判断与推理","href":"./logic-01.html#excerpt-l-thinking"},{"kind":"ocr","label":"看 OCR 原书 · 思维中的概念、判断与推理","href":"./source.html#book=formal-logic-1976&from=97&to=97&ref=logic-01.html%23excerpt-l-thinking"},{"kind":"excerpt","label":"本讲的定义","href":"./logic-01.html#excerpt-l-definition"},{"kind":"ocr","label":"看 OCR 原书 · 本讲的定义","href":"./source.html#book=formal-logic-1976&from=108&to=108&ref=logic-01.html%23excerpt-l-definition"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-01","title":"第一讲·大家都来学点逻辑","output":"logic-01.html"},"excerpts":[{"id":"l-meanings","label":"“逻辑”有不同的用法","lineStart":83,"lineEnd":83,"text":"“逻辑”这个词是从外文音译过来的，用在不同的场合，有着不同的含义。"},{"id":"l-law-word","label":"词义之一：客观规律","lineStart":85,"lineEnd":85,"text":"这里所说的“逻辑”，是指客观事物发展的必然规律。"},{"id":"l-view-word","label":"词义之二：理论或说法","lineStart":87,"lineEnd":87,"text":"这里所说的“逻辑”是指一种特殊的理论、观点或说法。"},{"id":"l-science-word","label":"本书所学：形式逻辑","lineStart":92,"lineEnd":92,"text":"这里所说的“逻辑”是指一门研究思维的科学一形式逻辑。"},{"id":"l-thinking","label":"思维中的概念、判断与推理","lineStart":97,"lineEnd":97,"text":"由此可见，思维的过程就是人们运用概念进行判断和推理的过程。"},{"id":"l-content-form","label":"区分思维的内容与形式","lineStart":98,"lineEnd":98,"text":"所谓内容方面，是指它们所反映的具体事物、事物的情况、事物之间的关系，我们称做“思维的内容”。所谓形式方面，是指它们的逻辑特征及结构，我们称做“思维的形式”。"},{"id":"l-form","label":"关注推理形式及其要求","lineStart":106,"lineEnd":106,"text":"形式逻辑不研究推理的具体内容，它只是从推理的形式方面来研究推理的特征以及达到推理有逻辑性的一般要求。"},{"id":"l-laws","label":"形式之外，还研究规律","lineStart":107,"lineEnd":107,"text":"形式逻辑除研究思维的形式之外，还研究它们的规律，即同一律，矛盾律，排中律。"},{"id":"l-definition","label":"本讲的定义","lineStart":108,"lineEnd":108,"text":"形式逻辑是研究思维的形式及其规律的科学。"},{"id":"l-boundary","label":"编者对学科边界与历史使命的说明","lineStart":109,"lineEnd":109,"text":"形式逻辑这门科学和哲学不同。哲学是关于自然知识和社会知识的概括和总结，马克思主义哲学是无产阶级的世界观和方法论，是我们进行三大革命斗争，认识世界和改造世界的尖锐武器。形式逻辑是一门具体科学，它只是人们认识事物和表达思想的辅助工具，决不能把形式逻辑和哲学混同起来。但是，必须指出，形式逻辑作为一门科学，'必须以马克思主义哲学为指导，只有这样，才能彻底清除形式逻辑中摊心主义和形而上学的影响，才能让形式逻辑更好地为无产阶级政治服务，为批判修正主义、批判资产阶毁、巩固无产阶级专政、建设社会主义服务。："},{"id":"l-knowing","label":"用途之一：帮助分析和认识","lineStart":116,"lineEnd":116,"text":"如果在思维过程中概念不清，判断错误，推理有毛病，就会影响思维的效果，就不能正确地认识事物。"},{"id":"l-expression","label":"用途之二：帮助表述和论证","lineStart":118,"lineEnd":118,"text":"学习了形式逻辑，按照逻辑规律，运用概念以作判断和推理，就有助于达到这些要求，使文章中心明确，条理清楚，结构严密，有说服力。"},{"id":"l-criticism","label":"用途之三：本书的历史语境","lineStart":119,"lineEnd":119,"text":"(三)学习形式逻辑，对于我们进行革命大批判，揭露敌人的谣言和诡辩，也有一定帮助。"},{"id":"l-conscious","label":"从不自觉运用到自觉运用","lineStart":133,"lineEnd":133,"text":"如果学习了形式逻辑，从不自觉地运用变成自觉运用，他的文章一定会写得更好。"},{"id":"l-reading","label":"编者提出的第一种学法","lineStart":140,"lineEnd":140,"text":"用心学习马列著作和毛主席著作中对逻辑的运用，这对于准确地领会原著的基本精神，，学会自觉地运用逻辑，都会有很大的好处。"},{"id":"l-practice","label":"编者提出的第二种学法","lineStart":141,"lineEnd":141,"text":"第二，联系三大革命实践来学，特别是要在群众性的大批判、大辩论中学。"}]}</script></body></html>
