k=family-origin&from=879&to=879&ref=origin-05.html%23excerpt-a-cancel"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-05","title":"第五章·雅典国家的产生","output":"origin-05.html"},"excerpts":[{"id":"a-method","label":"a-method","lineStart":835,"lineEnd":835,"text":"国家是怎样部分地靠改造氏族制度的机关，部分地用设置新机关的办法来排挤掉它们，最后全部代之以真正的国家权力机关而发展起来的；受这些国家权力机关支配的，因而也可以被用来反对人民的，武装的“公共权力”，又是怎样代替了氏族、胞族和部落中自己保卫自己的真正的“武装的人民”的一关于这一切，至少是它的始初阶段，再好莫过于从古雅典来加以研究。各种形式的更替，基本上已由摩尔根描绘出来了，我要补充的大半是引起这种形式更替的经济内容。"},{"id":"a-residents","label":"a-residents","lineStart":841,"lineEnd":841,"text":"胞族和部落的地区内，移来了这样的居民，他们虽然也是本民族的同胞，但并不属于这些团体，因而他们在自己的居住地上被看做外人。在和平时期，每一个胞族和每一个部落都是自己管理自己的事务，也不向雅典的人民议事会或巴赛勒斯请示。但是那些住在胞族或部落的地区内而不属于这个胞族或部落的人，自然是不能参与这种管理的。"},{"id":"a-central","label":"a-central","lineStart":842,"lineEnd":842,"text":"这就扰乱了氏族制度机关的正常活动，以致在英雄时代就需要设法补救。于是实行了提修斯所规定的制度。这一改变首先在于，在雅典设立了一个中央管理机关就是说，以前由各部落独立处理的部分事务，被宣布为共同的事务，而移交给设在雅典的总议事会管辖了。由于这一点，雅典人比美洲任何土著民族都前进了一步：相邻的各部落的单纯的联盟，已经由这些部落合并为统一的民族VOk)所代替了。于是就产生了凌驾于各个部落和氏族的法权习惯之上的一般的雅典民族法；只要是雅典的公民，即使在非自己部落的地区，也取得了确定的权利和新的法律保护。但这样一来就跨出了摧毁氏族制度的第一步，因为这是后来容许不属于全阿提卡任何部落并且始终都完全处于雅典氏族制度以外的人也成为公民的第一步。提修斯所制定的第二个制度，就是把全体人民，不问氏族、胞族或部落，一概分为Eupatriden(贵族)、G eomo-ren(农民)和Demiurgen(手工业者)三个阶级，并赋予贵族以担任公职的独占权。不过这一划分，除了由贵族担任公职以外，并没有起什么作用，因为除此以外，它并未规定各个阶级之间的任何法权上的差别。①但它有着重大的意义，因为它向我们揭示了新的、暗中发展"},{"id":"a-privilege","label":"a-privilege","lineStart":849,"lineEnd":849,"text":"起来的社会要素。它表明，由一定家庭的成员担任氏族公职的习惯，已经变为这些家庭担任公职的无可争辩的权利：这些因拥有财富而本来就有势力的家庭，已经开始在自己的氏族之外联合成一种独特的特权阶级；而刚刚萌芽的国家，也就使这种霸占行为神圣化。其次，它表明，农民和手工业者之间的分工已经如此牢固，以致使以前氏族和部落的划分在社会意义方面已不是最重要的。最后，它宣告了氏族社会和国家之间的不可调和的矛盾；建立国家的最初企图，就在于破坏氏族的联系，其办法就是把每一氏族的成员分为特权者和非特权者，把非特权者又按照他们的职业分为两个阶级，从而使之互相对立起来。"},{"id":"a-debt","label":"a-debt","lineStart":851,"lineEnd":851,"text":"一职已经丧失了它的意义：国家首脑人物已由贵族中所选出的执政官来充任。贵族的统治日益加强，到了公元前600年左右时，已经变得令人不能忍受了。这时，货币和高利贷已成为压制人民自由的主要手段。贵族们的主要居住地是雅典及其近郊，在那里，海上贸易以及附带的有时仍然进行的海上掠夺，使贵族们发财致富，并使货币财富集中在他们手中。由此而日益发达的货币经济，就像腐蚀性的酸类一样，渗入了农村公社的以自然经济为基础的传统的生活方式。氏族制度同货币经济绝对不能相容：阿提卡小农的破产是与保护他们的旧的氏族联系的松弛同时发生的。债务契约和土地抵押雅典人已经发明了抵押办法)既不理会氏族，也不理会胞族。而旧的氏族制度既不知有货币，也不知有贷款，更不知有货币债务。因此，贵族的日益扩展的货币统治，为了保护债权人以对付债务人，为了使货币所有者对小农的剥削神圣化，也造成了一种新的习惯法。在阿提卡的田地上到处都竖立着抵押柱，上面写着这块地已经"},{"id":"a-bondage","label":"a-bondage","lineStart":856,"lineEnd":856,"text":"以多少钱抵押给某某人了。没有竖这种柱子的田地，大半都因未按期付还押款或利息而出售，归贵族高利贷者所有了；农民只要被允许作佃户租种原地，能得自己劳动生产品的六分之一以维持生活，把其余六分之五以地租的形式交给新主人，那他就谢天谢地了。不仅如此，如果出卖土地所得的钱不够还债，或者债务没有抵押保证，那末债务人便不得不把自己的子女出卖到国外去做奴隶，以偿还债务。父亲出卖子女一这就是父权制和一夫一妻制的第一个果实！要是吸血鬼还不满足，那末他可以把债务人本身卖为奴隶。雅典人的文明时代的欢乐的曙光，就是如此。"},{"id":"a-exchange","label":"a-exchange","lineStart":863,"lineEnd":863,"text":"希腊人的情形就不同了。业己出现的对畜群和奢侈品的私人占有，引起了单个人之间的交换，使产品变成了商品。这就包含着随之而来的全部变革的萌芽。当生产者不再直接消费自己的产品，而是通过交换把它转让出去的时候，他们就失去了对自己的产品的支配权力。他们已不再知道产品的结局如何。于是利用产品来反对生产者、剥削和压迫生产者的可能性便产生了。因此，不论哪一个社会，只要它不消灭单个人之间的交换，它便不能长久保持对它自己的生产的支配，不能长久保持对自己生产过程的社会后果的控制。"},{"id":"a-money","label":"a-money","lineStart":864,"lineEnd":864,"text":"然而，产品是怎样在单个人之间的交换发生以后以及随着产品变成商品而迅速地支配了它的生产者的一这一点雅典人不得不亲自来体验了。随着商品生产，出现了个人单独经营的土地耕作，以后不久又出现了个人的土地所有制。随后就出现了货币，即其余一切商品都可以和它交换的普遍商品。但是当人们发明货币的时候，他们并没有想到，这样一来他们就创造了一种新的社会力量，一种整个社会都要向它屈膝的普通力量。这种未经它自身创造者的预知并违反其意志而突然崛起的新力量，就以其全部青年时代的粗暴性使雅典人感受到它的支配了。"},{"id":"a-interests","label":"a-interests","lineStart":870,"lineEnd":870,"text":"口。在全部阿提卡境内，特别是在雅典城本身，各氏族和胞族的成员相互杂居，已经一代比一代厉害了，尽管这时雅典人仍然只能把土地而不能把自己的住宅卖给本氏族以外的人。随着工业和交换的进一步发展，各种生产部门一农业、手工业（在手工业内又有无数行业)、商业、航海业等一之间的分工日益充分地发展起来；居民现在依其职业分成了相当稳定的集团；其中每个集团都有好多新的共同的利益，这种利益在氏族或胞族内是没有存在的余地的，因而就需要创设新的官职为这种利益服务。奴隶的数量已经大大增加，在那个时候大概就已经大大超过自由的雅典人；氏族制度最初是不知道奴隶制的，因而也就不知道控制这大批非自由人的手段。最后，贸易把许多外地人吸引到雅典来，这些外地人是为了易于赚钱而移居这里的：按照旧制度，他们既没有权利，也不受法律保护，所以尽管有传统的容忍精神，他们仍然是人民中间令人不安的异己分子。"},{"id":"a-fleet","label":"a-fleet","lineStart":871,"lineEnd":871,"text":"一句话，氏族制度已经走到了尽头。社会一天天成长，越来越超出氏族制度的范围：即使是最严重的坏事在它眼前发生，它也既不能阻止，又不能铲除了。但在这时，国家已经不知不觉地发展起来了。最初在城市和乡村间，然后在各种城市劳动部门间实行的分工所造成的新集团，创立了新的机关以保护自己的利益：各种官职都设置起来了。这时，年轻的国家首先就需要一支自己的军事力量，而在操航海业的雅典人中间，起初只能是一支海上的军事力量，用以进行个别的小规模战争和保护商船。在梭伦以前的一个不能确知的时期，设置了诺克拉里，即小规模的区，每个部落设十二个；每一诺克拉里必须提供一只战船，配备上武器和船员，此外，还要提供两个骑士。这个设施对氏族制度起了双重的破坏作用；第一，它造成了"},{"id":"a-district","label":"a-district","lineStart":876,"lineEnd":876,"text":"种已不再直截了当同武装起来的全体人民相符合的公共权力：第二，它第一次不依亲属集团而依共同居住地区为了公共目的来划分人民这有什么意义，可以从下面看出来。"},{"id":"a-cancel","label":"a-cancel","lineStart":879,"lineEnd":879,"text":"公元前594年实现改革的方式，我们在这里可以不谈。迄今所发生的一切革命，都是为了保护一种所有制以反对另一种所有制的革命。它们如果不侵犯另一种所有制，便不能保护这一种所有制。在法国大革命时期，是牺牲封建的所有制以拯救资产阶级的所有制；在梭伦所进行的革命中，应当是损害债权人的财产以保护债务人的财产。债务简单地被宣布无效了。详情我们虽然不太清楚，但是梭伦在他的诗中自夸说，他清除了负债土地上的抵押柱，使那些因债务而被出卖和逃亡到海外的人都重返家园。这只有通过公开侵犯了财产所有权才能做到。的确，一切所谓政治革命，从头"},{"id":"a-security","label":"a-security","lineStart":881,"lineEnd":881,"text":"但现在必须防止这种使自由的雅典人变为奴隶的情形重演。这一点，首先是通过普遍实行的措施，例如禁止缔结以债务人的人身作抵押的债务契约而做到的。此外，又规定了个人所能占有的土地的最大数额，以便至少把贵族对于农民土地的无限贪欲限制"},{"id":"a-classes","label":"a-classes","lineStart":889,"lineEnd":889,"text":"四个阶级；五百、三百及一百五十袋谷物（一袋约等于四十一公升)，为前三个阶级的最低限度的收入额；地产少于此数或完全没有地产的人，则属于第四阶级。只有三个上等阶级的人才能担任一切官职；只有第一阶级的人才能担任最高的官职；第四阶级只有在人民大会上发言和投票的权利，但是，一切官吏都是在这里选出的，一切官吏在这里都要作关于自己活动的报告；一切法律都是在这里制定的；而第四阶级在这里占多数。贵族的特权，部分地以财富特权的形式恢复起来，但人民却保留有决定的权力。此外，"},{"id":"a-property","label":"a-property","lineStart":891,"lineEnd":891,"text":"这样，在制度中便加入了一个全新的因素一私有财产。国家公民的权利和义务，是按照他们的地产的多寡来规定的，于是，随着有产阶级日益获得势力，旧的血缘亲属团体也就日益遭到排斥：氏族制度遭到了新的失败。"},{"id":"a-not-essential","label":"a-not-essential","lineStart":892,"lineEnd":892,"text":"然而，按照财产来规定政治权利的办法，并不是国家不可缺少的设施。虽然这种办法在国家制度的历史上起过很大的作用，但是许多国家，而且恰好是最发达的国家，都是不需要它的。即使在雅典，它也只起了暂时的作用；从亚里斯泰迪兹的时候起，一切官职对每个公民都是开放的。131"},{"id":"a-territory","label":"a-territory","lineStart":903,"lineEnd":903,"text":"克利斯提尼的新制度撇开了以氏族和胞族为基础的四个旧部落。代替它们的是一种全新的组织，这种组织是以已经用诺克拉里试验过的只依居住地区来划分公民的办法为基础的。有决定意义的已不是血族团体的族籍，而只是经常居住的地区了；现在要加以划分的，不是人民，而是地区了；居民在政治上已变为地区的简单的附属物了。"},{"id":"a-deme","label":"a-deme","lineStart":909,"lineEnd":909,"text":"及审理轻微案件的三十个法官。各个德莫同样也有自己的神殿及守护神或英雄，并选出祀奉他们的神职人员。德莫的最高权力，属于德莫特大会。摩尔根说得对，这是美洲市镇自治区的一种原型。134当时在雅典正在产生的国家开始时所依据的单位，正好和现代国家在最高发展阶段上最后要达到的单位相同。"},{"id":"a-tribe","label":"a-tribe","lineStart":910,"lineEnd":910,"text":"十个这样的单位，即德莫，构成一个部落，但是这种部落和过去的血族部落不同，现在它被叫做地区部落。地区部落不仅是一种自治的政治组织，而且也是一种军事组织：它选出一个菲拉尔赫①即部落长，指挥骑兵；一个塔克色阿赫，指挥步兵；一个兵法家，统率在部落境内招募的全体军人。其次，它提供五艘配有船员和船长的战船：并且有阿提卡的一位英雄作为自己的守护神，英雄的名字也就是部落的名称。最后，它选举五十名代表参加雅典议事会。"},{"id":"a-polity","label":"a-polity","lineStart":911,"lineEnd":911,"text":"最终的结果是雅典国家。它是由十个部落所选出的五百名代表组成的议事会来管理的，最后一级的管理权属于人民大会，每个雅典公民都可以参加这个大会并享有投票权：此外，有执政官和其他官员掌管各行政部门和司法事务。在雅典没有总揽执行权力的最高官员。"},{"id":"a-remains","label":"a-remains","lineStart":912,"lineEnd":912,"text":"由于实施这个新制度和容纳大量被保护民一一部分是移民，一部分是被释放的奴隶，一血族制度的各种机关便受到排挤而不再过问社会事务：它们下降为私人性质的团体和宗教会社。不过，旧氏族时代的道德影响、因袭的观点和思想方式，还保存很久，只是逐渐才消亡下去。这一点从下面的一个国家设施中可以"},{"id":"a-power","label":"a-power","lineStart":919,"lineEnd":919,"text":"我们已经看到，国家的本质特征，是和人民大众分离的公共权力。雅典在当时只有一支国民军和一支直接由人民提供的舰队，它们被用来抵御外敌和压制当时已占人口绝大多数的奴隶。对于公民，这种公共权力起初只不过当作警察来使用，警察是和国家"},{"id":"a-police","label":"a-police","lineStart":920,"lineEnd":920,"text":"一样古老的，所以十八世纪的质朴的法国人才不讲文明民族而讲警察民族(nations policees)①。这样，雅典人在创立他们国家的同时，也创立了警察，即由步行的和骑马的弓箭手组成的真正的宪兵队，或者如德国南郊和瑞士所说的Landj ager②。不过，这种宪兵队却是由奴隶组成的。这种警察职务，在自由的雅典人看来是非常卑贱的，以致他们宁愿叫武装的奴隶逮捕自己，而自己却不肯去干这种丢脸的事。这仍是旧的氏族思想。国家是不能没有警察的，不过国家还很年轻，还未享有充分的道义上的威望，足以使那种必然要被旧氏族成员视为卑贱的行业受到尊敬。"},{"id":"a-antagonisms","label":"a-antagonisms","lineStart":921,"lineEnd":921,"text":"现在已经大体上形成的国家是多么适合雅典人的新的社会状况，这可以从财富、商业和工业的迅速繁荣中得到证明。现在社会制度和政治制度建立于其上的阶级对立，已经不再是贵族和平民之间的对立，而是奴隶和自由民之间的对立，被保护民和公民之间的对立了。到了雅典全盛时代，自由公民的总数，连妇女和儿童在内，约为9万人，而男女奴隶为365000人，被保护民一外地人和被释放的奴隶为45000人。这样，每个成年的男性公民至少有18个奴隶和两个以上的被保护民。大量奴隶的存在，是由于许多奴隶在监工的监督下在房屋很大的手工工场内一起工作。但是，随着商"},{"id":"a-ending","label":"a-ending","lineStart":928,"lineEnd":928,"text":"业和工业的发展，发生了财富积累和集中于少数人手中以及大批自由公民贫困化的现象；摆在自由公民面前的只有两条道路：或者从事手工业去跟奴隶劳动竞争，而这被认为是可耻的、卑贱的职业，并且不会有什么成功：或者变成穷光蛋。他们在当时条件下必不可免地走上了后一条道路；由于他们数量很大，于是就把整个雅典国家引向了灭亡。所以，使雅典灭亡的并不是民主制，像欧洲那些讨好君主的学究们所断言的那样，而是排斥自由公民劳动的奴隶制。"},{"id":"a-typical","label":"a-typical","lineStart":929,"lineEnd":929,"text":"雅典人国家的产生乃是一般国家形成的一种非常典型的例子，一方面，因为它的产生非常纯粹，没有受到任何外来的或内部的暴力干涉，一庇西特拉图的篡位为时很短，并未留下任何"},{"id":"a-details","label":"a-details","lineStart":931,"lineEnd":931,"text":"共和国，是直接从氏族社会中产生的：最后，因为我们是充分知道这个国家形成的一切重要详情的。"}]}</script></body></html>
