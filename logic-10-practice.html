</main><script id="questions-data" type="application/json">{"bank":{"version":1,"unitId":"logic-10","label":"仿公考题型 · 原创练习","questions":[{"id":"q-logic-10-001","type":"定义判断","difficulty":2,"stem":"设例：讨论“办理效率”时，甲先指平均办结时间，后又用服务态度好证明效率高。主要违反什么要求？","options":["整体具有的性质不能直接分配给每个成员","互相矛盾的判断不能在同一条件下同假","同一讨论中概念含义应保持明确一致","互相矛盾的判断不能在同一条件下同真"],"answerIndex":2,"explanation":"本讲以同一律要求同一思维过程中概念保持确定；此处把时间效率换成态度评价。","whyWrong":["这是集合体与成员的混淆，题设是效率含义转变。","题设不是同时否定矛盾双方。","正确","题设没有同时肯定相反判断，核心是概念变义。"],"basis":{"paras":[],"excerptIds":["e-identity","e-switch","e-whole","e-change"],"anchors":[]},"knowledge":["identity"]},{"id":"q-logic-10-002","type":"逻辑判断","difficulty":2,"stem":"设例：同一时点同一材料，甲同时说“已经核验”和“尚未核验”，含义一致。正确评价是","options":["两个判断不能同真，至少一个不符合实际","两个判断不能同假，所以可以不检查它们是否同真","同一材料可以有多种属性，因而两判断可同时成立","核验状态可能随时间变化，所以同一时点也可并真"],"answerIndex":0,"explanation":"本讲强调同一时间、对象和方面，不能同时肯定相互矛盾的断定；题设已排除语义差异。","whyWrong":["正确","排中律不取消矛盾律，不能据此容许同时肯定。","多种属性不等于同一方面的矛盾属性可并真。","可能变化不能取消固定时点的相互否定。"],"basis":{"paras":[],"excerptIds":["e-noncontradiction","e-consistent","e-condition","e-respects"],"anchors":[]},"knowledge":["noncontradiction"]},{"id":"q-logic-10-003","type":"逻辑判断","difficulty":2,"stem":"设例：对同一材料，审核员说“不知道已归档是否为真”。这是否违反排中律？","options":["不违反，因为归档与未归档可以同时都不真实","不违反，尚未知道真值不等于否定矛盾双方","违反，因为排中律要求立刻知道哪一个判断真实","违反，因为不知道意味着同时否定归档与未归档"],"answerIndex":1,"explanation":"本讲区分客观真值关系与认识状态；不知道哪边真不等于断言两边都假。","whyWrong":["在相同二值条件下矛盾双方不能同假。","正确","把排中律误作即时认知能力要求。","把悬置判断等同双重否定。"],"basis":{"paras":[],"excerptIds":["e-excluded","e-contradictory","e-contrary","e-undecided"],"anchors":[]},"knowledge":["excluded","knowledge"]},{"id":"q-logic-10-004","type":"逻辑判断","difficulty":3,"stem":"设例：同一非空班组中，甲否定“全部参加”，也否定“全部未参加”。下列分析正确的是","options":["两句是反对关系，甲可能描述了部分参加的情况","两句是矛盾关系，因此甲至少有一句肯定真实","甲同时否定矛盾双方，必定违反排中律","甲否定两个全称判断，说明班组一定没有成员"],"answerIndex":0,"explanation":"本讲提醒排中律针对矛盾判断，不能把反对判断误作非此即彼；部分参加时两全称均假。","whyWrong":["正确","两句不是矛盾双方。","把反对关系错作矛盾关系。","非空且部分参加也可满足双重否定。"],"basis":{"paras":[],"excerptIds":["e-excluded","e-contradictory","e-contrary"],"anchors":[]},"knowledge":["excluded"]},{"id":"q-logic-10-005","type":"逻辑判断","difficulty":3,"stem":"设例：文件先明确按旧口径统计，后公开说明采用新口径并重新计算。是否必然违反同一律？","options":["必然违反，统计结果不同就证明论题在暗中转移","必然违反，同一律要求同名概念跨条件也绝不改变","未必违反，新旧口径虽不同但可在同一推导中互换","未必违反，公开区分口径并保持各自推导一致即可"],"answerIndex":3,"explanation":"本讲承认事物和认识会变化；同一律要求在确定讨论条件下保持概念确定，而非冻结概念。","whyWrong":["题设已公开区分口径，并非暗中偷换。","同一律不要求忽视条件变化。","公开说明变更并不许可忽略口径差别混用。","正确"],"basis":{"paras":[],"excerptIds":["e-identity","e-switch","e-whole","e-change","e-objective","e-reality","e-notabsolute","e-distinct"],"anchors":[]},"knowledge":["identity","basis"]},{"id":"q-logic-10-006","type":"逻辑判断","difficulty":3,"stem":"设例：某方案“对办理速度有利”且“对初期成本不利”。对此最恰当的分析是","options":["两个判断都涉及方案评价，因而应当视为同一方面","有利与不利不能同真，所以至少一个评价必须撤回","涉及不同方面，不能仅凭措辞判为自相矛盾","二者应是矛盾关系，只是尚不知道哪一个为真"],"answerIndex":2,"explanation":"本讲要求辨别同一方面的相互否定；速度与成本是不同方面，可以同时有相应表现。","whyWrong":["同属评价不等于速度与成本属于同一方面。","忽略这两个评价针对不同方面。","正确","不同方面的判断不构成矛盾双方。"],"basis":{"paras":[],"excerptIds":["e-noncontradiction","e-consistent","e-condition","e-respects"],"anchors":[]},"knowledge":["noncontradiction"]},{"id":"q-logic-10-007","type":"定义判断","difficulty":2,"stem":"设例：哪项明确违反排中律？（已归档与未归档含义固定且互相矛盾。）","options":["这份材料是否归档，我目前还需要核实","这份材料已经归档，但尚未完成后续复核","这份材料昨天未归档，今天已经完成归档","说它已归档不对，说它未归档也不对"],"answerIndex":3,"explanation":"本讲以排中律排除同条件下对矛盾双方的同时否定；其余是未知、时间变化或不同性质。","whyWrong":["悬置判断不是双重否定。","归档与后续复核不是互相否定。","不同时间不构成同条件矛盾。","正确"],"basis":{"paras":[],"excerptIds":["e-excluded","e-contradictory","e-contrary"],"anchors":[]},"knowledge":["excluded"]},{"id":"q-logic-10-008","type":"逻辑判断","difficulty":3,"stem":"设例：原争议是“是否缩短办结时间”，答辩只证明“服务态度获得认可”，并宣称已解决原争议。错误最接近","options":["用新的论题代替原论题，未回答原有争点","从真实个案推出总体结论，遗漏归纳样本","拒绝矛盾双方的任一断定，直接违反排中律","对同一断定同时肯定和否定，直接自相矛盾"],"answerIndex":0,"explanation":"本讲以同一律要求论题保持一致；证明另一种优点不能替代对办理时间的讨论。","whyWrong":["正确","题设没有个案到总体的推导。","未表现为对矛盾双方两不可。","没有明确同时肯定与否定一个判断。"],"basis":{"paras":[],"excerptIds":["e-identity","e-switch","e-whole","e-change"],"anchors":[]},"knowledge":["identity"]},{"id":"q-logic-10-009","type":"常识判断","difficulty":2,"stem":"关于暂不作判断，下列说法符合本讲的是","options":["暂不判断可以是证据不足时的认识状态","暂不判断就是断言肯定和否定两方都假","暂不判断说明矛盾双方之外还存在第三个真值","暂不判断必须以肯定和否定两方同时为真为根据"],"answerIndex":0,"explanation":"本讲允许在认识不足时暂不确定哪方为真，但不把这种状态解释为矛盾两方皆假。","whyWrong":["正确","未知不是对矛盾双方作双重否定。","认识未定不等于在题设二值断定外增加第三种状态。","无证据确定不意味着两方并真。"],"basis":{"paras":[],"excerptIds":["e-undecided","e-excluded"],"anchors":[]},"knowledge":["knowledge"]},{"id":"q-logic-10-010","type":"常识判断","difficulty":3,"stem":"依据本讲，对思维规律与事物变化的关系，哪项理解恰当？","options":["概念可随对象变化，因而同次推导可随结论需要换义","概念可随对象变化，但同一次推导仍须保持含义确定","不同方面可有不同性质，因而同一方面的两断定可并真","对象具有相对稳定性，因而已定概念无需再随认识调整"],"answerIndex":1,"explanation":"本讲不把形式逻辑的确定性理解为否认发展，而要求具体讨论有明确条件。","whyWrong":["发展不允许同次推导任意变义。","正确","不同方面不能为同一方面的矛盾并真辩护。","相对稳定不排除概念的明确修正。"],"basis":{"paras":[],"excerptIds":["e-objective","e-reality","e-notabsolute","e-change","e-distinct"],"anchors":[]},"knowledge":["basis"]},{"id":"q-logic-10-011","type":"类比推理","difficulty":2,"stem":"矛盾律∶不能同真","options":["矛盾关系∶只能同真","反对关系∶不能同假","排中律∶不能同假","同一律∶不能变更"],"answerIndex":2,"explanation":"本讲区分基本规律约束的真值组合：矛盾律排除矛盾两方同真，排中律排除其同假。","whyWrong":["矛盾关系既不能同真也不能同假。","反对关系也约束真值组合，但可以同假，不能同真。","正确","同一律并不禁止明确条件下概念的发展变化。"],"basis":{"paras":[],"excerptIds":["e-noncontradiction","e-consistent","e-condition","e-respects","e-excluded","e-contradictory","e-contrary"],"anchors":[]},"knowledge":["noncontradiction","excluded"]},{"id":"q-logic-10-012","type":"逻辑判断","difficulty":3,"stem":"设例：甲称“昨天所有申请已审结”，乙称“今天有新申请未审结”。若据此认定两人冲突，遗漏了什么？","options":["有些与所有的量不同，因此任何两句都不可能冲突","判定矛盾还须核对时间与对象范围是否相同","肯定和否定分属不同形式，因此无需比较具体范围","两句都涉及申请，就可以把不同时点的范围合并"],"answerIndex":1,"explanation":"本讲要求同一条件，昨日申请与今日新增申请范围不同，可能同时符合事实。","whyWrong":["全称肯定与特称否定在同范围条件下正可矛盾。","正确","是否同对象同条件正是判定冲突的必要检查。","同名不能消除对象与时间差别。"],"basis":{"paras":[],"excerptIds":["e-noncontradiction","e-consistent","e-condition","e-respects"],"anchors":[]},"knowledge":["noncontradiction"]},{"id":"q-logic-10-013","type":"逻辑判断","difficulty":3,"stem":"设例：某人以“公众利益”指整体利益提出方案，答辩时却以单个受益者得利证明公众利益不受损。最需追问的是","options":["是否对同一个受益者同时肯定获利和否定获利","是否把整体不受损及其否定都认定为不能成立","是否把原本整体利益受损的论题改成整体获益","整体与个体两个意义是否被混作同一概念"],"answerIndex":3,"explanation":"本讲提醒不能把整体和个体混淆；个体受益并不直接证明整体利益不受损。","whyWrong":["题设未自相矛盾，而是把个体受益作为整体不受损的根据。","题设不是对矛盾双方两不可，而是整体与个体换义。","原主张未先断定整体受损，关键是整体与成员的含义混淆。","正确"],"basis":{"paras":[],"excerptIds":["e-identity","e-switch","e-whole","e-change"],"anchors":[]},"knowledge":["identity"]},{"id":"q-logic-10-014","type":"逻辑判断","difficulty":2,"stem":"设例：同条件下P与非P互相矛盾。甲接受两者都真，乙接受两者都假。正确的对应诊断是","options":["甲乙只是保持未知，均未作出断定","甲乙都只违反同一律而非真值规律","甲违反矛盾律，乙违反排中律","甲违反排中律，乙违反矛盾律"],"answerIndex":2,"explanation":"本讲用矛盾律排除两可，用排中律排除两不可；两者不能混为一谈。","whyWrong":["同时接受真或假都是明确断定，不是未知。","未准确指出题设直接表现的真值错误。","正确","交换了两条规律的约束。"],"basis":{"paras":[],"excerptIds":["e-excluded","e-contradictory","e-contrary","e-noncontradiction","e-consistent","e-condition","e-respects"],"anchors":[]},"knowledge":["excluded","noncontradiction"]},{"id":"q-logic-10-015","type":"逻辑判断","difficulty":3,"stem":"设例：研究者发现旧结论与新证据冲突，明确撤回旧结论并重新调查。最合适的评价是","options":["新证据与旧结论冲突就证明所有旧论据均为假","旧结论曾被接受，所以应把新证据解释为不可能","新旧结论相互否定，所以更正结论本身违反矛盾律","承认冲突并修正结论有别于同时坚持矛盾断定"],"answerIndex":3,"explanation":"本讲不要求认识永不变化；明确承认并解决冲突不同于在同条件下同时肯定两方。","whyWrong":["冲突不等于原来所有事实都假，须定位错误来源。","旧接受状态不保证结论真，须按证据复核。","矛盾律禁止同条件同时坚持两方，不禁止撤回和修正。","正确"],"basis":{"paras":[],"excerptIds":["e-objective","e-reality","e-notabsolute","e-change","e-distinct","e-undecided","e-excluded"],"anchors":[]},"knowledge":["basis","knowledge"]}],"open":[{"id":"o-logic-10-001","type":"论证分析","material":{"text":"设例：审核者说：“同一材料要么已核验，要么未核验。你暂时不知道，就等于两边都否定，违反排中律，必须立刻选一个。”","sourceIds":[]},"prompt":"评价该要求，区分真值关系与认识状态，并提出合适的表达方式。（150—220字）","points":["已核验与未核验在题设条件下互相矛盾，不能同假。","不知道哪方真是认识状态，不是断定两方皆假。","排中律不能代替调查，也不要求在无证据时随意选择。","可以明确说核验状态尚待核实，并说明核查步骤。"],"basis":{"paras":[],"excerptIds":["e-excluded","e-contradictory","e-contrary","e-undecided"],"anchors":[]}},{"id":"o-logic-10-002","type":"论证分析","material":{"text":"设例：评议原本讨论方案是否节约总成本。答辩者先以单个部门成本降低作证，后又称方案能提高速度，最后说事物有多面性，所以任何不一致都无须解释。","sourceIds":[]},"prompt":"识别论题和概念的变化，说明多面性为何不能替代逻辑一致性的要求。（150—220字）","points":["单个部门成本不等于整体总成本，须核查是否转移成本。","提高速度是另一评价方面，不能代替总成本论题。","不同方面可以有利有弊，但同条件同方面的相互否定不能同时成立。","应固定成本范围和评价条件，分别核实成本与速度并回应原争点。"],"basis":{"paras":[],"excerptIds":["e-identity","e-switch","e-whole","e-change","e-noncontradiction","e-consistent","e-condition","e-respects"],"anchors":[]}}]},"materials":[],"knowledge":[{"id":"identity","title":"同一律"},{"id":"noncontradiction","title":"矛盾律"},{"id":"excluded","title":"排中律"},{"id":"knowledge","title":"真值与认知"},{"id":"basis","title":"规律的依据"}],"links":{"q-logic-10-001":[{"kind":"excerpt","label":"同一律的原文表述","href":"./logic-10.html#excerpt-e-identity"},{"kind":"ocr","label":"看 OCR 原书 · 同一律的原文表述","href":"./source.html#book=formal-logic-1976&from=1582&to=1582&ref=logic-10.html%23excerpt-e-identity"},{"kind":"excerpt","label":"违反同一律的错误","href":"./logic-10.html#excerpt-e-switch"},{"kind":"ocr","label":"看 OCR 原书 · 违反同一律的错误","href":"./source.html#book=formal-logic-1976&from=1590&to=1590&ref=logic-10.html%23excerpt-e-switch"},{"kind":"excerpt","label":"整体与个体的偷换","href":"./logic-10.html#excerpt-e-whole"},{"kind":"ocr","label":"看 OCR 原书 · 整体与个体的偷换","href":"./source.html#book=formal-logic-1976&from=1593&to=1593&ref=logic-10.html%23excerpt-e-whole"},{"kind":"excerpt","label":"同一不等于永不变化","href":"./logic-10.html#excerpt-e-change"},{"kind":"ocr","label":"看 OCR 原书 · 同一不等于永不变化","href":"./source.html#book=formal-logic-1976&from=1610&to=1610&ref=logic-10.html%23excerpt-e-change"}],"q-logic-10-002":[{"kind":"excerpt","label":"矛盾律简式","href":"./logic-10.html#excerpt-e-noncontradiction"},{"kind":"ocr","label":"看 OCR 原书 · 矛盾律简式","href":"./source.html#book=formal-logic-1976&from=1626&to=1626&ref=logic-10.html%23excerpt-e-noncontradiction"},{"kind":"excerpt","label":"矛盾律的要求","href":"./logic-10.html#excerpt-e-consistent"},{"kind":"ocr","label":"看 OCR 原书 · 矛盾律的要求","href":"./source.html#book=formal-logic-1976&from=1627&to=1627&ref=logic-10.html%23excerpt-e- "o-logic-10-002":[{"kind":"excerpt","label":"同一律的原文表述","href":"./logic-10.html#excerpt-e-identity"},{"kind":"ocr","label":"看 OCR 原书 · 同一律的原文表述","href":"./source.html#book=formal-logic-1976&from=1582&to=1582&ref=logic-10.html%23excerpt-e-identity"},{"kind":"excerpt","label":"违反同一律的错误","href":"./logic-10.html#excerpt-e-switch"},{"kind":"ocr","label":"看 OCR 原书 · 违反同一律的错误","href":"./source.html#book=formal-logic-1976&from=1590&to=1590&ref=logic-10.html%23excerpt-e-switch"},{"kind":"excerpt","label":"整体与个体的偷换","href":"./logic-10.html#excerpt-e-whole"},{"kind":"ocr","label":"看 OCR 原书 · 整体与个体的偷换","href":"./source.html#book=formal-logic-1976&from=1593&to=1593&ref=logic-10.html%23excerpt-e-whole"},{"kind":"excerpt","label":"同一不等于永不变化","href":"./logic-10.html#excerpt-e-change"},{"kind":"ocr","label":"看 OCR 原书 · 同一不等于永不变化","href":"./source.html#book=formal-logic-1976&from=1610&to=1610&ref=logic-10.html%23excerpt-e-change"},{"kind":"excerpt","label":"矛盾律简式","href":"./logic-10.html#excerpt-e-noncontradiction"},{"kind":"ocr","label":"看 OCR 原书 · 矛盾律简式","href":"./source.html#book=formal-logic-1976&from=1626&to=1626&ref=logic-10.html%23excerpt-e-noncontradiction"},{"kind":"excerpt","label":"矛盾律的要求","href":"./logic-10.html#excerpt-e-consistent"},{"kind":"ocr","label":"看 OCR 原书 · 矛盾律的要求","href":"./source.html#book=formal-logic-1976&from=1627&to=1627&ref=logic-10.html%23excerpt-e-consistent"},{"kind":"excerpt","label":"判断相反未必逻辑矛盾","href":"./logic-10.html#excerpt-e-condition"},{"kind":"ocr","label":"看 OCR 原书 · 判断相反未必逻辑矛盾","href":"./source.html#book=formal-logic-1976&from=1652&to=1652&ref=logic-10.html%23excerpt-e-condition"},{"kind":"excerpt","label":"须区分方面","href":"./logic-10.html#excerpt-e-respects"},{"kind":"ocr","label":"看 OCR 原书 · 须区分方面","href":"./source.html#book=formal-logic-1976&from=1658&to=1658&ref=logic-10.html%23excerpt-e-respects"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-10","title":"第十讲·思维要遵守形式逻辑的基本规律","output":"logic-10.html"},"excerpts":[{"id":"e-three","label":"本讲的三条规律","lineStart":1565,"lineEnd":1565,"text":"形式逻辑的基本规律有：同一律、矛盾律和排中律。"},{"id":"e-identity","label":"同一律的原文表述","lineStart":1582,"lineEnd":1582,"text":"在同一恩维过程中，人「们思想的内容必须保持同一"},{"id":"e-switch","label":"违反同一律的错误","lineStart":1590,"lineEnd":1590,"text":"表现在概念方面，主要是愉换概念或概念混淆的错误。表现在判断方面，是偷换论题或论题含混的错误。"},{"id":"e-whole","label":"整体与个体的偷换","lineStart":1593,"lineEnd":1593,"text":"大前提中的“鲁迅的著作”指的是鲁迅著作的整体，而小前提中的“鲁迅的著作”是指鲁迅的一篇一篇著作，这两个概念是有区别的。"},{"id":"e-change","label":"同一不等于永不变化","lineStart":1610,"lineEnd":1610,"text":"同一律只是要求在同一思维过程中概念和判断的含义要保持同一，不是说思想不会变化。"},{"id":"e-noncontradiction","label":"矛盾律简式","lineStart":1626,"lineEnd":1626,"text":"不能既是甲又不是甲。"},{"id":"e-consistent","label":"矛盾律的要求","lineStart":1627,"lineEnd":1627,"text":"矛盾律要求人们的思想应当首尾一贯，不能前后矛盾。"},{"id":"e-condition","label":"判断相反未必逻辑矛盾","lineStart":1652,"lineEnd":1652,"text":"如果由于时间变了，或者对象变了，因而作出了相反的判断，不能说违反矛盾律。"},{"id":"e-respects","label":"须区分方面","lineStart":1658,"lineEnd":1658,"text":"在同一时间内，人们从不同的方面来认识同一个对象，也可以作出两个相反的判断。"},{"id":"e-reality","label":"逻辑矛盾与现实矛盾","lineStart":1664,"lineEnd":1664,"text":"形式逻辑的矛盾律，只是不容许出现思想中的自相矛盾，但决不否认现实矛盾。"},{"id":"e-excluded","label":"排中律简式","lineStart":1678,"lineEnd":1678,"text":"或者是甲或者不是甲。"},{"id":"e-contradictory","label":"不能随意二选一","lineStart":1698,"lineEnd":1698,"text":"排中律只适用于有矛盾关系的判断。"},{"id":"e-contrary","label":"反对关系还可能同假","lineStart":1699,"lineEnd":1699,"text":"有反对关系的两个判断虽然不能同真，但可能都是假的"},{"id":"e-undecided","label":"暂不能断定不违背排中律","lineStart":1701,"lineEnd":1701,"text":"当我们反复考虑两种可能而暂时不能断定时，因为正在考虑之中，不能认为违反排中律。"},{"id":"e-objective","label":"本书关于规律依据的观点","lineStart":1715,"lineEnd":1715,"text":"客观事物的这种相对固定性就是形式逻辑基本规律的客观依据。"},{"id":"e-distinct","label":"三律不可混同","lineStart":1717,"lineEnd":1717,"text":"不能把它们混同起来。"},{"id":"e-notabsolute","label":"本书提醒不要绝对化","lineStart":1723,"lineEnd":1723,"text":"不能把形式逻辑的基本规律绝对化，否则，就是犯了形而上学的错误。"}]}</script></body></html>
