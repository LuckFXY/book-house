</main><script id="questions-data" type="application/json">{"bank":{"version":1,"unitId":"practice","questions":[{"id":"q-practice-001","type":"常识判断","difficulty":2,"stem":"下列关于社会实践的说法，与《实践论》观点不一致的是：","options":["生产是最基本的实践活动，认识还受到政治和文化生活的影响","生产决定其他实践活动，因而其他活动只能传播已有的认识","认识产生于社会生活，考察个人认识也需考虑其所处的关系","实践具有多种社会形式，不能把它限定为个人直接动手操作"],"answerIndex":1,"explanation":"本文在 p03 把生产称为最基本的实践活动，p04 又指出人们从政治、文化生活中获得对社会关系的认识。B 将生产的基础地位扩大为其他活动只能传播而不能产生认识，因而是不一致项。","whyWrong":["非所选项：本文同时肯定生产的基础地位和政治、文化生活的作用。","正确","非所选项：符合作者从社会关系考察认识的要求。","非所选项：符合本文列举的多种社会实践形式。"],"basis":{"paras":["p03","p04"],"excerptIds":["e-social"],"anchors":["a-k-source-0","a-k-social-0"]},"knowledge":["k-source","k-social"]},{"id":"q-practice-002","type":"常识判断","difficulty":3,"stem":"下列关于认识来源与真理标准的说法，与《实践论》一致的是：","options":["来源回答认识如何产生，标准回答是否符合实际，实践与二者均有关","来源考察亲身活动，标准考察经验能否上升为理论，二者各有所属","认识既然产生于实际活动，其真理性便可由这种实践来源加以确认","实践提供材料，理论揭示规律，因而规律性理论才是最终检验标准"],"answerIndex":0,"explanation":"本文在 p03 讨论知识从生产实践中产生，在 p06、p20 讨论认识如何受实践结果检验。源自实践并不保证某个具体判断已经正确，实践中形成的错误认识仍须纠正。","whyWrong":["正确","混淆层次：来源不只指个人亲历，上升为理论也未完成实践检验。","混淆来源与标准：实践中产生的具体认识仍可能片面或错误。","颠倒检验关系：理论揭示规律的主张仍需由社会实践检验。"],"basis":{"paras":["p20","p03","p06"],"excerptIds":["e-standard","e-test"],"anchors":["a-k-source-0","a-k-criterion-0"]},"knowledge":["k-source","k-criterion"]},{"id":"q-practice-003","type":"类比推理","difficulty":2,"stem":"感觉∶感性认识","options":["实践∶理性认识","概念∶感性认识","概念∶理性认识","判断∶推理结论"],"answerIndex":2,"explanation":"本文在 p08、p09 将感觉归于感性阶段，把概念、判断和推理归于理性阶段。题干关系是具体认识形式与其所属阶段，C 保持这一关系；B 虽也搭配形式和阶段，却错配了所属阶段。","whyWrong":["关系不符：实践是认识的基础，并非某个认识阶段的具体思维形式。","表层同为认识形式与阶段，但概念属于理性阶段，不属于感性阶段。","正确","关系不符：判断可作为推理的前提，不是推理结论所属的认识阶段。"],"basis":{"paras":["p08","p09"],"excerptIds":["e-sensory","e-concept"],"anchors":["a-k-sensory-0","a-k-rational-0"]},"knowledge":["k-sensory","k-rational"]},{"id":"q-practice-004","type":"常识判断","difficulty":2,"stem":"关于从感性认识到理性认识，下列说法与《实践论》一致的是：","options":["材料的数量积累达到充分程度，就意味着认识性质的转变已经完成","材料只有经理论加工才有意义，因此理性认识能够独立确立其基础","形成的概念可以超出个别印象，因此其可靠性不再取决于经验基础","材料须丰富并合于实际，还要经过加工，才能逐步把握本质和联系"],"answerIndex":3,"explanation":"本文在 p16、p18 要求材料丰富、合于实际，并说明思考加工的作用。第一次飞跃是认识性质的变化，不能把它缩成数量积累或脱离经验。","whyWrong":["数量替代性质：材料充分不等于已形成概念、判断和推理。","颠倒依赖关系：加工材料不等于理性可以自行产生经验基础。","偷换超出的含义：超出局部印象不等于摆脱实践基础。","正确"],"basis":{"paras":["p16","p18","p09","p19"],"excerptIds":["e-material","e-relation"],"anchors":["a-k-first-leap-0","a-k-unity-0"]},"knowledge":["k-first-leap","k-unity"]},{"id":"q-practice-005","type":"常识判断","difficulty":2,"stem":"关于理论回到实践，下列说法与《实践论》不一致的是：","options":["理论指导改造现实的过程，同时也是理论接受检验和获得发展的过程","理论形成时已经解决真理性问题，返回实践主要是把已有真理具体化","理论即使形成于实践，也仍须用于新的行动，不能以形成代替检验","方案在实行中可能需要修改，这与理论能够指导行动的作用并不冲突"],"answerIndex":1,"explanation":"本文在 p20 指出，由感性到理性的运动没有也不能完全解决理论是否符合客观真理性的问题。B 将形成理论误作真理性检验已经完成，故为不一致项；p21 对方案修改的论述进一步说明检验仍在继续。","whyWrong":["非所选项：符合本文对指导、检验和发展三个方面的联系。","正确","非所选项：区分了实践来源与返回实践接受检验。","非所选项：p21 承认方案修改，并未因此否定理论指导。"],"basis":{"paras":["p21","p20","p06"],"excerptIds":["e-return","e-test"],"anchors":["a-k-second-leap-0","a-k-criterion-0"]},"knowledge":["k-second-leap","k-criterion"]},{"id":"q-practice-006","type":"常识判断","difficulty":3,"stem":"本文肯定直接经验的基础地位，又承认间接知识。下列理解正确的是：","options":["直接经验承担知识的来源作用，间接经验则因经过概括而承担检验作用","知识是否可靠取决于个人取得方式，亲历所得比他人传递更有真理性","知识对个人可以间接取得，从其总体来源看却仍同直接经验相联系","知识一经科学方法概括而形成理论，其可靠性便不再依赖原有实践"],"answerIndex":2,"explanation":"本文在 p10 区分知识对个人的取得方式与知识总体的来源。对学习者是间接经验的内容，对原来获得它的人可以是直接经验，其可靠性仍取决于是否如实反映客观事物。","whyWrong":["功能错配：直接与间接是取得方式之分，并非来源与标准的分工。","偷换判断依据：个人取得方式不直接决定知识是否可靠。","正确","割裂联系：概括形成理论不能取消其经验基础及实践检验。"],"basis":{"paras":["p10","p03"],"excerptIds":["e-indirect"],"anchors":["a-k-indirect-0","a-k-source-0"]},"knowledge":["k-indirect","k-source"]},{"id":"q-practice-007","type":"常识判断","difficulty":2,"stem":"关于认识随实际发展，下列说法与《实践论》不一致的是：","options":["某方案已在实践中奏效，条件变化后便只需改进执行而无须再审视认识","某阶段的认识可以得到证实，对象进入新阶段时仍须研究新的具体条件","旧经验能作为认识新情况的材料，但不能直接代替对新情况的实际调查","原方案需要作部分甚至全部修改，不等于原阶段已取得的成果从未存在"],"answerIndex":0,"explanation":"本文在 p22 要求实际进入新阶段时，人的思想、计划和方案也随之转变。A 预先把调整限定于执行，排除了重新审视认识的可能，属于把阶段性成功扩大为持续正确的保证。","whyWrong":["正确","非所选项：区分阶段性证实与对象继续发展。","非所选项：既承认旧经验价值，又保留新调查的必要性。","非所选项：新条件下调整不倒推出旧结果不存在。"],"basis":{"paras":["p22","p27"],"excerptIds":["e-development","e-cycle"],"anchors":["a-k-historical-0","a-k-cycle-0"]},"knowledge":["k-historical","k-cycle"]},{"id":"q-practice-008","type":"常识判断","difficulty":2,"stem":"依据编者题解，教条主义与经验主义的共同问题是：","options":["都使间接经验取代直接经验，因而低估了亲身参加实践的作用","都把经验材料看作理论根据，因而未能承认理论对实践的指导","都把个别工作结果当作理论标准，因而完全否认概念判断的意义","都割裂理论与实际经验的联系，但对理论和局部经验的偏重不同"],"answerIndex":3,"explanation":"编者在 p01 批评一方照搬书中词句、拒绝革命经验，另一方拘守自身片断经验、轻视理论。二者的具体表现不同，不能归成完全相同的行为。","whyWrong":["以偏概全：拘守自身经验并不等于让间接经验取代直接经验。","混淆正确关系与错误：以经验为根据本身不是二者共同错误。","扩大判断：编者没有说两者都完全否认概念和判断。","正确"],"basis":{"paras":["p01"],"excerptIds":["e-background"],"anchors":["a-k-dogma-0","a-k-empiricism-0"]},"knowledge":["k-dogma","k-empiricism"]},{"id":"q-practice-009","type":"常识判断","difficulty":3,"stem":"关于思想落后于实际和超过实际，符合《实践论》的是：","options":["前者因坚持理论而表现为冒险主义，后者因依赖经验而表现为右倾","前者停在已过去的阶段，后者强行提前未来条件，共同偏离当前实际","前者的问题在于保留旧经验，后者的问题在于提出尚未实现的新目标","前者主要是认识材料不足，后者主要是行动不够，均无需调整原有判断"],"answerIndex":1,"explanation":"本文在 p23、p24 批评的是认识与客观过程所处阶段不相适应，p25 要求具体历史条件下的统一。判断关键是与实际条件的关系，不是经验或理想本身。","whyWrong":["对应颠倒：本文将落后于实际联系右倾，将超过现实阶段联系冒险主义。","正确","扩大外延：保留经验或提出目标不必然脱离具体条件。","误设补救：两种偏差都涉及判断与阶段不相适应，不能排除调整。"],"basis":{"paras":["p23","p24","p25"],"excerptIds":[],"anchors":["a-k-subject-object-0","a-k-right-0","a-k-left-0"]},"knowledge":["k-subject-object","k-right","k-left"]},{"id":"q-practice-010","type":"常识判断","difficulty":2,"stem":"下列选项中，最直接体现本文所说的改造主观世界的是：","options":["把已有结论用于改变服务流程，使理论在现实活动中转化为实际结果","扩大调查对象并增加访问次数，使掌握的情况覆盖更广的现实范围","反省只听支持意见的偏向，改善分析能力及自身认识与实际的关系","将试点经验编成统一操作方案，使工作人员在具体行动中有所遵循"],"answerIndex":2,"explanation":"本文在 p26 用破折号说明主观世界改造的内容，包括认识能力以及主观世界同客观世界的关系，并同时提出改造客观世界。","whyWrong":["对象侧重不同：主要描述用认识改变客观流程，未直接说明认识能力改造。","条件不等于任务：扩大材料范围有帮助，但未直接说明认识方式的改变。","正确","应用不同于能力改造：编制操作方案主要描述指导行动的安排。"],"basis":{"paras":["p26"],"excerptIds":[],"anchors":["a-k-transform-0"]},"knowledge":["k-transform"]},{"id":"q-practice-011","type":"常识判断","difficulty":3,"stem":"关于认识的完成与发展，下列说法与《实践论》不一致的是：","options":["某阶段认识既已完成，后续实践便只负责应用，不再能修正这一阶段的认识","对于特定过程实现预期目的，可以说这一具体阶段的认识运动已经完成","对于对象继续发展的过程，人的认识还需随阶段转换而继续推移和发展","认识在实践中获得阶段性成果，与人们对真理的认识没有终点可以并存"],"answerIndex":0,"explanation":"本文在 p21 限定了具体过程和发展阶段，p22、p25 则说明认识继续发展。A 将阶段完成解释为永久免于修正，超出了原文的限定；认识某阶段取得成果不意味着其全部内容再无补充、纠正的可能。","whyWrong":["正确","非所选项：保留了特定过程、阶段与实现目的的限定。","非所选项：符合 p22 对过程继续发展的论述。","非所选项：区分了阶段性成果和整体认识过程。"],"basis":{"paras":["p21","p22","p25","p27"],"excerptIds":["e-development"],"anchors":["a-k-relative-0","a-k-cycle-0"]},"knowledge":["k-relative","k-cycle"]},{"id":"q-practice-012","type":"类比推理","difficulty":2,"stem":"感性认识∶理性认识∶社会实践","options":["经验材料∶理论概括∶概念推演","理论概括∶经验材料∶实际检验","经验材料∶实践应用∶理论形成","经验材料∶理论概括∶实际检验"],"answerIndex":3,"explanation":"本文在 p10、p19 强调感性与理性的联系，p20 要求理性认识再回到实践。D 对应材料基础、理论形成、实践检验三个连续环节；A 前两项也对应，却把最后的实践检验换成了继续进行概念推演。","whyWrong":["前两环节对应，但末项仍属理性思考，未返回改造对象的实践。","前后次序颠倒：不能把理论概括置于所据经验材料之前。","环节错位：把理论的实践应用放在该理论形成之前。","正确"],"basis":{"paras":["p10","p19","p09","p20"],"excerptIds":["e-unity","e-relation"],"anchors":["a-k-unity-0","a-k-rational-0","a-k-second-leap-0"]},"knowledge":["k-unity","k-rational","k-second-leap"]},{"id":"q-practice-013","type":"定义判断","difficulty":2,"stem":"本文把感觉、印象及对现象和外部联系的认识称为感性认识。哪项设例最符合？","options":["小林依据居民的焦虑表现，判断等待时间反映出审核流程中的结构问题","小林记下各时段排队情况及居民反映，尚未分析它们之间的内在联系","小林将不同窗口的记录相互比较，推断等候差异与办理事项复杂度有关","小林将受访者所讲的反复往返经历，归纳为多个环节之间的衔接问题"],"answerIndex":1,"explanation":"本文在 p08 把所见所闻及其印象作为感性认识的例子。记录现象而尚未分析原因符合该定义；生气本身不是这种认识阶段的判断依据。","whyWrong":["已越过纯感觉：从焦虑表现判断结构问题，涉及对原因的解释。","正确","阶段不符：已运用比较和推理分析联系。","阶段不符：从经历归纳环节关系，已进行理性加工。"],"basis":{"paras":["p08"],"excerptIds":["e-sensory"],"anchors":["a-k-sensory-0"]},"knowledge":["k-sensory"]},{"id":"q-practice-014","type":"定义判断","difficulty":2,"stem":"本文以概念、判断和推理把握内部联系的阶段为理性认识。哪项设例最符合？","options":["调查者细致记下居民的不同经历，使原先分散的材料获得完整保存","调查者在访谈中克制个人情绪，使记录免受一时好恶的明显影响","调查者综合记录与访谈，区分表面拥挤和办理环节，提出原因解释","调查者亲自体验办事的各个环节，对原有报告中的情况形成直观印象"],"answerIndex":2,"explanation":"本文在 p09、p16 说明从材料到概念、判断和推理的过程。形成原因解释体现了这种加工，但进入理性认识阶段并不表示解释已经受实践证实。","whyWrong":["材料保存不等于加工：完整记录尚未表明概念、判断和推理。","偷换理性含义：克制情绪有助于调查，却不是认识阶段的定义。","正确","阶段不符：亲自形成直观印象主要描述感性认识。"],"basis":{"paras":["p16","p09"],"excerptIds":["e-concept","e-material"],"anchors":["a-k-rational-0","a-k-first-leap-0"]},"knowledge":["k-rational","k-first-leap"]},{"id":"q-practice-015","type":"定义判断","difficulty":2,"stem":"编者以脱离实际、机械搬用理论词句说明教条主义。哪项设例最符合？","options":["负责人以手册已概括普遍规律为由，在出现相反材料后仍照用原结论","负责人以自身多次办理经验为由，认为不必研究手册中的系统性解释","负责人以未来设施终将齐备为由，要求当前立即全面实行配套新方案","负责人以理论可以指导调查为由，先列待核实问题再研究本地的材料"],"answerIndex":0,"explanation":"编者在 p01 批评的关键是拒绝实践经验并照搬词句，不是一般的阅读理论或使用手册。","whyWrong":["正确","邻近概念混淆：偏重个人局部经验、轻视理论，更符合经验主义。","邻近概念混淆：强行提前未来条件，更符合本文批评的冒险主义。","不符合定义：以理论提出待核实问题并未拒绝实际材料。"],"basis":{"paras":["p01"],"excerptIds":["e-background"],"anchors":["a-k-dogma-0"]},"knowledge":["k-dogma"]},{"id":"q-practice-016","type":"定义判断","difficulty":2,"stem":"编者以拘守片断经验、轻视理论与全局说明经验主义。哪项设例最符合？","options":["负责人依据通用模型直接提出本地结论，认为已有理论足以覆盖特殊情况","负责人依据当前运行记录修正原有解释，同时保留尚未得到证实的假设","负责人依据本地材料暂缓推广他地经验，准备查明两地条件的重要差异","负责人依据自己经手事项的经验判断全局，认为系统研究不能增加认识"],"answerIndex":3,"explanation":"编者批评的是把局部经验封闭起来、低估理论与全局的意义。保存或总结经验本身并不属于这种错误。","whyWrong":["邻近概念混淆：机械使用理论模型更接近教条主义。","不符合定义：用实践修正解释，并未把个人经验封闭起来。","不符合定义：研究适用条件并不等于拒绝理论或间接经验。","正确"],"basis":{"paras":["p01"],"excerptIds":["e-background"],"anchors":["a-k-empiricism-0"]},"knowledge":["k-empiricism"]},{"id":"q-practice-017","type":"定义判断","difficulty":3,"stem":"按本文对直接与间接经验的区分，下列设例中的判断不正确的是：","options":["读者通过经过复核的实验报告了解实验结果，对该结果的了解仍属间接经验","读者亲自比较多份实验报告并核对说法，报告所记的实验经历便属直接经验","实验者亲自观察实验现象，再作概念分析，不能因此否定其经验的直接来源","同一实验知识对原实验者可以是直接经验，对通过文字学习的人则是间接经验"],"answerIndex":1,"explanation":"本文在 p10 区分的是对被认识对象的经验取得方式。B 中读者亲自比较、核对报告，仍是在通过他人记载了解所述实验，不能把报告中的实验经历变为自己的亲历；资料经复核是否可靠、是否经过理论加工，都不直接决定其对读者是直接还是间接经验。本题选择不正确的判断。","whyWrong":["非所选项：复核可能提高可靠性，却不改变读者通过他人取得的方式。","正确","非所选项：直接或间接与感性或理性不是同一分类维度。","非所选项：符合本文对知识总体来源与个人取得方式的区分。"],"basis":{"paras":["p10"],"excerptIds":["e-indirect"],"anchors":["a-k-indirect-0"]},"knowledge":["k-indirect"]},{"id":"q-practice-018","type":"定义判断","difficulty":2,"stem":"本文所说改造主观世界包括改善认识能力及其与实际的关系。哪项设例最直接体现？","options":["把经过讨论的改进方案投入试行，使已有认识转化为实际服务的变化","增加不同地点和时段的访问，补充原先尚未接触到的居民办事情况","反省只愿听好消息的偏向，学习核对相反证据并改进自己的提问方式","根据实际记录重新安排服务人员，使既定方案获得更充分的实施条件"],"answerIndex":2,"explanation":"本文在 p26 强调认识能力及主客观关系的改造。反省观察偏差并改善调查方法，直接对应这一任务。","whyWrong":["对象侧重不同：主要说明认识转化为客观服务变化，未直接说明能力改造。","范围不同于能力：扩大接触面本身未直接表明认识方式的调整。","正确","对象侧重不同：人员安排改变的是实践条件，而非直接改善认识方法。"],"basis":{"paras":["p26"],"excerptIds":[],"anchors":["a-k-transform-0"]},"knowledge":["k-transform"]},{"id":"q-practice-019","type":"定义判断","difficulty":3,"stem":"本文强调主客观在具体历史条件下统一。下列设例哪项不符合？","options":["在服务对象发生变化后，仍以旧方案曾获验证为由，只检查执行是否到位","在获得外地经验后，先比较当地条件，再判断原方案哪些部分适合应用","在新方案未达预期后，同时复查实施条件与原因解释，再决定如何调整","在主要任务改变后，保留旧经验作为材料，重新分析当前任务的具体要求"],"answerIndex":0,"explanation":"本文在 p22、p25 要求认识随客观过程发展。题目问不符合的选项，把过去有效直接当作现在必然有效，取消了具体条件。","whyWrong":["正确","非所选项：重视间接经验，同时考察具体适用条件。","非所选项：没有把失败原因预先限定于执行或理论中的一方。","非所选项：保留经验不等于拘守旧结论。"],"basis":{"paras":["p22","p25"],"excerptIds":["e-development"],"anchors":["a-k-subject-object-0"]},"knowledge":["k-subject-object"]},{"id":"q-practice-020","type":"定义判断","difficulty":2,"stem":"本文把理性认识回到实践称为第二次飞跃。哪项设例最能体现？","options":["对不同窗口的办理材料进行比较，从共同现象中形成关于拥堵的原因解释","参照理论判断筛选调查对象，进一步取得尚未观察到的各类感性材料","将形成的原因解释交由专家评议，依据逻辑一致性完善相关理论论证","依据原因解释试行新的办理流程，比较运行结果并据此修正原有解释"],"answerIndex":3,"explanation":"本文在 p20 把理论用于实际改造、检验和发展的过程称为认识过程的继续。仅整理材料、形成解释或传播术语，都不等于已回到实践。","whyWrong":["阶段错配：主要体现从材料到理论的第一次飞跃。","环节不同：进一步取得材料未明确体现以改造对象的结果检验该解释。","检验偷换：评议和逻辑完善不能替代改造对象的实践检验。","正确"],"basis":{"paras":["p20"],"excerptIds":["e-return","e-test"],"anchors":["a-k-second-leap-0"]},"knowledge":["k-second-leap"]},{"id":"q-practice-021","type":"逻辑判断","difficulty":3,"stem":"本文说只有材料丰富且合于实际，才能据此形成正确概念。仅就该条件句，可以推出：","options":["材料丰富并合于实际，就能保证据此形成的概念符合客观事物","据材料形成了正确概念，则该材料满足丰富并合于实际的条件","据材料未形成正确概念，则该材料尚未满足丰富且真实的条件","材料虽不够丰富但没有错觉，也能保证据此形成概念的正确性"],"answerIndex":1,"explanation":"本文在 p16 用只有……才……表达必要条件：若据这些材料形成正确概念，则材料应丰富并合于实际。必要条件不能直接当成充分保证，p18 还讨论了思考加工。","whyWrong":["充分必要颠倒：材料条件是必要条件，不能仅据条件句推出其充分性。","正确","否定结果误推：结果未出现不能反推必要条件未满足。","合取条件被删减：只保留合于实际，且误把剩余条件作为充分保证。"],"basis":{"paras":["p18","p16","p19"],"excerptIds":["e-material"],"anchors":["a-k-material-0","a-k-unity-0"]},"knowledge":["k-material","k-unity"]},{"id":"q-practice-022","type":"逻辑判断","difficulty":3,"stem":"设例：甲以方案获一致认可为由，断定其必能实现预期目标。该推理隐含的关键假设是：","options":["认可方案的人员都了解相关理论，也具有处理类似工作的实践经验","方案在讨论时充分吸收多方意见，其论证过程不存在明显内部矛盾","对这一方案的一致认可足以保证它符合实现目标所需的客观规律","方案参考的既有经验来自真实活动，并且经过相关人员反复总结"],"answerIndex":2,"explanation":"甲需要把一致认可与方案符合客观规律连接起来，C 正是这个隐含的保证性前提。本文在 p06、p20 并不认可这种保证，而要求看社会实践结果；本题选择推理所依赖的假设，并非认定该假设符合本文观点。","whyWrong":["资格不等于保证：了解理论和具有经验尚不能保证具体判断正确。","论证不等于检验：内部一致仍不能直接保证符合客观实际。","正确","来源不等于真理性：经验真实并经总结，仍需判断具体适用性。"],"basis":{"paras":["p20","p06"],"excerptIds":["e-standard","e-test"],"anchors":["a-k-criterion-0"]},"knowledge":["k-criterion"]},{"id":"q-practice-023","type":"逻辑判断","difficulty":3,"stem":"依据本文关于间接经验可靠性的论述，下列选项可以推出的是：","options":["原有经验如实反映客观事物是可靠性的根据，个人取得方式不能代替这一判断","个人亲历材料经过反复整理就有可靠性保证，间接材料则须另行通过实践检验","间接知识既然由文字与技术传达，就应以传播过程的准确性作为真理性的标准","他人知识经过科学抽象就成为直接经验，未经抽象的原始材料则仍是间接经验"],"answerIndex":0,"explanation":"本文在 p10 承认间接经验，也以原经验是否如实反映客观事物说明其可靠性。作者没有把亲历或读书本身当作绝对正确的保证。","whyWrong":["正确","区别检验要求不当：亲历材料经整理也不自动获得正确性保证。","混淆传递与检验：忠实转述并不能证明原认识本身符合实际。","分类错配：抽象程度不决定经验对某个人是直接还是间接。"],"basis":{"paras":["p10","p03"],"excerptIds":["e-indirect"],"anchors":["a-k-indirect-0","a-k-source-0"]},"knowledge":["k-indirect","k-source"]},{"id":"q-practice-024","type":"逻辑判断","difficulty":2,"stem":"设例：调查者称自己已从积累材料进入分析内部联系。哪项若属实，最能加强该判断？","options":["调查者补充了不同时间的访问资料，并请受访者逐项确认记录与原话一致","调查者区分不同对象的直接陈述，将同类现象分别汇总以便进一步比较","调查者就调查范围请教相关专家，依据建议补齐原先遗漏的几类观察对象","调查者比较多种情况下的记录，提出环节间的关系并说明支持判断的证据"],"answerIndex":3,"explanation":"本文在 p09、p16 把概念、判断和推理区别于单纯感觉材料的积累。比较关系并提出有证据的判断，支持已进行理性加工，但不证明结论永远正确。","whyWrong":["涉及真实性而非直接证明加工层次：核实原话仍可停留在材料积累。","接近但不足：分类汇总为分析作准备，尚未明确提出内部联系。","涉及完整性而非直接证明分析：补齐观察对象仍主要是取得材料。","正确"],"basis":{"paras":["p16","p09"],"excerptIds":["e-concept","e-material"],"anchors":["a-k-first-leap-0","a-k-rational-0"]},"knowledge":["k-first-leap","k-rational"]},{"id":"q-practice-025","type":"逻辑判断","difficulty":3,"stem":"设例：乙称方案参考多地经验并通过专家评审，本地试点必能达标。哪项若属实，最能削弱？","options":["评审专家认可方案的总体方向，但对几个实施环节的先后顺序意见不同","原方案在外地奏效所依赖的关键条件，在本地试点中目前尚不具备","方案所参考的地区采用不同做法，但希望解决的问题与本地大体相近","本地此前实行过另一种改进办法，但这一办法尚未达到原来预定的目标"],"answerIndex":1,"explanation":"本文在 p20 要求理论回到实践接受检验，p21 说明方案受实际条件限制。B 指出原经验奏效所依赖的关键条件在本地缺失，直接削弱从经验、评审推到必然达标的结论；其余选项虽涉及评审、经验或效果，却没有指出当前方案所必需的条件缺失。","whyWrong":["削弱有限：实施顺序上的分歧尚不表明达标所必需的条件缺失。","正确","关联但未形成反证：做法不同、目标相近不直接否定本地方案的条件。","对象不相同：另一办法未达标，不能直接否定当前方案的可行性。"],"basis":{"paras":["p20","p21"],"excerptIds":["e-return","e-test"],"anchors":["a-k-second-leap-0","a-k-completion-0"]},"knowledge":["k-second-leap","k-completion"]},{"id":"q-practice-026","type":"逻辑判断","difficulty":3,"stem":"设例：某试点成功后拟在条件不同的地区推广。依据本文关于认识发展的论述，不能推出：","options":["推广时应研究新地方的具体条件，不能以原试点成功代替适用性分析","原方案可能需要修改，修改范围须结合新情况及其实践结果加以判断","推广如果未能达到原目标，就足以否定原试点认识曾具有阶段性真理","原试点经验仍可作为研究材料，其参考价值不能因条件不同而被全盘否定"],"answerIndex":2,"explanation":"本文在 p21、p22 同时承认某阶段可以实现预期结果，以及新阶段条件可能要求修改方案。新环境中推广未达目标，不能单凭这一结果否定原环境中的认识曾具有阶段性真理；题目要求选择不能推出的判断。","whyWrong":["非所选项：符合具体条件下继续发展认识。","非所选项：本文允许方案部分甚至全部修改。","正确","非所选项：条件不同不等于旧经验完全失去参考价值。"],"basis":{"paras":["p21","p22"],"excerptIds":["e-development"],"anchors":["a-k-historical-0","a-k-completion-0"]},"knowledge":["k-historical","k-completion"]},{"id":"q-practice-027","type":"逻辑判断","difficulty":2,"stem":"设例：甲拒绝根据已变条件调整方案；乙把未来才能实现的目标用于当下。依据本文，可以推出：","options":["二者虽偏离方向不同，都没有使认识与行动适合当前过程的发展阶段","二者都属于思想超过实际，只是一个通过守旧、另一个通过急进表现","甲主要轻视直接经验，乙主要轻视间接经验，因此应分别补足相应材料","甲的判断形成于过去实践，因而较乙的理想更能保证当前方案符合实际"],"answerIndex":0,"explanation":"本文在 p23—p25 把落后于实际和超过实际联系起来批评，共同点是脱离具体历史条件；不同方向的偏差不能归为同一种速度或经验数量问题。","whyWrong":["正确","抹去方向差别：甲思想落后于已变实际，不能归为超过实际。","分类无据：偏离阶段不等于可以据此判断轻视何种经验取得方式。","来源代替适用性：来自过去实践不保证符合现在的具体条件。"],"basis":{"paras":["p23","p24","p25"],"excerptIds":[],"anchors":["a-k-subject-object-0","a-k-right-0","a-k-left-0"]},"knowledge":["k-subject-object","k-right","k-left"]},{"id":"q-practice-028","type":"逻辑判断","difficulty":3,"stem":"依据本文关于认识的反复与发展，下列选项不能推出的是：","options":["某阶段实现预期目标可以支持相应认识，但不能据此宣布整个认识过程终结","认识在实践中得到修正可以体现发展，不能单凭修正就认定以往认识全错","对象进入新的发展阶段可能提出新问题，已有认识因而仍须接受实际检验","某阶段认识只要仍有被修正的可能，就不能认定其已完成任何具体认识过程"],"answerIndex":3,"explanation":"本文在 p21 承认某一过程某一阶段的认识可以完成，在 p25、p27 又说明整体认识继续发展。D 把以后仍可能修正等同于从未完成任何具体认识过程，取消了阶段完成与整体发展之间的范围区别，因此不能推出。","whyWrong":["非所选项：区分了阶段成果和整体认识过程。","非所选项：发展与纠正并不等于全盘否定旧成果。","非所选项：符合认识随对象发展而继续检验。","正确"],"basis":{"paras":["p21","p27","p25"],"excerptIds":["e-cycle"],"anchors":["a-k-cycle-0","a-k-relative-0"]},"knowledge":["k-cycle","k-relative"]},{"id":"q-practice-029","type":"类比推理","difficulty":3,"stem":"感性认识∶理性认识","options":["直接经验∶间接经验","现象认识∶本质认识","方案提出∶方案实施","真理标准∶认识来源"],"answerIndex":1,"explanation":"本文在 p08、p09 区分感觉印象与把握本质、内部联系的阶段，后者以前者为基础并使认识深化。B 保留这层关系；C 也有先后关系，却是从方案走向行动，不是认识由现象进入本质。","whyWrong":["关系不符：这是取得知识的不同方式，后者并非前者深化而成的认识阶段。","正确","同为先后环节，但后项是行动，不是对前项材料的认识深化。","关系不符：标准与来源是两个问题，并非由浅入深的认识阶段。"],"basis":{"paras":["p08","p09"],"excerptIds":["e-sensory","e-concept"],"anchors":["a-k-sensory-0","a-k-rational-0"]},"knowledge":["k-sensory","k-rational"]},{"id":"q-practice-030","type":"类比推理","difficulty":3,"stem":"第一次飞跃∶第二次飞跃","options":["经验到理论∶理论到结论","个别到一般∶一般到个别","感性到理性∶理性到实践","理论到实践∶实践到理论"],"answerIndex":2,"explanation":"本文在 p20 区分从感性到理性、从理性到实践两次飞跃。C 对应两次转变的对象和顺序；B 也呈现由一端转向另一端再返回的形式，但返回个别判断并不等于返回实际行动。","whyWrong":["第一项近似对应，第二项仍可停在推理内部，并未明确返回实践。","同有双向运动，但个别与一般是概括层次，不等于认识与实际行动的转换。","正确","方向错位：两次飞跃的次序与本文所述相反。"],"basis":{"paras":["p09","p20"],"excerptIds":["e-return"],"anchors":["a-k-first-leap-0","a-k-second-leap-0"]},"knowledge":["k-first-leap","k-second-leap"]},{"id":"q-practice-031","type":"类比推理","difficulty":2,"stem":"教条主义∶经验主义","options":["照搬词句∶拘守经验","重视理论∶重视经验","拘守经验∶照搬词句","主观主义∶教条主义"],"answerIndex":0,"explanation":"编者在 p01 将教条主义与经验主义作为两种偏差并列说明，分别突出照搬词句与拘守局部经验。A 按相同顺序对应其错误表现；B 也区分理论和经验，却把片面化的偏差换成了未必错误的重视。","whyWrong":["正确","表面也分别涉及理论和经验，但重视本身没有构成脱离实际的偏差。","对应方向颠倒：两种错误表现被交换。","关系不符：这是上位概念与其一种表现，不是两种并列偏差。"],"basis":{"paras":["p01"],"excerptIds":["e-background"],"anchors":["a-k-dogma-0","a-k-empiricism-0"]},"knowledge":["k-dogma","k-empiricism"]},{"id":"q-practice-032","type":"类比推理","difficulty":2,"stem":"改造客观世界∶改造主观世界","options":["搜集调查材料∶整理调查材料","改进认识方法∶调整服务流程","实行改革方案∶改善服务条件","调整服务流程∶改进认识方法"],"answerIndex":3,"explanation":"本文在 p26 把改变外部现实与改善认识能力、主客观关系区分并联系起来。D 按顺序对应两类改造；C 同属改造活动，但都落在客观方面，B 则交换了两类对象的次序。","whyWrong":["关系不符：是认识工作的先后环节，并非外部对象与认识能力两类改造。","同为两类改造，但顺序颠倒，先主观后客观。","同为改造活动，但两项均侧重客观条件，没有对应认识能力的改造。","正确"],"basis":{"paras":["p26","p19"],"excerptIds":[],"anchors":["a-k-transform-0","a-k-unity-0"]},"knowledge":["k-transform","k-unity"]},{"id":"q-practice-033","type":"材料分析","difficulty":2,"stem":"结合资料与本文，对基层调研的作用理解最恰当的是：","options":["调研提供的是个别感受，只有已有理论才能独立提供对问题本质的认识","调研使人接触实际社会关系，获得认识材料，再通过研究形成原因判断","调研把间接知识转化为直接知识，因此现场获得的判断自然更符合实际","调研能增加对现象的熟悉程度，形成工作对策则主要取决于经验的累积"],"answerIndex":1,"explanation":"资料强调摸清情况和找准问题。本文在 p03、p04 说明认识依赖社会实践，但这不排除间接经验，也不允许用单一个案代替全体。","whyWrong":["割裂来源：理论认识依赖实践材料，不能独立产生本质认识的基础。","正确","取得方式代替检验：现场判断也可能片面，不能保证更符合实际。","数量代替加工：对策不能只从材料和经验累积自动产生。"],"basis":{"paras":["p03","p04"],"excerptIds":["e-social"],"anchors":["a-k-source-0","a-k-social-0"]},"knowledge":["k-source","k-social"],"material":{"text":"资料引文：“必须坚持问题导向，增强问题意识，敢于正视问题、善于发现问题，以解决问题为根本目的，真正把情况摸清、把问题找准、把对策提实，不断提出真正解决问题的新思路新办法。”\n设例：某服务站准备了解群众办事中的困难，安排现场观察和访谈。","sourceIds":["m-research-2023"]}},{"id":"q-practice-034","type":"材料分析","difficulty":3,"stem":"结合资料与本文，哪项最能同时避免材料片面和停留于现象？","options":["扩大访问对象并核实陈述，以各类意见出现的频次直接确定问题的根本原因","收集相反意见并比较材料，按既有解释所能涵盖的范围筛选实际采用的记录","覆盖不同情形并核实记录，比较现象间的联系，形成仍待实践检验的原因解释","参照外地研究并分类汇总，优先采用已有理论所支持的判断以减少分析的不确定"],"answerIndex":2,"explanation":"资料要求听真话、察实情、既报喜又报忧。本文在 p16、p18 还要求材料丰富真实并经过思考加工。因此，扩大而核实材料与分析内部联系缺一不可。","whyWrong":["频次替代因果：材料覆盖较广不等于最常见说法就是根本原因。","结论筛选材料：虽然进行了比较，仍可能排除不适合既有解释的真实情况。","正确","权威结论替代分析：既有理论有参考作用，却不能免去具体核实与判断。"],"basis":{"paras":["p18","p16","p09"],"excerptIds":["e-material"],"anchors":["a-k-material-0","a-k-rational-0"]},"knowledge":["k-material","k-rational"],"material":{"text":"资料引文：“必须坚持实事求是，坚守党性原则，一切从实际出发，理论联系实际，听真话、察实情，坚持真理、修正错误，有一是一、有二是二，既报喜又报忧，不唯书、不唯上、只唯实。”\n设例：一组调查人员发现，有的居民办事顺利，有的多次往返。","sourceIds":["m-research-2023"]}},{"id":"q-practice-035","type":"材料分析","difficulty":2,"stem":"结合资料列出的步骤与本文，设例中最需要补上的环节是：","options":["将分析形成的对策用于具体试行，通过运行结果与回访继续检验和修正","组织专家对原因分析集中论证，以论证的一致意见确认对策的实际效果","收集更多地区的成功案例，通过案例之间的共同之处确认本地对策有效","把既有分析提炼成系统性理论，以理论解释的完整程度作为工作完成标准"],"answerIndex":0,"explanation":"资料列有深化研究、解决问题和督查回访等步骤。本文在 p20 要求理论回到实践，检验并发展理论；完成报告不能替代改造对象的行动与结果。","whyWrong":["正确","替代实践检验：专家论证可以完善方案，却不能确认尚未发生的实际效果。","经验推广缺环：他地案例可供参考，不能直接代替本地实行后的结果。","把认识停在理论：系统化解释没有完成返回实践的环节。"],"basis":{"paras":["p20","p06"],"excerptIds":["e-return","e-test"],"anchors":["a-k-second-leap-0","a-k-criterion-0"]},"knowledge":["k-second-leap","k-criterion"],"material":{"text":"方案把在全党大兴调查研究分为6个步骤：提高认识、制定方案、开展调研、深化研究、解决问题、督查回访。\n设例：某部门完成情况汇总和原因分析后，把改进报告存档，此后未实行，也未回访。","sourceIds":["m-research-2023"]}},{"id":"q-practice-036","type":"材料分析","difficulty":3,"stem":"结合资料与本文，为什么试点改善后仍需督查回访？","options":["回访可增加直接经验，使已获理论认识重新回到比理论更可靠的感觉阶段","回访应确认执行是否符合原方案，已有成功足以排除原因解释仍需调整的可能","回访表明原阶段尚未完成认识，只有经过全部后续变化才能确认任何具体成果","回访可发现对象和条件的新变化，使已有认识和方案随实际过程继续发展"],"answerIndex":3,"explanation":"资料把督查回访列入步骤。本文在 p22、p27 强调实际过程继续发展，认识也应继续发展。回访应提供新的实际材料，不能退化为重复宣布成功。","whyWrong":["阶段高低倒置：回到实践并不是退回被认为更可靠的纯感觉阶段。","提前排除认识修正：将阶段成功扩大为原解释持续正确的保证。","否认阶段完成：无穷发展并不取消对特定阶段成果的确认。","正确"],"basis":{"paras":["p22","p27"],"excerptIds":["e-development","e-cycle"],"anchors":["a-k-historical-0","a-k-cycle-0"]},"knowledge":["k-historical","k-cycle"],"material":{"text":"方案把在全党大兴调查研究分为6个步骤：提高认识、制定方案、开展调研、深化研究、解决问题、督查回访。\n设例：某窗口试行新流程后情况改善，后来服务对象和事项发生变化。团队讨论是否还需回访。","sourceIds":["m-research-2023"]}},{"id":"q-practice-037","type":"材料分析","difficulty":3,"stem":"依据资料所列事实及《实践论》，下列判断最稳妥的是：","options":["文章得到多家报纸转载，说明有关理论已经经过社会实践的共同检验","发表与讨论表明议题受到关注，但传播本身不能替代具体认识的实践检验","讨论使认识从个别走向普遍，因此讨论形成的共识可以作为真理的最终标准","报道反映的是当时社会认识，故据此判断理论真理性比考察实践结果更直接"],"answerIndex":1,"explanation":"资料提供的是发表、转载及引发讨论的事实，没有给出所有判断的实践检验或所有参与者的意见。本文在 p06 明确以实践结果而非主观认可作为标准，不能把传播事实扩大为真理性证明。","whyWrong":["传播偷换检验：转载行为不等于文章各项判断已获改造对象的实践证实。","正确","共识偷换标准：讨论可以促进认识，形成共识却不能替代实践结果。","材料性质错配：报道可作认识材料，不能因此成为更直接的真理标准。"],"basis":{"paras":["p06"],"excerptIds":["e-standard"],"anchors":["a-k-criterion-0"]},"knowledge":["k-criterion"],"material":{"text":"1978年5月11日，《光明日报》以“本报特约评论员”名义在头版发表《实践是检验真理的唯一标准》。\n次日，《人民日报》《解放军报》转载该文。\n该文发表后引发了全国范围的真理标准问题大讨论。","sourceIds":["m-truth-1978"]}},{"id":"q-practice-038","type":"材料分析","difficulty":2,"stem":"设例：学习者仅通过资料包了解有关发表事实。依据本文，下列理解正确的是：","options":["资料中的事实经多方核对，读者对该事件的认识便取得了直接经验的性质","资料以文字形式传达，读者所得属于理性认识，因而已经超越经验的限制","读者对事件的了解属于间接经验，传播事实也不能单独证明相关理论的真理性","读者缺少事件发生时的亲历，因而这些事实只能作为假说而不能作为知识材料"],"answerIndex":2,"explanation":"本文在 p10 承认通过文字获得间接经验，p06 则讨论真理标准。读到报道不等于亲历事件；得知文章被转载，也不能直接证明其中所有判断正确。","whyWrong":["可靠性与取得方式混淆：核对不使读者成为该事件的亲历者。","分类混淆：文字传播不自动决定认识阶段，理性也不脱离经验基础。","正确","低估间接经验：缺少亲历不等于不能获得可用的事实知识。"],"basis":{"paras":["p10","p06"],"excerptIds":["e-indirect","e-standard"],"anchors":["a-k-indirect-0","a-k-criterion-0"]},"knowledge":["k-indirect","k-criterion"],"material":{"text":"1978年5月11日，《光明日报》以“本报特约评论员”名义在头版发表《实践是检验真理的唯一标准》。\n次日，《人民日报》《解放军报》转载该文。","sourceIds":["m-truth-1978"]}},{"id":"q-practice-039","type":"材料分析","difficulty":2,"stem":"依据本文，对设例中甲乙主张的评价最恰当的是：","options":["甲忽略条件已变，乙忽略条件未备；二者均须使判断适合当前的发展阶段","甲把过去经验当作现时条件，乙把未来目标提前实行；前者冒险，后者右倾","甲具有以往成功的实践根据，乙具有未来方向的理论根据；二者均可免于再调查","甲的问题在于未充分概括经验，乙的问题在于未推广理想；二者均应加强认识传播"],"answerIndex":0,"explanation":"本文在 p23、p24 分别批评思想停在旧阶段和把未来可能的理想强行放在现在，p25 要求具体历史条件下的统一。题目没有提供甲乙经验或知识总量的证据。","whyWrong":["正确","概念对应颠倒：落后于实际对应右倾，强行提前未来条件对应冒险主义。","根据替代适用性：过去实践和未来方向都不能免除当前条件调查。","传播替代修正：问题是与当前阶段不相适应，扩大传播并不能解决。"],"basis":{"paras":["p25","p23","p24"],"excerptIds":[],"anchors":["a-k-subject-object-0","a-k-right-0","a-k-left-0"]},"knowledge":["k-subject-object","k-right","k-left"],"material":{"text":"设例：某地服务需求已经变化，甲仍拒绝调整旧办法。乙提出的方案只有未来条件具备后才可能运行，却要求立即全面实施。","sourceIds":[]}},{"id":"q-practice-040","type":"材料分析","difficulty":2,"stem":"结合资料与本文，哪项对设例中调研改进的概括最完整？","options":["扩大访问范围提供了完整认识，后续流程调整主要是把已确定的真理付诸实行","纠正访谈偏向属于改造主观世界，流程是否得到改善则不再影响认识能力的判断","改变服务流程属于改造客观世界，访谈方法的改变仅是辅助操作而非主观改造","流程调整与认识方法改进相互联系，后续回访还需检验现实效果并修正已有判断"],"answerIndex":3,"explanation":"资料强调从实际出发、修正错误。本文在 p26 把改造客观世界与改善认识能力联系起来，p20 要求实践检验；设例包含两方面变化和继续检验。","whyWrong":["把材料补充当认识完成：扩大访问范围仍不能保证已经获得完整真理。","割裂两种改造：认识方法是否适合实际也应联系实践效果考察。","缩小主观改造：反省偏向并改进认识方法正涉及认识能力的改变。","正确"],"basis":{"paras":["p20","p26","p03"],"excerptIds":["e-test"],"anchors":["a-k-transform-0","a-k-source-0"]},"knowledge":["k-transform","k-source"],"material":{"text":"资料引文：“必须坚持实事求是，坚守党性原则，一切从实际出发，理论联系实际，听真话、察实情，坚持真理、修正错误，有一是一、有二是二，既报喜又报忧，不唯书、不唯上、只唯实。”\n设例：调查人员发现自己原先只听顺利办成事项的居民意见，于是补访遇到困难的人，核对记录，调整办理流程，并安排回访。","sourceIds":["m-research-2023"]}}],"open":[{"id":"o-practice-001","type":"申论小题","material":{"text":"方案把在全党大兴调查研究分为6个步骤：提高认识、制定方案、开展调研、深化研究、解决问题、督查回访。\n设例：某组只采访顺利办成事项的居民，把听到最多的原因直接写入报告。报告提交后未实行改进办法，也未回访遇到困难的居民。","sourceIds":["m-research-2023"]},"prompt":"请概括设例中调查工作的主要问题，并依据本文说明这些问题如何使认识与实践脱节。（150—200字）","points":["材料获取片面：只访问办成事项的人，缺少不同情形及相反材料，不能仅靠访谈数量证明材料丰富。","材料未经充分核实和分析：把出现次数最多的说法直接当原因，跳过比较、判断和推理。","理论与行动脱节：报告形成后没有试行改进办法，也没有用实际结果检验。","依据本文，认识应从实际材料出发，经过加工形成解释，再回到实践检验；资料中的六步不能只落实为收集和写报告。"],"basis":{"paras":["p18","p16","p09","p20"],"excerptIds":["e-material","e-return"],"anchors":["a-k-material-0","a-k-rational-0","a-k-second-leap-0"]}},{"id":"o-practice-002","type":"申论小题","material":{"text":"方案把在全党大兴调查研究分为6个步骤：提高认识、制定方案、开展调研、深化研究、解决问题、督查回访。\n资料引文：“必须坚持问题导向，增强问题意识，敢于正视问题、善于发现问题，以解决问题为根本目的，真正把情况摸清、把问题找准、把对策提实，不断提出真正解决问题的新思路新办法。”\n设例：某服务站发现居民对办理流程有不同反映，准备开展调查并解决问题。","sourceIds":["m-research-2023"]},"prompt":"请结合资料和本文，为设例提出一条从发现问题到持续改进的工作路径，并说明各环节为什么不能省略。（200—250字）","points":["围绕未解决的办理困难制定调查问题，接触不同对象、不同情况，核对实际记录，而非先认定原因。","比较并整理材料，研究现象之间的联系，形成有根据但仍待检验的解释和方案。","在适合的具体范围实行方案，明确要观察的实际变化，用实践结果检验方案。","对未达预期或出现新问题的部分查明原因，必要时部分或全部修改，不能只寻找支持性材料。","持续督查回访，发现对象和条件变化时重新调查，按本文所说推进实践与认识的循环。"],"basis":{"paras":["p16","p20","p21","p03","p06","p27"],"excerptIds":["e-standard","e-cycle"],"anchors":["a-k-source-0","a-k-criterion-0","a-k-cycle-0"]}},{"id":"o-practice-003","type":"申论小题","material":{"text":"资料引文：“必须坚持实事求是，坚守党性原则，一切从实际出发，理论联系实际，听真话、察实情，坚持真理、修正错误，有一是一、有二是二，既报喜又报忧，不唯书、不唯上、只唯实。”\n设例：某部门阅读外地试点报告后，打算不作本地调查就原样推广。另有同事因未亲历外地试点，主张拒绝阅读报告。","sourceIds":["m-research-2023"]},"prompt":"请分析为什么不能将外地试点经验直接当作本地现成答案，并提出学习、检验和推广经验的建议。（180—230字）","points":["依据本文，阅读外地报告是获得间接经验的途径，既有学习价值，也不能据此声称已经亲历本地情况。","外地经验形成于具体条件，应调查本地对象、环境与其相同和不同之处，避免照搬，也不应全盘拒绝。","将经验与本地真实、较全面的材料结合，形成说明适用条件的具体方案。","实行并观察实际效果，纠正不合实际的部分；不能把报告声誉或原试点成功替代本地检验。","推广过程中继续回访，在条件变化后调整认识和安排，保持本文所要求的具体历史条件下的统一。"],"basis":{"paras":["p01","p20","p22","p25","p10"],"excerptIds":["e-indirect","e-development"],"anchors":["a-k-historical-0","a-k-subject-object-0","a-k-indirect-0"]}},{"id":"o-practice-004","type":"申论小题","material":{"text":"资料引文：“必须坚持实事求是，坚守党性原则，一切从实际出发，理论联系实际，听真话、察实情，坚持真理、修正错误，有一是一、有二是二，既报喜又报忧，不唯书、不唯上、只唯实。”\n设例：调查人员发现，自己常把熟悉的说法当成结论，较少询问相反情况。团队准备改进访谈方法，同时调整实际服务安排。","sourceIds":["m-research-2023"]},"prompt":"请依据资料与本文，分析改进调研为何既涉及改造客观世界，也涉及改造主观世界，并提出相应对策。（180—230字）","points":["依据本文，客观世界方面的任务是针对实际问题改变现实服务安排，不能只停留于表达愿望。","主观世界方面的任务包括纠正只听好消息的偏向，改善观察、提问、核实与分析能力。","落实资料所说既报喜又报忧，主动寻找不同意见，检查材料是否真实、完整。","把分析形成的办法用于实践，依据结果修正认识和方案，使两个方面的改造相互联系。","安排后续回访，将新情况纳入分析，避免把一次认识方法的改进当作永久正确的保证。"],"basis":{"paras":["p20","p26","p19","p10"],"excerptIds":["e-unity","e-return"],"anchors":["a-k-transform-0","a-k-unity-0","a-k-second-leap-0"]}}],"label":"仿公考题型 · 原创练习"},"materials":[{"id":"m-research-2023","title":"中办印发《关于在全党大兴调查研究的工作方案》","publisher":"人民日报（转发新华社电）","date":"2023-03-20","url":"https://paper.people.com.cn/rmrb/html/2023-03/20/nw.D110000renmrb_20230320_1-01.htm","facts":["新华社北京2023年3月19日电：中共中央办公厅印发《关于在全党大兴调查研究的工作方案》。","方案把在全党大兴调查研究分为6个步骤：提高认识、制定方案、开展调研、深化研究、解决问题、督查回访。","方案列出的调研内容包括“人民最关心最直接最现实的利益问题”和“本地区本部门本单位长期未解决的老大难问题”等。"],"quotes":["调查研究是我们党的传家宝。","调查研究是谋事之基、成事之道，没有调查就没有发言权，没有调查就没有决策权","必须坚持问题导向，增强问题意识，敢于正视问题、善于发现问题，以解决问题为根本目的，真正把情况摸清、把问题找准、把对策提实，不断提出真正解决问题的新思路新办法。","必须坚持实事求是，坚守党性原则，一切从实际出发，理论联系实际，听真话、察实情，坚持真理、修正错误，有一是一、有二是二，既报喜又报忧，不唯书、不唯上、只唯实。"]},{"id":"m-truth-1978","title":"《实践是检验真理的唯一标准》发表","publisher":"人民网 / 澎湃新闻 等报道（多来源一致的事实）","date":"1978-05-11","url":"https://cpc.people.com.cn/GB/33837/2535004.html","facts":["1978年5月11日，《光明日报》以“本报特约评论员”名义在头版发表《实践是检验真理的唯一标准》。","次日，《人民日报》《解放军报》转载该文。","该文发表后引发了全国范围的真理标准问题大讨论。"],"quotes":[]}],"knowledge":[{"id":"k-source","title":"实践是认识的来源"},{"id":"k-social","title":"实践具有社会性"},{"id":"k-historical","title":"认识受历史条件影响"},{"id":"k-criterion","title":"实践是检验真理的标准"},{"id":"k-sensory","title":"感性认识：感觉和印象"},{"id":"k-rational","title":"理性认识：概念、判断和推理"},{"id":"k-first-leap","title":"第一次飞跃：从感性到理性"},{"id":"k-material","title":"感觉材料要丰富、符合实际"},{"id":"k-unity","title":"感性与理性相互联系"},{"id":"k-indirect","title":"直接经验与间接经验"},{"id":"k-dogma","title":"教条主义：照搬词句，轻视实践"},{"id":"k-empiricism","title":"经验主义：局部经验代替整体认识"},{"id":"k-second-leap","title":"第二次飞跃：理论回到实践"},{"id":"k-completion","title":"阶段性完成与方案修正"},{"id":"k-right","title":"思想落后于实际：右倾机会主义"},{"id":"k-left","title":"思想超过实际：“左”翼冒险主义"},{"id":"k-subject-object","title":"具体历史条件下的统一"},{"id":"k-relative","title":"相对真理与认识没有终点"},{"id":"k-transform","title":"改造客观世界，也改造主观世界"},{"id":"k-cycle","title":"实践—认识—再实践—再认识"}],"links":{"q-practice-001":[{"kind":"anchor","label":"实践是认识的来源 · 原文","href":"./practice-reader.html?question=q-practice-001#a-k-source-0"},{"kind":"anchor","label":"实践具有社会性 · 原文","href":"./practice-reader.html?question=q-practice-001#a-k-social-0"},{"kind":"paragraph","label":"全文第 03 段","href":"./practice-reader.html?question=q-practice-001#p03"},{"kind":"paragraph","label":"全文第 04 段","href":"./practice-reader.html?question=q-practice-001#p04"},{"kind":"excerpt","label":"实践的社会范围","href":"./practice.html#excerpt-e-social"},{"kind":"ocr","label":"看 OCR 原书 · 实践的社会范围","href":"./source.html#book=mao-selected&from=3399&to=3399&ref=practice.html%23excerpt-e-social"}],"q-practice-002":[{"kind":"anchor","label":"实践是认识的来源 · 原文","href":"./practice-reader.html?question=q-practice-002#a-k-source-0 ：理论回到实践"},{"id":"a-k-completion-0","para":"p21","title":"阶段性完成与方案修正"},{"id":"a-k-right-0","para":"p23","title":"思想落后于实际：右倾机会主义"},{"id":"a-k-left-0","para":"p24","title":"思想超过实际：“左”翼冒险主义"},{"id":"a-k-subject-object-0","para":"p25","title":"具体历史条件下的统一"},{"id":"a-k-relative-0","para":"p25","title":"相对真理与认识没有终点"},{"id":"a-k-transform-0","para":"p26","title":"改造客观世界，也改造主观世界"},{"id":"a-k-cycle-0","para":"p27","title":"实践—认识—再实践—再认识"}],"paras":["p01","p02","p03","p04","p05","p06","p07","p08","p09","p10","p11","p12","p13","p14","p15","p16","p17","p18","p19","p20","p21","p22","p23","p24","p25","p26","p27"]},"unit":{"id":"practice","title":"实践论","output":"practice.html"},"excerpts":[{"id":"e-background","label":"为什么写《实践论》 · 本书题解","lineStart":3392,"lineEnd":3392,"text":"毛泽东的《实践论》，是为着用马克思主义的认识论观点去揭露党内的教条主义和经验主义一特别是教条主义这些主观主义的错误而写的。"},{"id":"e-social","label":"实践的社会范围","lineStart":3399,"lineEnd":3399,"text":"人的社会实践，不限于生产活动一种形式，还有多种其他的形式，阶级斗争，政治生活，科学和艺术的活动，总之社会实际生活的一切领域都是社会的人所参加的。"},{"id":"e-standard","label":"检验认识的标准","lineStart":3406,"lineEnd":3406,"text":"判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。真理的标准只能是社会的实践。"},{"id":"e-sensory","label":"感性认识的含义","lineStart":3414,"lineEnd":3414,"text":"这叫做认识的感性阶段，就是感觉和印象的阶段。"},{"id":"e-concept","label":"从印象走向概念","lineStart":3415,"lineEnd":3415,"text":"概念这种东西已经不是事物的现象，不是事物的各个片面，不是它们的外部联系，而是抓着了事物的本质，事物的全体，事物的内部联系了。"},{"id":"e-unity","label":"感性与理性的联系","lineStart":3422,"lineEnd":3422,"text":"感性和理性二者的性质不同，但又不是互相分离的，它们在实践的基础上统一起来了。"},{"id":"e-indirect","label":"直接经验与间接经验","lineStart":3429,"lineEnd":3429,"text":"一切真知都是从直接经验发源的。但人不能事事直接经验，事实上多数的知识都是间接经验的东西，这就是一切古代的和外域的知识。"},{"id":"e-material","label":"材料的丰富与真实","lineStart":3456,"lineEnd":3456,"text":"只有感觉的材料十分丰富（不是零碎不全)和合于实际（不是错觉），才能根据这样的材料造出正确的概念和论理来。"},{"id":"e-relation","label":"认识必须深化","lineStart":3466,"lineEnd":3466,"text":"理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。"},{"id":"e-return","label":"理论返回实践","lineStart":3473,"lineEnd":3473,"text":"认识从实践始，经过实践得到了理论的认识，还须再回到实践去。"},{"id":"e-test","label":"在行动中检验理论","lineStart":3473,"lineEnd":3473,"text":"要完全地解决这个问题，只有把理性的认识再回到社会实践中去，应用理论于实践，看它是否能够达到预想的目的。"},{"id":"e-development","label":"过程变化，认识也要发展","lineStart":3487,"lineEnd":3487,"text":"然而对于过程的推移而言，人们的认识运动是没有完成的。任何过程，不论是属于自然界的和属于社会的，由于内部的矛盾和斗争，都是向前推移向前发展的，人们的认识运动也应跟着推移和发展。"},{"id":"e-cycle","label":"循环中的深化","lineStart":3504,"lineEnd":3504,"text":"实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。"}]}</script></body></html>
