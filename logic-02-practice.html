-logic-1976&from=247&to=247&ref=logic-02.html%23excerpt-e-expression"},{"kind":"excerpt","label":"形式逻辑的要求","href":"./logic-02.html#excerpt-e-method"},{"kind":"ocr","label":"看 OCR 原书 · 形式逻辑的要求","href":"./source.html#book=formal-logic-1976&from=248&to=248&ref=logic-02.html%23excerpt-e-method"},{"kind":"excerpt","label":"明确的两方面","href":"./logic-02.html#excerpt-e-clear"},{"kind":"ocr","label":"看 OCR 原书 · 明确的两方面","href":"./source.html#book=formal-logic-1976&from=212&to=212&ref=logic-02.html%23excerpt-e-clear"},{"kind":"excerpt","label":"内涵与外延","href":"./logic-02.html#excerpt-e-extension"},{"kind":"ocr","label":"看 OCR 原书 · 内涵与外延","href":"./source.html#book=formal-logic-1976&from=218&to=218&ref=logic-02.html%23excerpt-e-extension"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-02","title":"第二讲·概念要明确","output":"logic-02.html"},"excerpts":[{"id":"e-concept","label":"本书对概念的界定","lineStart":156,"lineEnd":156,"text":"简单说，概念是反映客观事物本质的思维形式。"},{"id":"e-word","label":"概念与语词的联系","lineStart":160,"lineEnd":160,"text":"概念是语词的思想内容，语词是概念的语言表现形式。"},{"id":"e-many","label":"语词与概念不是一一对应","lineStart":162,"lineEnd":162,"text":"同一个概念，有的可以用不同的语词来表达，同一个语词，有的可以表达不同的概念。"},{"id":"e-context","label":"看使用场合","lineStart":167,"lineEnd":167,"text":"我们就应当注意它用于什么场合，表达了什么概念。"},{"id":"e-unit","label":"概念在思维中的作用","lineStart":176,"lineEnd":176,"text":"概念既是认识的总结，又是思维的基本单位。"},{"id":"e-composition","label":"概念—判断—推理","lineStart":182,"lineEnd":182,"text":"这是一个推理，它是由三个判断组成的，其中每一个判断又都是由概念组成的。"},{"id":"e-collective","label":"个体与统一体不可混同","lineStart":198,"lineEnd":198,"text":"“工人”既可以指所有的工人，也可以指某一个个别工人，而“工人阶级”是由许许多多工人组成的统一体，"},{"id":"e-clear","label":"明确的两方面","lineStart":212,"lineEnd":212,"text":"从形式逻辑的要求来说，所谓概念明确，就是指概念的内涵明确，外延也明确。"},{"id":"e-extension","label":"内涵与外延","lineStart":218,"lineEnd":218,"text":"我们平常所说的概念的含义，也就是概念的内涵，所说的概念的适用范围，也就是概念的外延。"},{"id":"e-condition","label":"变化与条件内确定","lineStart":236,"lineEnd":236,"text":"我们在运用概念时，一方面要注意它的内涵与外延是发展变化的，另一方面又要注意它的内涵与外延在一定条件下是确定的。"},{"id":"e-investigate","label":"明确概念先要认识对象","lineStart":246,"lineEnd":246,"text":"抓住事物的本质。这就要求人们深入实际，·调查研究，掌握有关事物的具体知识，并且运用马克思主义的科学方法对事物进行认真的分析。"},{"id":"e-expression","label":"恰当表达","lineStart":247,"lineEnd":247,"text":"要做到概念明确，必须注意选用恰当的语词来表达概念，避免出现由于用词不当引起概念不清的错误。"},{"id":"e-method","label":"形式逻辑的要求","lineStart":248,"lineEnd":248,"text":"要做到概念明确，必须使概念的内涵与外延都明确，即搞清概念所反映的事物的本质是什么，概念的适用范围有多大。"}]}</script></body></html>
