iculty":3,"stem":"设例：“除非得到授权，否则不得公开”在此明确等于“未授权就不得公开”。由此可以推出的是","options":["只要得到授权，就一定能够公开","只要得到授权，就一定不得公开","只要不得公开，就一定未得授权","只要能够公开，就一定得到授权"],"answerIndex":3,"explanation":"本讲按条件方向分析：未授权推出不得公开，逆否后得到能够公开推出已授权。","whyWrong":["将必要授权当成充分条件。","题设没有授权与不得公开的这种联系。","肯定后件不能肯定前件。","正确"],"basis":{"paras":[],"excerptIds":["e-order","e-sufficient","e-sufficientlimit","e-necessary","e-necessarylimit"],"anchors":[]},"knowledge":["sufficient","necessary"]},{"id":"q-logic-06-011","type":"逻辑判断","difficulty":2,"stem":"设例：甲、乙两项检查中至少一项通过，且并非两项都通过。符合题意的是","options":["至少一项通过，另一项是否通过仍无约束","不是两项都通过，所以两项均应视为未通过","两项各有通过可能，所以可以认定两项同时通过","恰有一项检查已经通过，另一项尚未通过"],"answerIndex":3,"explanation":"本讲结合相容选言和对联言的否定，可以限定为两项中恰有一项成立。","whyWrong":["遗漏并非两项都通过。","把联言的否定误作两支都否定。","把分别可能误作同时成立，并违背第二条件。","正确"],"basis":{"paras":[],"excerptIds":["e-composite","e-and","e-andcheck","e-ornames","e-exclusive","e-omit"],"anchors":[]},"knowledge":["and","or"]},{"id":"q-logic-06-012","type":"逻辑判断","difficulty":3,"stem":"设例：已知“如果甲条件成立则乙成立”。补充哪项，才能使甲成为乙的充要条件？","options":["甲不成立时乙条件可能仍成立","乙不成立时甲条件也必不成立","甲成立时乙条件可能已经成立","乙成立时甲条件也必定成立"],"answerIndex":3,"explanation":"本讲指出充要条件还须有反向的充分联系，即乙推出甲。","whyWrong":["容许乙真甲假，不能确立充要。","只是原条件的逆否，没有新增反向信息。","没有补充反向条件。","正确"],"basis":{"paras":[],"excerptIds":["e-iff","e-actual","e-order","e-sufficient","e-sufficientlimit"],"anchors":[]},"knowledge":["iff","sufficient"]},{"id":"q-logic-06-013","type":"常识判断","difficulty":2,"stem":"依据本讲，辨别选言判断相容与否，主要应看什么？","options":["两个选言支是否都具有各自成立的可能","否定其中一支后能否肯定另外一支","选言支在实际规定中能否同时成立","两个选言支是否合起来覆盖所有可能"],"answerIndex":2,"explanation":"本讲强调应按实际意义确定能否兼有，不能只依赖或字的表面形式。","whyWrong":["各自可能不等于能够同时成立。","相容和不相容的两支穷尽选言都允许此式，不能据此区分。","正确","穷尽性不是相容性的区别标准。"],"basis":{"paras":[],"excerptIds":["e-ornames","e-exclusive","e-omit"],"anchors":[]},"knowledge":["or"]},{"id":"q-logic-06-014","type":"类比推理","difficulty":3,"stem":"如果甲则乙∶非乙则非甲","options":["只有甲才乙∶非甲则非乙","只有甲才乙∶非乙则非甲","如果甲则乙∶如果乙则甲","甲当且仅当乙∶甲且乙"],"answerIndex":0,"explanation":"本讲按逻辑含义配对，题干前后互为逆否；只有甲才乙表示乙推出甲，其逆否为非甲推出非乙。 tml%23excerpt-e-sufficient"},{"kind":"excerpt","label":"无甲未必无乙","href":"./logic-06.html#excerpt-e-sufficientlimit"},{"kind":"ocr","label":"看 OCR 原书 · 无甲未必无乙","href":"./source.html#book=formal-logic-1976&from=863&to=863&ref=logic-06.html%23excerpt-e-sufficientlimit"}],"o-logic-06-002":[{"kind":"excerpt","label":"相容选言不排除同真","href":"./logic-06.html#excerpt-e-ornames"},{"kind":"ocr","label":"看 OCR 原书 · 相容选言不排除同真","href":"./source.html#book=formal-logic-1976&from=836&to=836&ref=logic-06.html%23excerpt-e-ornames"},{"kind":"excerpt","label":"不相容的可能","href":"./logic-06.html#excerpt-e-exclusive"},{"kind":"ocr","label":"看 OCR 原书 · 不相容的可能","href":"./source.html#book=formal-logic-1976&from=831&to=831&ref=logic-06.html%23excerpt-e-exclusive"},{"kind":"excerpt","label":"漏项的原书例子","href":"./logic-06.html#excerpt-e-omit"},{"kind":"ocr","label":"看 OCR 原书 · 漏项的原书例子","href":"./source.html#book=formal-logic-1976&from=829&to=829&ref=logic-06.html%23excerpt-e-omit"},{"kind":"excerpt","label":"复合判断与支判断","href":"./logic-06.html#excerpt-e-composite"},{"kind":"ocr","label":"看 OCR 原书 · 复合判断与支判断","href":"./source.html#book=formal-logic-1976&from=759&to=759&ref=logic-06.html%23excerpt-e-composite"},{"kind":"excerpt","label":"复合判断可以嵌套","href":"./logic-06.html#excerpt-e-nested"},{"kind":"ocr","label":"看 OCR 原书 · 复合判断可以嵌套","href":"./source.html#book=formal-logic-1976&from=924&to=924&ref=logic-06.html%23excerpt-e-nested"},{"kind":"excerpt","label":"前件与后件","href":"./logic-06.html#excerpt-e-order"},{"kind":"ocr","label":"看 OCR 原书 · 前件与后件","href":"./source.html#book=formal-logic-1976&from=845&to=845&ref=logic-06.html%23excerpt-e-order"},{"kind":"excerpt","label":"联言判断","href":"./logic-06.html#excerpt-e-and"},{"kind":"ocr","label":"看 OCR 原书 · 联言判断","href":"./source.html#book=formal-logic-1976&from=768&to=768&ref=logic-06.html%23excerpt-e-and"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-06","title":"第六讲·怎样做到判断恰当（二）","output":"logic-06.html"},"excerpts":[{"id":"e-composite","label":"复合判断与支判断","lineStart":759,"lineEnd":759,"text":"由两个或两个以上简单判断组合起来的判断形式，叫做复合判断。组成复合判断的判断叫支判断。"},{"id":"e-and","label":"联言判断","lineStart":768,"lineEnd":768,"text":"联言判断反映两个或两个以上的事物情况同时存在。"},{"id":"e-andcheck","label":"支判断必须能够并存","lineStart":796,"lineEnd":796,"text":"因为它们正确地表达了两种情况可以同时并存的关系。"},{"id":"e-omit","label":"漏项的原书例子","lineStart":829,"lineEnd":829,"text":"因此，如果现在还说“物质不是导电体，就是绝缘体”，就是不正确的了。"},{"id":"e-exclusive","label":"不相容的可能","lineStart":831,"lineEnd":831,"text":"两种可能情况不能同时都实现，只能有一种实现，.这两种可能性就是不相容的。"},{"id":"e-inclusive","label":"相容的可能","lineStart":835,"lineEnd":835,"text":"反映相容可能性的判断可以同时都真。"},{"id":"e-ornames","label":"相容选言不排除同真","lineStart":836,"lineEnd":836,"text":"把没有断定各支判断不相容即其支判断可以相容的选言判断，、叫做相容的选言判断。"},{"id":"e-order","label":"前件与后件","lineStart":845,"lineEnd":845,"text":"我们把假言判断中表示条件的支判断叫前件，把表示结果的支判断叫后件。"},{"id":"e-sufficient","label":"充分条件方向","lineStart":854,"lineEnd":854,"text":"所谓甲是乙的充分条件，就是指：，有甲必有乙。"},{"id":"e-sufficientlimit","label":"无甲未必无乙","lineStart":863,"lineEnd":863,"text":"一个真的充分条件假言判断，前件真，后件也一定真。但是能不能说前件假，后件也一定假呢？不能。"},{"id":"e-necessary","label":"必要条件方向","lineStart":876,"lineEnd":876,"text":"所谓甲是乙的必要条件，就是指：无甲必无乙。"},{"id":"e-necessarylimit","label":"有甲未必有乙","lineStart":877,"lineEnd":877,"text":"一个真的必要条件假言判断，前件假，后件一定也假。但是，能不能说前件真，后件一定也真呢？不能。"},{"id":"e-iff","label":"充分必要条件","lineStart":891,"lineEnd":891,"text":"一个真的充分必要条件假言判断，前件真，后件一定也真；前件假，后件一定也假。"},{"id":"e-actual","label":"不能只认连结词","lineStart":892,"lineEnd":892,"text":"是不是充分必要条件假言判断，不能仅仅看连结项，而要看前件与后件所断定的实际关系。"},{"id":"e-nested","label":"复合判断可以嵌套","lineStart":924,"lineEnd":924,"text":"例(20)总的看是一个假言判断，但是它的前件是一个选言判断。"}]}</script></body></html>
