到的。只举几个例子：在人们还不知道什么是氏族的时候，那一位曾经费了莫大气力去搅混氏族问题的麦克伦南，就已经表明了氏族的存在，并且大体上正确地描述了卡尔梅克人、切尔克斯人、萨莫耶特人③的氏族，以及三个印度民族华拉耳人、马加尔人、曼尼普尔人的氏族。146不久以前，马·柯瓦列夫斯基也发现并描述了北萧胡人、显胡苏人、斯万人和高加索部落的其他氏族。14在这里，我们只对克尔特人和日耳曼人的氏族的存在，作若干简短的评述。"},{"id":"c-wales","label":"c-wales","lineStart":1057,"lineEnd":1057,"text":"在威尔士被英国人征服以前数世纪4“，即至迟于十一世纪所制定的古代威尔士的法律，还表明有整个村落共同耕作的事情，虽然这只是一种普遍流行的早期习俗的稀有残余：每个家庭有供自己耕作的五英亩土地：此外，另有一块土地共同耕种，收获物实行分配。就其跟爱尔兰和苏格兰类似这一点来说，毫无疑问这种农村公社乃是一种氏族或氏族分支，即使对威尔士法律的重新考查"},{"id":"c-law","label":"c-law","lineStart":1058,"lineEnd":1058,"text":"我没有时间去这样做（我的摘要是在1869年做的4）一未必能直接证实这一点。然而，威尔士以及爱尔兰的材料却直接证明，到十一世纪时，克尔特人的对偶婚还根本没有被一夫一妻制所代替。在威尔士，婚姻只有满了七年之后才是不能解除的，或者更确切些说，才是不能取消的。甚至只差三夜就满七年，夫妻还是可以分离的。那时财产便要分开：由妻子划分，丈夫任选一份。家具是按一定的非常有趣的惯例来分的。如果是丈夫提出离婚的，那他必须把妻子的嫁妆和其他某些东西还给她：如果是妻子提出离婚的，那她便少得一点。如有三个子女，丈夫分两个，妻子分一个，即当中的一个。如果妻子在离婚后重新结婚，而她的前夫想重新要她时，即使她的一只脚已经踏上新夫的床，也要顺从前夫的要求。但是如果他们业已同居七年，即使以前并未正式结婚，他们也就成了夫妻。在结婚以前，少女的贞操完全不严格遵守，也不要求遵守；与此有关的规定，具有非常轻佻的性质，是和资产阶级的道"},{"id":"c-women","label":"c-women","lineStart":1064,"lineEnd":1064,"text":"“对于同一罪行，或者要求赎罪，或者要求报复，但两者不可得兼”。150妻子可据以要求离婚而且在分财产时自己的权利又丝毫不受损失的原因，是非常多样的：只要丈夫口有臭气就够了。为赎回初夜权而付给部落首领或国王的赎金(gobr merch,中世纪的mar~cheta这个名称、法语的marquette就是由此而来的)在法典上起着很大的作用。妇女在人民大会上享有表决权。我们再补充一点，在爱尔兰已经证明有类似情况存在；在那里，暂时性的婚姻也非常流行，在离婚时，妻子享有很大的明确规定的照顾，甚至对她的家务劳动也要给以报酬；在那里，还有长妻”与其他诸妻并存的事而在分配遗产时，婚生子女和非婚生子女没有任何差别。这样，我们便看到了一幅对偶婚的图景，与这种对偶婚比较起来，北美现行的婚姻形式，似乎是严格的，不过，对于一个在凯撒时代还过着群婚生活的民族来说，在十一世纪有这种情形，是不足为奇的。"},{"id":"c-irish","label":"c-irish","lineStart":1065,"lineEnd":1065,"text":"爱尔兰氏族（即sept:部落称为clainne,克兰）的存在是千真万确的，它不仅记在古代法典中，而且在十七世纪被派到爱尔兰以便把克兰的领地变成英王王室领地的英国法学家们也对它作过记述。直到那时，土地只要未被首领变为自己的私有领地，就仍是克兰或氏族的公共财产。如果某一氏族成员死亡，因而一户经济不再存在，氏族首长（英国法学家称之为caput cognationis)便把全部氏族土地在其他各户中间进行一次重新分配。这种分配，大体上一定是依照德意志通行的惯例来进行的。即在今日，还可以见到一些属于所谓rundale(朗得尔)制度的村田，在四五十年前，这种村田"},{"id":"c-rundale","label":"c-rundale","lineStart":1071,"lineEnd":1071,"text":"Gewanne》(块”)，如摩塞尔河沿岸所称呼的那样；每个人在每一块中都有一份；沼地和牧场归公共使用。在五十年前，重新分配土地依旧时常举行，有时每年举行。这种实行朗得尔制度的村落的地界图，看去极似摩塞尔河沿岸或霍赫瓦尔特山脉的德意志人的那种农家公社。氏族此外还继续存在于《factions》)(“帮”)中。爱尔兰农民常常分成各种帮，它们是以看来毫无意思和十分荒诞的差别为根据的，这种差别为英国人所全然不解，并且它们除了彼此之间进行心爱的盛大殴斗而外，似乎别无任何目的。这是被消灭了的氏族的人工的复活，氏族灭亡后才产生的代替物，这种代替物以特殊的方式证明了遗传下来的氏族本能的存在。此外，有些地方，同氏族人还一道住在他们旧有的地区内：比如在三十年代，莫纳根郡的绝大多数居民只有四个姓，换言之，即起源于四个氏族或克兰。①在苏格兰，氏族制度是随着1746年起义的被镇压而灭亡的。152"},{"id":"c-scot-gap","label":"c-scot-gap","lineStart":1077,"lineEnd":1077,"text":"至于苏格兰的克兰是这个制度的哪一环节，尚待研究：但它是这样一个环节，则是没有疑问的。在瓦尔特·司各脱的小说中，我们可以看到关于苏格兰高地的这种克兰的生动描写。摩尔根说，这种克兰，"},{"id":"c-scot","label":"c-scot","lineStart":1078,"lineEnd":1078,"text":"“就其组织和精神而言，乃是氏族的最好的标本，氏族生活支配氏族成员的显著实例…从他们的纷争和血族复仇上，从按克兰划分地区上，从他们的共同使用土地上，从克兰的成员对于首领的忠诚以及彼此间的忠诚上，我们处处都看到氏族社会的那种通常的、持久的特征…世系是按照父权制计算的，因此男子的子女仍留在克兰内，而妇女的子女则转入他们父亲的克兰里去”153"},{"id":"c-german-gap","label":"c-german-gap","lineStart":1087,"lineEnd":1087,"text":"和北海之间的地区；基姆布利人和条顿人正处在大迁徙中，而苏维汇人只是到凯撒时代才稳定地定居下来。凯撒谈到苏维汇人时明确地说过：他们是按氏族和亲属关系(gentibus cognationi-一busque)分开居住的155；而在gens Julia优利氏族的一个罗马人的口中，gentibus这个名词有着完全确定的和不容误解的意义。这适用于全体德意志人：他们甚至在被征服的罗马各行省似乎还按氏族居住。从邹阿勒曼尼法典”中可以得到证实，在多瑙河以南的被征服的土地上人们是按血族(genealogiae).分开居住的。156这里使用的genealogia一词，与后来的马尔克公社或农村公社的意义完全相同。①不久以前，柯瓦列夫斯基提出了一种见解，说这些genealogiae都是大家庭公社，土地在它们之间进行分配，农村公社只是后来才从它们当中发展起来的。15关于fara的情况也是如此。在勃艮第人和伦巴德人那里，一从而，在哥特部落和赫米奥南部落或高地德意志部落那里，一fara一词的含义和“阿勒曼尼法典”上的genealogia一词的含义虽不完全相同，却也相差无几。这里在我们面前的究竟是氏族还是家庭公社，还需要作进一步研究。"},{"id":"c-language","label":"c-language","lineStart":1095,"lineEnd":1095,"text":"在一切德意志人中是否有一个表示氏族的共同名词，这个名词又是什么，关于这个问题，语言的遗迹没有给我们提供答案。在语源上，哥特语的kuni,中部高地德意志语的kunne是和希腊语的genos,.拉丁语的gens相当的，而且是在相同的意义上来使用的。妇女的名字来自同一个词根，如希腊语的gye斯拉夫语的zena、哥特语的qvino,古斯堪的那维亚语的kona,kuna等，这表明曾存在过母权制时代。一在伦巴德人和勃艮第人那里，像刚才说过的，我们看到fra一词，这个词被格林假定来源于词根fisan,意即生育，我则倾向于认为它来源于更显而易见的词根faran,意即骑马①游牧、返回，用来表示不言而喻只是由亲属构成的游牧群的某个一定的部分。这个词，在起初是向东方，后来又向西方迁徙的许多世纪中，渐渐地被用来指血族共同体本身了。一其次，哥特语的sibja,盎格鲁撒克逊语的sib,古代高地德意志语的sippia,sippa,都是亲属②的意思。在古代斯堪的那维亚语中，仅有复数的sifar(亲属)一词：单数只用作女神西芙Si0的名字。一最后，在“希尔德布兰德之歌”158中还见到另外一种用语，它出现在希尔德布兰德问哈杜布兰德的话中："},{"id":"c-affinity","label":"c-affinity","lineStart":1105,"lineEnd":1105,"text":"个字演变来的。sibja亲属)这个词似乎无须加以考虑；至少，siar在古代斯塔的那维亚语中，不仅表示有血亲关系的人，而且也表示有姻亲关系的人，即包括至少两个氏族的成员；因此，sf这个词本身是不能表示氏族的。"},{"id":"c-uncle","label":"c-uncle","lineStart":1107,"lineEnd":1107,"text":"有决定意义的是塔西佗的这一段话，在那里他说：母亲的兄弟把他的外甥看做是自己的儿子；有些人甚至认为舅父和外甥之间的血缘关系，比父子之间的血缘关系还要神圣和密切，所以当要求人质的时候，那个将受到约束的人的姊妹的儿子被认为是比他自己的儿子还要大的保证。在这里，我们看到了按照母权制组织起来的、因而是最初的氏族活生生的残余，而且这种残余还被当作德意志人所特有的一种东西。①假使这种氏族成员把自己的儿子当作某一庄严义务的担保物，而这个儿子却成了父亲违约的牺牲品，那"},{"id":"c-maternal-memory","label":"c-maternal-memory","lineStart":1118,"lineEnd":1118,"text":"Systrungr一字是母亲的姊妹的儿子的意思，在诗人看来，姊妹的子女否认相互之间的血缘亲属关系比兄弟互相残杀还要罪大恶极。起加强作用的是表示母方亲属关系的systrungar一词；要是不用这个词，而用syskina born(兄弟和姊妹的子女)或syski-na一synir(兄弟和姊妹的儿子们)，那末第二行对于第一行就不是加强，而是减弱了。由此可见，甚至在产生“女预言者的预言”的海盗时代，在斯堪的那维亚关于母权制的回忆还没有消失。"},{"id":"c-paternal","label":"c-paternal","lineStart":1124,"lineEnd":1124,"text":"但是，在塔西佗时代，至少在他较为熟悉①的德意志人中间，母权制已经让位给父权制了；父亲的遗产由子女继承；如果没有子女，就由兄弟及叔伯和舅父继承。容许母亲的兄弟参加继承这一事实，是和刚刚所说的习俗的保存有关系的，并证明德意志人的父权制在当时还是多么新近。直到进入中世纪很久之后，也仍然可以见到母权制的残余。那时，在人们中间，特别是在农奴中间，似乎仍然不大信赖父亲的血统：所以，当领主向某个城市要求追回逃亡的农奴的时候，在奥格斯堡、巴塞尔和凯则尔斯劳顿，就要求有六个最近的血缘亲属，而且是只限于母方的亲属来宣誓证实被告的农奴身分（毛勒“城市制度”第1卷第381页163）。"},{"id":"c-respect","label":"c-respect","lineStart":1125,"lineEnd":1125,"text":"当时刚刚灭亡的母权制，还有一个残余，这就是在罗马人看来几乎是不可理解的、德意志人对于女性的尊敬。在同德意志人缔结条约时，贵族家庭的少女被认为是最可靠的人质：想到自己的妻女可能被俘而作奴隶，这对于德意志人说来是很可怕的，并且最能鼓舞他们的战斗勇气；他们认为妇女是一种神圣的和先知的东西；他们也在最重要的事情上听取妇女的意见：例如，利珀河畔布鲁克泰人的女祭司魏勒姐，就曾经是巴达维人起义的灵魂，在这次起义中，戚维利斯领导德意志人和比利时人动摇了罗马人在高卢的全部统治。164在家庭内妻子的统治看来是无可争辩的；自然，一切家"},{"id":"c-labor","label":"c-labor","lineStart":1126,"lineEnd":1126,"text":"务也都由妻子、老人和子女关照：丈夫则打猎，饮酒或游手好闲。塔西佗就是这样说的；但是由于他没有说谁耕田种地，并且确定地说，奴隶只纳贡，不服任何劳役，因此，耕种土地所需要的少量劳动，看来就必须由成年男子来负担了。"},{"id":"c-morality","label":"c-morality","lineStart":1132,"lineEnd":1132,"text":"如前所述，婚姻的形式是逐渐接近一夫一妻制的对偶婚制。这还不是严格的一夫一妻制，因为还允许显贵实行多妻制。少女的贞操，一般说来，是严格遵守的这和克尔特人相反)，同样，塔西佗也特别热情地说到德意志人的婚姻关系的不可破坏性。他只是举出妻子的通奸，作为离婚的理由。不过，他的话在这里留下了很多漏洞，而且过于明显地用来给淫荡的罗马人作为美德的镜子了。有一点是真实的：即使德意志人在自己的森林中曾经是这种世上少有的美德骑士，那末，只要和外界稍一接触，便足以使他们堕落到其余一般欧洲人的水平；在罗马世界中，严格道德的最后痕迹消失得比德语还要快。只消读一读图尔的格雷哥里的作品，就可以相信这点了。不言而喻，在德意志人的原始森林中，不可能像在罗马那样，盛行骄奢淫逸的享乐生活，因此，在这方面，即使我们没有给德意志人加上那种从未成为任何一个地方的整个民族的通例的节欲行为，他们也比罗马世界优越得多。"},{"id":"c-compensation","label":"c-compensation","lineStart":1133,"lineEnd":1133,"text":"从氏族制度中产生了继承父亲或亲属的友谊关系和仇敌关系的义务：同样，也继承用以代替血族复仇的杀人或伤人赎金。这种赎金，在上一代还被认为是德意志人特有的制度，但现在已经证明，在成百个民族中都是这样，这是起源于氏族制度的血族复仇的"},{"id":"c-old-land","label":"c-old-land","lineStart":1142,"lineEnd":1142,"text":"单个家庭并定期实行重新分配；既然已经确定，耕地的这种定期重新分配的办法在德意志本土有些地方还保存到今日，关于这问题就不必再费一词了。如果从凯撒到塔西佗的一百五十年间，德意志人从凯撒所明确指出的苏维汇人那里有过的共同耕作（他说，他们完全没有被分割的或私有的土地)过渡到了土地每年重新分配的个体耕作，那末这确实是个很大的进步：在这样短的时间内，而且没有任何外来干涉，要从共同耕作过渡到土地完全私有，是根本不可能的。因此，我在塔西佗的著作中只读到他说得很简洁的话：他们每年更换（或重新分配）耕地一次，同时还留下充分的公有土地。166这是和德意志人当时的氏族制度完全相适应的一种耕作和土地占有阶段。①"},{"id":"c-revision","label":"c-revision","lineStart":1143,"lineEnd":1143,"text":"上面这一段，我仍照以前各版的样子保留下来，未加改变。在这个期间，问题已转到另一方面了。柯瓦列夫斯基已经证明（见前述书第44页②)，家长制家庭公社乃是母权制共产制家庭和现代的孤立的家庭之间的中间阶段，它虽不是到处流行，但却流行很广。在这以后，问题已经不再像毛勒积瓦茨争论不下的那样一是土地公有还是土地私有，而是关于土地公有的形式是什么了。毫无疑问，在凯撒时代，苏维汇人不仅有过土地公有，而且也有过共同核算的共同耕作。至于他们的经济单位是氏族，还是家庭公社，或者是介于两者之间的某种共产制亲属集团，或者是所有三种集团依"},{"id":"c-new-land","label":"c-new-land","lineStart":1151,"lineEnd":1151,"text":"按照这个观点，德意志人在罗马时代在他们所占据的土地上的居住区，以及后来在他们从罗马夺取的土地上的居住区，不是由村落组成，而是由大家庭公社组成的，这种大家庭公社包括好几代人，耕种着相当的地带，并和邻居一起，像一个共同的马尔克一样使用四周的荒地。在这种情况下，塔西佗著作中谈到更换耕地的那个地方，实际上就应当从农学意义上去理解：公社每年耕种另一块土地，将上年的耕地休耕，或令其全然荒芜。由于人口稀少，荒地总是很多的，因之，任何争夺土地的纠纷，就没有必要了。只是经过数世纪之后，当家庭成员的人数大大增加，以致在当时的生产条件下共同经营已成为不可能的时候，这种家庭公社才解体；以前公有的耕地和草地，就按人所共知的方式，在新形成的单个农户之间实行分配，这一分配起初是暂时的，后来便成为永久的，至于森林、牧场和沼地依然是公共的。"},{"id":"c-research","label":"c-research","lineStart":1154,"lineEnd":1154,"text":"公社来解释要好得多。另一方面，这种解释又造成了新的困难和引起了新的需要解决的问题。在这里只有新的研究才能作出解决：但是，我不能否认，作为中间阶段的家庭公社，在德国、斯堪的那维亚"},{"id":"c-production","label":"c-production","lineStart":1160,"lineEnd":1160,"text":"在凯撒时代，一部分德意志人刚刚定居下来，一部分人尚在找寻定居的地方，但在塔西佗时代，他们已有整整百年之久的定居生活了；与此相适应，在生活资料的生产方面也有了无可怀疑的进步。他们居住在木屋中，穿的还是很原始的林中居民的衣服：粗糙的羊毛外套，兽皮：妇女和贵人则穿麻布内衣。食物为乳、肉、野生果实，以及像普林尼所补充的燕麦粥6$（直到今日，这还是爱尔兰和苏格兰的克尔特人的民族食物)。他们的财富是家畜，但是品种很差：牛矮小难看，没有角；马是小马，不善奔驰。货币很少使用，数量有限，而且只是罗马货币。他们不制造金银装饰品，也不重视这些。铁是很少见的，至少在莱茵河和多瑙河诸部落中间似乎主要靠输入，而不是自行开采的。鲁恩文字是模仿希腊和拉丁字母造成的，仅仅用作暗号，并且专供宗教巫术之用。把人当作祭品的做法还在流行。一句话，我们在这里所看到的，是一种刚从野蛮时代中级阶段进到高级阶段的民族。不过，虽然与罗马人直接接壤的各部落由于输入罗马的工业品极为容易，因而其金属业和纺织业的独立发展受到了阻碍，但是在东北部，在波罗的海沿岸诸部落中，则毫无疑问建立起了这样的工业。在什列斯维希沼地所发现的武器"},{"id":"c-government","label":"c-government","lineStart":1167,"lineEnd":1167,"text":"他们的制度也是跟野蛮时代高级阶段相适应的。据塔西佗说，到处都有氏族首长(principes),议事会，它处理比较小的事情，而比较重大的事情则由它提交人民大会去解决；在野蛮时代低级阶段上，至少在我们知道有人民大会的地方，例如在美洲人那里，仅仅氏族才有人民大会，而部落或部落联盟是没有的。氏族首长(principes)和军事首领(duces)还有显著的区别，正像在易洛魁人那里一样。氏族首长已经部分地靠部落成员的献礼如家畜、谷物等来生活：他们一如在美洲一样一大半是从同一家庭中选出的：向父权制的过渡，像在希腊和罗马一样，使官职由选举逐渐变为世袭，从而促进了各氏族中贵族家庭的产生。这种古代的所谓部落贵族，大多数在民族大迁徙中成在它以后不久便消灭了。军事首长完全是按才能来选举的，与世系无关。他们的权力很小，必须以自己的榜样来影响别人；至于军队的实际惩戒权，塔西佗确定地说，是握在祭司们手里的。真正的权力集中在人民大会上。王或部落长是大会主席：决定由人民来作：怨声表示反对，喝采、敲打武器表示赞成。人民大会同时也是审判法庭；各种控诉都向它提出，并由它作出判决，死刑也在这里宣判，但只有对卑怯、背叛和反自然的淫行才判处死刑。在氏族和其他分支中，也是由以氏族首长为主席的全体大会进行审判：像在德意志人的一切最早的法庭上一样，氏族首长只能是诉讼的领导者和审问者；德意志人的判决，不拘何时何地，都是由全体作出的。"},{"id":"c-new-nobles","label":"c-new-nobles","lineStart":1173,"lineEnd":1173,"text":"的统治者：不过他们已经开始粉碎氏族制度的枷锁了。被释放的奴隶一般是处于低微地位的，因为他们不能属于任何氏族，而在新王的手下，他们当中的受到宠幸的人却往往获得高官、财富和荣誉。罗马帝国被征服以后，在成了大国国王的军事首长那里也发生了同样的情形。在法兰克人中间，国王的奴隶和被释放者，起初在宫廷里，后来在国家中，都起了重要的作用：新的贵族有很大一部分是从他们当中产生的。"},{"id":"c-retinue","label":"c-retinue","lineStart":1174,"lineEnd":1174,"text":"有一种制度促进了王权的产生，这就是扈从队制度。我们在美洲红种人中间就已经看到，与氏族制度并行，还形成了一种独立自主地进行战争的私人团体。这种私人团体，在德意志人中间，已经成为经常性的团体了。博得了声誉的军事首领，在自己周围集合一队贪图掠夺品的青年人，他们对他个人必须效忠，而他对他们亦然。首领养活他们，奖赏他们，并且按等级制来组织他们：对于小规模的征战，他们充当卫队和战斗预备队；对于大规模的征战，他们是现成的军官团。不管这种扈从队必然是多么弱小，像后来在意大利奥多亚克麾下所表现的那样，但是他们仍然包含着古代的人民自由走向衰落的萌芽；在民族大迁徙时期和迁徙以后，他们也表明自己的作用正是这样。因为，第一，他们促进了王权的产生；第二，如塔西佗已经指出的，只有通过不断的战争和抢劫，才能把他们纠合在一起。掠夺成了目的。如果扈从队首领在附近地区无事可做，他就把他的队伍带到发生了战争、可以指望获得战利品的别的民族那里去；由德意志人组成的辅助军，在罗马的旗帜下，甚至大举对德意志人作战，这种辅助军有一部分就是由这种扈从队编成的。德意志人的耻辱和诅咒一雇佣兵制度，在这里已经初具雏形。在罗马帝国被征服以后，国王们的这种扈从兵，就同"},{"id":"c-end","label":"c-end","lineStart":1180,"lineEnd":1180,"text":"由此可见，一般说来，在联合为民族Vok)的德意志各部落中，也有过像英雄时代的希腊人和所谓王政时代的罗马人那样的制度，即人民大会、氏族首长议事会和企图获得真正王权的军事首长。这是氏族制度下一般所能达到的最发达的制度；这是野蛮时代高级阶段的模范制度。只要社会一越出这一制度所适用的界限，氏族制度的末日就来到了；它就被炸毁，由国家来代替了。"}]}</script></body></html>
