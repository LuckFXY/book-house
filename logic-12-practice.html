2-005","type":"逻辑判断","difficulty":3,"stem":"设例：甲反驳某方案说“假如采用它，就会出现我不喜欢的安排，所以方案不成立”。关键不足是什么？","options":["多数参与者若同样不喜欢，就能把它直接视为逻辑矛盾","后果只要偏离提出者预期，就足以否定方案全部主张","主观不喜欢不等于已证实的事实或逻辑冲突","后果推导只要有效，就不用再证明该后果确实不能成立"],"answerIndex":2,"explanation":"本讲要求归谬的结果确为不能成立的冲突，且推导有效；个人偏好不足以担任此角色。","whyWrong":["共同偏好仍不是逻辑矛盾的充分根据。","偏离预期不一定违反论题或既定条件。","正确","有效推出还须证明后果为假或与可靠前提冲突。"],"basis":{"paras":[],"excerptIds":["e-reductio","e-denyconsequent","e-rules","e-focus","e-sufficient","e-summary","e-proofrelation"],"anchors":[]},"knowledge":["absurd","quality"]},{"id":"q-logic-12-006","type":"逻辑判断","difficulty":2,"stem":"设例：甲主张“有些申请无需复核”，乙要直接证明该主张为假，应证明哪项？","options":["有些申请确实需要复核","所有申请都必须经过复核","所有申请目前尚未完成复核","有些申请已经完成复核"],"answerIndex":1,"explanation":"本讲要求直接反驳确立原论题的矛盾判断；有些不需要的否定是全部需要。","whyWrong":["可与有些不需要并存。","正确","是否完成与是否需要不同。","完成事实不等于全体都需要。"],"basis":{"paras":[],"excerptIds":["e-thesis","e-indirect","e-focus"],"anchors":[]},"knowledge":["thesis"]},{"id":"q-logic-12-007","type":"逻辑判断","difficulty":3,"stem":"设例：原主张是“在高峰时段试行预约”，批评者却反驳“全天取消现场服务”。最准确的评价是","options":["批评者已反驳方案效果的根据，因此原主张也必为假","批评者反驳更强主张，因而也就反驳其较弱主张","批评者已证明原推导无效，所以足以接受相反主张","批评者把有限主张换成更强主张，未击中原论题"],"answerIndex":3,"explanation":"本讲要求反驳有针对性，先准确把握对方论题，不能另立更强主张替代它。","whyWrong":["题设未反驳原主张的实际根据；即使论据失败也不自动证伪论题。","更强命题假不保证较弱命题假。","未证明原推导无效，且推不出不等于相反主张成立。","正确"],"basis":{"paras":[],"excerptIds":["e-refutation","e-targets","e-focus","e-historical","e-sufficient","e-rules","e-summary","e-proofrelation"],"anchors":[]},"knowledge":["target","quality"]},{"id":"q-logic-12-008","type":"逻辑判断","difficulty":3,"stem":"设例：乙推翻甲的一项论据后，甲提供了不依赖该论据的可靠新证明。乙应如何回应？","options":["论题相同意味着根据相同，因此旧反驳仍然完全适用","旧论据既已被推翻，新论据应先被认定为假再审查","只要新证明形式不同，原论题便可无须核实直接接受","检查新证明的根据和联系，不能沿用旧反驳作结"],"answerIndex":3,"explanation":"本讲区分某次论证被驳倒与论题被证伪；独立的新证明需要独立评价。","whyWrong":["同一论题可以有不同独立证明。","旧论据失实不赋予其他独立根据预设假值。","形式不同不保证真实性和有效性。","正确"],"basis":{"paras":[],"excerptIds":["e-premises","e-notproved","e-targets","e-focus","e-sufficient","e-rules","e-summary","e-proofrelation"],"anchors":[]},"knowledge":["evidence","quality"]},{"id":"q-logic-12-009","type":"逻辑判断","difficulty":3,"stem":"设例：甲由两个成功案例推出所有场景都适用。哪项批评直接针对论证方式，而非直接否定论题？","options":["提出者过去曾作出不准确的推广，故本次也不可接受","两个案例未经代表性论证，不能充分支持全部适用","其中一个所谓成功案例实际并未成功","已确认有一个场景完全不适用该方法"],"answerIndex":1,"explanation":"本讲把反驳论证方式与反驳论据、论题区别开；指出从有限案例到全体的支持不足针对推导。","whyWrong":["这是诉诸提出者经历，并非具体分析当前推出关系。","正确","这直接反驳论据。","这直接以反例否定全称论题。"],"basis":{"paras":[],"excerptIds":["e-disconnected","e-targets","e-rules"],"anchors":[]},"knowledge":["method"]},{"id":"q-logic-12-010","type":"逻辑判断","difficulty":2,"stem":"设例：甲论题推出后果乙，但乙已被确证为假。只要推出关系有效，可以怎样反驳甲？","options":["以后果为假否定全部背景论据，不再检查原论题","以后果未成立推出甲与乙没有任何条件联系","以后果为假否定论题，采用否定后件的方式","以后果为假仅认定证明不足，不能否定原论题"],"answerIndex":2,"explanation":"本讲说明归谬可按充分条件推理的否定后件式理解：甲真必有乙，非乙故非甲。","whyWrong":["否定后件只保证原前件不能真，不推翻所有背景事实。","乙假可与甲推出乙同时成立，不能否定条件联系。","正确","题设推出有效且乙已确假，可否定甲，不止是未证成。"],"basis":{"paras":[],"excerptIds":["e-reductio","e-denyconsequent","e-rules"],"anchors":[]},"knowledge":["absurd"]},{"id":"q-logic-12-011","type":"常识判断","difficulty":2,"stem":"依据本讲，下列哪项区分最准确？","options":["反驳论题说明主张不真，反驳论据未必达到此效果","反驳论据已使原证明失败，因而等于论题被证伪","反驳论证方式只要成功，就能确立相反论题","反驳提出者曾用的根据，就可否定其后独立证明"],"answerIndex":0,"explanation":"本讲强调不同反驳对象带来的结论强度不同，不能混同未证成与已证伪。","whyWrong":["正确","证明失败与论题假不同。","推不出不能自动证明反面。","独立新证明仍须分别检查。"],"basis":{"paras":[],"excerptIds":["e-thesis","e-indirect","e-focus","e-premises","e-notproved","e-targets"],"anchors":[]},"knowledge":["thesis","evidence"]},{"id":"q-logic-12-012","type":"逻辑判断","difficulty":3,"stem":"设例：甲反对某措施只因其提出者过去判断失误；乙补充了当前措施确实违反已定必要条件的证据。哪项评价最恰当？","options":["甲针对个人经历，乙提供与当前论题直接相关根据","乙只检查一个必要条件，因此无法影响整个措施","甲过去案例更多，所以必比乙的当前证据可靠","甲乙都是否定措施，因此两者论证力度相同"],"answerIndex":0,"explanation":"本讲要求反驳有针对性和充分根据；当前必要条件未满足比对个人经历的泛化更直接。","whyWrong":["正确","必要条件缺失可以直接影响成立资格。","数量不能补偿相关性不足。","同样的结论不等于同样的支持。"],"basis":{"paras":[],"excerptIds":["e-focus","e-sufficient","e-rules","e-summary","e-proofrelation"],"anchors":[]},"knowledge":["quality"]},{"id":"q-logic-12-013","type":"类比推理","difficulty":2,"stem":"反驳论据∶指出根据失实","options":["反驳方式∶指出推导无效","反驳论题∶指出推导无效","反驳论题∶指出某据失实","反驳方式∶提出相反意见"],"answerIndex":0,"explanation":"本讲按反驳对象和对应手段配对；根据失实针对论据，推导无效针对论证方式。","whyWrong":["正确","对象与方法错配，推导无效未必证伪论题。","与题干同涉失实，但将论据反驳错作论题反驳。","提出意见不是指出推导缺陷的充分方法。"],"basis":{"paras":[],"excerptIds":["e-refutation","e-targets","e-focus","e-historical","e-disconnected","e-rules"],"anchors":[]},"knowledge":["target","method"]},{"id":"q-logic-12-014","type":"逻辑判断","difficulty":2,"stem":"设例：甲说“该做法在任何情况下都能降低成本”。哪项若属实，最有力地反驳这一论题？","options":["专家对该做法的理论说明提出过修改意见","一个条件明确的实际试行中总成本反而增加","采用者普遍表示愿意继续尝试该做法","其他做法在部分条件下也能够降低成本"],"answerIndex":1,"explanation":"本讲要求反驳击中论题；无条件全称断定受到一个确证反例的直接否定。","whyWrong":["修改理论说明不等于效果论题虚假。","正确","意愿不直接评价成本真假。","其他做法有效可与本做法全有效并存。"],"basis":{"paras":[],"excerptIds":["e-focus","e-sufficient","e-rules","e-summary","e-proofrelation","e-thesis","e-indirect"],"anchors":[]},"knowledge":["quality","thesis"]},{"id":"q-logic-12-015","type":"逻辑判断","difficulty":3,"stem":"设例：某归谬在假设对方论题后，又加入一个未经证实的前提，才推出冲突。最重要的审查是什么？","options":["冲突是否仅由原论题与可靠背景前提有效导出","附加前提是否与反驳者所要得到的结论一致","对方是否暂时未反对该附加前提，就可视为已证实","加入该前提后推导是否形式有效，即可忽略其真假"],"answerIndex":0,"explanation":"本讲要求归谬的推导可靠；若冲突依赖额外不真实假设，就不能独归于原论题。","whyWrong":["正确","与预期结论同向不证明前提真实独立。","未反对不等于真实性已确立。","形式有效仍须可靠背景前提，不能只审形式。"],"basis":{"paras":[],"excerptIds":["e-reductio","e-denyconsequent","e-rules","e-focus","e-sufficient","e-summary","e-proofrelation"],"anchors":[]},"knowledge":["absurd","quality"]}],"open":[{"id":"o-logic-12-001","type":"论证分析","material":{"text":"设例：甲用两份调查记录证明所有窗口都已整改。乙指出其中一份记录不实，便宣布所有窗口都未整改。丙认为另一份记录真实，所以原全称论题仍已得到证明。","sourceIds":[]},"prompt":"分别评价乙、丙的推断，说明要反驳原全称论题还应提供怎样的证据。（150—220字）","points":["记录失实使原证明损失一项根据，不能推出全部窗口均未整改。","另一记录真实也不足以覆盖全部窗口，不能自动补足全称证明。","应查明至少一个确未整改窗口，即可直接反驳全部已整改。","若要证明全部未整改，则须更强的全面根据，不能由一个缺陷扩大。","分别考察论据真实性、覆盖范围及论题真假，避免相互替代。"],"basis":{"paras":[],"excerptIds":["e-premises","e-notproved","e-targets","e-disconnected","e-rules","e-focus","e-sufficient","e-summary","e-proofrelation"],"anchors":[]}},{"id":"o-logic-12-002","type":"论证分析","material":{"text":"设例：原主张是在高峰期试行预约并保留现场服务。批评者将其写成全天仅许预约，再假设所有人都无法使用预约，推得无人能办理，并据此否定原主张。","sourceIds":[]},"prompt":"分析这项归谬为什么没有击中原论题，提出规范反驳应满足的条件。（150—220字）","points":["把高峰试行且保留现场改成全天仅许预约，偷换了反驳对象。","所有人无法使用预约是额外未证实前提，不能无根据加入。","归谬须从准确的原论题和可靠背景前提有效推出真实冲突。","可调查特定人群能否使用渠道、现场保留是否充分，再据真实问题提出限定批评。"],"basis":{"paras":[],"excerptIds":["e-reductio","e-denyconsequent","e-rules","e-refutation","e-targets","e-focus","e-historical","e-sufficient","e-summary","e-proofrelation"],"anchors":[]}}]},"materials":[],"knowledge":[{"id":"target","title":"先确定对象"},{"id":"thesis","title":"反驳论题"},{"id":"absurd","title":"归谬法"},{"id":"evidence","title":"反驳论据"},{"id":"method","title":"反驳论证方式"},{"id":"quality","title":"让反驳成立"}],"links":{"q-logic-12-001":[{"kind":"excerpt","label":"反驳需要证明","href":"./logic-12.html#excerpt-e-refutation"},{"kind":"ocr","label":"看 OCR 原书 · 反驳需要证明","href":"./source.html#book=formal-logic-1976&from=1904&to=1904&ref=logic-12.html%23excerpt-e-refutation"},{"kind":"excerpt","label":"三个反驳对象","href":"./logic-12.html#excerpt-e-targets"},{"kind":"ocr","label":"看 OCR 原书 · 三个反驳对象","href":"./source.html#book=formal-logic-1976&from=1924&to=1924&ref=logic-12.html%23excerpt-e-targets"},{"kind":"excerpt","label":"明确反驳目标","href":"./logic-12.html#excerpt-e-focus"},{"kind":"ocr","label":"看 OCR 原书 · 明确反驳目标","href":"./source.html#book=formal-logic-1976&from=1980&to=1980&ref=logic-12.html%23excerpt-e-focus"},{"kind":"excerpt","label":"反驳与原书历史语境","href":"./logic-12.html#excerpt-e-historical"},{"kind":"ocr","label":"看 OCR 原书 · 反驳与原书历史语境","href":"./source.html#book=formal-logic-1976&from=1916&to=1916&ref=logic-12.html%23excerpt-e-historical"}],"q-logic-12-002":[{"kind":"excerpt","label":"反驳论据","href":"./logic-12.html#excerpt-e-premises"},{"kind":"ocr","label":"看 OCR 原书 · 反驳论据","href":"./source.html#book=formal-logic-1976&from=1950&to=1950&ref=logic-12.html%23excerpt-e-premises"},{"kind":"excerpt","label":"论据被驳与论题未得证明（保留OCR栏题）","href":"./logic-12.html#exce &ref=logic-12.html%23excerpt-e-historical"},{"kind":"excerpt","label":"需要充分根据","href":"./logic-12.html#excerpt-e-sufficient"},{"kind":"ocr","label":"看 OCR 原书 · 需要充分根据","href":"./source.html#book=formal-logic-1976&from=1981&to=1981&ref=logic-12.html%23excerpt-e-sufficient"},{"kind":"excerpt","label":"本讲的反驳路径","href":"./logic-12.html#excerpt-e-summary"},{"kind":"ocr","label":"看 OCR 原书 · 本讲的反驳路径","href":"./source.html#book=formal-logic-1976&from=1988&to=1988&ref=logic-12.html%23excerpt-e-summary"},{"kind":"excerpt","label":"证明与反驳结合","href":"./logic-12.html#excerpt-e-proofrelation"},{"kind":"ocr","label":"看 OCR 原书 · 证明与反驳结合","href":"./source.html#book=formal-logic-1976&from=1905&to=1905&ref=logic-12.html%23excerpt-e-proofrelation"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-12","title":"第十二讲·怎样进行反驳","output":"logic-12.html"},"excerpts":[{"id":"e-refutation","label":"反驳需要证明","lineStart":1904,"lineEnd":1904,"text":"所谓反驳，就是用确凿的事实或正确的理论观点证明某种言论是虚假的，也可以说，是用一个证明去推翻另一个证明。"},{"id":"e-proofrelation","label":"证明与反驳结合","lineStart":1905,"lineEnd":1905,"text":"证明和反驳常常是结合在一起同时使用的。"},{"id":"e-historical","label":"反驳与原书历史语境","lineStart":1916,"lineEnd":1916,"text":"反驳只是革命大批判的一部分"},{"id":"e-targets","label":"三个反驳对象","lineStart":1924,"lineEnd":1924,"text":"反驳应当从这三方面进行，即反驳论题，反驳论据，反驳论证方式。"},{"id":"e-thesis","label":"反驳论题","lineStart":1925,"lineEnd":1925,"text":"反驳论题就是证明对方的论题是错误的。"},{"id":"e-indirect","label":"间接反驳","lineStart":1935,"lineEnd":1935,"text":"先证明一个与对方论题相反的论题是正确的，根据矛盾律，两个相反的判断不能同真，必有一假，从而驳倒对方论题。"},{"id":"e-reductio","label":"归谬法的起点","lineStart":1939,"lineEnd":1939,"text":"先假定对方的论题是真的，然后从中引出明显荒谬的结论"},{"id":"e-denyconsequent","label":"归谬法的推出关系","lineStart":1940,"lineEnd":1940,"text":"根据充分条件假言推理的规则，既然后件假，也就证明前件假，从而达到反驳目的。"},{"id":"e-premises","label":"反驳论据","lineStart":1950,"lineEnd":1950,"text":"反驳论据就是证明对方的论据是虚假的，站不住脚的。"},{"id":"e-notproved","label":"论据被驳与论题未得证明（保留OCR栏题）","lineStart":1950,"lineEnd":1952,"text":"论据既假，论题就\n    反驳论据\n    得不到证明。"},{"id":"e-disconnected","label":"反驳论证方式的关键","lineStart":1975,"lineEnd":1975,"text":"由前者绝对推不出后者。"},{"id":"e-focus","label":"明确反驳目标","lineStart":1980,"lineEnd":1980,"text":"反驳时，首先要选好靶子，做到反驳有鲜明的针对性。"},{"id":"e-sufficient","label":"需要充分根据","lineStart":1981,"lineEnd":1981,"text":"反驳时，要尽量拿出充分的事实和理论根据，增强反驳的力量。"},{"id":"e-rules","label":"方法与规则","lineStart":1988,"lineEnd":1988,"text":"要遵守逻辑规律、规则，正确地使用反驳方法。"},{"id":"e-summary","label":"本讲的反驳路径","lineStart":1988,"lineEnd":1988,"text":"首先要明确反对什么，接着就姜拿出理论上和事实上的充分依据，.并且选用适当的反驳方法，这样才能达到反驳的目的。"}]}</script></body></html>
