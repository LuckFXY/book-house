ic-03.html%23excerpt-e-boundaries"},{"kind":"excerpt","label":"同次划分同一标准","href":"./logic-03.html#excerpt-e-standard"},{"kind":"ocr","label":"看 OCR 原书 · 同次划分同一标准","href":"./source.html#book=formal-logic-1976&from=395&to=395&ref=logic-03.html%23excerpt-e-standard"}],"o-logic-03-002":[{"kind":"excerpt","label":"限制的任务","href":"./logic-03.html#excerpt-e-restrict"},{"kind":"ocr","label":"看 OCR 原书 · 限制的任务","href":"./source.html#book=formal-logic-1976&from=426&to=426&ref=logic-03.html%23excerpt-e-restrict"},{"kind":"excerpt","label":"限制不能偷换成部分","href":"./logic-03.html#excerpt-e-species"},{"kind":"ocr","label":"看 OCR 原书 · 限制不能偷换成部分","href":"./source.html#book=formal-logic-1976&from=428&to=428&ref=logic-03.html%23excerpt-e-species"},{"kind":"excerpt","label":"增加规定以缩小范围","href":"./logic-03.html#excerpt-e-add"},{"kind":"ocr","label":"看 OCR 原书 · 增加规定以缩小范围","href":"./source.html#book=formal-logic-1976&from=429&to=429&ref=logic-03.html%23excerpt-e-add"},{"kind":"excerpt","label":"定义的任务","href":"./logic-03.html#excerpt-e-definition"},{"kind":"ocr","label":"看 OCR 原书 · 定义的任务","href":"./source.html#book=formal-logic-1976&from=261&to=261&ref=logic-03.html%23excerpt-e-definition"},{"kind":"excerpt","label":"划分的任务","href":"./logic-03.html#excerpt-e-division"},{"kind":"ocr","label":"看 OCR 原书 · 划分的任务","href":"./source.html#book=formal-logic-1976&from=345&to=345&ref=logic-03.html%23excerpt-e-division"},{"kind":"excerpt","label":"定义不能替代实际","href":"./logic-03.html#excerpt-e-relative"},{"kind":"ocr","label":"看 OCR 原书 · 定义不能替代实际","href":"./source.html#book=formal-logic-1976&from=332&to=332&ref=logic-03.html%23excerpt-e-relative"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-03","title":"第三讲·明确概念的几种逻辑方法","output":"logic-03.html"},"excerpts":[{"id":"e-definition","label":"定义的任务","lineStart":261,"lineEnd":261,"text":"定义是揭示概念所反映的客观事物的本质的逻辑方法，也就是明确概念内涵的逻辑方法。"},{"id":"e-structure","label":"被定义概念与定义概念","lineStart":262,"lineEnd":262,"text":"任何定义都是由两部分组成的。"},{"id":"e-genus","label":"属概念加种差","lineStart":282,"lineEnd":282,"text":"这种方法逻辑上叫做通过属概念加种差来给概念下定义。"},{"id":"e-formula","label":"定义公式","lineStart":287,"lineEnd":287,"text":"被定义概念=种差+属概念"},{"id":"e-notall","label":"定义方法的适用限度","lineStart":296,"lineEnd":296,"text":"属概念加种差的定义方法虽然是常用的，但是，并不是所有的概念都可以用这种方法下定义。"},{"id":"e-equal","label":"定义不可过宽或过窄","lineStart":316,"lineEnd":316,"text":"定义概念的外延和被定义概念的外延应当是相等的。"},{"id":"e-circle","label":"避免循环解释","lineStart":317,"lineEnd":317,"text":"在定义中，定义概念必须能够直接说明被定义概念的内涵，不能依赖被定义概念。"},{"id":"e-clear","label":"定义应清楚","lineStart":318,"lineEnd":318,"text":"在定义中，定义概念必须清楚明白，不能含糊不清。"},{"id":"e-relative","label":"定义不能替代实际","lineStart":332,"lineEnd":332,"text":"任何定义都是有条件的，相对的，永远也不能包括充分发展的现象的各方面。"},{"id":"e-division","label":"划分的任务","lineStart":345,"lineEnd":345,"text":"划分是通过把概念所反映的事物一个一个列出或分成若干类来明确概念外延的逻辑方法。"},{"id":"e-parts","label":"划分与分解","lineStart":352,"lineEnd":352,"text":"划分是把属概念分成几个种概念，分解是把事物的整体分成几个部分。"},{"id":"e-total","label":"划分不漏不多","lineStart":389,"lineEnd":389,"text":"划分中，子项的外延应当同母项的外延相等，‘既不能窄也不能宽。"},{"id":"e-boundaries","label":"划分子项界限","lineStart":390,"lineEnd":390,"text":"划分后的子项必须界限分明。"},{"id":"e-standard","label":"同次划分同一标准","lineStart":395,"lineEnd":395,"text":"一次划分只能根据同一标准。"},{"id":"e-restrict","label":"限制的任务","lineStart":426,"lineEnd":426,"text":"限制就是通过缩小概念的外延来明确概念的逻辑方法。"},{"id":"e-species","label":"限制不能偷换成部分","lineStart":428,"lineEnd":428,"text":"概念的限制就是从属概念过渡到种概念。"},{"id":"e-add","label":"增加规定以缩小范围","lineStart":429,"lineEnd":429,"text":"要对一个概念进行限制，我们可以增加这个溉念的内涵。概念的内涵多了，它的外延就小了。"}]}</script></body></html>
