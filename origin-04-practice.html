/source.html#book=family-origin&from=813&to=813&ref=origin-04.html%23excerpt-h-functions"},{"kind":"excerpt","label":"h-limited","href":"./origin-04.html#excerpt-h-limited"},{"kind":"ocr","label":"看 OCR 原书 · h-limited","href":"./source.html#book=family-origin&from=820&to=820&ref=origin-04.html%23excerpt-h-limited"},{"kind":"excerpt","label":"h-genealogy","href":"./origin-04.html#excerpt-h-genealogy"},{"kind":"ocr","label":"看 OCR 原书 · h-genealogy","href":"./source.html#book=family-origin&from=774&to=774&ref=origin-04.html%23excerpt-h-genealogy"},{"kind":"excerpt","label":"h-unknown","href":"./origin-04.html#excerpt-h-unknown"},{"kind":"ocr","label":"看 OCR 原书 · h-unknown","href":"./source.html#book=family-origin&from=784&to=784&ref=origin-04.html%23excerpt-h-unknown"},{"kind":"excerpt","label":"h-council","href":"./origin-04.html#excerpt-h-council"},{"kind":"ocr","label":"看 OCR 原书 · h-council","href":"./source.html#book=family-origin&from=793&to=793&ref=origin-04.html%23excerpt-h-council"},{"kind":"excerpt","label":"h-assembly","href":"./origin-04.html#excerpt-h-assembly"},{"kind":"ocr","label":"看 OCR 原书 · h-assembly","href":"./source.html#book=family-origin&from=795&to=795&ref=origin-04.html%23excerpt-h-assembly"},{"kind":"excerpt","label":"h-no-force","href":"./origin-04.html#excerpt-h-no-force"},{"kind":"ocr","label":"看 OCR 原书 · h-no-force","href":"./source.html#book=family-origin&from=797&to=797&ref=origin-04.html%23excerpt-h-no-force"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-04","title":"第四章·希腊人的氏族","output":"origin-04.html"},"excerpts":[{"id":"h-change","label":"h-change","lineStart":727,"lineEnd":727,"text":"希腊人，像皮拉斯基人以及其他起源于同一部落的民族一样，在史前时代，就已经按照美洲人的那种有机的序列一氏族、胞族、部落、部落联盟而组织起来了。胞族可能是没有的，在多立斯人中间就是这样；部落联盟也可能不是到处都成立的，但无论如何氏族是基本的单位。希腊人，在他们出现在历史舞台上的时候，已经处在文明时代的门槛上了；他们与上述美洲部落之间，横着差不多整整两个很大的发展时期，亦即英雄时代的希腊人超过易洛魁人两个时期。所以，希腊人的氏族已经不再是易洛魁人的那种古老的氏族了，群婚①的痕迹正开始显著地消失。母权制已让位给父权制；与此同时，正在产生的私有财富在氏族制度上打开了第一个缺口。第二个缺口是第一个缺口的自然结果：既然在实行父权制以后，富有的女继承人的财产在她出嫁时应当归她的丈夫所有，从而归别的氏族所有，所以，这便摧毁了整个氏族法权的基础，于是，为了把少女的财产保存在氏族以内，不仅容许少女在氏族内出嫁，而且还非这样做不可了。"},{"id":"h-customs","label":"h-customs","lineStart":735,"lineEnd":735,"text":"1.共同的宗教节日和祀奉一定的神的独占权。这种神被认为是氏族的祖先，并具有独特的别名以表明其地位。"},{"id":"h-burial","label":"h-burial","lineStart":736,"lineEnd":736,"text":"2.共同的墓地（参看狄摩西尼“反驳欧布利得）。"},{"id":"h-inheritance","label":"h-inheritance","lineStart":737,"lineEnd":737,"text":"3.相互继承权。"},{"id":"h-protection","label":"h-protection","lineStart":738,"lineEnd":738,"text":"4.在受到侵害时提供帮助、保护和支援的相互义务。"},{"id":"h-heiress","label":"h-heiress","lineStart":739,"lineEnd":739,"text":"5.在一定情况下，特别是在事关孤女或女继承人的时候，在氏族内部通婚的相互权利和义务。"},{"id":"h-assets","label":"h-assets","lineStart":740,"lineEnd":740,"text":"6.拥有一至少在某些情况下，一共同财产以及自己的"},{"id":"h-paternal","label":"h-paternal","lineStart":746,"lineEnd":746,"text":"7.按照父权制计算的世系。"},{"id":"h-exception","label":"h-exception","lineStart":747,"lineEnd":747,"text":"8.禁止氏族内部通婚，但和女继承人结婚例外，这一例外及其成为律令，就证实古时的惯例仍然有效。这也是从下述普遍通行的惯例中产生的，即妇女出嫁后，就不再参与本氏族的宗教仪式，而改行她丈夫的氏族的宗教仪式，加入她丈夫的胞族。根据这一点以及狄凯阿尔科斯的著名的一段话看来2，可知外婚乃是"},{"id":"h-adoption","label":"h-adoption","lineStart":753,"lineEnd":753,"text":"9.收养外人入族的权利；这是用家庭收养的办法来实现的，但是有公开的手续，而且只限于例外情形"},{"id":"h-elect","label":"h-elect","lineStart":754,"lineEnd":754,"text":"10.选举和撤换首长的权利。我们知道，每一氏族都有自己的首长；但是，任何地方都没有提到过这一职务是在一定的家庭里世袭的。在野蛮时代结束以前，总是不大可能有严格的①世袭制的，因为这种世袭制是同富人和穷人在氏族内部享有完全平等权利的秩序不相容的。"},{"id":"h-household","label":"h-household","lineStart":755,"lineEnd":755,"text":"不仅格罗特，而且尼布尔、蒙森以及先前的其他一切古典古代历史家，都没有解决氏族问题。不论他们多么正确地叙述了氏族的许多特征，但是他们总是把氏族看做家庭集团，因此便不能理解氏族的本性和起源。在氏族制度之下，家庭从来不是，也不可能是一个组织单位，因为夫与妻必然属于两个不同的氏族。氏族整个包括在胞族内，胞族整个包括在部落内：而家庭却是一半包括在丈夫的氏族内，一半包括在妻子的氏族内。国家在其公法上也不承认家庭，到今日为止，家庭不过存在于私法上而已。然而我们的全部历史科学直至现在都是从一个荒诞的假定出发的，这种假定尤其是在十八世纪已成为不可侵犯的了，即以为那未必早于文明时代的一夫一妻制个体家庭，曾是社会和国家在其周围逐渐凝结起来的核心。"},{"id":"h-genealogy","label":"h-genealogy","lineStart":774,"lineEnd":774,"text":"他们从童年时代起，就在实践上熟悉了这种对他们极其重要的事物。随着一夫一妻制家庭的产生，这种事物就湮没无闻了。氏族名称创造了一个系谱，相形之下，个体家庭的系谱便显得没有意义。这种氏族名称，现在应当证明具有这种名称的人有共同世系：但是氏族的系谱已经十分湮远，以致氏族的成员，除了有较近的共同祖先的少数场合以外，已经不能证明他们相互之间有事实上的亲属关系了。名称本身就是共同世系的证据，而且除了收养外人入族的情形以外，也是不可争辩的证据。反之，像格罗特①和尼布尔所做的那样，实际否定氏族成员间的任何亲属关系，从而把氏族变为纯粹虚构和幻想的产物，这是只有‘观念的’、亦即蛰居式的书斋学者才能干得出来的事情。由于血族的联系（尤其是一夫一妻制发生后)已经湮远，而过去的现实看来是反映在神话的幻想中，于是老实的庸人们便作出了而且还在继续作着一种结论，即幻想的系谱创造了现实的氏族。”1s"},{"id":"h-unknown","label":"h-unknown","lineStart":784,"lineEnd":784,"text":"几个亲属胞族构成一个部落。在阿提卡，共有四个部落，每个部落有三个胞族，每个胞族有三十个氏族。这样细密的集团划分，是以有意识的和有计划的干涉自发造成的秩序为前提的。至于这是怎样发生的，什么时候发生的，以及为什么发生的，希腊历史都没有提到，希腊人自己关于他们的历史所保存下来的记忆仅仅追溯到英雄时代为止。"},{"id":"h-council","label":"h-council","lineStart":793,"lineEnd":793,"text":"1.常设的权力机关为议事会(bulè)，这种议事会最初大概是由各氏族的首长组成的，后来，由于其人数增加得太多，便由其中选出的一部分人组成，这就造成了发展和加强贵族分子的机会；狄奥尼修斯所描述的英雄时代的议事会正是这样由贵族(kratistoi)组成的2”。议事会对于一切重要问题作出最后决定；例如，在埃斯库罗斯的作品中就谈到过忒拜议事会曾作了一个当时必须遵守的决定，即为伊托克利斯举行荣誉葬礼，而波吕涅克斯的尸体则让狗吃掉。123随着国家的设立，这种议事会就变为元老院了。"},{"id":"h-assembly","label":"h-assembly","lineStart":795,"lineEnd":795,"text":"U mstand)(这是古代德意志人的法庭用语)已经发展成为一种真正的人民大会，这种情形在古代德意志人那里也有。人民大会由议事会召集，以解决各项重要问题；每个男子都可以发言。决定是用举手(见埃斯库罗斯的“求援女”)或欢呼通过的。人民大会是最高级的权力，因为，正如舍曼所说(“希腊的古迹”)，"},{"id":"h-no-force","label":"h-no-force","lineStart":797,"lineEnd":797,"text":"原来，当部落中的每个成年男子都是战士的时候，那脱离了人民的、可以用来和人民对抗的公共权力还不存在。自然长成的民主制还处于全盛时期，所以无论在判断议事会或者在判断巴赛勒斯的权力与地位时，都应当以此为出发点。"},{"id":"h-succession","label":"h-succession","lineStart":806,"lineEnd":806,"text":"我们己经看到，易洛魁人和其他印第安人的酋长职位是怎样继承的。一切职位多数场合都是在氏族内部选举的，因而是在氏族范围内世袭的。在递补遗缺时，最亲近的同氏族亲属一兄弟，或姊妹的儿子，逐渐享有了优先权，除非有理由摈弃他。因此，如果说在希腊人中间，在父权制统治之下，巴赛勒斯的职位通常是传给儿子或儿子中的一个，那末这仅仅证明，儿子们在这里可能指望通过人民选举而获得继承权，但决不是说不经过人民选举就承认继承合法。在这种情况下，我们在易洛魁人和希腊人中间所看到的，是氏族内部的特殊的显贵家庭的最初萌芽，而在希腊人那里，还是未来的世袭元首或君主的最初萌芽。因此，可以推想希腊人的巴赛勒斯，正像罗马的“王”（勒克斯）一样，必须是或者由人民选举的，或者为人民的公认的机关一议事会或人民大会一所认可的"},{"id":"h-functions","label":"h-functions","lineStart":813,"lineEnd":813,"text":"巴赛勒斯除军事的权限以外，还有祭祀的和审判的权限；审判的权限没有详细规定，但祭祀的权限是他作为部落或部落联盟的最高代表而被赋与的。关于民政、行政的权限从来没有提到过；但是巴赛勒斯由于职位的关系大概也是议事会的成员。这样，把巴赛勒斯”一词译成德语的《K oing》在语源上是完全正确的，因为《K onig》"},{"id":"h-limited","label":"h-limited","lineStart":820,"lineEnd":820,"text":"过，古希腊文的“巴赛勒斯”跟现代意义的《巛onig》(国王)一词是完全不相符合的。修昔的底斯把古代的basileia很确定地叫做patrik色，即由氏族产生的意思，并说，basileia有明确规定的、因而是有限的权限。12亚里士多德也说，英雄时代的basileia是对自由人的统率，巴赛勒斯是军事首长、法官和最高祭司3；可见，巴赛勒斯并未握有后世所谓的统治权力。①"},{"id":"h-unravel","label":"h-unravel","lineStart":821,"lineEnd":821,"text":"这样，我们看到，在英雄时代的希腊社会制度中，古代的氏族组织还是很有活力的，不过我们也看到，它的瓦解已经开始：由子女继承财产的父权制，促进了财产积累于家庭中，并且使家庭变成一种与氏族对立的力量；财产的差别，通过世袭显贵和王权的最初萌芽的形成，对社会制度发生反作用：奴隶制起初虽然仅限于俘虏，但已经开辟了奴役同部落人甚至同氏族人的前景；古代部落对部落的战争，已经开始蜕变为在陆上和海上为攫夺家畜、奴隶和财宝而不断进行的抢劫，变为一种正常的营生，一句话，财富被当作最高福利而受到赞美和崇敬，古代氏族制度被滥用来替暴力掠夺财富的行为辩护。所缺少的只是一件东西，即这样一个机关，它不仅可以保障单个人新获得的财富不受氏族制度的共产制传统的侵犯，不仅可以使以前被轻视的私有财产神圣化，并宣布这种神圣化是整个人类社会的最高目的，而且还会给相继发展"},{"id":"h-class","label":"h-class","lineStart":828,"lineEnd":828,"text":"起来的获得财产的新形式，因而是给不断加速的财富积累，盖上社会普通承认的印章；所缺少的只是这样一个机关，它不仅可以使正在开始的社会划分为阶级的现象永久化，而且可以使有产阶级剥削无产者的权利以及前者对后者的统治永久化。"},{"id":"h-state","label":"h-state","lineStart":829,"lineEnd":829,"text":"而这样的机关也就出现了。国家被发明出来了。"}]}</script></body></html>
