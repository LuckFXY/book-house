tribe-council"},{"kind":"ocr","label":"看 OCR 原书 · g-tribe-council","href":"./source.html#book=family-origin&from=665&to=665&ref=origin-03.html%23excerpt-g-tribe-council"}],"o-origin-03-002":[{"kind":"excerpt","label":"g-state","href":"./origin-03.html#excerpt-g-state"},{"kind":"ocr","label":"看 OCR 原书 · g-state","href":"./source.html#book=family-origin&from=698&to=698&ref=origin-03.html%23excerpt-g-state"},{"kind":"excerpt","label":"g-communal","href":"./origin-03.html#excerpt-g-communal"},{"kind":"ocr","label":"看 OCR 原书 · g-communal","href":"./source.html#book=family-origin&from=705&to=705&ref=origin-03.html%23excerpt-g-communal"},{"kind":"excerpt","label":"g-limits","href":"./origin-03.html#excerpt-g-limits"},{"kind":"ocr","label":"看 OCR 原书 · g-limits","href":"./source.html#book=family-origin&from=715&to=715&ref=origin-03.html%23excerpt-g-limits"},{"kind":"excerpt","label":"g-break","href":"./origin-03.html#excerpt-g-break"},{"kind":"ocr","label":"看 OCR 原书 · g-break","href":"./source.html#book=family-origin&from=720&to=720&ref=origin-03.html%23excerpt-g-break"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-03","title":"第三章·易洛魁人的氏族","output":"origin-03.html"},"excerpts":[{"id":"g-discovery","label":"g-discovery","lineStart":590,"lineEnd":590,"text":"氏族，直到野蛮人进入文明时代为止，甚至再往后一点（就现有资料而言），是一切野蛮人所共有的制度。"},{"id":"g-descent","label":"g-descent","lineStart":598,"lineEnd":598,"text":"我们在前面，在研究普那路亚家庭时，已经看到原始形式的氏族是怎样构成的。它所包括的成员，是一切由于普那路亚婚姻，并依照这种婚姻中必然占统治地位的观念，而构成一个确定的女祖先即氏族创立者的公认后代的人。由于在这种家庭形式下父系血统不能确定，所以只承认女系。又因为兄弟不得娶自己的姊妹为妻，只能同其他世系的妇女结婚，所以，根据母权制，同这些异族妇女所生的子女，便列在氏族以外。这样，留在血族团体内部的只有各代女儿的子孙；儿子的子孙则归入其母亲的氏族。当这种血缘亲属集团构成一个与同一部落内其他类似集团相对来说的特殊集团时，它又是什么样子呢？"},{"id":"g-election","label":"g-election","lineStart":606,"lineEnd":606,"text":"袖)。酋长必须从本氏族成员中选出，他的职位在氏族内世袭，亦即一有空缺，必须立刻重新补上；军事首领，也可以从氏族以外的人中选出，有时他的职位可以暂缺。由于易洛魁人奉行母权制，因而酋长的儿子属于别一氏族，所以从不选举前一酋长的儿子做酋长，而是往往选举他的兄弟做酋长，或者选举他的姊妹的儿子做酋长。所有的人，无论男女，都参加选举。不过选举须经其余"},{"id":"g-authority","label":"g-authority","lineStart":607,"lineEnd":607,"text":"七个氏族确认，只有在这以后，当选为酋长的人才正式就职，就职仪式则由全易洛魁联盟的总议事会举行。这样做的意义，在后面就可以看出来。酋长在氏族内部的权力，是父亲般的、纯粹道德性质的；他手里没有强制的手段。此外，由于他的职位，他也是塞讷卡部落议事会以及全体易洛魁人联盟的议事会的成员。军事首领仅仅在出征时才能发布命令。"},{"id":"g-recall","label":"g-recall","lineStart":608,"lineEnd":608,"text":"2.氏族可以任意撤换酋长和军事首领。这仍是由男女共同决定的。被撤换的人，此后便成为和其他私人一样的普通战士。此外，部落议事会也可以甚至违反氏族的意志而撤换酋长。"},{"id":"g-exogamy","label":"g-exogamy","lineStart":609,"lineEnd":609,"text":"3.氏族的任何成员都不得在氏族内部通婚。"},{"id":"g-property","label":"g-property","lineStart":615,"lineEnd":615,"text":"4.死者的财产转归其余的同氏族人所有，它必须留在氏族中。由于易洛魁人所能遗留的东西为数很少，所以他的遗产就由他最近的同氏亲属分享；男子死时，由他的同胞兄弟、姊妹以及母亲的兄弟分享；妇女死时，由她的子女和同胞姊妹而不是由她的兄弟分享。根据同一理由，夫妇不能彼此继承，子女也不得继承父亲"},{"id":"g-help","label":"g-help","lineStart":616,"lineEnd":616,"text":"5.同氏族人必须相互援助、保护，特别是在受到外族人伤害时，要帮报仇。个人依靠氏族来保护自己的安全，而且也能作到这一点：凡伤害个人的，便是伤害了整个氏族。因而，从氏族的血族关系中便产生了那为易洛魁人所绝对承认的血族复仇的义务。假使一个氏族成员被外族人杀害了，那末被害者的全氏族必须实行血族复仇。起初是试行调解；行凶者的氏族议事会开会，大抵用道歉与赠送厚礼的方式，向被害者的氏族议事会提议和平了结事件。如果提议被接受，事情就算解决了。否则，受害的氏族就指定一个或几个复仇者，他们的义务就是去寻出行凶者，把他杀死。如果这样做了，行凶者的氏族也没有诉怨的权利，事情就算了结了。"},{"id":"g-adopt","label":"g-adopt","lineStart":623,"lineEnd":623,"text":"的成员。这样，未杀死的俘虏，由于被一个氏族收养入族，就成为塞讷卡部落的成员，从而获得了氏族和部落的一切权利。收养外人入族的事情，是根据氏族的个别成员的提议而实行的：男子可以提议收养外人为兄弟或姊妹；女子可以提议收养外人为自己的孩子；为了确认这种收养，必须举行入族典礼。某些因特殊情形而人丁不旺的氏族，常常由于大批收养别一氏族（得到它的同意）的人入族而重新兴旺起来。在易洛魁人中间，入族典礼是在部落议事会的公共集会上举行的，实际上已经把它变为一种宗教仪式。"},{"id":"g-names","label":"g-names","lineStart":617,"lineEnd":617,"text":"6.氏族有一定的名称或一套名称，在全部落内只有该氏族才能使用这些名称，因此，氏族个别成员的名字，也就表明了他属于哪一氏族。氏族的名称一开始就同氏族的权利密切联系在一起。"},{"id":"g-religion","label":"g-religion","lineStart":624,"lineEnd":624,"text":"8.印第安人的氏族有无特殊的宗教节日，很难确定；不过印第安人的宗教仪式多少都是和氏族联系在一起的。在易洛魁人的每年六个宗教节日期间，各个氏族的酋长和军事首领，由于他们的职位，都被列在“信仰守护人”以内，而执行祭司的职能。"},{"id":"g-cemetery","label":"g-cemetery","lineStart":625,"lineEnd":625,"text":"9.氏族有着共同的墓地。纽约州境内四周都为白种人包围的易洛魁人，他们的墓地现在已经绝迹了，但从前是存在过的。在其他印第安人中间，这种墓地还保存着；例如，和易洛魁人有近亲关系的吐斯卡罗腊人，他们虽然是基督徒，但在墓地上，每一氏族都独成一排，所以，总是把母亲而不是把父亲和孩子埋在一排。而在易洛魁人中间，死者的全氏族都要参加葬仪，安排坟墓，宣读悼词等等。"},{"id":"g-council","label":"g-council","lineStart":626,"lineEnd":626,"text":"10.氏族有议事会，它是氏族的一切成年男女享有平等表决权的民主集会。这种议事会选举、撤换酋长和军事首领，以及其余的“信仰守护人”；它作出为被杀害的氏族成员接受赎金"},{"id":"g-phratry","label":"g-phratry","lineStart":635,"lineEnd":635,"text":"在许多有五六个以上氏族的印第安人部落中间，我们可以遇到一种特殊的集团，每个集团有三、四个或更多的氏族；摩尔根用希腊语确切地表达了印第安语的名称，把这种集团叫做“夫拉特里”（胞族）。例如，塞讷卡部落有两个胞族；第一个胞族包括1一4四个氏族，第二个胞族包括5一8四个氏族。更详细地研究起来便可发现，这种胞族大抵是当初由部落分裂成的最初的氏族：因为在氏族内部禁止通婚的情况下，每个部落必须至少包括两个氏族才能独立存在。随着部落的增殖，每个氏族又分裂成两个或两个以上的氏族，这些氏族如今也作为单个的氏族而存在；而包括"},{"id":"g-phratry-change","label":"g-phratry-change","lineStart":636,"lineEnd":636,"text":"一切女儿氏族的最初的氏族，则作为胞族而继续存在。在塞讷卡人和大多数其他印第安人中间，一个胞族内的各氏族被认为是兄弟氏族，而别个胞族的各氏族则被认为是它们的从兄弟氏族，一这种称呼，在美洲亲属制度中，像我们在前边所看到的，都具有极现实而明确的意义。塞讷卡人起初也不能在胞族内通婚，但是这种习俗久已废除了，如今只限于氏族。塞讷卡部落有一种传说，“熊”和“鹿”两个氏族是最初的氏族，其他氏族都是从这"},{"id":"g-tribe","label":"g-tribe","lineStart":649,"lineEnd":649,"text":"正如几个氏族组成一个胞族一样，几个胞族就古典形式来说则组成一个部落；而那些大大衰微的部落则往往没有胞族这种中间环节。那末，美洲印第安人部落有什么特征呢？"},{"id":"g-tribe-council","label":"g-tribe-council","lineStart":665,"lineEnd":665,"text":"6.有讨论公共事务的部落议事会。它是由各个氏族的酋长和军事首领组成的一这些人是氏族的真正代表，因为他们是随时都可以撤换的；议事会公开开会，四周围着部落的其余成员，这些成员有权加入讨论和发表自己的意见；决议则由议事会作出。按照通例，每个出席的人都可以随意发表意见，妇女也可以通过她们所选定的发言人陈述自己的意见。在易洛魁人中间，最后的决"},{"id":"g-federation","label":"g-federation","lineStart":684,"lineEnd":684,"text":"和独立为基础，结成永世联盟。这种血缘亲属关系是联盟的真实基础。五个部落中有三个称为父亲部落，互为兄弟部落；其余两个称为儿子部落，也互为兄弟部落。有三个氏族一最老的在五个部落中都还存在着，另外有三个氏族在三个部落中都还存在着；这些氏族中的每一个氏族，其成员在所有五个部落中都被认为是兄弟。仅在方言上有差异的共同语言，便是共同世系的表现和证明。"},{"id":"g-unanimity","label":"g-unanimity","lineStart":688,"lineEnd":688,"text":"5.联盟议事会的一切决议，须经全体一致通过。"},{"id":"g-public","label":"g-public","lineStart":691,"lineEnd":691,"text":"8.会议在聚集起来的民众面前公开举行，每个易洛魁人都可以发言；但只有议事会才能作决定。"},{"id":"g-no-executive","label":"g-no-executive","lineStart":692,"lineEnd":692,"text":"9.联盟没有一长制首长，即没有主掌执行权的首脑。"},{"id":"g-state","label":"g-state","lineStart":698,"lineEnd":698,"text":"国家是以一种与全体经常有关的成员相脱离的特殊的公共权力为前提的，所以毛勒凭其正确的直觉，确认德意志的马尔克制度是一种纯粹社会的制度，虽然它以后大部分成了国家的基础，但在本质上它是和国家不同的。"},{"id":"g-communal","label":"g-communal","lineStart":705,"lineEnd":705,"text":"虽然当时的公共事务比今日更多，一家庭经济都是由若干个家庭按照共产制共同经营的，土地乃是全部落的财产，仅有小小的园圃归家庭经济暂时使用，一可是，丝毫没有今日这样臃肿复杂的管理机关。"},{"id":"g-limits","label":"g-limits","lineStart":715,"lineEnd":715,"text":"这是一个方面。但我们不要忘记，这种组织是注定要灭亡的。它没有超出部落的范围；如我们在后面将要看到的，部落联盟的建立就已经意味着这种组织开始崩溃，易洛魁人征服其他部落的企图也表明了这一点。凡是部落以外的，便是不受法律保护的。在没有明确的和平条约的地方，部落与部落之间便存在着战争，而且这种战争进行得很残酷，使别的动物无法和人类相比，只是到后来，才因物质利益的影响而稍微缓和一些。全盛时期的氏族制度，如我们在美洲所见的，其前提是生产极不发达，因此广大地区内人口极度稀少；因此，人类差不多完全受着陌生的、对立的、不可理解的外部大自然的支配，这也就反映在幼稚的宗教观念中。部落始终是人们的界限，无论对别一部落的人来说或者对他们自己来说都是如此：部落、氏族及其制度，都是神圣而不可侵犯的，"},{"id":"g-break","label":"g-break","lineStart":720,"lineEnd":720,"text":"都是自然所赋予的最高权力，个人在感情、思想和行动上始终是无条件服从的。这个时代的人们，不管在我们看来多么值得赞叹，但他们彼此并没有什么差别，用马克思的话说，他们还没有脱掉自然发生的共同体的脐带①。这种自然发生的共同体的权力一定要被打破，而且也确实被打破了。不过它是被那种在我们看来简直是一种堕落，一种离开古代氏族社会的纯朴道德高峰的堕落的势力所打破的。最卑下的利益一庸俗的贪欲、粗暴的情欲、卑下的物欲、对公共财产的自私自利的掠夺一揭开了新的、文明的阶级社会；最卑鄙的手段一偷窃、暴力、欺诈、背信—毁坏了古老的没有阶级的氏族制度，把它引向崩溃。而这一新社会自身，在其整整两千五百余年的存在期间，只不过是一幅区区少数人靠牺牲被剥削和被压迫的绝大多数人的利益而求得发展的图画罢了，而这种情形，现在比从前更加厉害了。"}]}</script></body></html>
