免断定超出调查能力"],"answerIndex":2,"explanation":"本讲要求判断恰当而有根据；既不抹去已经查明的事实，也不补写尚未查明的细节。","whyWrong":["把一般经验当作本次持续时长的证据。","把已经确证的降雨退回为仅有迹象。","正确","对已确定事实作不必要的弱化。"],"basis":{"paras":[],"excerptIds":["e-rain","e-adequate","e-research","e-expression","e-limit"],"anchors":[]},"knowledge":["adequacy"]},{"id":"q-logic-04-006","type":"定义判断","difficulty":2,"stem":"设例：以下哪一句在给定语境中明确表达判断？","options":["希望这份材料能尽快得到核实","这份材料尚未经过调查组核实","请把待核实的材料交给调查组","这份材料究竟是否经过核实"],"answerIndex":1,"explanation":"本讲认为判断要有所断定，陈述材料尚未核实明确肯定一种状态。","whyWrong":["愿望本身未断定愿望已经实现。","正确","请求本身未断定材料的核实状态。","疑问本身未选择肯定或否定。"],"basis":{"paras":[],"excerptIds":["e-notall","e-meaning","e-language","e-rhetoric"],"anchors":[]},"knowledge":["sentence"]},{"id":"q-logic-04-007","type":"常识判断","difficulty":2,"stem":"关于真判断与恰当表达，下列说法不正确的是","options":["具体程度应受实际掌握的事实条件限制","表达越具体就越能保证判断符合实际","提高表达精度需要相应调查材料作支持","符合事实的判断仍可能表达得不够具体"],"answerIndex":1,"explanation":"本讲区分符合事实与充分恰当地反映事实；无根据的细节会损害真实性。","whyWrong":["证据限制精度，此说符合本讲。","正确","调查支持准确表达，此说符合本讲。","真判断可以笼统，此说符合本讲。"],"basis":{"paras":[],"excerptIds":["e-truth","e-truefalse","e-research","e-rain","e-adequate","e-expression","e-limit"],"anchors":[]},"knowledge":["truth","adequacy"]},{"id":"q-logic-04-008","type":"逻辑判断","difficulty":3,"stem":"设例：“没有一份已登记材料遗失”和“已登记材料全部未遗失”指同一批材料。下列分析正确的是","options":["二者表达同一断定，不能按字面数成两种意见","第一句只否定一份遗失，第二句才否定全部遗失","第一句否定全部遗失，第二句允许少数遗失","第一句是部分未遗失，第二句才是全部未遗失"],"answerIndex":0,"explanation":"本讲要求依据实际含义识别判断；改换表达并未改变对同一范围的断定。","whyWrong":["正确","没有一份是全称排除，不只涉及一个特定对象。","全部未遗失不允许例外。","把没有一份遗失误作特称否定。"],"basis":{"paras":[],"excerptIds":["e-notall","e-meaning","e-language","e-rhetoric","e-form","e-next"],"anchors":[]},"knowledge":["sentence","form"]},{"id":"q-logic-04-009","type":"常识判断","difficulty":2,"stem":"依据本讲，错误判断与没有表达判断的语句有何区别？","options":["前者有所断定但不符事实，后者未作相应断定","前者未完成判断，后者表达尚待证实的判断","前者只是缺少根据，后者已有根据而未表达","前者只是否定判断，后者只是未说出的肯定判断"],"answerIndex":0,"explanation":"本讲认为有无判断取决于有无断定，真假则取决于断定是否符合实际。","whyWrong":["正确","错误判断仍有所断定，后者未必有断定。","错误是不符事实，不能仅等同证据不足。","真假与肯定否定、有 logic-04.html%23excerpt-e-rain"},{"kind":"excerpt","label":"恰当判断的双重要求","href":"./logic-04.html#excerpt-e-adequate"},{"kind":"ocr","label":"看 OCR 原书 · 恰当判断的双重要求","href":"./source.html#book=formal-logic-1976&from=561&to=561&ref=logic-04.html%23excerpt-e-adequate"},{"kind":"excerpt","label":"判断需要调查研究","href":"./logic-04.html#excerpt-e-research"},{"kind":"ocr","label":"看 OCR 原书 · 判断需要调查研究","href":"./source.html#book=formal-logic-1976&from=572&to=572&ref=logic-04.html%23excerpt-e-research"},{"kind":"excerpt","label":"表达要避免含混","href":"./logic-04.html#excerpt-e-expression"},{"kind":"ocr","label":"看 OCR 原书 · 表达要避免含混","href":"./source.html#book=formal-logic-1976&from=573&to=573&ref=logic-04.html%23excerpt-e-expression"},{"kind":"excerpt","label":"形式逻辑的边界","href":"./logic-04.html#excerpt-e-limit"},{"kind":"ocr","label":"看 OCR 原书 · 形式逻辑的边界","href":"./source.html#book=formal-logic-1976&from=574&to=574&ref=logic-04.html%23excerpt-e-limit"},{"kind":"excerpt","label":"真假以是否符合实际为准","href":"./logic-04.html#excerpt-e-truth"},{"kind":"ocr","label":"看 OCR 原书 · 真假以是否符合实际为准","href":"./source.html#book=formal-logic-1976&from=484&to=484&ref=logic-04.html%23excerpt-e-truth"},{"kind":"excerpt","label":"判断有真假之分","href":"./logic-04.html#excerpt-e-truefalse"},{"kind":"ocr","label":"看 OCR 原书 · 判断有真假之分","href":"./source.html#book=formal-logic-1976&from=490&to=490&ref=logic-04.html%23excerpt-e-truefalse"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-04","title":"第四讲·判断要恰当","output":"logic-04.html"},"excerpts":[{"id":"e-judgment","label":"判断的界定","lineStart":467,"lineEnd":467,"text":"判断就是对事物有所肯定或否定的思维形式。"},{"id":"e-function","label":"判断的作用","lineStart":477,"lineEnd":477,"text":"判断是用来反映和断定事物情况的。"},{"id":"e-truth","label":"真假以是否符合实际为准","lineStart":484,"lineEnd":484,"text":"知果如实地反映了客观事物情况，它就是真实的，否则就是虚假的。"},{"id":"e-truefalse","label":"判断有真假之分","lineStart":490,"lineEnd":490,"text":"一个判断或者是真的，或者是假的，这是判断的一个重要的特征。"},{"id":"e-sentence","label":"句子与判断的关系","lineStart":499,"lineEnd":499,"text":"语言表现形式，判断是句子的思想内容。"},{"id":"e-notall","label":"并非所有句子都是判断","lineStart":501,"lineEnd":501,"text":"判断都是用句子表达的，可是并不是所有的句子都表达判断。"},{"id":"e-meaning","label":"按含意识别判断","lineStart":501,"lineEnd":501,"text":"一个句子是否表达判断，要看它的含意，看它是否包含对事物的断定，以及是否可以说它是真的或假的。"},{"id":"e-language","label":"不同句子表达同一判断","lineStart":506,"lineEnd":506,"text":"同一个判断可以用不同的语句来表达。"},{"id":"e-rhetoric","label":"反问句可能表达判断","lineStart":510,"lineEnd":510,"text":"第一个句子叫反诘（反问、责难）句它也表达判断。"},{"id":"e-form","label":"判断形式","lineStart":543,"lineEnd":543,"text":"判断的形式就是判断中所包含的最一般的共同点，相对于具体内容来说，它是形式。"},{"id":"e-rain","label":"真实还可能不够确切","lineStart":560,"lineEnd":560,"text":"有时一个真的判断，却还可能比较笼统，不够确切严密。"},{"id":"e-adequate","label":"恰当判断的双重要求","lineStart":561,"lineEnd":561,"text":"判断恰当主要要求判断真实，也要求判断确切严密。"},{"id":"e-research","label":"判断需要调查研究","lineStart":572,"lineEnd":572,"text":"判断的形成过程，就是调查和研究的过程。"},{"id":"e-expression","label":"表达要避免含混","lineStart":573,"lineEnd":573,"text":"要学会通过句子的含意来分析它们所表现的判断形式，运用句子下判断时尽可能避免含混不清。"},{"id":"e-limit","label":"形式逻辑的边界","lineStart":574,"lineEnd":574,"text":"形式逻辑不能解决所有这些问题，它只能提供关于判断的逻辑理论，指出判断洽当从逻辑上需要注意的一些问题。"},{"id":"e-next","label":"下一步研究判断类型","lineStart":591,"lineEnd":591,"text":"通过具体研究各种判断形式，了解判断的各种类型及其特点，就能够帮助我们选用恰当的判断形式来反映事物的情况，作出恰当的判断。"}]}</script></body></html>
