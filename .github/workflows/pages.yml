name: Publish book house
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for file in index.html practice.html origin-09.html app.js styles.css; do
            curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${SITE_URL%/}/$file" -o "$RUNNER_TEMP/live-$file"
            cmp "$file" "$RUNNER_TEMP/live-$file"
          done
