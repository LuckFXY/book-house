</main><script id="questions-data" type="application/json">{"bank":{"version":1,"unitId":"logic-09","label":"仿公考题型 · 原创练习","questions":[{"id":"q-logic-09-001","type":"逻辑判断","difficulty":2,"stem":"设例：名册固定且没有漏项，逐一核实其中全部人员在当天已登记。可以据此确定的是","options":["凡采用此名册形式的单位都能完成全部登记","名册中全部人员在核查当日均已完成登记","所有将来加入的人员都会在当天完成登记","名册之外的同类人员也必定完成了登记"],"answerIndex":1,"explanation":"本讲将完全归纳的可靠性建立在穷尽所论对象的基础上；结论不能超出已确定的对象和时间范围。","whyWrong":["由一组事实推广为其他单位规律。","正确","把固定范围推广到未来新增对象。","把未核查对象包含进结论。"],"basis":{"paras":[],"excerptIds":["e-induction","e-complete","e-allobjects"],"anchors":[]},"knowledge":["complete"]},{"id":"q-logic-09-002","type":"逻辑判断","difficulty":2,"stem":"设例：某人声称已用完全归纳证明全部设备合格。哪项信息最直接破坏这一声称？","options":["设备来源不同但都按相同标准受检","其中一台设备被重复核查两次","待评估范围内另有设备尚未纳入清单","核查采用统一标准并逐台记录结果"],"answerIndex":2,"explanation":"本讲要求完全归纳包括被论及的全部对象；存在遗漏便不能以完全归纳担保全称结论。","whyWrong":["来源差异不破坏全部核查。","重复本身不说明有遗漏。","正确","这有利于核查一致性。"],"basis":{"paras":[],"excerptIds":["e-induction","e-complete","e-allobjects"],"anchors":[]},"knowledge":["complete"]},{"id":"q-logic-09-003","type":"逻辑判断","difficulty":3,"stem":"设例：某组在同一窗口重复观察多次，均见办结顺利，便推广为各类窗口都如此。最有针对性的改进是","options":["让更多人员独立观察原窗口的同一类业务","扩大到不同业务和时段的窗口观察","继续在原窗口增加相同时段的观察次数","把原窗口的全部业务都核实后直接推广全部窗口"],"answerIndex":1,"explanation":"本讲强调简单枚举归纳既要注意数量，也要注意对象和条件的多样性；重复同类不能替代代表范围。","whyWrong":["独立观察可核实记录，但未扩展条件多样性。","正确","次数增加不补足业务和时段偏窄。","穷尽一窗口不等于穷尽不同窗口条件。"],"basis":{"paras":[],"excerptIds":["e-enumeration","e-enumlimit","e-variety","e-hasty"],"anchors":[]},"knowledge":["enumeration"]},{"id":"q-logic-09-004","type":"逻辑判断","difficulty":2,"stem":"设例：报告由若干顺利案例推出“所有试点均顺利”。后来发现一个确实不顺利的试点。必能确定的是","options":["原结论仍可作为全称判断，因为成功案例更多","原结论只能改为全部试点都不顺利","原结论暂时保留，只需把反例排除出推广对象","原来的全称结论已被反例否定"],"answerIndex":3,"explanation":"本讲指出简单枚举的全称推广可能被新反例推翻；反例否定全称而非抹去已有个别事实。","whyWrong":["反例不能被更多正例抵消。","否定全称肯定不等于全称否定。","事后排除反例改变了原全称范围，不能保留原命题。","正确"],"basis":{"paras":[],"excerptIds":["e-enumeration","e-enumlimit","e-variety","e-hasty","e-connection","e-mechanical","e-analogylimit"],"anchors":[]},"knowledge":["enumeration","strength"]},{"id":"q-logic-09-005","type":"逻辑判断","difficulty":3,"stem":"设例：三个发生系统卡顿的站点都开启同一插件，据此怀疑插件致卡。哪项最能削弱这一因果怀疑？","options":["三个发生卡顿的站点在启用插件前运行都较稳定","三个站点关闭该插件以后卡顿现象均有所减少","未开启该插件的同类站点也在同期出现相近卡顿","三个站点所用其他插件和操作人员并不相同"],"answerIndex":2,"explanation":"本讲用求同思路寻找共同因素时仍须审查其他原因；无插件的同类站点也卡顿，削弱其作为关键共同原因的解释力，但不逻辑排除插件影响。","whyWrong":["前后变化反而支持插件可能相关。","关闭后改善支持插件影响。","正确","排除其他共同因素不直接削弱插件解释。"],"basis":{"paras":[],"excerptIds":["e-causal","e-agreement","e-superficial"],"anchors":[]},"knowledge":["agreement"]},{"id":"q-logic-09-006","type":"逻辑判断","difficulty":3,"stem":"设例：甲窗口调整流程后办结更快，但同时增加了人员。若要判断提速是否源于流程，最需补充哪项？","options":["其他条件相近且人员不增时调整流程的效果","增加人员且同时调整流程的其他窗口是否也提速","在人员更少且流程未变的窗口是否存在办结较慢","人员与流程都不变的同一窗口前后速度是否相同"],"answerIndex":0,"explanation":"本讲要求求异比较尽量排除其他差异；人员增加是同时变化的混杂因素。","whyWrong":["正确","重复相同组合仍无法分离流程作用。","两因素仍同时变化，不如控制人员后考察流程有力。","基线稳定有帮助，但没有直接隔离流程调整的作用。"],"basis":{"paras":[],"excerptIds":["e-difference","e-confounding","e-causal"],"anchors":[]},"knowledge":["difference"]},{"id":"q-logic-09-007","type":"逻辑判断","difficulty":3,"stem":"设例：两组条件相近，仅一组启用新分流方式，该组排队缩短而另一组未变。哪项最加强分流起作用的判断？","options":["启用组在不同日期重复采用新方式，结果均有改善","启用组参考过类似站点，而这些站点也曾排队缩短","两组在观察期间客流和人员配置也相近","另一组也认为新方式适用，准备在未来跟进试行"],"answerIndex":2,"explanation":"本讲将其他相关条件的可比性作为求异法的重要保障；客流和人员相近排除了竞争解释。","whyWrong":["重复现象有价值，但未直接排除客流或人员的竞争解释。","类比经验不直接保证本次两组可比。","正确","实施意愿不是排除当前竞争解释的事实。"],"basis":{"paras":[],"excerptIds":["e-difference","e-confounding","e-causal"],"anchors":[]},"knowledge":["difference"]},{"id":"q-logic-09-008","type":"逻辑判断","difficulty":3,"stem":"设例：甲窗口预约有效，乙希望照用。哪项相似最能支持这一类比？","options":["两窗口都设预约岗位，且都有人负责审核预约信息","两窗口业务耗时分布和到访需求相近","两窗口办事流程的环节数量相同，但各环节耗时未查","两窗口采用相同培训办法，且人员均熟悉现行流程"],"answerIndex":1,"explanation":"本讲要求考察相似点与待推性质的联系；业务与需求直接影响预约分流效果，比表面相似更相关。","whyWrong":["有相似岗位未必具有相近负荷及需求结构。","正确","表面环节数量相同不如耗时与需求直接影响分流。","人员培训相似不能充分说明预约机制面对的需求相同。"],"basis":{"paras":[],"excerptIds":["e-analogy","e-special","e-analogylimit"],"anchors":[]},"knowledge":["analogy"]},{"id":"q-logic-09-009","type":"逻辑判断","difficulty":3,"stem":"设例：两站点多处相似，甲站可用线上预约替代现场排队。哪项最削弱乙也可完全替代的推测？","options":["乙站主要服务对象难以使用线上预约","乙站也采用了与甲站相同的服务分类","乙站目前也面临高峰时段排队问题","乙站工作人员曾接受同类业务培训"],"answerIndex":0,"explanation":"本讲提醒类比注意对结论有关键意义的差异；使用渠道的条件不同会破坏完全替代的机制。","whyWrong":["正确","增加相关相似性而非削弱。","同有排队需求不反对预约适用。","培训相似没有指出关键差异。"],"basis":{"paras":[],"excerptIds":["e-analogy","e-special","e-analogylimit","e-connection","e-mechanical","e-enumlimit"],"anchors":[]},"knowledge":["analogy","strength"]},{"id":"q-logic-09-010","type":"常识判断","difficulty":2,"stem":"关于求同与求异的运用，下列说法最符合本讲的是","options":["只要结果发生在措施之后，就能排除相反因果方向","两情形只有一项记录差别，就不必核对未记录的条件","共同因素先于结果出现，就足以把它确定为唯一原因","需辨明因素与结果的联系，并检查其他相关条件"],"answerIndex":3,"explanation":"本讲把求因方法与实际联系的研究结合，不主张仅凭表面共现机械定因。","whyWrong":["时间先后仍不能排除共同原因或偶合。","记录只有一项差别不保证真实条件只有一项差别。","先后与共现不足以确定唯一原因。","正确"],"basis":{"paras":[],"excerptIds":["e-causal","e-agreement","e-superficial","e-difference","e-confounding"],"anchors":[]},"knowledge":["agreement","difference"]},{"id":"q-logic-09-011","type":"类比推理","difficulty":2,"stem":"全部核查∶完全归纳","options":["部分列举∶简单枚举","一般规则∶个别应用","相关相似∶性质类比","共同因素∶求同方法"],"answerIndex":0,"explanation":"本讲按对象覆盖范围辨别归纳方式；题干穷尽对象对应完全归纳，正确项从未穷尽的部分列举对应简单枚举。","whyWrong":["正确","同属根据与方法，但改变为演绎方向。","同属根据与方法，但并非按总体覆盖范围划分的归纳。","同属根据与方法，但关注因果比较而非对象覆盖程度。"],"basis":{"paras":[],"excerptIds":["e-induction","e-complete","e-allobjects","e-enumeration","e-enumlimit","e-variety","e-hasty"],"anchors":[]},"knowledge":["complete","enumeration"]},{"id":"q-logic-09-012","type":"逻辑判断","difficulty":2,"stem":"设例：只观察部分对象且未发现反例。哪种结论表达最恰当？","options":["已经排除任何反例，因此可断定无条件成立","现有观察支持这一趋势，仍需扩大核查范围","只需重复同一批观察，即可成为完全归纳","没有核查全部对象，因此现有观察毫无价值"],"answerIndex":1,"explanation":"本讲承认不完全归纳的认识作用，同时提醒结论超出已观察范围会留下不确定性。","whyWrong":["未发现不是证明不存在。","正确","重复不会扩大对象覆盖范围。","不确定不等于没有信息价值。"],"basis":{"paras":[],"excerptIds":["e-enumeration","e-enumlimit","e-variety","e-hasty"],"anchors":[]},"knowledge":["enumeration"]},{"id":"q-logic-09-013","type":"逻辑判断","difficulty":3,"stem":"设例：甲据十项表面相似主张两地措施效果相同，乙据一项关键机制差异质疑。最合适的评价是","options":["只要存在一项真实差异，就应否定对其他性质的类推","优先按相似项与差异项的数量，比较两者证据强弱","只要多个相似点已经核实，就可先排除单项差异影响","应比较这些相似与差异同预期效果的关联程度"],"answerIndex":3,"explanation":"本讲反对机械计算相似点；相关性和关键差异比单纯数量更能决定类比强度。","whyWrong":["不相关的差异未必削弱类比。","数量多不等于与效果更相关。","单项关键差异可能胜过多个表面相似点。","正确"],"basis":{"paras":[],"excerptIds":["e-connection","e-mechanical","e-analogylimit","e-enumlimit","e-analogy","e-special"],"anchors":[]},"knowledge":["strength","analogy"]},{"id":"q-logic-09-014","type":"逻辑判断","difficulty":3,"stem":"设例：发生延误的几个站点都采用流程甲，也都使用同一故障系统。要把延误主要归于流程甲，最需处理哪一问题？","options":["同一流程在不同站点引起延误的程度是否完全相同","这些站点是否都多次重复观察到流程与延误相伴","流程甲是否还与办理事项的其他共同特点相联系","系统故障是否足以解释这些共同延误"],"answerIndex":3,"explanation":"本讲在求同中要求进一步辨明共同因素；并存的共同系统故障是必须比较的竞争性解释。","whyWrong":["程度不同可由其他条件调节，不能先排除共同系统原因。","重复同一混杂组合不能分开流程与故障系统的作用。","可能相关，但不如直接审查题设已有竞争原因切中问题。","正确"],"basis":{"paras":[],"excerptIds":["e-causal","e-agreement","e-superficial"],"anchors":[]},"knowledge":["agreement"]},{"id":"q-logic-09-015","type":"逻辑判断","difficulty":3,"stem":"设例：试点改变流程时同时更换系统，效率提高。负责人说“无论如何，至少证明流程单独有效”。该推断的问题是","options":["效率确实提高，所以系统变化最多只是次要的影响","只需再观察一次相同组合，即可分离流程单独作用","多因素同时变化，尚不能分离流程调整的单独作用","观察已经证实调整组合有效，故组合内每项都有效"],"answerIndex":2,"explanation":"本讲要求求异时控制差异；多项改变同时发生，不能单独归因于其中一项。","whyWrong":["结果改善不决定系统与流程贡献的主次。","重复组合不分离各因素的贡献。","正确","组合效果不能分配给每个单独措施。"],"basis":{"paras":[],"excerptIds":["e-difference","e-confounding","e-causal","e-connection","e-mechanical","e-analogylimit","e-enumlimit"],"anchors":[]},"knowledge":["difference","strength"]}],"open":[{"id":"o-logic-09-001","type":"论证分析","material":{"text":"设例：某组连续观察同一站点多个上午，发现采用预约后排队减少，便建议所有站点全天只采用预约。观察期间该站还增加了工作人员。","sourceIds":[]},"prompt":"分析推广结论的证据缺口，并提出补充调查与比较的方案。（150—220字）","points":["样本局限于一站点和上午，不能直接推广到所有站点全部时段。","预约与增员同时变化，效果尚不能单独归于预约。","选择不同业务、客流和时段观察，查找可能反例。","设置其他条件可比而预约措施不同的比较，核查因果机制。","依据结果限定推广范围，保留不适用对象的替代渠道。"],"basis":{"paras":[],"excerptIds":["e-enumeration","e-enumlimit","e-variety","e-hasty","e-difference","e-confounding","e-causal","e-connection","e-mechanical","e-analogylimit"],"anchors":[]}},{"id":"o-logic-09-002","type":"论证分析","material":{"text":"设例：甲乙两站点面积、人员称谓和表格格式相近。甲站线上预约效果较好，乙站便决定照搬。调查显示两站点的办理事项和服务对象使用线上渠道的能力不同。","sourceIds":[]},"prompt":"评价这项类比的强弱，并给出使迁移判断更可靠的办法。（150—220字）","points":["表面相似不能直接担保预约效果相同。","业务特性与线上使用能力可能直接影响预约机制，属于重要差异。","应优先比较办理耗时、需求分布、渠道可达性等相关条件。","可在限定范围试行并保留现场服务，观察效果后修正规则。"],"basis":{"paras":[],"excerptIds":["e-analogy","e-special","e-analogylimit","e-connection","e-mechanical","e-enumlimit"],"anchors":[]}}]},"materials":[],"knowledge":[{"id":"complete","title":"完全归纳"},{"id":"enumeration","title":"简单枚举"},{"id":"agreement","title":"求同法"},{"id":"difference","title":"求异法"},{"id":"analogy","title":"类比推理"},{"id":"strength","title":"检查联系强度"}],"links":{"q-logic-09-001":[{"kind":"excerpt","label":"归纳的方向","href":"./logic-09.html#excerpt-e-induction"},{"kind":"ocr","label":"看 OCR 原书 · 归纳的方向","href":"./source.html#book=formal-logic-1976&from=1370&to=1370&ref=logic-09.html%23excerpt-e-induction"},{"kind":"excerpt","label":"完全归纳","href":"./logic-09.html#excerpt-e-complete"},{"kind":"ocr","label":"看 OCR 原书 · 完全归纳","href":"./source.html#book=formal-logic-1976&from=1388&to=1388&ref=logic-09.html%23excerpt-e-complete"},{"kind":"excerpt","label":"穷尽检查的局限","href":"./logic-09.html#excerpt-e-allobjects"},{"kind":"ocr","label":"看 OCR 原书 · 穷尽检查的局限","href":"./source.html#book=formal-logic-1976&from=1405&to=1405&ref=logic-09.html%23excerpt-e-allobjects"}],"q-logic-09-002":[{"kind":"excerpt","label":"归纳的方向","href":"./logic-09.html#excerpt-e-induction"},{"kind":"ocr","label":"看 OCR 原书 · 归纳的方向","href":"./source.html#book=formal-logic-1976&from=1370&to=1370&ref=logic-09.html%23excerpt-e-induction"},{"kind":"excerpt","label":"完全归纳","href":"./logic-09.html#excerpt-e-complete"},{"kind":"ocr","label":"看 OCR 原书 · 完全归纳","href":"./source.html#book=formal-logic-1976&from=1388&to=1388&ref=logic-09.html%23excerpt-e-complete"},{"kind":"excerpt","label":"穷尽检查的局限","href":"./logic-09.html#excerpt-e-allobjects"} %23excerpt-e-causal"},{"kind":"excerpt","label":"相关联系比表面像重要","href":"./logic-09.html#excerpt-e-connection"},{"kind":"ocr","label":"看 OCR 原书 · 相关联系比表面像重要","href":"./source.html#book=formal-logic-1976&from=1525&to=1525&ref=logic-09.html%23excerpt-e-connection"},{"kind":"excerpt","label":"机械类比","href":"./logic-09.html#excerpt-e-mechanical"},{"kind":"ocr","label":"看 OCR 原书 · 机械类比","href":"./source.html#book=formal-logic-1976&from=1527&to=1527&ref=logic-09.html%23excerpt-e-mechanical"},{"kind":"excerpt","label":"类比结论需检验","href":"./logic-09.html#excerpt-e-analogylimit"},{"kind":"ocr","label":"看 OCR 原书 · 类比结论需检验","href":"./source.html#book=formal-logic-1976&from=1511&to=1511&ref=logic-09.html%23excerpt-e-analogylimit"}],"o-logic-09-002":[{"kind":"excerpt","label":"类比的形式","href":"./logic-09.html#excerpt-e-analogy"},{"kind":"ocr","label":"看 OCR 原书 · 类比的形式","href":"./source.html#book=formal-logic-1976&from=1500&to=1500&ref=logic-09.html%23excerpt-e-analogy"},{"kind":"excerpt","label":"类比的方向","href":"./logic-09.html#excerpt-e-special"},{"kind":"ocr","label":"看 OCR 原书 · 类比的方向","href":"./source.html#book=formal-logic-1976&from=1501&to=1501&ref=logic-09.html%23excerpt-e-special"},{"kind":"excerpt","label":"类比结论需检验","href":"./logic-09.html#excerpt-e-analogylimit"},{"kind":"ocr","label":"看 OCR 原书 · 类比结论需检验","href":"./source.html#book=formal-logic-1976&from=1511&to=1511&ref=logic-09.html%23excerpt-e-analogylimit"},{"kind":"excerpt","label":"相关联系比表面像重要","href":"./logic-09.html#excerpt-e-connection"},{"kind":"ocr","label":"看 OCR 原书 · 相关联系比表面像重要","href":"./source.html#book=formal-logic-1976&from=1525&to=1525&ref=logic-09.html%23excerpt-e-connection"},{"kind":"excerpt","label":"机械类比","href":"./logic-09.html#excerpt-e-mechanical"},{"kind":"ocr","label":"看 OCR 原书 · 机械类比","href":"./source.html#book=formal-logic-1976&from=1527&to=1527&ref=logic-09.html%23excerpt-e-mechanical"},{"kind":"excerpt","label":"枚举结论仍需检验","href":"./logic-09.html#excerpt-e-enumlimit"},{"kind":"ocr","label":"看 OCR 原书 · 枚举结论仍需检验","href":"./source.html#book=formal-logic-1976&from=1434&to=1434&ref=logic-09.html%23excerpt-e-enumlimit"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-09","title":"第九讲·怎样使推理有逻辑性（二）","output":"logic-09.html"},"excerpts":[{"id":"e-induction","label":"归纳的方向","lineStart":1370,"lineEnd":1370,"text":"所谓归纳推理，就是从特殊性的前提推出一般性的结论的推理，也可以说是从特殊到一般的推理。"},{"id":"e-complete","label":"完全归纳","lineStart":1388,"lineEnd":1388,"text":"完全归纳法就是由一类中的每一个对象都有某种性质，推出这一类都具有某种性质的推理方法。"},{"id":"e-allobjects","label":"穷尽检查的局限","lineStart":1405,"lineEnd":1405,"text":"当我们研究的某类对象的数目非常之多，无法一进行考察时，完全归纳法就不适用了。"},{"id":"e-enumeration","label":"简单枚举","lineStart":1422,"lineEnd":1422,"text":"简单枚举法就是由一类中的部分对象具有某种性质，并且没有遇到相反的情况，从而推出这一类所有对象都具有这种性质的推理方法。"},{"id":"e-enumlimit","label":"枚举结论仍需检验","lineStart":1434,"lineEnd":1434,"text":"这种结论不一定是确实可靠的，必须经实践检验。一且出现了相反的情况，结论就被推翻。"},{"id":"e-variety","label":"考察分布面","lineStart":1435,"lineEnd":1435,"text":"前提中列举的单个对象分布面要广。"},{"id":"e-hasty","label":"以偏概全","lineStart":1440,"lineEnd":1440,"text":"在使用简单枚举法时，如果只是根据个别事实就作出一般性的结论，并把它看作真实可靠的，就会犯“以偏概全”的逻辑错误。"},{"id":"e-causal","label":"求因果联系的初步方法","lineStart":1452,"lineEnd":1452,"text":"因果联系的初步方法，主要有求同法、求异法等。"},{"id":"e-agreement","label":"原书对求同法的表述","lineStart":1455,"lineEnd":1455,"text":"如果被研究的现象出现在各个不同的场合，而在这些场合中，其它有关情祝都不同，只有一个有关情况是共同的，那么这个共同的情况就是被研究现象存在的原因。"},{"id":"e-superficial","label":"共同点不等于表面相似","lineStart":1467,"lineEnd":1467,"text":"根据已有的知识，排除表面的相同之处，而保留主要的共同点。"},{"id":"e-difference","label":"原书对求异法的表述","lineStart":1475,"lineEnd":1475,"text":"这两个场合的其它情况是相同的，只有一个情况不同，那么这个不同的情况就是被研究现象存在的原因。"},{"id":"e-confounding","label":"排查多个差异","lineStart":1484,"lineEnd":1484,"text":"不同的情况不止一个，这就需要我们反复地进行试验和分析，以便确定主要的不同情祝是什么。"},{"id":"e-analogy","label":"类比的形式","lineStart":1500,"lineEnd":1500,"text":"类比推理是由两个（或两类）对象在某些性质上的相同，推出它们在别的性质上也相同的推理形式。"},{"id":"e-special","label":"类比的方向","lineStart":1501,"lineEnd":1501,"text":"它既不是从特殊到一般，也不是从一般到特殊，而是从特殊到特殊。"},{"id":"e-analogylimit","label":"类比结论需检验","lineStart":1511,"lineEnd":1511,"text":"类比推理的结论并不都是可靠的。必须由实践证明。"},{"id":"e-connection","label":"相关联系比表面像重要","lineStart":1525,"lineEnd":1525,"text":"类比对象的共同性质与推出性质要有必然联系。"},{"id":"e-mechanical","label":"机械类比","lineStart":1527,"lineEnd":1527,"text":"所谓机械类比，主要是指仅仅依据两个对象表面相似或偶然相似，便拿来进行类比，推出结论"}]}</script></body></html>
