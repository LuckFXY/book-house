"],"anchors":[]},"knowledge":["connection"]},{"id":"q-logic-11-005","type":"逻辑判断","difficulty":3,"stem":"设例：某组以两个成功试点证明“该流程适用于全部窗口”。哪项最能削弱这一推广？","options":["该流程的设计参考了已有成熟工作经验","其他窗口有关键业务无法满足该流程的前置条件","试点负责人认可流程并愿意继续使用","两个试点采用了同一套效果记录方法"],"answerIndex":1,"explanation":"本讲指出举例不能无条件保证全称结论；存在与适用机制有关的关键差异会破坏推广。","whyWrong":["参考经验并不直接反对推广。","正确","支持试点体验，不触及全体适用。","统一记录不揭示推广边界。"],"basis":{"paras":[],"excerptIds":["e-example","e-contrast","e-insufficient","e-follow","e-irrelevant"],"anchors":[]},"knowledge":["inductive","connection"]},{"id":"q-logic-11-006","type":"逻辑判断","difficulty":2,"stem":"设例：甲称新方法适用于所有情形。乙提供一个经确认的例外。对双方证明力最准确的评价是","options":["乙只能质疑个案记录，不能影响任何总体判断","甲只需再增加一个正例就能抵消乙的例外","乙足以否定全称论题，但不否认方法在其他场合有效","乙既已发现例外，就证明新方法在任何场合都无效"],"answerIndex":2,"explanation":"本讲区分正例与反例对全称论题的作用；一个确证反例即可否定全称，不能据此扩大否定。","whyWrong":["反例直接否定无例外的论题。","反例不能被更多正例抵消。","正确","从并非全部有效扩大到全部无效。"],"basis":{"paras":[],"excerptIds":["e-example","e-contrast","e-insufficient","e-process","e-multiple","e-evidence"],"anchors":[]},"knowledge":["inductive","proof-inference"]},{"id":"q-logic-11-007","type":"逻辑判断","difficulty":3,"stem":"设例：故障原因被列为甲或乙，排除甲后即认定乙。这个排除证明最需要补足什么？","options":["甲和乙已包括所有可能原因","甲与乙互相排斥不能同时发生","乙曾作为同类故障的实际原因","甲出现时通常比乙造成更严重后果"],"answerIndex":0,"explanation":"本讲说明排除法必须以穷尽的选言范围为基础，否则排除一项不能唯一确定另一项。","whyWrong":["正确","互斥不保证穷尽；否定甲推乙关键是没有第三原因。","曾经可能不能排除当前有第三原因。","后果比较不补足选项穷尽。"],"basis":{"paras":[],"excerptIds":["e-deductive","e-elimination","e-reductio","e-method"],"anchors":[]},"knowledge":["deductive"]},{"id":"q-logic-11-008","type":"逻辑判断","difficulty":3,"stem":"设例：要间接证明“至少一份材料不合格”，应先假设哪项，再有效导出与已知事实的冲突？","options":["所有材料全部合格","所有材料均不合格","并非所有材料都合格","有些材料已经合格"],"answerIndex":0,"explanation":"本讲用反证法时应假设原论题的矛盾判断；至少一份不合格的否定是全部合格。","whyWrong":["正确","这比待证论题更强，同向而非矛盾。","这等价于待证论题，不是其反论题。","可与有些不合格并存，不是其矛盾判断。"],"basis":{"paras":[],"excerptIds":["e-deductive","e-elimination","e-reductio","e-method"],"anchors":[]},"knowledge":["deductive"]},{"id":"q-logic-11-009","type":"逻辑判断","difficulty":3,"stem":"设例：原论题是“该措施足以降低总成本”，答辩只证明“该措施有望改善服务”，就宣称完成证明。主要错误是","options":["有望改善服务等于已经降低成本，属于有效的论题转换","原论题只需证明措施具有一项优点，就已充分成立","成本主张与服务主张相互矛盾，所以已经完成反证","论题范围发生转移，没有证明原来的成本主张"],"answerIndex":3,"explanation":"本讲要求证明过程中论题保持同一；服务改善与足以降本不是同一个待证判断。","whyWrong":["不同指标与不同强度都不能等同。","原论题有明确成本与充分性要求，不能用任何优点替代。","两主张并非矛盾双方，也未通过反证确立成本结论。","正确"],"basis":{"paras":[],"excerptIds":["e-thesiscare","e-evidencetrue","e-circular"],"anchors":[]},"knowledge":["same-and-true"]},{"id":"q-logic-11-010","type":"逻辑判断","difficulty":2,"stem":"设例：某论据经核查不实，而论题另有尚未检查的证据。可以立即确定的是","options":["原证明失去这一根据，论题真假还需另行考察","原证明其余论据只要真实，就能自动补足该项缺口","原证明有关键论据失实，因此应直接接受相反论题","原证明形式只要有效，就能用结论反证论据应为真"],"answerIndex":0,"explanation":"本讲要求论据真实；论据被推翻影响原证明，但不能自动否定论题本身。","whyWrong":["正确","其余论据真实不保证已经充分，仍需检查联系。","没有证明相反论题所需的根据。","真结论也不能反推全部前提真。"],"basis":{"paras":[],"excerptIds":["e-thesiscare","e-evidencetrue","e-circular","e-follow","e-irrelevant","e-insufficient"],"anchors":[]},"knowledge":["same-and-true","connection"]},{"id":"q-logic-11-011","type":"逻辑判断","difficulty":3,"stem":"设例：调整排班后等候缩短，据此证明排班调整有效。哪项最加强该论证？","options":["专家依据其他窗口的经验预测这种排班可能有效","同等客流和人员下仅调整排班仍出现缩短","采用该办法的多个窗口都同时增员并缩短了等候","某窗口等候缩短后选择了同样的排班办法"],"answerIndex":1,"explanation":"本讲要求论据切实支持论题；控制重要其他条件后仍出现变化，增强排班调整与效果的联系。","whyWrong":["事前类比预测不如控制条件的当前证据直接。","正确","共同增员保留了另一原因，无法分离排班作用。","效果先发生不能支持该办法造成当前效果。"],"basis":{"paras":[],"excerptIds":["e-follow","e-irrelevant","e-insufficient","e-example","e-contrast"],"anchors":[]},"knowledge":["connection","inductive"]},{"id":"q-logic-11-012","type":"逻辑判断","difficulty":3,"stem":"设例：所有经过复核的方案都可执行；甲方案可执行；所以甲经过复核。评价正确的是","options":["这是肯定后件，论据为真也不保证该结论","这是有效的逆否推理，结论已由两个论据保证","这是否定前件，因此可以直接否定甲经过复核","这是充分条件的双向应用，论据真则结论必真"],"answerIndex":0,"explanation":"本讲要求除真实论据外还须有效论证；可执行可能有其他原因，不能倒推复核。","whyWrong":["正确","逆否是否定后件推出否定前件，不是反向肯定。","这里肯定后件，且不能由无效推导推出相反结论。","充分条件不保证逆命题。"],"basis":{"paras":[],"excerptIds":["e-process","e-multiple","e-evidence","e-insufficient","e-follow","e-irrelevant"],"anchors":[]},"knowledge":["proof-inference","connection"]},{"id":"q-logic-11-013","type":"类比推理","difficulty":2,"stem":"论据∶论题","options":["表达形式∶具体内容","待证判断∶支持理由","全称主项∶全称谓项","已知根据∶待证判断"],"answerIndex":3,"explanation":"本讲按证明中的角色区分：论据承担支持论题的根据作用，正确项保留支持方向。","whyWrong":["也是相关概念，但不是证明根据与目标的关系。","同样涉及证明两端，但支持方向倒置。","是判断内部的项关系，不是证明角色。","正确"],"basis":{"paras":[],"excerptIds":["e-proof","e-thesis","e-evidence","e-method"],"anchors":[]},"knowledge":["three-parts"]},{"id":"q-logic-11-014","type":"逻辑判断","difficulty":3,"stem":"设例：报告用甲乙两例对比论证措施有效，但两例的业务复杂度不同。最有价值的评价问题是","options":["甲乙两例是否都确实实施过题述措施","业务复杂度差异是否足以解释所见效果差异","在同样复杂度差异下重复比较是否仍得相同结果","效果较好的一例是否获得了更多使用者认可"],"answerIndex":1,"explanation":"本讲用比较证明时须检查对比的实际根据；可能独立造成结果差异的因素会影响论证力度。","whyWrong":["实施真实性须核查，但无法单独解释复杂度差异的影响。","正确","重复同一混杂结构仍不能分离措施和复杂度作用。","认可与好效果相伴不排除业务复杂度这个竞争原因。"],"basis":{"paras":[],"excerptIds":["e-example","e-contrast","e-insufficient"],"anchors":[]},"knowledge":["inductive"]},{"id":"q-logic-11-015","type":"常识判断","difficulty":2,"stem":"依据本讲，下列关于证明规则的说法不正确的是","options":["论据应当真实，不能把待证结论充作根据","论证应有联系，不能用相关话题代替有效支持","反面假设只要令人不满，就足以证明正面论题","论题应保持明确，不能在过程中悄然替换"],"answerIndex":2,"explanation":"本讲要求反证通过有效推导得到逻辑或事实上的矛盾，而非仅诉诸主观不满。","whyWrong":["符合真实性和非循环要求。","符合论据支持论题的要求。","正确","符合论题同一要求。"],"basis":{"paras":[],"excerptIds":["e-thesiscare","e-evidencetrue","e-circular","e-deductive","e-elimination","e-reductio","e-method"],"anchors":[]},"knowledge":["same-and-true","deductive"]}],"open":[{"id":"o-logic-11-001","type":"论证分析","material":{"text":"设例：报告要证明新流程能降低总成本，却只列出专家讨论通过、工作人员欢迎和一个环节耗时减少，随后把结论改为“新流程有改进价值”，宣称原论题已证成。","sourceIds":[]},"prompt":"拆分论题、论据与论证联系，指出不足并提出补证方案。（150—220字）","points":["原论题是降低总成本，改进价值是不同且更宽泛的论题，不能替换。","专家讨论与欢迎程度不是总成本降低的直接事实根据。","一个环节耗时减少未覆盖其他成本及可能转移的负担。","应明确成本口径并比较实施前后或可比对象的全流程成本。","检查其他变化因素，按证据限定结论而非悄然更换论题。"],"basis":{"paras":[],"excerptIds":["e-proof","e-thesis","e-evidence","e-method","e-follow","e-irrelevant","e-insufficient","e-thesiscare","e-evidencetrue","e-circular"],"anchors":[]}},{"id":"o-logic-11-002","type":"论证分析","materi ic-11.html#excerpt-e-irrelevant"},{"kind":"ocr","label":"看 OCR 原书 · 不相干的论据","href":"./source.html#book=formal-logic-1976&from=1877&to=1877&ref=logic-11.html%23excerpt-e-irrelevant"},{"kind":"excerpt","label":"资料不充分","href":"./logic-11.html#excerpt-e-insufficient"},{"kind":"ocr","label":"看 OCR 原书 · 资料不充分","href":"./source.html#book=formal-logic-1976&from=1878&to=1878&ref=logic-11.html%23excerpt-e-insufficient"},{"kind":"excerpt","label":"论题的规则","href":"./logic-11.html#excerpt-e-thesiscare"},{"kind":"ocr","label":"看 OCR 原书 · 论题的规则","href":"./source.html#book=formal-logic-1976&from=1831&to=1831&ref=logic-11.html%23excerpt-e-thesiscare"},{"kind":"excerpt","label":"论据的规则","href":"./logic-11.html#excerpt-e-evidencetrue"},{"kind":"ocr","label":"看 OCR 原书 · 论据的规则","href":"./source.html#book=formal-logic-1976&from=1850&to=1850&ref=logic-11.html%23excerpt-e-evidencetrue"},{"kind":"excerpt","label":"循环论证","href":"./logic-11.html#excerpt-e-circular"},{"kind":"ocr","label":"看 OCR 原书 · 循环论证","href":"./source.html#book=formal-logic-1976&from=1864&to=1864&ref=logic-11.html%23excerpt-e-circular"}],"o-logic-11-002":[{"kind":"excerpt","label":"演绎证明的基本思路","href":"./logic-11.html#excerpt-e-deductive"},{"kind":"ocr","label":"看 OCR 原书 · 演绎证明的基本思路","href":"./source.html#book=formal-logic-1976&from=1799&to=1799&ref=logic-11.html%23excerpt-e-deductive"},{"kind":"excerpt","label":"选言证法","href":"./logic-11.html#excerpt-e-elimination"},{"kind":"ocr","label":"看 OCR 原书 · 选言证法","href":"./source.html#book=formal-logic-1976&from=1811&to=1811&ref=logic-11.html%23excerpt-e-elimination"},{"kind":"excerpt","label":"反证法的结构","href":"./logic-11.html#excerpt-e-reductio"},{"kind":"ocr","label":"看 OCR 原书 · 反证法的结构","href":"./source.html#book=formal-logic-1976&from=1820&to=1820&ref=logic-11.html%23excerpt-e-reductio"},{"kind":"excerpt","label":"论证方式","href":"./logic-11.html#excerpt-e-method"},{"kind":"ocr","label":"看 OCR 原书 · 论证方式","href":"./source.html#book=formal-logic-1976&from=1743&to=1743&ref=logic-11.html%23excerpt-e-method"},{"kind":"excerpt","label":"例证属于归纳证明","href":"./logic-11.html#excerpt-e-example"},{"kind":"ocr","label":"看 OCR 原书 · 例证属于归纳证明","href":"./source.html#book=formal-logic-1976&from=1781&to=1781&ref=logic-11.html%23excerpt-e-example"},{"kind":"excerpt","label":"对比属于归纳证明","href":"./logic-11.html#excerpt-e-contrast"},{"kind":"ocr","label":"看 OCR 原书 · 对比属于归纳证明","href":"./source.html#book=formal-logic-1976&from=1790&to=1790&ref=logic-11.html%23excerpt-e-contrast"},{"kind":"excerpt","label":"资料不充分","href":"./logic-11.html#excerpt-e-insufficient"},{"kind":"ocr","label":"看 OCR 原书 · 资料不充分","href":"./source.html#book=formal-logic-1976&from=1878&to=1878&ref=logic-11.html%23excerpt-e-insufficient"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-11","title":"第十一讲·证明要有说服力","output":"logic-11.html"},"excerpts":[{"id":"e-proof","label":"逻辑证明的任务","lineStart":1733,"lineEnd":1733,"text":"这种证明就是用一个或几个真实的判断作为根据，通过推理，来确立某一判断的真实性。"},{"id":"e-thesis","label":"论题","lineStart":1741,"lineEnd":1741,"text":"论题是真实性需要加以确立的那个判断。它回答“证明什么”的问题。"},{"id":"e-evidence","label":"论据","lineStart":1742,"lineEnd":1742,"text":"论据是确立论题的真实性所依据的那些判断。它回答“用什么来证明”的问题。"},{"id":"e-method","label":"论证方式","lineStart":1743,"lineEnd":1743,"text":"论证方式是论据和论题之间的联系方式，也就是由论据证明论题时运用了什么样的推理形式。它回答“如何证明”的问题。"},{"id":"e-process","label":"证明与推理的活动方向","lineStart":1755,"lineEnd":1755,"text":"推理是由已有的判断推出新判断，即由前提出发，根据前提得出结论。而证明是先有论题，然后为论题找论据，来确立论题的真实性"},{"id":"e-multiple","label":"证明可以有多个推理","lineStart":1756,"lineEnd":1756,"text":"证明虽然可以只由一个推理构成，但经常是由几个推理构成的。"},{"id":"e-example","label":"例证属于归纳证明","lineStart":1781,"lineEnd":1781,"text":"可以用例证法，就是列举出有代表性的典型事例作为论据，来证明一个一般性的道理。"},{"id":"e-contrast","label":"对比属于归纳证明","lineStart":1790,"lineEnd":1790,"text":"对比法来进行证明，就是列举两个具有不同（或相反）情况的事物，加以对照比较，以对比的结果来证明一般性的道理。"},{"id":"e-deductive","label":"演绎证明的基本思路","lineStart":1799,"lineEnd":1799,"text":"用一般原理、原则作为论据，运用演绎推理的形式"},{"id":"e-elimination","label":"选言证法","lineStart":1811,"lineEnd":1811,"text":"先列出论题存在的各种可能情况，然后排除其他可能，证明只有论题中的一种可能是真实的。"},{"id":"e-reductio","label":"反证法的结构","lineStart":1820,"lineEnd":1820,"text":"先设立一个与要证明的论题相矛盾的反论题，构成一个不相容的选言判断，然后用一个假言推理证明反论题是假的，再根据不相容选言推理的规则，确定原来要证明的论题是真实的。"},{"id":"e-thesiscare","label":"论题的规则","lineStart":1831,"lineEnd":1831,"text":"论题必须明确并保持同一。"},{"id":"e-evidencetrue","label":"论据的规则","lineStart":1850,"lineEnd":1850,"text":"论据必须真实。"},{"id":"e-circular","label":"循环论证","lineStart":1864,"lineEnd":1864,"text":"论题靠论据来证明，论据又要靠论题来证明，这样一来，等于没有证明。"},{"id":"e-follow","label":"推出关系的规则","lineStart":1867,"lineEnd":1867,"text":"从论据必须能推出论题。"},{"id":"e-irrelevant","label":"不相干的论据","lineStart":1877,"lineEnd":1877,"text":"“推不出”的错误还表现为，论据与论题不相干，即论据与论题之间没有必然联系。"},{"id":"e-insufficient","label":"资料不充分","lineStart":1878,"lineEnd":1878,"text":"论据不充分或有片面性，也是“推不出”的一种表现。在归纳证明中，这类错误常常表现为“以偏概全”。"}]}</script></body></html>
