  <script id="reader-data" type="application/json">{"fulltext":{"source":{"url":"https://www.marxists.org/chinese/maozedong/marxist.org-chinese-mao-193707.htm","site":"中文马克思主义文库","rawSha256":"3dd26c15b434b5c3b9bdda28ca3834a07565729e139f2f0e2a3a6280a5d68276","note":"简体全文，取自中文马克思主义文库（《毛泽东选集》第一卷通行文本）；与旧版 OCR 引文用字可能略有出入。"},"title":"实践论","subtitle":"论认识和实践的关系——知和行的关系","date":"（一九三七年七月）","paragraphs":[{"id":"p01","n":1,"text":"在中国共产党内，曾经有一部分教条主义的同志长期拒绝中国革命的经验，否认“马克思主义不是教条而是行动的指南”这个真理，而只生吞活剥马克思主义书籍中的只言片语，去吓唬人们。还有另一部分经验主义的同志长期拘守于自身的片断经验，不了解理论对于革命实践的重要性，看不见革命的全局，虽然也是辛苦地——但却是盲目地在工作。这两类同志的错误思想，特别是教条主义思想，曾经在一九三一年至一九三四年使得中国革命受了极大的损失，而教条主义者却是披着马克思主义的外衣迷惑了广大的同志。毛泽东的《实践论》，是为着用马克思主义的认识论观点去揭露党内的教条主义和经验主义——特别是教条主义这些主观主义的错误而写的。因为重点是揭露看轻实践的教条主义这种主观主义，故题为《实践论》。毛泽东曾以这篇论文的观点在延安的抗日军事政治大学作过讲演。","kind":"editor-note"},{"id":"p02","n":2,"text":"马克思以前的唯物论，离开人的社会性，离开人的历史发展，去观察认识问题，因此不能了解认识对社会实践的依赖关系，即认识对生产和阶级斗争的依赖关系。","kind":"body"},{"id":"p03","n":3,"text":"首先，马克思主义者认为人类的生产活动是最基本的实践活动，是决定其它一切活动的东西。人的认识，主要地依赖于物质的生产活动，逐渐地了解自然的现象、自然的性质、自然的规律性、人和自然的关系；而且经过生产活动，也在各种不同程度上逐渐地认识了人和人的一定的相互关系。一切这些知识，离开生产活动是不能得到的。在没有阶级的社会中，每个人以社会一员的资格，同其它社会成员协力，结成一定的生产关系，从事生产活动，以解决人类物质生活问题。在各种阶级的社会中，各阶级的社会成员，则又以各种不同的方式，结成一定的生产关系，从事生产活动，以解决人类物质生活问题。这是人的认识发展的基本来源。","kind":"body"},{"id":"p04","n":4,"text":"人的社会实践，不限于生产活动一种形式，还有多种其它的形式，阶级斗争，政治生活，科学和艺术的活动，总之社会实际生活的一切领域都是社会的人所参加的。因此，人的认识，在物质生活以外，还从政治生活文化生活中（与物质生活密切联系），在各种不同程度上，知道人和人的各种关系。其中，尤以各种形式的阶级斗争，给予人的认识发展以深刻的影响。在阶级社会中，每一个人都在一定的阶级地位中生活，各种思想无不打上阶级的烙印。","kind":"body"},{"id":"p05","n":5,"text":"马克思主义者认为人类社会的生产活动，是一步又一步地由低级向高级发展，因此，人们的认识，不论对于自然界方面，对于社会方面，也都是一步又一步地由低级向高级发展，即由浅入深，由片面到更多的方面。在很长的历史时期内，大家对于社会的历史只能限于片面的了解，这一方面是由于剥削阶级的偏见经常歪曲社会的历史，另方面，则由于生产规模的狭小，限制了人们的眼界。人们能够对于社会历史的发展作全面的历史的了解，把对于社会的认识变成了科学，这只是到了伴随巨大生产力——大工业而出现近代无产阶级的时候，这就是马克思主义的科学。","kind":"body"},{"id":"p06","n":6,"text":"马克思主义者认为，只有人们的社会实践，才是人们对于外界认识的真理性的标准。实际的情形是这样的，只有在社会实践过程中（物质生产过程中，阶级斗争过程中，科学实验过程中），人们达到了思想中所预想的结果时，人们的认识才被证实了。人们要想得到工作的胜利即得到预想的结果，一定要使自己的思想合于客观外界的规律性，如果不合，就会在实践中失败。人们经过失败之后，也就从失败取得教训，改正自己的思想使之适合于外界的规律性，人们就能变失败为胜利，所谓“失败者成功之母”，“吃一堑长一智”，就是这个道理。辩证唯物论的认识论把实践提到第一的地位，认为人的认识一点也不能离开实践，排斥一切否认实践重要性、使认识离开实践的错误理论。列宁这样说过：“实践高于（理论的）认识，因为它不但有普遍性的品格，而且还有直接现实性的品格。”[1]马克思主义的哲学辩证唯物论有两个最显着的特点：一个是它的阶级性，公然申明辩证唯物论是为无产阶级服务的；再一个是它的实践性，强调理论对于实践的依赖关系，理论的基础是实践，又转过来为实践服务。判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。真理的标准只能是社会的实践。实践的观点是辩证唯物论的认识论之第一的和基本的观点[2]。","kind":"body"},{"id":"p07","n":7,"text":"然而人的认识究竟怎样从实践发生，而又服务于实践呢？这只要看一看认识的发展过程就会明了的。","kind":"body"},{"id":"p08","n":8,"text":"原来人在实践过程中，开始只是看到过程中各个事物的现象方面，看到各个事物的片面，看到各个事物之间的外部联系。例如有些外面的人们到延安来考察，头一二天，他们看到了延安的地形、街道、屋宇，接触了许多的人，参加了宴会、晚会和群众大会，听到了各种说话，看到了各种文件，这些就是事物的现象，事物的各个片面以及这些事物的外部联系。这叫做认识的感性阶段，就是感觉和印象的阶段。也就是延安这些各别的事物作用于考察团先生们的感官，引起了他们的感觉，在他们的脑子中生起了许多的印象，以及这些印象间的大概的外部的联系，这是认识的第一个阶段。在这个阶段中，人们还不能造成深刻的概念，作出合乎论理（即合乎逻辑）的结论。","kind":"body"},{"id":"p09","n":9,"text":"社会实践的继续，使人们在实践中引起感觉和印象的东西反复了多次，于是在人们的脑子里生起了一个认识过程中的突变（即飞跃），产生了概念。概念这种东西已经不是事物的现象，不是事物的各个片面，不是它们的外部联系，而是抓着了事物的本质，事物的全体，事物的内部联系了。概念同感觉，不但是数量上的差别，而且有了性质上的差别。循此继进，使用判断和推理的方法，就可产生出合乎论理的结论来。《三国演义》上所谓“眉头一皱计上心来”，我们普通说话所谓“让我想一想”，就是人在脑子中运用概念以作判断和推理的工夫。这是认识的第二个阶段。外来的考察团先生们在他们集合了各种材料，加上他们“想了一想”之后，他们就能够作出“共产党的抗日民族统一战线的政策是彻底的、诚恳的和真实的”这样一个判断了。在他们作出这个判断之后，如果他们对于团结救国也是真实的的话，那末他们就能够进一步作出这样的结论：“抗日民族统一战线是能够成功的。”这个概念、判断和推理的阶段，在人们对于一个事物的整个认识过程中是更重要的阶段，也就是理性认识的阶段。认识的真正任务在于经过感觉而到达于思维，到达于逐步了解客观事物的内部矛盾，了解它的规律性，了解这一过程和那一过程间的内部联系，即到达于论理的认识。重复地说，论理的认识所以和感性的认识不同，是因为感性的认识是属于事物之片面的、现象的、外部联系的东西，论理的认识则推进了一大步，到达了事物的全体的、本质的、内部联系的东西，到达了暴露周围世界的内在的矛盾，因而能在周围世界的总体上，在周围世界一切方面的内部联系上去把握周围世界的发展。","kind":"body"},{"id":"p10","n":10,"text":"这种基于实践的由浅入深的辩证唯物论的关于认识发展过程的理论，在马克思主义以前，是没有一个人这样解决过的。马克思主义的唯物论，第一次正确地解决了这个问题，唯物地而且辩证地指出了认识的深化的运动，指出了社会的人在他们的生产和阶级斗争的复杂的、经常反复的实践中，由感性认识到论理认识的推移的运动。列宁说过：“物质的抽象，自然规律的抽象，价值的抽象以及其它等等，一句话，一切科学的（正确的、郑重的、非瞎说的）抽象，都更深刻、更正确、更完全地反映着自然。”[3]马克思列宁主义认为：认识过程中两个阶段的特性，在低级阶段，认识表现为感性的，在高级阶段，认识表现为论理的，但任何阶段，都是统一的认识过程中的阶段。感性和理性二者的性质不同，但又不是互相分离的，它们在实践的基础上统一起来了。我们的实践证明：感觉到了的东西，我们不能立刻理解它，只有理解了的东西才更深刻地感觉它。感觉只解决现象问题，理论才解决本质问题。这些问题的解决，一点也不能离开实践。无论何人要认识什么事物，除了同那个事物接触，即生活于（实践于）那个事物的环境中，是没有法子解决的。不能在封建社会就预先认识资本主义社会的规律，因为资本主义还未出现，还无这种实践。马克思主义只能是资本主义社会的产物。马克思不能在自由资本主义时代就预先具体地认识帝国主义时代的某些特异的规律，因为帝国主义这个资本主义最后阶段还未到来，还无这种实践，只有列宁和斯大林才能担当此项任务。马克思、恩格斯、列宁、斯大林之所以能够作出他们的理论，除了他们的天才条件之外，主要地是他们亲自参加了当时的阶级斗争和科学实验的实践，没有这后一个条件，任何天才也是不能成功的。“秀才不出门，全知天下事”，在技术不发达的古代只是一句空话，在技术发达的现代虽然可以实现这句话，然而真正亲知的是天下实践着的人，那些人在他们的实践中间取得了“知”，经过文字和技术的传达而到达于“秀才”之手，秀才乃能间接地“知天下事”。如果要直接地认识某种或某些事物，便只有亲身参加于变革现实、变革某种或某些事物的实践的斗争中，才能触到那种或那些事物的现象，也只有在亲身参加变革现实的实践的斗争中，才能暴露那种或那些事物的本质而理解它们。这是任何人实际上走着的认识路程，不过有些人故意歪曲地说些反对的话罢了。世上最可笑的是那些“知识里手”[4]，有了道听途说的一知半解，便自封为“天下第一”，适足见其不自量而已。知识的问题是一个科学问题，来不得半点的虚伪和骄傲，决定地需要的倒是其反面——诚实和谦逊的态度。你要有知识，你就得参加变革现实的实践。你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。你要知道原子的组织同性质，你就得实行物理学和化学的实验，变革原子的情况。你要知道革命的理论和方法，你就得参加革命。一切真知都是从直接经验发源的。但人不能事事直接经验，事实上多数的知识都是间接经验的东西，这就是一切古代的和外域的知识。这些知识在古人在外人是直接经验的东西，如果在古人外人直接经验时是符合于列宁所说的条件“科学的抽象”，是科学地反映了客观的事物，那末这些知识是可靠的，否则就是不可靠的。所以，一个人的知识，不外直接经验的和间接经验的两部分。而且在我为间接经验者，在人则仍为直接经验。因此，就知识的总体说来，无论何种知识都是不能离开直接经验的。任何知识的来源，在于人的肉体感官对客观外界的感觉，否认了这个感觉，否认了直接经验，否认亲自参加变革现实的实践，他就不是唯物论者。“知识里手”之所以可笑，原因就是在这个地方。中国人有一句老话：“不入虎穴，焉得虎子。”这句话对于人们的实践是真理，对于认识论也是真理。离开实践的认识是不可能的。","kind":"body"},{"id":"p11","n":11,"text":"为了明了基于变革现实的实践而产生的辩证唯物论的认识运动——认识的逐渐深化的运动，下面再举出几个具体的例子。","kind":"body"},{"id":"p12","n":12,"text":"无产阶级对于资本主义社会的认识，在其实践的初期——破坏机器和自发斗争时期，他们还只在感性认识的阶段，只认识资本主义各个现象的片面及其外部的联系。这时，他们还是一个所谓“自在的阶级”。但是到了他们实践的第二个时期——有意识有组织的经济斗争和政治斗争的时期，由于实践，由于长期斗争的经验，经过马克思、恩格斯用科学的方法把这种种经验总结起来，产生了马克思主义的理论，用以教育无产阶级，这样就使无产阶级理解了资本主义社会的本质，理解了社会阶级的剥削关系，理解了无产阶级的历史任务，这时他们就变成了一个“自为的阶级”。","kind":"body"},{"id":"p13","n":13,"text":"中国人民对于帝国主义的认识也是这样。第一阶段是表面的感性的认识阶段，表现在太平天国运动和义和团运动等笼统的排外主义的斗争上[5]。第二阶段才进到理性的认识阶段，看出了帝国主义内部和外部的各种矛盾，并看出了帝国主义联合中国买办阶级和封建阶级以压榨中国人民大众的实质，这种认识是从一九一九年五四运动[6]前后才开始的。","kind":"body"},{"id":"p14","n":14,"text":"我们再来看战争。战争的领导者，如果他们是一些没有战争经验的人，对于一个具体的战争（例如我们过去十年的土地革命战争）的深刻的指导规律，在开始阶段是不了解的。他们在开始阶段只是身历了许多作战的经验，而且败仗是打得很多的。然而由于这些经验（胜仗，特别是败仗的经验），使他们能够理解贯串整个战争的内部的东西，即那个具体战争的规律性，懂得了战略和战术，因而能够有把握地去指导战争。此时，如果改换一个无经验的人去指导，又会要在吃了一些败仗之后（有了经验之后）才能理会战争的正确的规律。","kind":"body"},{"id":"p15","n":15,"text":"常常听到一些同志在不能勇敢接受工作任务时说出来的一句话：没有把握。为什么没有把握呢？因为他对于这项工作的内容和环境没有规律性的了解，或者他从来就没有接触过这类工作，或者接触得不多，因而无从谈到这类工作的规律性。及至把工作的情况和环境给以详细分析之后，他就觉得比较地有了把握，愿意去做这项工作。如果这个人在这项工作中经过了一个时期，他有了这项工作的经验了，而他又是一个肯虚心体察情况的人，不是一个主观地、片面地、表面地看问题的人，他就能够自己做出应该怎样进行工作的结论，他的工作勇气也就可以大大地提高了。只有那些主观地、片面地和表面地看问题的人，跑到一个地方，不问环境的情况，不看事情的全体（事情的历史和全部现状），也不触到事情的本质（事情的性质及此一事情和其它事情的内部联系），就自以为是地发号施令起来，这样的人是没有不跌交子的。","kind":"body"},{"id":"p16","n":16,"text":"由此看来，认识的过程，第一步，是开始接触外界事情，属于感觉的阶段。第二步，是综合感觉的材料加以整理和改造，属于概念、判断和推理的阶段。只有感觉的材料十分丰富（不是零碎不全）和合于实际（不是错觉），才能根据这样的材料造出正确的概念和论理来。","kind":"body"},{"id":"p17","n":17,"text":"这里有两个要点必须着重指明。第一个，在前面已经说过的，这里再重复说一说，就是理性认识依赖于感性认识的问题。如果以为理性认识可以不从感性认识得来，他就是一个唯心论者。哲学史上有所谓“唯理论”一派，就是只承认理性的实在性，不承认经验的实在性，以为只有理性靠得住，而感觉的经验是靠不住的，这一派的错误在于颠倒了事实。理性的东西所以靠得住，正是由于它来源于感性，否则理性的东西就成了无源之水，无本之木，而只是主观自生的靠不住的东西了。从认识过程的秩序说来，感觉经验是第一的东西，我们强调社会实践在认识过程中的意义，就在于只有社会实践才能使人的认识开始发生，开始从客观外界得到感觉经验。一个闭目塞听、同客观外界根本绝缘的人，是无所谓认识的。认识开始于经验——这就是认识论的唯物论。","kind":"body"},{"id":"p18","n":18,"text":"第二是认识有待于深化，认识的感性阶段有待于发展到理性阶段——这就是认识论的辩证法[7]。如果以为认识可以停顿在低级的感性阶段，以为只有感性认识可靠，而理性认识是靠不住的，这便是重复了历史上的“经验论”的错误。这种理论的错误，在于不知道感觉材料固然是客观外界某些真实性的反映（我这里不来说经验只是所谓内省体验的那种唯心的经验论），但它们仅是片面的和表面的东西，这种反映是不完全的，是没有反映事物本质的。要完全地反映整个的事物，反映事物的本质，反映事物的内部规律性，就必须经过思考作用，将丰富的感觉材料加以去粗取精、去伪存真、由此及彼、由表及里的改造制作工夫，造成概念和理论的系统，就必须从感性认识跃进到理性认识。这种改造过的认识，不是更空虚了更不可靠了的认识，相反，只要是在认识过程中根据于实践基础而科学地改造过的东西，正如列宁所说乃是更深刻、更正确、更完全地反映客观事物的东西。庸俗的事务主义家不是这样，他们尊重经验而看轻理论，因而不能通观客观过程的全体，缺乏明确的方针，没有远大的前途，沾沾自喜于一得之功和一孔之见。这种人如果指导革命，就会引导革命走上碰壁的地步。","kind":"body"},{"id":"p19","n":19,"text":"理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。哲学上的“唯理论”和“经验论”都不懂得认识的历史性或辩证性，虽然各有片面的真理（对于唯物的唯理论和经验论而言，非指唯心的唯理论和经验论），但在认识论的全体上则都是错误的。由感性到理性之辩证唯物论的认识运动，对于一个小的认识过程（例如对于一个事物或一件工作的认识）是如此，对于一个大的认识过程（例如对于一个社会或一个革命的认识）也是如此。","kind":"body"},{"id":"p20","n":20,"text":"然而认识运动至此还没有完结。辩证唯物论的认识运动，如果只到理性认识为止，那末还只说到问题的一半。而且对于马克思主义的哲学说来，还只说到非十分重要的那一半。马克思主义的哲学认为十分重要的问题，不在于懂得了客观世界的规律性，因而能够解释世界，而在于拿了这种对于客观规律性的认识去能动地改造世界。在马克思主义看来，理论是重要的，它的重要性充分地表现在列宁说过的一句话：“没有革命的理论，就不会有革命的运动。”[8]然而马克思主义看重理论，正是，也仅仅是，因为它能够指导行动。如果有了正确的理论，只是把它空谈一阵，束之高阁，并不实行，那末，这种理论再好也是没有意义的。认识从实践始，经过实践得到了理论的认识，还须再回到实践去。认识的能动作用，不但表现于从感性的认识到理性的认识之能动的飞跃，更重要的还须表现于从理性的认识到革命的实践这一个飞跃。抓着了世界的规律性的认识，必须把它再回到改造世界的实践中去，再用到生产的实践、革命的阶级斗争和民族斗争的实践以及科学实验的实践中去。这就是检验理论和发展理论的过程，是整个认识过程的继续。理论的东西之是否符合于客观真理性这个问题，在前面说的由感性到理性之认识运动中是没有完全解决的，也不能完全解决的。要完全地解决这个问题，只有把理性的认识再回到社会实践中去，应用理论于实践，看它是否能够达到预想的目的。许多自然科学理论之所以被称为真理，不但在于自然科学家们创立这些学说的时候，而且在于为尔后的科学实践所证实的时候。马克思列宁主义之所以被称为真理，也不但在于马克思、恩格斯、列宁、斯大林等人科学地构成这些学说的时候，而且在于为尔后革命的阶级斗争和民族斗争的实践所证实的时候。辩证唯物论之所以为普遍真理，在于经过无论什么人的实践都不能逃出它的范围。人类认识的历史告诉我们，许多理论的真理性是不完全的，经过实践的检验而纠正了它们的不完全性。许多理论是错误的，经过实践的检验而纠正其错误。所谓实践是真理的标准，所谓“生活、实践底观点，应该是认识论底首先的和基本的观点”[9]，理由就在这个地方。斯大林说得好：“理论若不和革命实践联系起来，就会变成无对象的理论，同样，实践若不以革命理论为指南，就会变成盲目的实践。”[10]","kind":"body"},{"id":"p21","n":21,"text":"说到这里，认识运动就算完成了吗？我们的答复是完成了，又没有完成。社会的人们投身于变革在某一发展阶段内的某一客观过程的实践中（不论是关于变革某一自然过程的实践，或变革某一社会过程的实践），由于客观过程的反映和主观能动性的作用，使得人们的认识由感性的推移到了理性的，造成了大体上相应于该客观过程的法则性的思想、理论、计划或方案，然后再应用这种思想、理论、计划或方案于该同一客观过程的实践，如果能够实现预想的目的，即将预定的思想、理论、计划、方案在该同一过程的实践中变为事实，或者大体上变为事实，那末，对于这一具体过程的认识运动算是完成了。例如，在变革自然的过程中，某一工程计划的实现，某一科学假想的证实，某一器物的制成，某一农产的收获，在变革社会过程中某一罢工的胜利，某一战争的胜利，某一教育计划的实现，都算实现了预想的目的。然而一般地说来，不论在变革自然或变革社会的实践中，人们原定的思想、理论、计划、方案，毫无改变地实现出来的事，是很少的。这是因为从事变革现实的人们，常常受着许多的限制，不但常常受着科学条件和技术条件的限制，而且也受着客观过程的发展及其表现程度的限制（客观过程的方面及本质尚未充分暴露）。在这种情形之下，由于实践中发现前所未料的情况，因而部分地改变思想、理论、计划、方案的事是常有的，全部地改变的事也是有的。即是说，原定的思想、理论、计划、方案，部分地或全部地不合于实际，部分错了或全部错了的事，都是有的。许多时候须反复失败过多次，才能纠正错误的认识，才能到达于和客观过程的规律性相符合，因而才能够变主观的东西为客观的东西，即在实践中得到预想的结果。但是不管怎样，到了这种时候，人们对于在某一发展阶段内的某一客观过程的认识运动，算是完成了。","kind":"body"},{"id":"p22","n":22,"text":"然而对于过程的推移而言，人们的认识运动是没有完成的。任何过程，不论是属于自然界的和属于社会的，由于内部的矛盾和斗争，都是向前推移向前发展的，人们的认识运动也应跟着推移和发展。依社会运动来说，真正的革命的指导者，不但在于当自己的思想、理论、计划、方案有错误时须得善于改正，如同上面已经说到的，而且在于当某一客观过程已经从某一发展阶段向另一发展阶段推移转变的时候，须得善于使自己和参加革命的一切人员在主观认识上也跟着推移转变，即是要使新的革命任务和新的工作方案的提出，适合于新的情况的变化。革命时期情况的变化是很急速的，如果革命党人的认识不能随之而急速变化，就不能引导革命走向胜利。","kind":"body"},{"id":"p23","n":23,"text":"然而思想落后于实际的事是常有的，这是因为人的认识受了许多社会条件的限制的缘故。我们反对革命队伍中的顽固派，他们的思想不能随变化了的客观情况而前进，在历史上表现为右倾机会主义。这些人看不出矛盾的斗争已将客观过程推向前进了，而他们的认识仍然停止在旧阶段。一切顽固党的思想都有这样的特征。他们的思想离开了社会的实践，他们不能站在社会车轮的前头充任向导的工作，他们只知跟在车子后面怨恨车子走得太快了，企图把它向后拉，开倒车。","kind":"body"},{"id":"p24","n":24,"text":"我们也反对“左”翼空谈主义。他们的思想超过客观过程的一定发展阶段，有些把幻想看作真理，有些则把仅在将来有现实可能性的理想，勉强地放在现时来做，离开了当前大多数人的实践，离开了当前的现实性，在行动上表现为冒险主义。","kind":"body"},{"id":"p25","n":25,"text":"唯心论和机械唯物论，机会主义和冒险主义，都是以主观和客观相分裂，以认识和实践相脱离为特征的。以科学的社会实践为特征的马克思列宁主义的认识论，不能不坚决反对这些错误思想。马克思主义者承认，在绝对的总的宇宙发展过程中，各个具体过程的发展都是相对的，因而在绝对真理的长河中，人们对于在各个一定发展阶段上的具体过程的认识只具有相对的真理性。无数相对的真理之总和，就是绝对的真理[11]。客观过程的发展是充满着矛盾和斗争的发展，人的认识运动的发展也是充满着矛盾和斗争的发展。一切客观世界的辩证法的运动，都或先或后地能够反映到人的认识中来。社会实践中的发生、发展和消灭的过程是无穷的，人的认识的发生、发展和消灭的过程也是无穷的。根据于一定的思想、理论、计划、方案以从事于变革客观现实的实践，一次又一次地向前，人们对于客观现实的认识也就一次又一次地深化。客观现实世界的变化运动永远没有完结，人们在实践中对于真理的认识也就永远没有完结。马克思列宁主义并没有结束真理，而是在实践中不断地开辟认识真理的道路。我们的结论是主观和客观、理论和实践、知和行的具体的历史的统一，反对一切离开具体历史的“左”的或右的错误思想。","kind":"body"},{"id":"p26","n":26,"text":"社会的发展到了今天的时代，正确地认识世界和改造世界的责任，已经历史地落在无产阶级及其政党的肩上。这种根据科学认识而定下来的改造世界的实践过程，在世界、在中国均已到达了一个历史的时节——自有历史以来未曾有过的重大时节，这就是整个儿地推翻世界和中国的黑暗面，把它们转变过来成为前所未有的光明世界。无产阶级和革命人民改造世界的斗争，包括实现下述的任务：改造客观世界，也改造自己的主观世界——改造自己的认识能力，改造主观世界同客观世界的关系。地球上已经有一部分实行了这种改造，这就是苏联。他们还正在促进这种改造过程。中国人民和世界人民也都正在或将要通过这样的改造过程。所谓被改造的客观世界，其中包括了一切反对改造的人们，他们的被改造，须要通过强迫的阶段，然后才能进入自觉的阶段。世界到了全人类都自觉地改造自己和改造世界的时候，那就是世界的共产主义时代。","kind":"body"},{"id":"p27","n":27,"text":"通过实践而发现真理，又通过实践而证实真理和发展真理。从感性认识而能动地发展到理性认识，又从理性认识而能动地指导革命实践，改造主观世界和客观世界。实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。这就是辩证唯物论的全部认识论，这就是辩证唯物论的知行统一观。","kind":"body"}],"footnotes":[{"id":"n1","n":1,"text":"见列宁《黑格尔〈逻辑学〉一书摘要》。新的译文是：“实践高于（理论的）认识，因为它不仅具有普遍性的品格，而且还具有直接现实性的品格。”（《列宁全集》第55卷，人民出版社1990年版，第183页）"},{"id":"n2","n":2,"text":"参见马克思《关于费尔巴哈的提纲》（《马克思恩格斯选集》第1卷，人民出版社1972年版，第16—19页）和列宁《唯物主义和经验批判主义》第二章第六节（《列宁全集》第18卷，人民出版社1988年版，第144页）。"},{"id":"n3","n":3,"text":"见列宁《黑格尔〈逻辑学〉一书摘要》（《列宁全集》第55卷，人民出版社1990年版，第142页）。"},{"id":"n4","n":4,"text":"里手，湖南方言，内行的意思。"},{"id":"n5","n":5,"text":"一九五一年三月二十七日，毛泽东在致李达的信中说：“《实践论》中将太平天国放在排外主义一起说不妥，出选集时拟加修改，此处暂仍照原。”"},{"id":"n6","n":6,"text":"五四运动是一九一九年五月四日发生的反帝反封建的爱国运动。当时，第一次世界大战刚刚结束，英、美、法、日、意等战胜国在巴黎召开对德和会，决定由日本继承德国在中国山东的特权。中国是参加对德宣战的战胜国之一，但北洋军阀政府却准备接受这个决定。五月四日，北京学生游行示威，反对帝国主义的这一无理决定和北洋军阀政府的妥协。这次运动迅速地获得了全国人民的响应，到六月三日以后，发展成为有工人阶级、城市小资产阶级和民族资产阶级参加的广大群众性的反帝反封建的爱国运动。五四运动也是反对封建文化的新文化运动。以一九一五年《青年杂志》（后改名《新青年》）创刊为起点的新文化运动，竖起“民主”和“科学”的旗帜，反对旧道德，提倡新道德，反对旧文学，提倡新文学。五四运动中的先进分子接受了马克思主义，使新文化运动发展成为马克思主义思想运动，他们致力于马克思主义同中国工人运动相结合，在思想上和干部上准备了中国共产党的成立。"},{"id":"n7","n":7,"text":"参见列宁《黑格尔〈逻辑学〉一书摘要》：“要理解，就必须从经验开始理解、研究，从经验上升到一般。”（《列宁全集》第55卷，人民出版社1990年版，第175页）"},{"id":"n8","n":8,"text":"见列宁《俄国社会民主党人的任务》（《列宁全集》第2卷，人民出版社1984年版，第443页）；并见列宁《怎么办？》第一章第四节（《列宁全集》第6卷，人民出版社1986年版，第23页）。"},{"id":"n9","n":9,"text":"见列宁《唯物主义和经验批判主义》第二章第六节（《列宁全集》第18卷，人民出版社1988年版，第144页）。"},{"id":"n10","n":10,"text":"见斯大林《论列宁主义基础》第三部分《理论》。新的译文是：“离开革命实践的理论是空洞的理论，而不以革命理论为指南的实践是盲目的实践。”（《斯大林选集》上卷，人民出版社1979年版，第199—200页）"},{"id":"n11","n":11,"text":"参见列宁《唯物主义和经验批判主义》第二章第五节。原文是：“人类思维按其本性是能够给我们提供并且正在提供由相对真理的总和所构成的绝对真理的。”（《列宁全集》第18卷，人民出版社1988年版，第135页）"}]},"guide":{"version":1,"outline":[{"id":"s1","title":"编者说明","paras":["p01"],"purpose":"说明写作背景，区分编者题解与作者正文。"},{"id":"s2","title":"实践是认识的基础","paras":["p02","p03","p04","p05","p06"],"purpose":"从生产、社会生活和历史发展说明认识的来源及检验标准。"},{"id":"s3","title":"从感觉到理解","paras":["p07","p08","p09","p10","p11","p12","p13","p14","p15","p16"],"purpose":"说明感性认识如何转向理性认识，并用考察、阶级斗争、战争和工作举例。"},{"id":"s4","title":"两种认识相互联系","paras":["p17","p18","p19"],"purpose":"说明理性依赖感性、感性需要深化，批评只重一面的观点。"},{"id":"s5","title":"从理论回到实践","paras":["p20","p21"],"purpose":"说明理论要指导行动、接受检验，计划也需要修正。"},{"id":"s6","title":"在变化中继续认识","paras":["p22","p23","p24","p25"],"purpose":"说明认识必须随实际发展，反对落后于实际或超过实际的思想。"},{"id":"s7","title":"改造世界与认识的循环","paras":["p26","p27"],"purpose":"提出改造客观和主观世界的任务，总结知与行不断发展的关系。"}],"paragraphs":{"p01":{"gist":"编者说明：本文主要批评脱离实践的教条主义。","plain":"编者说，中国共产党内曾有一些坚持教条主义的人。他们长期拒绝接受中国革命中的实际经验，不承认马克思主义应当指导行动，而不应成为固定不变的规定。他们只从书中拿出零散的话，不理解就照搬，还用这些话吓唬别人。另一些坚持经验主义的人，只守着自己的一点经验，不懂理论对革命实践的作用，也看不到革命的整体情况。他们虽然辛苦工作，却缺少明确的方向。编者认为，这两种思想，特别是教条主义，使中国革命在1931年至1934年受到很大损失。教条主义者又借着马克思主义的名义，使许多同志受到迷惑。编者说明，毛泽东写这篇文章，是为了用马克思主义关于认识的理论，批评党内这两种主观主义错误，重点是轻视实践的教条主义，因此文章叫《实践论》。编者还说，毛泽东曾用文中的观点，在延安的抗日军事政治大学作过讲演。","difficulty":3,"knowledge":["k-dogma","k-empiricism"],"readingTip":"这是编者题解，不是正文。“两类同志”分别指只照搬书本的人和只守着个人经验的人。"},"p02":{"gist":"认识要放在社会关系和历史发展中理解。","plain":"本文认为，马克思以前的唯物论讨论人怎样认识事物时，没有把人放在社会关系和历史发展中来看。因此，它不能理解认识依靠社会实践，也就是依靠生产活动和阶级斗争。","difficulty":2,"knowledge":["k-social"]},"p03":{"gist":"生产活动是认识发展的基本来源。","plain":"本文认为，生产是人类最基本的实践活动，并决定其他活动。人们主要通过生产物质生活所需的东西，逐步认识自然界的现象、性质和规律，以及人同自然的关系。在生产中，人们也逐步认识人与人之间的关系，只是认识的程度有所不同。作者认为，离开生产就得不到这些知识。在没有阶级的社会里，每个人作为社会的一员，与别人合作，形成一定的生产关系，共同生产，以满足物质生活的需要。在有阶级的社会里，各阶级的人也以不同的方式，形成一定的生产关系，进行生产，解决物质生活问题。作者把这看作人的认识发展的基本来源。","difficulty":2,"knowledge":["k-source","k-social"]},"p04":{"gist":"社会实践还包括政治、科学、艺术等活动。","plain":"本文认为，社会实践不只有生产，还包括阶级斗争、政治生活、科学活动和艺术活动等。生活在社会中的人，会参加实际社会生活各方面的活动。因此，人们不只通过物质生活，也通过与物质生活紧密联系的政治和文化生活，在不同程度上了解人与人的各种关系。作者特别强调，各种形式的阶级斗争会对认识的发展产生很大的影响。作者认为，在阶级社会里，每个人都有一定的阶级地位，人的各种思想都受到这种地位的影响。","difficulty":2,"knowledge":["k-social"]},"p05":{"gist":"认识的发展受生产和历史条件影响。","plain":"本文认为，生产活动一步步从较低水平发展到较高水平，人们对自然和社会的认识也随着发展：从浅到较全面的理解，从只看一部分到能看更多方面。作者说，在很长的历史时期，人们对社会历史的了解都很有限。一方面，剥削阶级的偏见使历史被歪曲；另一方面，生产规模小，限制了人们能看到的范围。作者认为，直到大工业这种巨大生产力出现，并伴随着近代无产阶级的出现，人们才可能全面地理解社会历史的发展，使社会认识成为一门科学；作者把马克思主义看作这种科学。","difficulty":3,"knowledge":["k-historical"]},"p06":{"gist":"本文把社会实践作为检验真理的标准。","plain":"本文认为，只有社会实践才能检验人对外部世界的认识是否符合实际。作者解释说，人们在物质生产、阶级斗争和科学实验等社会实践中，取得原来预想的结果，认识才得到证实。要使工作成功，取得预期结果，思想就必须符合外部世界本身的规律；不符合，就会在实践中失败。失败以后，人们可以吸取教训，改正思想，使思想符合外部世界的规律，从而把失败变成成功。作者用“失败者成功之母”和“吃一堑长一智”说明这一点。作者说，辩证唯物论关于认识的理论把实践放在首位，认为认识完全不能离开实践，并反对否认实践作用、把认识与实践分开的理论。作者引用列宁的话说，实践比理论认识更高，因为实践不仅有普遍意义，而且能够直接成为现实。作者提出，辩证唯物论有两个突出的特点。一是阶级性：公开说明它为无产阶级服务。二是实践性：强调理论依靠实践，以实践为基础，又回来指导实践。作者认为，判断认识或理论是不是真理，要看社会实践的客观结果，不能只凭个人觉得如何。检验真理的标准只能是社会实践。所以，作者把实践的观点称为辩证唯物论认识论中首要、基本的观点。","difficulty":3,"knowledge":["k-criterion","k-source"],"readingTip":"先找“标准”，再看“两个特点”。最后一句重申结论；引文后的数字是注释编号。","chunks":[{"quote":"马克思主义者认为，只有人们的社会实践，才是人们对于外界认识的真理性的标准。","plain":"本文认为，只有社会实践才能检验人对外部世界的认识是否符合实际。"},{"quote":"实际的情形是这样的，只有在社会实践过程中（物质生产过程中，阶级斗争过程中，科学实验过程中），人们达到了思想中所预想的结果时，人们的认识才被证实了。","plain":"作者解释说，人们在物质生产、阶级斗争和科学实验等社会实践中，取得原来预想的结果，认识才得到证实。"},{"quote":"人们要想得到工作的胜利即得到预想的结果，一定要使自己的思想合于客观外界的规律性，如果不合，就会在实践中失败。","plain":"要使工作成功，取得预期结果，思想就必须符合外部世界本身的规律；不符合，就会在实践中失败。"},{"quote":"人们经过失败之后，也就从失败取得教训，改正自己的思想使之适合于外界的规律性，人们就能变失败为胜利，所谓“失败者成功之母”，“吃一堑长一智”，就是这个道理。","plain":"失败以后，人们可以吸取教训，改正思想，使思想符合外部世界的规律，从而把失败变成成功。作者用“失败者成功之母”和“吃一堑长一智”说明这一点。"},{"quote":"辩证唯物论的认识论把实践提到第一的地位，认为人的认识一点也不能离开实践，排斥一切否认实践重要性、使认识离开实践的错误理论。","plain":"作者说，辩证唯物论关于认识的理论把实践放在首位，认为认识完全不能离开实践，并反对否认实践作用、把认识与实践分开的理论。"},{"quote":"列宁这样说过：“实践高于（理论的）认识，因为它不但有普遍性的品格，而且还有直接现实性的品格。”","plain":"作者引用列宁的话说，实践比理论认识更高，因为实践不仅有普遍意义，而且能够直接成为现实。"},{"quote":"马克思主义的哲学辩证唯物论有两个最显着的特点：一个是它的阶级性，公然申明辩证唯物论是为无产阶级服务的；再一个是它的实践性，强调理论对于实践的依赖关系，理论的基础是实践，又转过来为实践服务。","plain":"作者提出，辩证唯物论有两个突出的特点。一是阶级性：公开说明它为无产阶级服务。二是实践性：强调理论依靠实践，以实践为基础，又回来指导实践。"},{"quote":"判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。真理的标准只能是社会的实践。","plain":"作者认为，判断认识或理论是不是真理，要看社会实践的客观结果，不能只凭个人觉得如何。检验真理的标准只能是社会实践。"},{"quote":"实践的观点是辩证唯物论的认识论之第一的和基本的观点","plain":"所以，作者把实践的观点称为辩证唯物论认识论中首要、基本的观点。"}]},"p07":{"gist":"下文转向说明认识怎样产生并指导实践。","plain":"作者接着问：人的认识到底怎样从实践中产生，又怎样回来为实践服务？作者说，只要考察认识一步步发展的过程，就可以弄清这个问题。","difficulty":1,"knowledge":["k-cycle"]},"p08":{"gist":"感性认识首先得到现象、感觉和印象。","plain":"本文认为，人在实践中最初看到的是事物的表面现象、各自的一部分，以及它们外部的联系。作者举例说，一些人到延安考察，最初一两天看地形、街道、房屋，接触许多人，参加宴会、晚会和群众大会，也听各种讲话、看各种文件。他们接触到的这些，都是现象、局部和外部联系。作者把这叫作认识的感性阶段，也就是得到感觉和印象的阶段。延安的具体事物通过考察者的感觉器官，使他们产生感觉，在头脑里留下许多印象，并看到印象之间大致的外部联系。这是认识的第一阶段。在这一阶段，人们还不能形成能够说明事物内在特点的概念，也不能作出符合逻辑的结论。","difficulty":2,"knowledge":["k-sensory"]},"p09":{"gist":"反复实践和思考使认识从感性转向理性。","plain":"本文认为，社会实践继续进行，产生感觉和印象的事物多次出现，人的认识会发生性质上的变化，也就是“飞跃”，从而形成概念。概念不再只是现象、局部和外部联系，而是把握事物的本质、整体和内部联系。因此，概念与感觉的差别不仅在数量上，也在性质上。进一步运用判断和推理，就能得出符合逻辑的结论。作者引用《三国演义》的说法，并用日常的“让我想一想”，说明人如何在头脑中使用概念，进行判断和推理。作者把这称为认识的第二阶段。作者继续用延安考察团作例子：考察者收集各种材料并思考以后，就能判断，共产党的抗日民族统一战线政策是彻底的、诚恳的、真实的。作出这一判断后，如果考察者也真心愿意团结救国，就能进一步推论，抗日民族统一战线能够成功。作者把形成概念、进行判断和推理的阶段，称为理性认识阶段，并认为它在认识一个事物的整个过程中更重要。作者说，认识真正要做的是从感觉进入思考，逐步理解事物内部的矛盾、规律，以及不同过程之间的内部联系，也就是达到理性认识。作者再次区分：感性认识看到局部、现象和外部联系；理性认识则进一步理解整体、本质和内部联系，发现周围世界内部的矛盾。这样，人们才能从整体及各方面内部联系上，把握世界的发展。","difficulty":3,"knowledge":["k-rational","k-first-leap"],"readingTip":"“突变（即飞跃）”是认识性质的变化。“论理的认识”在这里指理性认识；考察团是作者用于解释判断和推理的例子。","chunks":[{"quote":"社会实践的继续，使人们在实践中引起感觉和印象的东西反复了多次，于是在人们的脑子里生起了一个认识过程中的突变（即飞跃），产生了概念。","plain":"本文认为，社会实践继续进行，产生感觉和印象的事物多次出现，人的认识会发生性质上的变化，也就是“飞跃”，从而形成概念。"},{"quote":"概念这种东西已经不是事物的现象，不是事物的各个片面，不是它们的外部联系，而是抓着了事物的本质，事物的全体，事物的内部联系了。概念同感觉，不但是数量上的差别，而且有了性质上的差别。","plain":"概念不再只是现象、局部和外部联系，而是把握事物的本质、整体和内部联系。因此，概念与感觉的差别不仅在数量上，也在性质上。"},{"quote":"循此继进，使用判断和推理的方法，就可产生出合乎论理的结论来。《三国演义》上所谓“眉头一皱计上心来”，我们普通说话所谓“让我想一想”，就是人在脑子中运用概念以作判断和推理的工夫。","plain":"进一步运用判断和推理，就能得出符合逻辑的结论。作者引用《三国演义》的说法，并用日常的“让我想一想”，说明人如何在头脑中使用概念，进行判断和推理。"},{"quote":"这是认识的第二个阶段。","plain":"作者把这称为认识的第二阶段。"},{"quote":"外来的考察团先生们在他们集合了各种材料，加上他们“想了一想”之后，他们就能够作出“共产党的抗日民族统一战线的政策是彻底的、诚恳的和真实的”这样一个判断了。","plain":"作者继续用延安考察团作例子：考察者收集各种材料并思考以后，就能判断，共产党的抗日民族统一战线政策是彻底的、诚恳的、真实的。"},{"quote":"在他们作出这个判断之后，如果他们对于团结救国也是真实的的话，那末他们就能够进一步作出这样的结论：“抗日民族统一战线是能够成功的。”","plain":"作出这一判断后，如果考察者也真心愿意团结救国，就能进一步推论，抗日民族统一战线能够成功。"},{"quote":"这个概念、判断和推理的阶段，在人们对于一个事物的整个认识过程中是更重要的阶段，也就是理性认识的阶段。","plain":"作者把形成概念、进行判断和推理的阶段，称为理性认识阶段，并认为它在认识一个事物的整个过程中更重要。"},{"quote":"认识的真正任务在于经过感觉而到达于思维，到达于逐步了解客观事物的内部矛盾，了解它的规律性，了解这一过程和那一过程间的内部联系，即到达于论理的认识。","plain":"作者说，认识真正要做的是从感觉进入思考，逐步理解事物内部的矛盾、规律，以及不同过程之间的内部联系，也就是达到理性认识。"},{"quote":"重复地说，论理的认识所以和感性的认识不同，是因为感性的认识是属于事物之片面的、现象的、外部联系的东西，论理的认识则推进了一大步，到达了事物的全体的、本质的、内部联系的东西，到达了暴露周围世界的内在的矛盾，因而能在周围世界的总体上，在周围世界一切方面的内部联系上去把握周围世界的发展。","plain":"作者再次区分：感性认识看到局部、现象和外部联系；理性认识则进一步理解整体、本质和内部联系，发现周围世界内部的矛盾。这样，人们才能从整体及各方面内部联系上，把握世界的发展。"}]},"p10":{"gist":"感性与理性在实践中统一，间接知识也源于实践。","plain":"作者认为，以实践为基础、说明认识由浅入深发展的辩证唯物论，在马克思主义以前没有人这样提出过。作者认为，马克思主义唯物论第一次解决了这个问题：社会中的人，在生产和阶级斗争等复杂而反复的实践中，使认识从感性发展到理性。作者引用列宁的话说，对物质、自然规律、价值等进行科学的抽象，也就是从具体事物中提取共同的、重要的特点，能更充分、更准确地反映自然。作者说明，认识的较低阶段表现为感性，较高阶段表现为理性，两者都属于同一个认识过程。它们性质不同，却并不分开，而是在实践基础上联系为一个整体。作者说，感觉到一个东西，并不表示马上就理解它；理解以后，才能进一步把握所感觉的东西。感觉处理现象的问题，理论处理本质的问题。作者强调，解决这些问题完全不能离开实践。作者认为，任何人想认识某种事物，都必须接触它，在它所在的环境中生活和实践，否则无法认识它。作者举例说，封建社会里不能预先认识资本主义社会的规律，因为资本主义尚未出现，也没有相应的实践。因此，马克思主义只能产生于资本主义社会。作者说，马克思处在自由资本主义时代，不能预先具体认识帝国主义时代的某些特殊规律，因为作者所称的资本主义最后阶段——帝国主义——尚未到来，也就没有那种实践。作者认为，列宁和斯大林才能完成这项任务。作者认为，马克思、恩格斯、列宁、斯大林能够提出理论，除了个人才能，更主要的是亲自参加了当时的阶级斗争和科学实验。没有后一个条件，再有才能也不能成功。作者说，古代技术不发达，“秀才不出门，全知天下事”只是空话。现代技术发达，这种说法可以实现，但真正直接知道情况的，还是实际参加活动的人。他们在实践中获得知识，再通过文字和技术传给读书人，读书人才能间接了解各地的事。作者认为，要直接认识某种事物，就得亲自参加改变现实、改变这些事物的实践，才能接触其现象；也只有在这样的实践中，事物的本质才会显露出来，让人理解。作者说，每个人实际上都经过这样的认识过程，只是有些人故意歪曲，提出相反的话。作者批评那些自称知识内行的人。他们只听来一些片面知识，就把自己说成“天下第一”，恰好显出他们不能正确估计自己的能力。作者认为，求知识是严肃的科学问题，不能虚假或骄傲，而应诚实、谦虚。作者说，要获得知识，就要参加改变现实的实践。想知道梨的味道，就要通过亲口吃梨来改变梨。作者说，想知道原子的结构和性质，要做物理、化学实验，改变原子的状态；想知道革命的理论和方法，就要参加革命。作者认为，一切真正的知识都起源于直接经验。但一个人不可能事事亲自经历，事实上多数知识是间接经验，包括关于古代和外地的知识。这些知识对古人或外地人来说，是直接经验。如果他们在获得经验时，能按列宁所说进行科学的抽象，如实反映客观事物，这些知识就是可靠的；否则便不可靠。所以，一个人的知识有直接经验和间接经验两部分。对我是间接经验的知识，对别人仍是直接经验。作者因此认为，从全部知识的来源看，知识都离不开直接经验。作者认为，知识的来源在于人通过身体的感觉器官感受客观世界。否认这种感觉、否认直接经验、否认亲自改变现实的实践，就不属于唯物论的立场。作者说，自称“知识里手”的人可笑，原因就在这里。作者又引用老话“不入虎穴，焉得虎子”，意思是不进入老虎的洞穴，怎能得到小老虎。作者认为，这句话对于实际行动和关于认识的理论都是真理：要得到认识必须参与实践。作者的结论是，认识不可能离开实践。","difficulty":3,"knowledge":["k-unity","k-indirect","k-source","k-historical"],"readingTip":"这段有四层：两种认识的联系；认识受时代限制；亲身实践的例子；直接与间接经验。先按块读。“知识里手”在文中带讽刺意味，注释解释“里手”为内行。","chunks":[{"quote":"这种基于实践的由浅入深的辩证唯物论的关于认识发展过程的理论，在马克思主义以前，是没有一个人这样解决过的。","plain":"作者认为，以实践为基础、说明认识由浅入深发展的辩证唯物论，在马克思主义以前没有人这样提出过。"},{"quote":"马克思主义的唯物论，第一次正确地解决了这个问题，唯物地而且辩证地指出了认识的深化的运动，指出了社会的人在他们的生产和阶级斗争的复杂的、经常反复的实践中，由感性认识到论理认识的推移的运动。","plain":"作者认为，马克思主义唯物论第一次解决了这个问题：社会中的人，在生产和阶级斗争等复杂而反复的实践中，使认识从感性发展到理性。"},{"quote":"列宁说过：“物质的抽象，自然规律的抽象，价值的抽象以及其它等等，一句话，一切科学的（正确的、郑重的、非瞎说的）抽象，都更深刻、更正确、更完全地反映着自然。”","plain":"作者引用列宁的话说，对物质、自然规律、价值等进行科学的抽象，也就是从具体事物中提取共同的、重要的特点，能更充分、更准确地反映自然。"},{"quote":"马克思列宁主义认为：认识过程中两个阶段的特性，在低级阶段，认识表现为感性的，在高级阶段，认识表现为论理的，但任何阶段，都是统一的认识过程中的阶段。感性和理性二者的性质不同，但又不是互相分离的，它们在实践的基础上统一起来了。","plain":"作者说明，认识的较低阶段表现为感性，较高阶段表现为理性，两者都属于同一个认识过程。它们性质不同，却并不分开，而是在实践基础上联系为一个整体。"},{"quote":"我们的实践证明：感觉到了的东西，我们不能立刻理解它，只有理解了的东西才更深刻地感觉它。感觉只解决现象问题，理论才解决本质问题。","plain":"作者说，感觉到一个东西，并不表示马上就理解它；理解以后，才能进一步把握所感觉的东西。感觉处理现象的问题，理论处理本质的问题。"},{"quote":"这些问题的解决，一点也不能离开实践。","plain":"作者强调，解决这些问题完全不能离开实践。"},{"quote":"无论何人要认识什么事物，除了同那个事物接触，即生活于（实践于）那个事物的环境中，是没有法子解决的。","plain":"作者认为，任何人想认识某种事物，都必须接触它，在它所在的环境中生活和实践，否则无法认识它。"},{"quote":"不能在封建社会就预先认识资本主义社会的规律，因为资本主义还未出现，还无这种实践。马克思主义只能是资本主义社会的产物。","plain":"作者举例说，封建社会里不能预先认识资本主义社会的规律，因为资本主义尚未出现，也没有相应的实践。因此，马克思主义只能产生于资本主义社会。"},{"quote":"马克思不能在自由资本主义时代就预先具体地认识帝国主义时代的某些特异的规律，因为帝国主义这个资本主义最后阶段还未到来，还无这种实践，只有列宁和斯大林才能担当此项任务。","plain":"作者说，马克思处在自由资本主义时代，不能预先具体认识帝国主义时代的某些特殊规律，因为作者所称的资本主义最后阶段——帝国主义——尚未到来，也就没有那种实践。作者认为，列宁和斯大林才能完成这项任务。"},{"quote":"马克思、恩格斯、列宁、斯大林之所以能够作出他们的理论，除了他们的天才条件之外，主要地是他们亲自参加了当时的阶级斗争和科学实验的实践，没有这后一个条件，任何天才也是不能成功的。","plain":"作者认为，马克思、恩格斯、列宁、斯大林能够提出理论，除了个人才能，更主要的是亲自参加了当时的阶级斗争和科学实验。没有后一个条件，再有才能也不能成功。"},{"quote":"“秀才不出门，全知天下事”，在技术不发达的古代只是一句空话，在技术发达的现代虽然可以实现这句话，然而真正亲知的是天下实践着的人，那些人在他们的实践中间取得了“知”，经过文字和技术的传达而到达于“秀才”之手，秀才乃能间接地“知天下事”。","plain":"作者说，古代技术不发达，“秀才不出门，全知天下事”只是空话。现代技术发达，这种说法可以实现，但真正直接知道情况的，还是实际参加活动的人。他们在实践中获得知识，再通过文字和技术传给读书人，读书人才能间接了解各地的事。"},{"quote":"如果要直接地认识某种或某些事物，便只有亲身参加于变革现实、变革某种或某些事物的实践的斗争中，才能触到那种或那些事物的现象，也只有在亲身参加变革现实的实践的斗争中，才能暴露那种或那些事物的本质而理解它们。","plain":"作者认为，要直接认识某种事物，就得亲自参加改变现实、改变这些事物的实践，才能接触其现象；也只有在这样的实践中，事物的本质才会显露出来，让人理解。"},{"quote":"这是任何人实际上走着的认识路程，不过有些人故意歪曲地说些反对的话罢了。世上最可笑的是那些“知识里手”","plain":"作者说，每个人实际上都经过这样的认识过程，只是有些人故意歪曲，提出相反的话。作者批评那些自称知识内行的人。"},{"quote":"，有了道听途说的一知半解，便自封为“天下第一”，适足见其不自量而已。知识的问题是一个科学问题，来不得半点的虚伪和骄傲，决定地需要的倒是其反面——诚实和谦逊的态度。","plain":"他们只听来一些片面知识，就把自己说成“天下第一”，恰好显出他们不能正确估计自己的能力。作者认为，求知识是严肃的科学问题，不能虚假或骄傲，而应诚实、谦虚。"},{"quote":"你要有知识，你就得参加变革现实的实践。你要知道梨子的滋味，你就得变革梨子，亲口吃一吃。","plain":"作者说，要获得知识，就要参加改变现实的实践。想知道梨的味道，就要通过亲口吃梨来改变梨。"},{"quote":"你要知道原子的组织同性质，你就得实行物理学和化学的实验，变革原子的情况。你要知道革命的理论和方法，你就得参加革命。","plain":"作者说，想知道原子的结构和性质，要做物理、化学实验，改变原子的状态；想知道革命的理论和方法，就要参加革命。"},{"quote":"一切真知都是从直接经验发源的。但人不能事事直接经验，事实上多数的知识都是间接经验的东西，这就是一切古代的和外域的知识。","plain":"作者认为，一切真正的知识都起源于直接经验。但一个人不可能事事亲自经历，事实上多数知识是间接经验，包括关于古代和外地的知识。"},{"quote":"这些知识在古人在外人是直接经验的东西，如果在古人外人直接经验时是符合于列宁所说的条件“科学的抽象”，是科学地反映了客观的事物，那末这些知识是可靠的，否则就是不可靠的。","plain":"这些知识对古人或外地人来说，是直接经验。如果他们在获得经验时，能按列宁所说进行科学的抽象，如实反映客观事物，这些知识就是可靠的；否则便不可靠。"},{"quote":"所以，一个人的知识，不外直接经验的和间接经验的两部分。而且在我为间接经验者，在人则仍为直接经验。","plain":"所以，一个人的知识有直接经验和间接经验两部分。对我是间接经验的知识，对别人仍是直接经验。"},{"quote":"因此，就知识的总体说来，无论何种知识都是不能离开直接经验的。","plain":"作者因此认为，从全部知识的来源看，知识都离不开直接经验。"},{"quote":"任何知识的来源，在于人的肉体感官对客观外界的感觉，否认了这个感觉，否认了直接经验，否认亲自参加变革现实的实践，他就不是唯物论者。","plain":"作者认为，知识的来源在于人通过身体的感觉器官感受客观世界。否认这种感觉、否认直接经验、否认亲自改变现实的实践，就不属于唯物论的立场。"},{"quote":"“知识里手”之所以可笑，原因就是在这个地方。中国人有一句老话：“不入虎穴，焉得虎子。”","plain":"作者说，自称“知识里手”的人可笑，原因就在这里。作者又引用老话“不入虎穴，焉得虎子”，意思是不进入老虎的洞穴，怎能得到小老虎。"},{"quote":"这句话对于人们的实践是真理，对于认识论也是真理。离开实践的认识是不可能的。","plain":"作者认为，这句话对于实际行动和关于认识的理论都是真理：要得到认识必须参与实践。作者的结论是，认识不可能离开实践。"}]},"p11":{"gist":"下文用具体例子说明认识怎样逐步发展。","plain":"作者为了让读者更清楚地理解，人在改变现实的实践中，认识怎样按照辩证唯物论所说的方式逐步发展、加深，接下来又举出几个具体例子。","difficulty":1,"knowledge":["k-first-leap"]},"p12":{"gist":"作者用工人斗争说明从局部经验到理论的变化。","plain":"作者用无产阶级认识资本主义作例子。在最初破坏机器、自发斗争的时期，工人还处于感性认识阶段，只认识资本主义的部分现象和外部联系。作者把这时的无产阶级称为“自在的阶级”。后来，他们进入有意识、有组织地进行经济和政治斗争的时期。长期斗争积累了经验，马克思和恩格斯用科学方法总结这些经验，形成马克思主义理论，再用理论教育无产阶级。作者认为，这样，工人就理解了资本主义社会的本质、阶级之间的剥削关系，以及无产阶级在历史上的任务。这时，他们成为了“自为的阶级”，也就是具有自觉认识的阶级。","difficulty":3,"knowledge":["k-first-leap","k-rational"]},"p13":{"gist":"作者用中国人民认识帝国主义的过程举例。","plain":"作者说，中国人民对帝国主义的认识也经历了两个阶段。作者把第一阶段说成只看表面的感性认识，并把太平天国、义和团等运动中笼统地反对外来事物的斗争放在这一阶段。作者认为，第二阶段从1919年五四运动前后开始：人们进入理性认识，看到帝国主义内部和外部的矛盾，也看到帝国主义联合中国买办阶级、封建阶级压榨中国人民的实质。","difficulty":3,"knowledge":["k-first-leap","k-historical"],"readingTip":"这里是在转述作者的历史判断。请同时读注释[5]：毛泽东后来在给李达的信中说，把太平天国放在排外主义中一起说“不妥”，拟作修改；本版正文仍保留原文。"},"p14":{"gist":"战争经验使领导者逐步掌握具体战争的规律。","plain":"作者再以战争为例。没有战争经验的领导者，刚开始时，不了解怎样指导一场具体战争，例如作者所说的过去十年的土地革命战争。他们最初只是在实际作战中积累了许多经验，而且经常打败仗。后来，胜仗的经验，尤其是败仗的经验，让他们逐步理解贯穿整场战争的内部联系，也就是这场具体战争的规律。他们因此懂得战略和战术，能够比较有把握地指挥。如果这时换一个没有经验的人来指挥，这个人也要先打一些败仗、获得经验，才能理解战争的正确规律。","difficulty":2,"knowledge":["k-first-leap"],"readingTip":"按“没有经验→经历胜败→理解规律→指导战争”读。末句的“此时”指原来的领导者已经有经验的时候；“一个无经验的人”是后来替换的人。"},"p15":{"gist":"工作信心来自了解实际，主观发令容易失败。","plain":"作者说，有些同志不敢接受工作任务，常说“没有把握”。原因是他们不了解工作内容和环境中的规律：可能从未做过，也可能接触太少，因此谈不上掌握规律。详细分析工作情况和环境后，他们就觉得较有把握，愿意去做。如果做了一段时间，有了经验，又肯谦虚地观察和了解情况，而不是只凭个人想法、只看一部分或只看表面，就能自己判断应当怎样工作，勇气也会增加。相反，作者批评有些人一到某地，既不问环境，也不看事情的历史和全部现状，还不研究事物的性质及其与其他事物的内部联系，就自以为对，开始下命令。作者认为，这样的人必然会遇到失败。","difficulty":2,"knowledge":["k-source","k-subject-object"]},"p16":{"gist":"丰富、真实的感觉材料是形成正确认识的条件。","plain":"作者归纳说，认识的第一步是接触外部事物，得到感觉。第二步是把这些感觉材料集中起来，加以整理和加工，形成概念，作出判断和推理。只有材料足够丰富，不是零碎、不完整的，并且符合实际，不是错觉，才能以此形成正确的概念和推理。","difficulty":2,"knowledge":["k-material","k-first-leap"]},"p17":{"gist":"理性认识必须以感性经验为来源。","plain":"作者提出两个需要特别说明的要点，先重复第一个：理性认识依赖感性认识。如果认为理性认识可以不从感性认识中来，就属于唯心论。作者批评哲学史上的“唯理论”：它只承认理性的真实存在，不承认经验的真实存在，认为只有理性可靠，而感觉经验不可靠。作者认为，这把事实颠倒了。理性之所以可靠，正是因为它来自感性；否则就像没有水源的水、没有根的树，只剩下头脑里凭空产生的不可靠想法。从认识发生的顺序看，感觉经验在先。作者强调社会实践，是因为只有实践才能让认识开始发生，让人从客观世界获得感觉经验。如果一个人完全不听不看，与外部世界隔绝，就谈不上认识。作者把“认识开始于经验”称为认识论中的唯物论观点。","difficulty":3,"knowledge":["k-unity","k-source"]},"p18":{"gist":"经验需要经过思考加工，才能认识本质。","plain":"作者的第二个要点是：认识还要继续加深，从感性阶段发展到理性阶段。作者把这种发展称为认识论的辩证法。作者认为，如果停在感性阶段，只相信感性认识，认为理性不可靠，就重复了历史上经验论的错误。感觉材料确实反映了客观世界的某些真实情况，但只反映局部和表面，并不完整，也没有反映本质。作者补充说，这里讨论的不是把经验仅仅当作内心体验的那种唯心主义经验论。要反映整个事物、本质和内部规律，就要思考、加工丰富的感觉材料：去掉粗杂部分，留下重要部分；排除假的，保留真的；从一个方面联系到其他方面；从表面进入内部。这样才能形成有系统的概念和理论，从感性进入理性。作者认为，经过这种加工的认识，并不会更空洞、更不可靠。只要它以实践为基础，经过科学方法加工，正如列宁所说，就能更充分、更准确地反映客观事物。作者批评只忙于具体事务的人：他们重经验、轻理论，看不到客观过程的整体，缺少明确方向和长远眼光，却满足于一点成绩和局部见解。作者认为，如果这样的人指导革命，就会使革命遇到失败。","difficulty":3,"knowledge":["k-empiricism","k-first-leap","k-material"],"readingTip":"“固然……但……”先承认感觉材料有真实的一面，再说明它不完整。“去粗取精”等四个短语，都在说明怎样加工材料。","chunks":[{"quote":"第二是认识有待于深化，认识的感性阶段有待于发展到理性阶段——这就是认识论的辩证法","plain":"作者的第二个要点是：认识还要继续加深，从感性阶段发展到理性阶段。作者把这种发展称为认识论的辩证法。"},{"quote":"。如果以为认识可以停顿在低级的感性阶段，以为只有感性认识可靠，而理性认识是靠不住的，这便是重复了历史上的“经验论”的错误。","plain":"作者认为，如果停在感性阶段，只相信感性认识，认为理性不可靠，就重复了历史上经验论的错误。"},{"quote":"这种理论的错误，在于不知道感觉材料固然是客观外界某些真实性的反映（我这里不来说经验只是所谓内省体验的那种唯心的经验论），但它们仅是片面的和表面的东西，这种反映是不完全的，是没有反映事物本质的。","plain":"感觉材料确实反映了客观世界的某些真实情况，但只反映局部和表面，并不完整，也没有反映本质。作者补充说，这里讨论的不是把经验仅仅当作内心体验的那种唯心主义经验论。"},{"quote":"要完全地反映整个的事物，反映事物的本质，反映事物的内部规律性，就必须经过思考作用，将丰富的感觉材料加以去粗取精、去伪存真、由此及彼、由表及里的改造制作工夫，造成概念和理论的系统，就必须从感性认识跃进到理性认识。","plain":"要反映整个事物、本质和内部规律，就要思考、加工丰富的感觉材料：去掉粗杂部分，留下重要部分；排除假的，保留真的；从一个方面联系到其他方面；从表面进入内部。这样才能形成有系统的概念和理论，从感性进入理性。"},{"quote":"这种改造过的认识，不是更空虚了更不可靠了的认识，相反，只要是在认识过程中根据于实践基础而科学地改造过的东西，正如列宁所说乃是更深刻、更正确、更完全地反映客观事物的东西。","plain":"作者认为，经过这种加工的认识，并不会更空洞、更不可靠。只要它以实践为基础，经过科学方法加工，正如列宁所说，就能更充分、更准确地反映客观事物。"},{"quote":"庸俗的事务主义家不是这样，他们尊重经验而看轻理论，因而不能通观客观过程的全体，缺乏明确的方针，没有远大的前途，沾沾自喜于一得之功和一孔之见。这种人如果指导革命，就会引导革命走上碰壁的地步。","plain":"作者批评只忙于具体事务的人：他们重经验、轻理论，看不到客观过程的整体，缺少明确方向和长远眼光，却满足于一点成绩和局部见解。作者认为，如果这样的人指导革命，就会使革命遇到失败。"}]},"p19":{"gist":"理性依赖感性，感性又需要发展为理性。","plain":"作者总结说，理性认识以感性认识为基础，感性认识还需要发展为理性认识，这就是辩证唯物论的认识论。作者认为，唯理论和经验论都不理解认识受历史条件影响、又不断发展的特点。它们各自包含一部分真理，但作者在这里特指其中属于唯物论的派别，不包括属于唯心论的派别。从认识论整体看，作者仍认为它们是错误的。由感性发展到理性的过程，不仅适用于认识一件事或一项工作这样的小过程，也适用于认识一个社会或一场革命这样的大过程。","difficulty":3,"knowledge":["k-unity","k-empiricism"]},"p20":{"gist":"认识还须回到实践，指导行动并接受检验。","plain":"作者说，认识发展到这里还没有结束。如果只达到理性认识，就只讲了整个问题的一半；对马克思主义哲学来说，还是不那么重要的一半。作者认为，更重要的不只是了解客观规律、解释世界，而是用这些认识主动地改变世界。作者强调理论的重要性，并引用列宁的话：没有革命的理论，就不会有革命的运动。作者说，马克思主义重视理论，正是因为理论能指导行动。如果有了正确理论，只是空谈，把它放在一边，不去实行，那么理论再好也没有意义。认识从实践开始，在实践中形成理论后，还必须回到实践。认识的主动作用，一方面表现为从感性到理性的飞跃，更重要的一方面，是从理性认识回到革命实践的飞跃。作者认为，掌握了世界规律的认识，必须重新用于改变世界的活动：生产、革命的阶级斗争和民族斗争，以及科学实验。这既检验理论，也发展理论，是认识过程的继续。从感性发展到理性，并没有也不能完全解决理论是否符合客观实际的问题。要解决这个问题，就要把理论放回社会实践，应用它，看看能不能达到预期目的。作者认为，自然科学理论被称为真理，不仅因为科学家创立了学说，还因为后来的科学实践证实了它们。作者同样认为，马克思列宁主义被称为真理，不仅因为马克思、恩格斯、列宁、斯大林等人建立了这些学说，还因为后来的革命阶级斗争和民族斗争实践证实了它们。作者把辩证唯物论称为普遍真理，理由是他认为，无论谁的实践都不能超出它所说明的范围。作者说，认识史表明，不少理论含有真理，却不完整，实践检验补正了它们；还有不少理论是错误的，实践检验纠正了这些错误。作者认为，这正是把实践作为真理标准、把生活和实践作为认识论首要和基本观点的理由。作者最后引用斯大林的话：理论如果不联系革命实践，就没有实际对象；实践如果没有革命理论指路，就会缺少方向。","difficulty":3,"knowledge":["k-second-leap","k-criterion"],"readingTip":"先读两次“飞跃”，再读“检验理论和发展理论”。作者区分“提出理论”和“实践证实理论”，并说行动结果可能要求修改理论。","chunks":[{"quote":"然而认识运动至此还没有完结。","plain":"作者说，认识发展到这里还没有结束。"},{"quote":"辩证唯物论的认识运动，如果只到理性认识为止，那末还只说到问题的一半。而且对于马克思主义的哲学说来，还只说到非十分重要的那一半。","plain":"如果只达到理性认识，就只讲了整个问题的一半；对马克思主义哲学来说，还是不那么重要的一半。"},{"quote":"马克思主义的哲学认为十分重要的问题，不在于懂得了客观世界的规律性，因而能够解释世界，而在于拿了这种对于客观规律性的认识去能动地改造世界。","plain":"作者认为，更重要的不只是了解客观规律、解释世界，而是用这些认识主动地改变世界。"},{"quote":"在马克思主义看来，理论是重要的，它的重要性充分地表现在列宁说过的一句话：“没有革命的理论，就不会有革命的运动。”","plain":"作者强调理论的重要性，并引用列宁的话：没有革命的理论，就不会有革命的运动。"},{"quote":"然而马克思主义看重理论，正是，也仅仅是，因为它能够指导行动。如果有了正确的理论，只是把它空谈一阵，束之高阁，并不实行，那末，这种理论再好也是没有意义的。","plain":"作者说，马克思主义重视理论，正是因为理论能指导行动。如果有了正确理论，只是空谈，把它放在一边，不去实行，那么理论再好也没有意义。"},{"quote":"认识从实践始，经过实践得到了理论的认识，还须再回到实践去。认识的能动作用，不但表现于从感性的认识到理性的认识之能动的飞跃，更重要的还须表现于从理性的认识到革命的实践这一个飞跃。","plain":"认识从实践开始，在实践中形成理论后，还必须回到实践。认识的主动作用，一方面表现为从感性到理性的飞跃，更重要的一方面，是从理性认识回到革命实践的飞跃。"},{"quote":"抓着了世界的规律性的认识，必须把它再回到改造世界的实践中去，再用到生产的实践、革命的阶级斗争和民族斗争的实践以及科学实验的实践中去。这就是检验理论和发展理论的过程，是整个认识过程的继续。","plain":"作者认为，掌握了世界规律的认识，必须重新用于改变世界的活动：生产、革命的阶级斗争和民族斗争，以及科学实验。这既检验理论，也发展理论，是认识过程的继续。"},{"quote":"理论的东西之是否符合于客观真理性这个问题，在前面说的由感性到理性之认识运动中是没有完全解决的，也不能完全解决的。要完全地解决这个问题，只有把理性的认识再回到社会实践中去，应用理论于实践，看它是否能够达到预想的目的。","plain":"从感性发展到理性，并没有也不能完全解决理论是否符合客观实际的问题。要解决这个问题，就要把理论放回社会实践，应用它，看看能不能达到预期目的。"},{"quote":"许多自然科学理论之所以被称为真理，不但在于自然科学家们创立这些学说的时候，而且在于为尔后的科学实践所证实的时候。","plain":"作者认为，自然科学理论被称为真理，不仅因为科学家创立了学说，还因为后来的科学实践证实了它们。"},{"quote":"马克思列宁主义之所以被称为真理，也不但在于马克思、恩格斯、列宁、斯大林等人科学地构成这些学说的时候，而且在于为尔后革命的阶级斗争和民族斗争的实践所证实的时候。","plain":"作者同样认为，马克思列宁主义被称为真理，不仅因为马克思、恩格斯、列宁、斯大林等人建立了这些学说，还因为后来的革命阶级斗争和民族斗争实践证实了它们。"},{"quote":"辩证唯物论之所以为普遍真理，在于经过无论什么人的实践都不能逃出它的范围。","plain":"作者把辩证唯物论称为普遍真理，理由是他认为，无论谁的实践都不能超出它所说明的范围。"},{"quote":"人类认识的历史告诉我们，许多理论的真理性是不完全的，经过实践的检验而纠正了它们的不完全性。许多理论是错误的，经过实践的检验而纠正其错误。","plain":"作者说，认识史表明，不少理论含有真理，却不完整，实践检验补正了它们；还有不少理论是错误的，实践检验纠正了这些错误。"},{"quote":"所谓实践是真理的标准，所谓“生活、实践底观点，应该是认识论底首先的和基本的观点”","plain":"作者认为，这正是把实践作为真理标准、把生活和实践作为认识论首要和基本观点的理由。"},{"quote":"，理由就在这个地方。斯大林说得好：“理论若不和革命实践联系起来，就会变成无对象的理论，同样，实践若不以革命理论为指南，就会变成盲目的实践。”","plain":"作者最后引用斯大林的话：理论如果不联系革命实践，就没有实际对象；实践如果没有革命理论指路，就会缺少方向。"}]},"p21":{"gist":"具体阶段的认识可以完成，计划常需实践修正。","plain":"作者提出，认识到这里是否完成了？回答是：从一个角度说完成了，从另一个角度说还没有完成。作者解释第一个角度：人们参加改变某一发展阶段内某个客观过程的实践，可以是改变自然，也可以是改变社会。客观过程在人脑中得到反映，再加上人主动思考，认识就由感性进入理性，形成大体符合该过程规律的思想、理论、计划或方案。把它们再用到同一个过程的实践中，如果实现了预期目的，使原来的设想成为事实，或大体成为事实，那么，对这个具体过程的认识就算完成了。作者举例：改变自然时，完成工程计划、证实科学假想、制成器物、收获农作物；改变社会时，罢工或战争取得胜利、教育计划得到实行，都属于实现了预期目的。但作者说，无论改变自然还是社会，原来的思想、理论、计划和方案，很少能完全不作修改就实现。因为参加实践的人受到许多限制，不仅有科学技术条件的限制，也有客观过程本身发展程度、显露程度的限制：它的各个方面和本质可能还没有充分表现出来。实践中可能出现原来没有料到的情况，所以人们常要部分修改思想、理论、计划或方案，有时甚至要全部改变。这说明原来的想法和方案，可能部分不符合实际，也可能全部不符合实际；可能部分有错，也可能全错。作者说，许多时候，人们要经历多次失败，才能纠正错误认识，使它符合客观规律，进而把头脑中的设想变成现实，在实践中取得预想结果。无论经历怎样的过程，一旦达到这个结果，人们对某个客观过程在某一发展阶段的认识，就算完成了。","difficulty":3,"knowledge":["k-completion","k-criterion"],"readingTip":"“完成了”始终有限定：某一过程的某一发展阶段。第二块长句可拆成“参加实践→形成方案→应用方案→预期成为事实”。","chunks":[{"quote":"说到这里，认识运动就算完成了吗？我们的答复是完成了，又没有完成。","plain":"作者提出，认识到这里是否完成了？回答是：从一个角度说完成了，从另一个角度说还没有完成。"},{"quote":"社会的人们投身于变革在某一发展阶段内的某一客观过程的实践中（不论是关于变革某一自然过程的实践，或变革某一社会过程的实践），由于客观过程的反映和主观能动性的作用，使得人们的认识由感性的推移到了理性的，造成了大体上相应于该客观过程的法则性的思想、理论、计划或方案，然后再应用这种思想、理论、计划或方案于该同一客观过程的实践，如果能够实现预想的目的，即将预定的思想、理论、计划、方案在该同一过程的实践中变为事实，或者大体上变为事实，那末，对于这一具体过程的认识运动算是完成了。","plain":"作者解释第一个角度：人们参加改变某一发展阶段内某个客观过程的实践，可以是改变自然，也可以是改变社会。客观过程在人脑中得到反映，再加上人主动思考，认识就由感性进入理性，形成大体符合该过程规律的思想、理论、计划或方案。把它们再用到同一个过程的实践中，如果实现了预期目的，使原来的设想成为事实，或大体成为事实，那么，对这个具体过程的认识就算完成了。"},{"quote":"例如，在变革自然的过程中，某一工程计划的实现，某一科学假想的证实，某一器物的制成，某一农产的收获，在变革社会过程中某一罢工的胜利，某一战争的胜利，某一教育计划的实现，都算实现了预想的目的。","plain":"作者举例：改变自然时，完成工程计划、证实科学假想、制成器物、收获农作物；改变社会时，罢工或战争取得胜利、教育计划得到实行，都属于实现了预期目的。"},{"quote":"然而一般地说来，不论在变革自然或变革社会的实践中，人们原定的思想、理论、计划、方案，毫无改变地实现出来的事，是很少的。","plain":"但作者说，无论改变自然还是社会，原来的思想、理论、计划和方案，很少能完全不作修改就实现。"},{"quote":"这是因为从事变革现实的人们，常常受着许多的限制，不但常常受着科学条件和技术条件的限制，而且也受着客观过程的发展及其表现程度的限制（客观过程的方面及本质尚未充分暴露）。","plain":"因为参加实践的人受到许多限制，不仅有科学技术条件的限制，也有客观过程本身发展程度、显露程度的限制：它的各个方面和本质可能还没有充分表现出来。"},{"quote":"在这种情形之下，由于实践中发现前所未料的情况，因而部分地改变思想、理论、计划、方案的事是常有的，全部地改变的事也是有的。","plain":"实践中可能出现原来没有料到的情况，所以人们常要部分修改思想、理论、计划或方案，有时甚至要全部改变。"},{"quote":"即是说，原定的思想、理论、计划、方案，部分地或全部地不合于实际，部分错了或全部错了的事，都是有的。","plain":"这说明原来的想法和方案，可能部分不符合实际，也可能全部不符合实际；可能部分有错，也可能全错。"},{"quote":"许多时候须反复失败过多次，才能纠正错误的认识，才能到达于和客观过程的规律性相符合，因而才能够变主观的东西为客观的东西，即在实践中得到预想的结果。","plain":"作者说，许多时候，人们要经历多次失败，才能纠正错误认识，使它符合客观规律，进而把头脑中的设想变成现实，在实践中取得预想结果。"},{"quote":"但是不管怎样，到了这种时候，人们对于在某一发展阶段内的某一客观过程的认识运动，算是完成了。","plain":"无论经历怎样的过程，一旦达到这个结果，人们对某个客观过程在某一发展阶段的认识，就算完成了。"}]},"p22":{"gist":"对象继续变化，认识和工作方案也必须发展。","plain":"作者从过程继续发展的角度说，认识还没有完成。无论自然还是社会，各种过程都会因为内部的矛盾和斗争而继续发展，人的认识也应该跟着发展。就社会运动而言，作者认为，革命领导者不只要在思想、理论、计划、方案出错时改正它们，还要在客观过程进入新阶段时，让自己和其他革命参加者的认识也随之改变。也就是说，要根据新情况提出新的革命任务和工作方案。作者说，革命时期情况变化很快，如果革命者的认识不能及时改变，就不能领导革命取得胜利。","difficulty":2,"knowledge":["k-historical","k-cycle"]},"p23":{"gist":"作者批评思想停留在旧阶段的右倾机会主义。","plain":"作者说，人的认识受到许多社会条件限制，所以思想落后于实际的情况经常发生。作者反对革命队伍里的顽固派，认为他们的思想不能随客观情况的变化而前进，在历史上表现为右倾机会主义。他们看不出矛盾斗争已经推动实际情况发展，认识却停在旧阶段。作者把这看作所有顽固派共有的思想特点：脱离社会实践，不能走在前面引导社会。作者用车作比喻，说他们只会跟在车后抱怨车走得太快，还想把车往回拉，让社会倒退。","difficulty":3,"knowledge":["k-right"]},"p24":{"gist":"作者也反对超过现实条件、急于实行的冒险主义。","plain":"作者同样反对“左”翼空谈主义。这些人的思想超过了客观过程当时所处的发展阶段。有些人把幻想当成真理；另一些人把只有将来才有可能实现的理想，硬要在现在实行。作者认为，他们脱离了当时大多数人的实践，也脱离了当时的现实条件，在行动上表现为冒险主义。","difficulty":3,"knowledge":["k-left"],"readingTip":"“有些……有些……”并列两种情况。“仅在将来有现实可能性的”修饰“理想”。与 p23 对照：一个停在过去，一个急着把将来放到现在。"},"p25":{"gist":"认识须在具体历史条件下与实际、实践统一。","plain":"作者认为，唯心论、机械唯物论、机会主义和冒险主义的共同特点，是把人的想法与客观实际分开，把认识与实践分开。作者说，马克思列宁主义的认识论以科学的社会实践为特点，因此必须反对这些思想。作者认为，整个宇宙总的发展过程是绝对的，而每个具体过程的发展是相对的。因此，人对具体过程在某一发展阶段的认识，也只具有相对的真理性，也就是说，受到特定阶段和条件的限制。作者认为，无数相对真理加在一起，构成绝对真理。作者说，客观过程的发展充满矛盾和斗争，人的认识的发展也同样如此。客观世界中各种辩证发展的运动，早晚都能反映到人的认识里。社会实践不断产生、发展和消失，没有终点；人的认识也不断产生、发展和消失，没有终点。人们按照一定的思想、理论、计划或方案，一次次进行改变客观现实的实践，认识也就一次次加深。作者认为，客观世界永远在变化，所以人们通过实践认识真理的过程也永远不会结束。马克思列宁主义没有把真理全部讲完，而是不断通过实践开出认识真理的道路。作者最后提出，人的想法与客观实际、理论与实践、认识与行动，应当在具体的历史条件下统一。作者反对一切脱离具体历史条件的“左”的或右的错误思想。","difficulty":3,"knowledge":["k-subject-object","k-relative","k-cycle"],"readingTip":"分三层读：批评认识与实践分开；说明相对真理与不断发展；提出“具体的历史的统一”。“不能不”是双重否定，意思是“必须”。","chunks":[{"quote":"唯心论和机械唯物论，机会主义和冒险主义，都是以主观和客观相分裂，以认识和实践相脱离为特征的。","plain":"作者认为，唯心论、机械唯物论、机会主义和冒险主义的共同特点，是把人的想法与客观实际分开，把认识与实践分开。"},{"quote":"以科学的社会实践为特征的马克思列宁主义的认识论，不能不坚决反对这些错误思想。","plain":"作者说，马克思列宁主义的认识论以科学的社会实践为特点，因此必须反对这些思想。"},{"quote":"马克思主义者承认，在绝对的总的宇宙发展过程中，各个具体过程的发展都是相对的，因而在绝对真理的长河中，人们对于在各个一定发展阶段上的具体过程的认识只具有相对的真理性。","plain":"作者认为，整个宇宙总的发展过程是绝对的，而每个具体过程的发展是相对的。因此，人对具体过程在某一发展阶段的认识，也只具有相对的真理性，也就是说，受到特定阶段和条件的限制。"},{"quote":"无数相对的真理之总和，就是绝对的真理","plain":"作者认为，无数相对真理加在一起，构成绝对真理。"},{"quote":"。客观过程的发展是充满着矛盾和斗争的发展，人的认识运动的发展也是充满着矛盾和斗争的发展。","plain":"作者说，客观过程的发展充满矛盾和斗争，人的认识的发展也同样如此。"},{"quote":"一切客观世界的辩证法的运动，都或先或后地能够反映到人的认识中来。社会实践中的发生、发展和消灭的过程是无穷的，人的认识的发生、发展和消灭的过程也是无穷的。","plain":"客观世界中各种辩证发展的运动，早晚都能反映到人的认识里。社会实践不断产生、发展和消失，没有终点；人的认识也不断产生、发展和消失，没有终点。"},{"quote":"根据于一定的思想、理论、计划、方案以从事于变革客观现实的实践，一次又一次地向前，人们对于客观现实的认识也就一次又一次地深化。","plain":"人们按照一定的思想、理论、计划或方案，一次次进行改变客观现实的实践，认识也就一次次加深。"},{"quote":"客观现实世界的变化运动永远没有完结，人们在实践中对于真理的认识也就永远没有完结。马克思列宁主义并没有结束真理，而是在实践中不断地开辟认识真理的道路。","plain":"作者认为，客观世界永远在变化，所以人们通过实践认识真理的过程也永远不会结束。马克思列宁主义没有把真理全部讲完，而是不断通过实践开出认识真理的道路。"},{"quote":"我们的结论是主观和客观、理论和实践、知和行的具体的历史的统一，反对一切离开具体历史的“左”的或右的错误思想。","plain":"作者最后提出，人的想法与客观实际、理论与实践、认识与行动，应当在具体的历史条件下统一。作者反对一切脱离具体历史条件的“左”的或右的错误思想。"}]},"p26":{"gist":"作者提出同时改造客观世界与主观世界。","plain":"作者认为，社会发展到文章写作的时代，正确认识世界、改变世界的责任，已经由历史交给无产阶级及其政党。作者说，按照科学认识来改造世界的实践，在中国和世界都到了一个从未有过的重要阶段：要推翻中国和世界中黑暗的一面，使它们成为前所未有的光明世界。作者提出，无产阶级和革命人民不只要改造客观世界，也要改造自己的主观世界，也就是改善认识能力，调整自己的思想同客观世界的关系。作者把当时的苏联说成已经在一部分地区实行这种改造、并继续推进这一过程的例子；中国和世界其他地方的人民，也正在或将要经历这种改造。作者还说，需要改造的客观世界包括反对改造的人。他认为，对这些人的改造要先经过强迫阶段，才能进入他们自觉参与的阶段。作者把所有人都自觉改造自己和世界的时代，称为世界的共产主义时代。","difficulty":3,"knowledge":["k-transform"],"readingTip":"“今天的时代”指作者写作时的历史语境。“下述的任务”后面分两项：改造外部世界，改造自己的认识能力及其与外部世界的关系。"},"p27":{"gist":"实践与认识循环发展，知与行相互统一。","plain":"作者最后总结：人通过实践发现真理，也通过实践证实、发展真理。人主动地把感性认识发展为理性认识，再用理性认识主动指导革命实践，改造自己的主观世界和客观世界。这个过程是实践、认识、再实践、再认识，不断循环，没有终点。每次循环的内容，都比上一次达到较高的程度。作者把这称为辩证唯物论的全部认识论，也就是把认识与行动统一起来的观点。","difficulty":2,"knowledge":["k-cycle","k-transform","k-unity","k-subject-object"]}},"glossary":[{"id":"g-jiaotiao","term":"教条主义","pinyin":"jiào tiáo zhǔ yì","meaning":"把理论当作固定公式而不顾具体实际的思想方法。","plain":"只照搬书上的话，不看眼前的情况。","match":["教条主义"],"knowledge":["k-dogma"]},{"id":"g-jingyan","term":"经验主义","pinyin":"jīng yàn zhǔ yì","meaning":"片面依靠局部经验、轻视理论指导的思想方法。","plain":"只相信自己做过的事，不研究整体和原因。","match":["经验主义"],"knowledge":["k-empiricism"]},{"id":"g-bianzheng","term":"辩证唯物论","pinyin":"biàn zhèng wéi wù lùn","meaning":"认为物质是基础，并从联系、矛盾和发展中认识世界的哲学观点。","plain":"先承认外部世界存在，再研究它怎样相互联系和变化。","match":["辩证唯物论"],"knowledge":["k-unity","k-subject-object"]},{"id":"g-ganxing","term":"感性认识","pinyin":"gǎn xìng rèn shi","meaning":"通过感觉器官获得的对现象、局部和外部联系的认识。","plain":"先看到、听到，留下感觉和印象。","match":["感性认识"],"knowledge":["k-sensory"]},{"id":"g-lixing","term":"理性认识","pinyin":"lǐ xìng rèn shi","meaning":"通过概念、判断、推理来把握本质及内部联系的认识。","plain":"整理材料，想清事物为什么这样。","match":["理性认识"],"knowledge":["k-rational"]},{"id":"g-feiyue","term":"飞跃","pinyin":"fēi yuè","meaning":"发展过程中性质发生转变；文中指认识阶段或认识与实践间的转变。","plain":"不只是知道得更多，而是进入另一种认识或行动阶段。","match":["飞跃"],"knowledge":["k-first-leap","k-second-leap"]},{"id":"g-nengdong","term":"能动","pinyin":"néng dòng","meaning":"具有主动、自觉作用的。","plain":"人会主动思考和行动。","match":["能动"],"knowledge":["k-second-leap"]},{"id":"g-shengtun","term":"生吞活剥","pinyin":"shēng tūn huó bō","meaning":"比喻不理解内容而机械搬用。","plain":"没弄懂就整套照搬。","match":["生吞活剥"],"knowledge":["k-dogma"]},{"id":"g-zhiyan","term":"只言片语","pinyin":"zhī yán piàn yǔ","meaning":"零散、简短的言语。","plain":"不完整的几句话。","match":["只言片语"],"knowledge":["k-dogma"]},{"id":"g-lishou","term":"里手","pinyin":"lǐ shǒu","meaning":"方言，指内行、熟悉某种业务的人；文中含讽刺意味。","plain":"对某件事很懂的人；这里讽刺自以为懂的人。","match":["里手"],"knowledge":["k-indirect"]},{"id":"g-zhuguan","term":"主观主义","pinyin":"zhǔ guān zhǔ yì","meaning":"不从客观实际出发、只凭主观愿望看问题的思想方法。","plain":"只凭自己想的来判断。","match":["主观主义"],"knowledge":["k-subject-object","k-dogma"]},{"id":"g-benzhi","term":"本质","pinyin":"běn zhì","meaning":"决定事物性质的内在根本特点。","plain":"不只看表面，还要看它究竟是什么。","match":["本质"],"knowledge":["k-rational"]},{"id":"g-guilvxing","term":"规律性","pinyin":"guī lǜ xìng","meaning":"事物发展中存在的内在的、必然的联系。","plain":"事情的变化有内在的道理。","match":["规律性"],"knowledge":["k-rational","k-criterion"]},{"id":"g-gaizao","term":"改造","pinyin":"gǎi zào","meaning":"改变原有的性质、状况或结构。","plain":"把原来的样子和关系改变。","match":["改造"],"knowledge":["k-transform"]},{"id":"g-shijian","term":"实践","pinyin":"shí jiàn","meaning":"人们实际参与、改变自然和社会的活动。","plain":"真正参与生产、社会生活、实验等活动。","match":["实践"],"knowledge":["k-source","k-social"]},{"id":"g-renshilun","term":"认识论","pinyin":"rèn shi lùn","meaning":"研究认识的来源、过程、性质和检验等问题的哲学理论。","plain":"研究人怎样知道、怎样判断自己知道得对不对。","match":["认识论"],"knowledge":["k-cycle"]},{"id":"g-shengchan","term":"生产关系","pinyin":"shēng chǎn guān xì","meaning":"人们在物质生产过程中形成的社会关系。","plain":"人们一起生产时形成的相互关系。","match":["生产关系"],"knowledge":["k-source","k-social"]},{"id":"g-jieji","term":"阶级斗争","pinyin":"jiē jí dòu zhēng","meaning":"阶级之间围绕不同利益发生的斗争。","plain":"不同阶级为了自身利益发生的冲突。","match":["阶级斗争"],"knowledge":["k-social"]},{"id":"g-laoyin","term":"烙印","pinyin":"lào yìn","meaning":"本指烫出的印记，比喻不易消失的影响或特征。","plain":"某种经历或地位留下的明显影响。","match":["烙印"],"knowledge":["k-social"]},{"id":"g-boxue","term":"剥削","pinyin":"bō xuē","meaning":"在本文语境中，指凭生产资料占有关系取得他人劳动成果。","plain":"文中指占有别人劳动所得。","match":["剥削"],"knowledge":["k-social"]},{"id":"g-wuchan","term":"无产阶级","pinyin":"wú chǎn jiē jí","meaning":"不占有生产资料、主要靠出卖劳动力生活的阶级。","plain":"主要靠受雇劳动生活的工人阶级。","match":["无产阶级"],"knowledge":["k-historical"]},{"id":"g-zhenli","term":"真理","pinyin":"zhēn lǐ","meaning":"与客观实际及其规律相符合的认识。","plain":"符合实际情况和规律的认识。","match":["真理"],"knowledge":["k-criterion","k-relative"]},{"id":"g-keguan","term":"客观","pinyin":"kè guān","meaning":"不依个人意志而存在的；此处与主观相对。","plain":"不管你怎样想，都实际存在。","match":["客观"],"knowledge":["k-subject-object"]},{"id":"g-pianmian","term":"片面","pinyin":"piàn miàn","meaning":"只涉及事物的一部分或一个方面。","plain":"只看到一部分。","match":["片面"],"knowledge":["k-sensory","k-empiricism"]},{"id":"g-gainian","term":"概念","pinyin":"gài niàn","meaning":"反映事物共同或本质特点的思维形式。","plain":"把一类事物的重要特点概括出来。","match":["概念"],"knowledge":["k-rational"]},{"id":"g-panduan","term":"判断","pinyin":"pàn duàn","meaning":"对事物的性质、关系等作肯定或否定的思维活动。","plain":"根据材料说它是什么、有没有某种关系。","match":["判断"],"knowledge":["k-rational"]},{"id":"g-tuili","term":"推理","pinyin":"tuī lǐ","meaning":"由已有判断推出另一判断的思维过程。","plain":"根据已经知道的，推想可以得出的结论。","match":["推理"],"knowledge":["k-rational"]},{"id":"g-maodun","term":"矛盾","pinyin":"máo dùn","meaning":"辩证法中指事物内部或事物之间对立又相联系的关系。","plain":"互相对立的方面，又存在于一定的联系中。","match":["矛盾"],"knowledge":["k-historical","k-relative"]},{"id":"g-chouxiang","term":"抽象","pinyin":"chōu xiàng","meaning":"从具体事物中提取共同或本质特点的思维过程。","plain":"从许多具体事情中找重要的共同点。","match":["抽象"],"knowledge":["k-first-leap"]},{"id":"g-zhijie","term":"直接经验","pinyin":"zhí jiē jīng yàn","meaning":"本人通过亲身实践得到的经验。","plain":"自己亲自做、亲自接触后知道的。","match":["直接经验"],"knowledge":["k-indirect"]},{"id":"g-jianjie","term":"间接经验","pinyin":"jiàn jiē jīng yàn","meaning":"通过他人的叙述、文字等获得的经验知识。","plain":"从书里或别人那里学来的。","match":["间接经验"],"knowledge":["k-indirect"]},{"id":"g-daoting","term":"道听途说","pinyin":"dào tīng tú shuō","meaning":"从别处随便听来、未经充分根据确认的话。","plain":"听人说了一点，就拿来讲。","match":["道听途说"],"knowledge":["k-indirect"]},{"id":"g-yizhi","term":"一知半解","pinyin":"yī zhī bàn jiě","meaning":"知道得少，理解得不完整。","plain":"只懂一点，还没弄明白。","match":["一知半解"],"knowledge":["k-indirect"]},{"id":"g-qianxun","term":"谦逊","pinyin":"qiān xùn","meaning":"谦虚，不自大。","plain":"承认自己还有不懂的地方。","match":["谦逊"],"knowledge":["k-indirect"]},{"id":"g-guanchuan","term":"贯串","pinyin":"guàn chuàn","meaning":"从头到尾穿过、连接；同“贯穿”。","plain":"把整个过程连在一起。","match":["贯串"],"knowledge":["k-first-leap"]},{"id":"g-zhanlve","term":"战略","pinyin":"zhàn lüè","meaning":"对战争全局的筹划和指导。","plain":"整个战争的大计划。","match":["战略"],"knowledge":["k-first-leap"]},{"id":"g-zhanshu","term":"战术","pinyin":"zhàn shù","meaning":"进行具体战斗的原则和方法。","plain":"一场具体战斗怎样打。","match":["战术"],"knowledge":["k-first-leap"]},{"id":"g-ziyi","term":"自以为是","pinyin":"zì yǐ wéi shì","meaning":"认为自己总是对的，不接受不同意见。","plain":"还没弄清情况，就认定自己对。","match":["自以为是"],"knowledge":["k-subject-object"]},{"id":"g-lingsui","term":"零碎","pinyin":"líng suì","meaning":"不完整、不成系统的。","plain":"这里一点，那里一点，连不起来。","match":["零碎"],"knowledge":["k-material"]},{"id":"g-cuojue","term":"错觉","pinyin":"cuò jué","meaning":"与实际情况不符的感觉或知觉。","plain":"感觉是这样，实际却不是。","match":["错觉"],"knowledge":["k-material"]},{"id":"g-weixin","term":"唯心论","pinyin":"wéi xīn lùn","meaning":"主张精神或意识是第一性的哲学观点。","plain":"把精神或意识看作世界的根本。","match":["唯心论"],"knowledge":["k-unity","k-subject-object"]},{"id":"g-weili","term":"唯理论","pinyin":"wéi lǐ lùn","meaning":"强调理性在知识形成中作用的认识论流派；本文批评其脱离感性的一面。","plain":"这里指只信理性、不承认经验可靠的观点。","match":["唯理论"],"knowledge":["k-unity"]},{"id":"g-biyong","term":"闭目塞听","pinyin":"bì mù sè tīng","meaning":"不看不听，拒绝接触外界情况。","plain":"把自己关起来，不了解外面。","match":["闭目塞听"],"knowledge":["k-source"]},{"id":"g-qucu","term":"去粗取精","pinyin":"qù cū qǔ jīng","meaning":"去除粗杂部分，选取精要部分。","plain":"从材料里挑出重要的内容。","match":["去粗取精"],"knowledge":["k-material"]},{"id":"g-quwei","term":"去伪存真","pinyin":"qù wěi cún zhēn","meaning":"去掉虚假的，留下真实的。","plain":"查清哪些是真的，把假的排除。","match":["去伪存真"],"knowledge":["k-material"]},{"id":"g-biaoli","term":"由表及里","pinyin":"yóu biǎo jí lǐ","meaning":"从表面现象进入内部本质。","plain":"不只看样子，还看里面的原因。","match":["由表及里"],"knowledge":["k-first-leap"]},{"id":"g-shuzhi","term":"束之高阁","pinyin":"shù zhī gāo gé","meaning":"把东西放置不用，比喻将意见、理论等搁置。","plain":"放在一边，不去用它。","match":["束之高阁"],"knowledge":["k-second-leap"]},{"id":"g-zhinan","term":"指南","pinyin":"zhǐ nán","meaning":"比喻提供行动方向或方法的依据。","plain":"帮助人知道怎样行动。","match":["指南"],"knowledge":["k-second-leap","k-dogma"]},{"id":"g-youqing","term":"右倾机会主义","pinyin":"yòu qīng jī huì zhǔ yì","meaning":"本文指思想落后于已变化的实际、坚持旧阶段的政治倾向。","plain":"情况向前走了，想法却还停在过去。","match":["右倾机会主义"],"knowledge":["k-right"]},{"id":"g-maoxian","term":"冒险主义","pinyin":"mào xiǎn zhǔ yì","meaning":"不顾现实条件而强行行动的思想倾向。","plain":"条件还不够，就急着硬做。","match":["冒险主义"],"knowledge":["k-left"]},{"id":"g-xiangdui","term":"相对","pinyin":"xiāng duì","meaning":"在一定条件、范围或关系中成立的。","plain":"有条件、有范围，不是到处永远一样。","match":["相对"],"knowledge":["k-relative"]},{"id":"g-juedui","term":"绝对","pinyin":"jué duì","meaning":"不受条件限制的；文中用于宇宙总过程及真理总体。","plain":"从不受某个局部条件限制的总体来说。","match":["绝对"],"knowledge":["k-relative"]},{"id":"g-xunhuan","term":"循环往复","pinyin":"xún huán wǎng fù","meaning":"按一定形式反复进行。","plain":"一轮又一轮地进行。","match":["循环往复"],"knowledge":["k-cycle"]},{"id":"g-zhixing","term":"知行","pinyin":"zhī xíng","meaning":"知识、认识与行动、实践的合称。","plain":"怎样认识，以及怎样去做。","match":["知行"],"knowledge":["k-cycle"]},{"id":"g-liaojie","term":"了解","pinyin":"liǎo jiě","meaning":"知道、理解事物的情况。","plain":"弄清是怎么回事。","match":["了解"],"knowledge":["k-source"]},{"id":"g-changqi","term":"长期","pinyin":"cháng qī","meaning":"较长的一段时间。","plain":"持续很久。","match":["长期"],"knowledge":["k-historical"]},{"id":"g-pianduan","term":"片断","pinyin":"piàn duàn","meaning":"零散、不完整的部分。","plain":"整个事情中的一点点。","match":["片断"],"knowledge":["k-empiricism"]},{"id":"g-zhongdian","term":"重点","pinyin":"zhòng diǎn","meaning":"主要的部分或需要特别重视的方面。","plain":"最要着重处理的地方。","match":["重点"],"knowledge":["k-dogma"]},{"id":"g-qiangpo","term":"强迫","pinyin":"qiǎng pò","meaning":"施加压力，使他人做不愿做的事。","plain":"使别人不得不去做。","match":["强迫"],"knowledge":["k-transform"]},{"id":"g-zizai","term":"自在","pinyin":"zì zài","meaning":"本文“自在的阶级”中指尚未自觉认识自身地位和任务的状态。","plain":"作为一个阶级存在，但还没有形成自觉的整体认识。","match":["自在"],"knowledge":["k-first-leap"]},{"id":"g-ziwei","term":"自为","pinyin":"zì wéi","meaning":"本文“自为的阶级”中指自觉认识自身地位和任务的状态。","plain":"知道自己作为一个阶级要做什么。","match":["自为"],"knowledge":["k-first-leap"]},{"id":"g-ji","term":"即","pinyin":"jí","kind":"function-word","meaning":"在这里引出同一意思的具体说明，相当于“也就是”。","plain":"看到“即”，把后面看作对前面的解释，不是另加一个观点。","match":["即认识","即由"],"example":"原文（p02）：即认识对生产和阶级斗争的依赖关系。\n造句：请于周一，即下周的第一天，交作业。","knowledge":["k-social"]},{"id":"g-ze","term":"则","pinyin":"zé","kind":"function-word","meaning":"连接分句，可表示转入另一种情况，或引出相应结果。","plain":"在“则又”中可理解为“就又”；在“否则”中表示“不然就”。要结合前后句读。","match":["则又","则由于","则仍"],"example":"原文（p03）：各阶级的社会成员，则又以各种不同的方式，结成一定的生产关系\n造句：这家店周一休息，另一家则照常营业。","knowledge":["k-social","k-indirect"]},{"id":"g-zhi","term":"之","pinyin":"zhī","kind":"function-word","meaning":"文言虚词；本文中有的相当于“的”，有的代替前面提到的事物。","plain":"“秀才之手”就是“秀才的手”；“使之适合”里的“之”指前面的思想。不要把每个“之”都译成“的”。","match":["之手","使之"],"example":"原文（p06）：改正自己的思想使之适合于外界的规律性\n造句：我调整了书架的位置，使之更方便使用。","knowledge":["k-indirect","k-criterion"]},{"id":"g-qi","term":"其","pinyin":"qí","kind":"function-word","meaning":"代词，指上文提到的人或事物，可相当于“他、它、他们的、它的”。","plain":"先往前找“其”指谁或什么，再换成这个名称来读。","match":["其错误","其不自量"],"example":"原文（p20）：许多理论是错误的，经过实践的检验而纠正其错误。\n造句：请阅读通知，并记下其中的时间和地点。","knowledge":["k-criterion","k-indirect"]},{"id":"g-er","term":"而","pinyin":"ér","kind":"function-word","meaning":"连接前后成分，本文中可表示并列、转折或前后相接。","plain":"不能固定译成一个词。“而又”接着说另一面；“而只”常转向作者要批评的做法。","match":["而又","而只","而在于"],"example":"原文（p07）：然而人的认识究竟怎样从实践发生，而又服务于实践呢？\n造句：这间屋子小而明亮。","knowledge":["k-cycle","k-dogma","k-second-leap"]},{"id":"g-gu","term":"故","pinyin":"gù","kind":"function-word","meaning":"在“故题为”中表示原因带来的结果，相当于“所以”。","plain":"前面解释理由，“故”后面说因此怎样。这里不是“故意”的“故”。","match":["故题为"],"example":"原文（p01）：故题为《实践论》。\n造句：今天店里停电，故暂停营业。","knowledge":["k-dogma"]},{"id":"g-nai","term":"乃","pinyin":"nǎi","kind":"function-word","meaning":"在“乃能”中相当于“才”；在“乃是”中相当于“就是、正是”。","plain":"“乃能”要联系前面的条件；“乃是”强调后面的判断。","match":["乃能","乃是"],"example":"原文（p10）：秀才乃能间接地“知天下事”。\n造句：他查了三遍资料，乃知原来记错了日期。","knowledge":["k-indirect","k-first-leap"]},{"id":"g-yan","term":"焉","pinyin":"yān","kind":"function-word","meaning":"在“焉得”中用于反问，相当于“怎么能”。","plain":"“焉得虎子”就是“怎么能得到小老虎”；反问强调前面的条件不可少。","match":["焉得"],"example":"原文（p10）：不入虎穴，焉得虎子。\n造句：不问清地址，焉能找到这家店？","knowledge":["k-source"]},{"id":"g-jizhi","term":"及至","pinyin":"jí zhì","kind":"function-word","meaning":"表示到了某个时间或情况，相当于“等到”。","plain":"先读“等到……之后”，再看后面出现什么变化。","match":["及至"],"example":"原文（p15）：及至把工作的情况和环境给以详细分析之后，他就觉得比较地有了把握\n造句：及至到家，我才发现钥匙留在办公室了。","knowledge":["k-source"]},{"id":"g-name","term":"那末","pinyin":"nà me","kind":"function-word","meaning":"“那么”的旧写法，承接前面的条件，引出结果或判断。","plain":"读成现在常用的“那么”，再找前面提出了什么条件。","match":["那末"],"example":"原文（p10）：那末这些知识是可靠的，否则就是不可靠的。\n造句：如果你已经准备好了，那末我们就出发吧。","knowledge":["k-indirect","k-second-leap"]},{"id":"g-yi-wei","term":"以…为","pinyin":"yǐ wéi","kind":"pattern","meaning":"把前一个事物作为后一个事物；也可表示以某事物作为特点或依据。","plain":"在“以革命理论为指南”里，“革命理论”是用来指路的依据。中间可以插入很长的名词短语。","match":["以革命理论","为指南"],"example":"原文（p20）：实践若不以革命理论为指南，就会变成盲目的实践。\n造句：这次讨论以大家的问题为起点。","knowledge":["k-second-leap"]},{"id":"g-bushi-ershi","term":"不是…而是","pinyin":"bù shì ér shì","kind":"pattern","meaning":"先否定一种判断，再提出要肯定的判断。","plain":"重点落在“而是”后面；不要把前后两项都当成作者肯定的观点。","match":["不是","而是"],"example":"原文（p06）：不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。\n造句：我不是不想来，而是今天要上班。","knowledge":["k-criterion","k-dogma"]},{"id":"g-youyu-yiner","term":"由于…因而","pinyin":"yóu yú yīn ér","kind":"pattern","meaning":"前面说明原因，后面引出结果，两个部分之间可插入其他说明。","plain":"先圈出“由于”后的原因，再找“因而”后的结果。长句里的其他内容可以第二遍再读。","match":["由于","因而"],"example":"原文（p21）：由于实践中发现前所未料的情况，因而部分地改变思想、理论、计划、方案的事是常有的\n造句：由于公交车晚点，因而我迟到了十分钟。","knowledge":["k-completion"]},{"id":"g-suowei","term":"所谓…","pinyin":"suǒ wèi","kind":"pattern","meaning":"引出一种名称、说法或前面讨论的概念，相当于“所说的”。","plain":"“所谓”后面可能是引文，也可能是一个名称；在本文中不能一见这个词就认定作者在讽刺。","match":["所谓"],"example":"原文（p26）：所谓被改造的客观世界，其中包括了一切反对改造的人们\n造句：所谓预约，就是先约好时间再来。","knowledge":["k-transform","k-rational"]},{"id":"g-zhiyou-cai","term":"只有…才","pinyin":"zhǐ yǒu cái","kind":"pattern","meaning":"强调前面的条件必不可少，满足它才可能有后面的结果。","plain":"先找必要条件，再找结果；不要把“只有”误读成“只要”，后者更强调条件足以带来结果。","match":["只有","才能","才是"],"example":"原文（p16）：只有感觉的材料十分丰富（不是零碎不全）和合于实际（不是错觉），才能根据这样的材料造出正确的概念和论理来。\n造句：只有先买票，才能进场。","knowledge":["k-material","k-criterion"]},{"id":"g-ruguo-name","term":"如果…那末","pinyin":"rú guǒ nà me","kind":"pattern","meaning":"先提出假设或条件，再说明在这个条件下的结果；“那末”即“那么”。","plain":"找到“如果”后，先读完整个条件，再读“那末”引出的判断。","match":["如果","那末"],"example":"原文（p20）：如果有了正确的理论，只是把它空谈一阵，束之高阁，并不实行，那末，这种理论再好也是没有意义的。\n造句：如果明天下雨，那末我们就改在室内见面。","knowledge":["k-second-leap"]},{"id":"g-guran-dan","term":"固然…但","pinyin":"gù rán dàn","kind":"pattern","meaning":"先承认前一方面，再指出它的限制或另一面。","plain":"“固然”后说的是作者承认的部分；论述重点通常在“但”后。","match":["固然","但它们"],"example":"原文（p18）：感觉材料固然是客观外界某些真实性的反映（我这里不来说经验只是所谓内省体验的那种唯心的经验论），但它们仅是片面的和表面的东西\n造句：这条路固然近，但晚上没有路灯。","knowledge":["k-empiricism","k-first-leap"]},{"id":"g-budan-erqie","term":"不但…而且","pinyin":"bù dàn ér qiě","kind":"pattern","meaning":"表示递进：肯定前一项，还要进一步肯定后一项。","plain":"两项都成立，后一项比前一项再进一层。文中“不但是……而且……”同样这样读。","match":["不但","而且"],"example":"原文（p09）：概念同感觉，不但是数量上的差别，而且有了性质上的差别。\n造句：这家店不但离家近，而且周末也营业。","knowledge":["k-first-leap","k-criterion"]},{"id":"g-bunengbu","term":"不能不","pinyin":"bù néng bù","kind":"pattern","meaning":"双重否定，表达“必须、不得不”的肯定意思。","plain":"两个“不”合起来强调肯定，不是说“不能做”。","match":["不能不"],"example":"原文（p25）：不能不坚决反对这些错误思想。\n造句：看见地上有水，我不能不提醒后面的人小心。","knowledge":["k-subject-object"]}],"knowledge":[{"id":"k-source","title":"实践是认识的来源","level":"core","summary":"本文认为，认识从社会实践中产生。","explain":"本文认为，人们在生产等实践中接触外部世界，才开始获得认识。生产活动既让人认识自然，也让人认识人与人的关系。","glossary":["g-shijian","g-shengchan","g-liaojie","g-yan","g-jizhi"],"anchors":[{"para":"p03","quote":"这是人的认识发展的基本来源。"}],"check":{"question":"按本文，认识发展的基本来源是什么？","options":["凭空想象","社会实践，尤其是生产活动","只记住书中的词句"],"answerIndex":1,"why":"作者在说明生产活动如何提供知识后，把它称为认识发展的基本来源。"}},{"id":"k-social","title":"实践具有社会性","level":"core","summary":"本文讨论的实践包括社会生活多个领域。","explain":"本文认为，实践不只是一人的动手尝试，还包括生产、阶级斗争、政治、科学和艺术等社会活动。作者强调人在社会关系和阶级地位中生活，这些关系会影响认识。","glossary":["g-shijian","g-jieji","g-laoyin","g-ji","g-ze"],"anchors":[{"para":"p04","quote":"人的社会实践，不限于生产活动一种形式，还有多种其它的形式，阶级斗争，政治生活，科学和艺术的活动"}],"check":{"question":"下列哪一种理解符合本文？","options":["实践包括生产、政治、科学和艺术活动","实践只指做手工","实践只指个人读书"],"answerIndex":0,"why":"p04 明确列出多种社会实践形式。"}},{"id":"k-historical","title":"认识受历史条件影响","level":"core","summary":"本文认为，认识随着生产和社会过程的发展而发展。","explain":"本文认为，人们的眼界受生产规模和社会条件限制，不能脱离时代获得全部认识。作者还要求，在实际过程进入新阶段时，人的认识和工作方案也随之改变。","glossary":["g-changqi","g-wuchan","g-maodun"],"anchors":[{"para":"p22","quote":"人们的认识运动也应跟着推移和发展。"}],"check":{"question":"情况进入新阶段后，应当怎样做？","options":["永久使用原方案","仅改变口号","根据新情况发展认识和方案"],"answerIndex":2,"why":"作者要求新的任务和方案适合已经变化的情况。"}},{"id":"k-criterion","title":"实践是检验真理的标准","level":"core","summary":"本文认为，应以社会实践的结果检验认识。","explain":"本文认为，认识是否符合实际，不能只靠主观感觉判断。理论必须用于社会实践，通过结果检验，并在发现错误时修正。","glossary":["g-zhenli","g-guilvxing","g-keguan","g-zhi","g-qi","g-bushi-ershi","g-zhiyou-cai","g-budan-erqie"],"anchors":[{"para":"p06","quote":"判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。"}],"check":{"question":"按本文，判断理论是否符合实际，应主要看什么？","options":["说话的人是否自信","社会实践的客观结果","理论是否难懂"],"answerIndex":1,"why":"作者明确把社会实践的结果同个人主观感觉区分开。"}},{"id":"k-sensory","title":"感性认识：感觉和印象","level":"core","summary":"本文把先接触现象、局部和外部联系的阶段称为感性认识。","explain":"本文认为，人初次接触事物时，会得到感觉和印象。这里的感性指认识的起步阶段，不是日常所说的情绪化；它还没有充分理解事物的本质。","glossary":["g-ganxing","g-pianmian"],"anchors":[{"para":"p08","quote":"这叫做认识的感性阶段，就是感觉和印象的阶段。"}],"check":{"question":"这里“感性阶段”主要指什么？","options":["得到感觉和印象","情绪激动","已经理解全部规律"],"answerIndex":0,"why":"作者直接把感性阶段解释为感觉和印象的阶段。"}},{"id":"k-rational","title":"理性认识：概念、判断和推理","level":"core","summary":"本文认为，理性认识进一步把握本质、整体和内部联系。","explain":"本文认为，反复实践后还要运用概念、判断和推理，才能逐步理解内部联系。这里的理性并不只指态度冷静，而指一种认识阶段。","glossary":["g-lixing","g-gainian","g-panduan","g-tuili","g-benzhi","g-suowei"],"anchors":[{"para":"p09","quote":"这个概念、判断和推理的阶段，在人们对于一个事物的整个认识过程中是更重要的阶段，也就是理性认识的阶段。"}],"check":{"question":"哪一项最符合本文的理性认识？","options":["只保留第一印象","只要求保持冷静","整理材料并推理其内部联系"],"answerIndex":2,"why":"理性认识涉及概念、判断和推理，目标是理解本质与联系。"}},{"id":"k-first-leap","title":"第一次飞跃：从感性到理性","level":"core","summary":"本文认为，材料经过思考加工，认识会发生性质上的变化。","explain":"本文认为，从感觉到概念，不只是材料数量变多，而是认识性质发生变化。作者用工人斗争、战争和工作等例子说明，实践经验需要发展为对规律的理解。","glossary":["g-feiyue","g-chouxiang","g-biaoli","g-nai","g-guran-dan","g-budan-erqie"],"anchors":[{"para":"p09","quote":"概念同感觉，不但是数量上的差别，而且有了性质上的差别。"}],"check":{"question":"第一次飞跃为什么不只是材料增多？","options":["因为它完全不需要经验","因为它从感觉进入对本质、联系的理解","因为它只改变用词"],"answerIndex":1,"why":"作者强调概念和感觉存在性质差别。"}},{"id":"k-material","title":"感觉材料要丰富、符合实际","level":"support","summary":"本文认为，正确概念需要丰富而真实的材料。","explain":"本文认为，零散不全的材料和错觉，不能成为正确认识的充分基础。作者要求先取得丰富、符合实际的材料，再去粗取精、去伪存真，通过思考加工它们。","glossary":["g-lingsui","g-cuojue","g-qucu","g-quwei","g-zhiyou-cai"],"anchors":[{"para":"p16","quote":"只有感觉的材料十分丰富（不是零碎不全）和合于实际（不是错觉），才能根据这样的材料造出正确的概念和论理来。"}],"check":{"question":"材料很多，但全是错觉，是否满足本文的条件？","options":["不满足，还必须符合实际","满足，数量够就行","满足，只要大家都相信"],"answerIndex":0,"why":"本文同时要求丰富和合于实际，不能只满足其中一个。"}},{"id":"k-unity","title":"感性与理性相互联系","level":"core","summary":"本文认为，理性以感性为基础，感性需要向理性发展。","explain":"本文认为，理性认识不能脱离感性经验，否则就失去来源。感性认识也不能成为终点，它需要发展为理性认识；两者统一在实践基础上。","glossary":["g-bianzheng","g-ganxing","g-lixing","g-weili"],"anchors":[{"para":"p19","quote":"理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。"}],"check":{"question":"本文怎样看感性与理性的关系？","options":["只要理性，不要感性","只要感性，不要理性","理性依赖感性，感性需要发展为理性"],"answerIndex":2,"why":"这正是 p19 开头概括的两方面关系。"}},{"id":"k-indirect","title":"直接经验与间接经验","level":"core","summary":"本文承认间接知识，但认为全部知识的来源仍与直接经验相连。","explain":"本文认为，一个人不可能亲历一切，多数知识来自书本或他人，是间接经验。对学习者是间接的知识，对原来获得它的人可能是直接经验。作者也要求判断这些经验是否如实反映客观事物。","glossary":["g-zhijie","g-jianjie","g-lishou","g-qianxun","g-ze","g-zhi","g-qi","g-nai","g-name"],"anchors":[{"para":"p10","quote":"一切真知都是从直接经验发源的。但人不能事事直接经验，事实上多数的知识都是间接经验的东西"}],"check":{"question":"本文是否要求每个人亲自经历所有事情？","options":["是，书本没有用","否，可以学习间接经验，但其来源仍联系实践","否，知识完全不需要实践"],"answerIndex":1,"why":"作者明确说人不能事事直接经验，并承认多数知识是间接的。"}},{"id":"k-dogma","title":"教条主义：照搬词句，轻视实践","level":"core","summary":"编者说明，本文重点批评脱离实际地照搬理论。","explain":"编者认为，教条主义者拒绝中国革命的经验，只搬用书中零散的话。编者说明，本文的主要批评对象是这种看轻实践的思想，而不是主张取消理论。","glossary":["g-jiaotiao","g-shengtun","g-zhiyan","g-zhinan","g-er","g-gu","g-bushi-ershi"],"anchors":[{"para":"p01","quote":"而只生吞活剥马克思主义书籍中的只言片语，去吓唬人们。"}],"check":{"question":"编者批评的教条主义主要是什么？","options":["把书中词句照搬到实际，不研究情况","认真联系实际学习理论","根据实践修改认识"],"answerIndex":0,"why":"编者批评的是不理解、不联系实践地搬用词句。"}},{"id":"k-empiricism","title":"经验主义：局部经验代替整体认识","level":"core","summary":"编者和作者批评只守着个人经验、轻视理论的倾向。","explain":"编者指出，经验主义者拘守自己的片断经验，不能看清全局。作者进一步论述，经验材料只反映一部分现象，需要理论加工；重视实践不等于停在经验上。","glossary":["g-jingyan","g-pianduan","g-pianmian","g-guran-dan"],"anchors":[{"para":"p01","quote":"还有另一部分经验主义的同志长期拘守于自身的片断经验，不了解理论对于革命实践的重要性"}],"check":{"question":"哪种做法体现文中批评的经验主义？","options":["根据真实材料分析整体关系","承认经验需要总结","只相信自己的局部经验，认为理论没用"],"answerIndex":2,"why":"问题在于拘守局部经验、低估理论与整体认识的作用。"}},{"id":"k-second-leap","title":"第二次飞跃：理论回到实践","level":"core","summary":"本文认为，理论要用于改变世界并接受检验。","explain":"本文认为，形成理论还只完成认识过程的一部分。更重要的飞跃是用理性认识指导生产、社会斗争和实验，在行动中检验并发展理论。","glossary":["g-nengdong","g-shuzhi","g-feiyue","g-er","g-name","g-yi-wei","g-ruguo-name"],"anchors":[{"para":"p20","quote":"认识从实践始，经过实践得到了理论的认识，还须再回到实践去。"}],"check":{"question":"提出理论以后，按本文还应做什么？","options":["把理论存起来就结束","将理论用于实践，检验和发展它","只反复背诵理论"],"answerIndex":1,"why":"第二次飞跃把认识带回实践，理论的作用体现于指导行动。"}},{"id":"k-completion","title":"阶段性完成与方案修正","level":"support","summary":"本文认为，具体阶段可以完成认识，但实现方案常需修改。","explain":"本文认为，在某一过程的某一阶段实现预期目的，可以说这次具体认识完成了。作者同时指出，科学技术条件和客观过程的显露程度会限制认识，所以方案常需部分甚至全部修改。","glossary":["g-cuojue","g-keguan","g-youyu-yiner"],"anchors":[{"para":"p21","quote":"因而部分地改变思想、理论、计划、方案的事是常有的，全部地改变的事也是有的。"}],"check":{"question":"实践出现未预料的情况时，方案能否修改？","options":["能，可能部分修改，也可能全部修改","不能，修改就等于没有认识","只能换名称，不能换内容"],"answerIndex":0,"why":"作者明确承认两种修改，并解释了认识受到的限制。"}},{"id":"k-right","title":"思想落后于实际：右倾机会主义","level":"support","summary":"本文批评实际已经变化、思想却仍停在旧阶段的倾向。","explain":"本文认为，认识可能受到社会条件限制，落后于实际。作者批评右倾机会主义看不到过程已前进，仍坚持旧阶段的认识，甚至试图让发展倒退。","glossary":["g-youqing","g-changqi"],"anchors":[{"para":"p23","quote":"他们的思想不能随变化了的客观情况而前进，在历史上表现为右倾机会主义。"}],"check":{"question":"作者在这里怎样解释右倾机会主义？","options":["思想随实际发展","思想落后于已经变化的实际","思想总比现实先完成"],"answerIndex":1,"why":"作者强调的是客观情况已改变，而思想没有跟上。"}},{"id":"k-left","title":"思想超过实际：“左”翼冒险主义","level":"support","summary":"本文反对把未来可能的事强行放在现在做。","explain":"本文认为，有些人把幻想当真理，有些把将来才有现实可能的理想提前实行。作者把这看作脱离当前多数人的实践和现实条件，并认为它在行动上表现为冒险主义。","glossary":["g-maoxian","g-keguan"],"anchors":[{"para":"p24","quote":"有些把幻想看作真理，有些则把仅在将来有现实可能性的理想，勉强地放在现时来做"}],"check":{"question":"哪一种情况符合作者批评的冒险主义？","options":["等现实条件具备后再行动","调查当前大多数人的实践","把将来才可能实现的目标硬放到现在做"],"answerIndex":2,"why":"问题是行动超出了当前现实条件，而不是一般地具有理想。"}},{"id":"k-subject-object","title":"具体历史条件下的统一","level":"core","summary":"本文要求主观与客观、认识与实践在具体历史条件下统一。","explain":"本文认为，只凭想法而离开实际，或只谈认识而脱离实践，都会出错。作者要求思想、理论和行动符合当时具体的客观过程，这种统一需要随着情况发展而调整。","glossary":["g-zhuguan","g-keguan","g-zhixing","g-bunengbu"],"anchors":[{"para":"p25","quote":"我们的结论是主观和客观、理论和实践、知和行的具体的历史的统一"}],"check":{"question":"“具体的历史的统一”强调什么？","options":["思想和行动适合具体时代与实际条件","所有时代只能用同一方案","主观愿望可以代替客观情况"],"answerIndex":0,"why":"作者把统一限定于具体历史条件，并反对脱离这些条件的左右两种倾向。"}},{"id":"k-relative","title":"相对真理与认识没有终点","level":"support","summary":"本文认为，具体阶段的真理有条件，认识真理的过程不断继续。","explain":"本文认为，对具体过程在一定阶段的认识具有相对真理性。作者把无数相对真理的总和称为绝对真理，并说客观世界不断变化，因此认识真理的过程不会结束。","glossary":["g-xiangdui","g-juedui","g-zhenli"],"anchors":[{"para":"p25","quote":"客观现实世界的变化运动永远没有完结，人们在实践中对于真理的认识也就永远没有完结。"}],"check":{"question":"按本文，某阶段得到真理是否表示全部认识结束？","options":["是，从此不必实践","否，世界继续变化，认识也继续发展","是，所有条件都不会再变"],"answerIndex":1,"why":"阶段性的认识并不等于关于整个发展过程的认识已经结束。"}},{"id":"k-transform","title":"改造客观世界，也改造主观世界","level":"core","summary":"本文要求改变现实，同时改善人的认识能力及其与现实的关系。","explain":"本文认为，改造世界的任务包括改变客观世界，也包括改变人的主观世界。作者把后者具体说明为改造认识能力，以及主观世界同客观世界的关系，并将这项任务放在其革命论述中。","glossary":["g-gaizao","g-qiangpo","g-keguan","g-suowei"],"anchors":[{"para":"p26","quote":"改造客观世界，也改造自己的主观世界——改造自己的认识能力，改造主观世界同客观世界的关系。"}],"check":{"question":"本文说的“改造主观世界”包括什么？","options":["只改变外部物品","不再接触外界","改善认识能力及其与客观世界的关系"],"answerIndex":2,"why":"作者在破折号后直接解释了主观世界改造的内容。"}},{"id":"k-cycle","title":"实践—认识—再实践—再认识","level":"core","summary":"本文把认识与实践的关系概括为内容不断发展的循环。","explain":"本文认为，实践产生认识，认识指导新的实践，新的实践又发展认识。这个形式可以不断重复，但每一轮的内容应进入更高的程度，不是停在原地重复旧结论。","glossary":["g-xunhuan","g-zhixing","g-renshilun","g-er"],"anchors":[{"para":"p27","quote":"实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。"}],"check":{"question":"本文所说的循环是什么样的？","options":["形式反复，内容逐步发展","每次都回到相同内容","理论形成后便没有实践"],"answerIndex":0,"why":"作者既说循环往复，也强调每一循环内容的发展。"}}],"excerptMap":{"e-background":{"para":"p01","quote":"毛泽东的《实践论》，是为着用马克思主义的认识论观点去揭露党内的教条主义和经验主义——特别是教条主义这些主观主义的错误而写的。"},"e-social":{"para":"p04","quote":"人的社会实践，不限于生产活动一种形式，还有多种其它的形式，阶级斗争，政治生活，科学和艺术的活动，总之社会实际生活的一切领域都是社会的人所参加的。"},"e-standard":{"para":"p06","quote":"判定认识或理论之是否真理，不是依主观上觉得如何而定，而是依客观上社会实践的结果如何而定。真理的标准只能是社会的实践。"},"e-sensory":{"para":"p08","quote":"这叫做认识的感性阶段，就是感觉和印象的阶段。"},"e-concept":{"para":"p09","quote":"概念这种东西已经不是事物的现象，不是事物的各个片面，不是它们的外部联系，而是抓着了事物的本质，事物的全体，事物的内部联系了。"},"e-unity":{"para":"p10","quote":"感性和理性二者的性质不同，但又不是互相分离的，它们在实践的基础上统一起来了。"},"e-indirect":{"para":"p10","quote":"一切真知都是从直接经验发源的。但人不能事事直接经验，事实上多数的知识都是间接经验的东西，这就是一切古代的和外域的知识。"},"e-material":{"para":"p16","quote":"只有感觉的材料十分丰富（不是零碎不全）和合于实际（不是错觉），才能根据这样的材料造出正确的概念和论理来。"},"e-relation":{"para":"p19","quote":"理性认识依赖于感性认识，感性认识有待于发展到理性认识，这就是辩证唯物论的认识论。"},"e-return":{"para":"p20","quote":"认识从实践始，经过实践得到了理论的认识，还须再回到实践去。"},"e-test":{"para":"p20","quote":"要完全地解决这个问题，只有把理性的认识再回到社会实践中去，应用理论于实践，看它是否能够达到预想的目的。"},"e-development":{"para":"p22","quote":"然而对于过程的推移而言，人们的认识运动是没有完成的。任何过程，不论是属于自然界的和属于社会的，由于内部的矛盾和斗争，都是向前推移向前发展的，人们的认识运动也应跟着推移和发展。"},"e-cycle":{"para":"p27","quote":"实践、认识、再实践、再认识，这种形式，循环往复以至无穷，而实践和认识之每一循环的内容，都比较地进到了高一级的程度。"}},"path":[{"para":"p01","why":"先读编者说明，弄清文章为什么批评教条主义和经验主义。读完两张知识卡并做小测，再进入作者正文。","knowledge":["k-dogma","k-empiricism"]},{"para":"p03","why":"从生产这一具体活动入手，理解认识从哪里来。打开“社会性”知识卡，再跳到 p04 看实践还有哪些形式。","knowledge":["k-source","k-social"]},{"para":"p06","why":"接着弄清怎样检验认识。先读分块白话，再用小测区分个人相信与实践证实。","knowledge":["k-criterion"]},{"para":"p08","why":"借延安考察的例子认识“感觉和印象”。先说出考察者看见了什么，再做感性认识小测。","knowledge":["k-sensory"]},{"para":"p09","why":"承接上一段，观察材料怎样变成概念、判断和推理。读完后，用自己的话说出第一次飞跃改变了什么。","knowledge":["k-rational","k-first-leap"]},{"para":"p10","why":"按分块读两种认识的联系、时代限制和直接与间接经验。用三张知识卡的小测检查：依靠实践是否意味着事事必须亲历？","knowledge":["k-unity","k-historical","k-indirect"]},{"para":"p20","why":"跟随第二次飞跃回到行动，理解为什么形成理论还不够。做小测，再回看 p06 的检验标准，连起理论与实践。","knowledge":["k-second-leap","k-criterion"]},{"para":"p27","why":"最后读全文总结，串起实践、认识、再实践、再认识。打开“改造世界”和“具体历史条件下的统一”卡片，回看 p26、p25 的原文，再用小测检查整个循环。","knowledge":["k-cycle","k-transform","k-subject-object"]}]},"ocr":{"bookId":"mao-selected","excerpts":[{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-background","label":"为什么写《实践论》 · 本书题解","lineStart":3392,"lineEnd":3392},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-social","label":"实践的社会范围","lineStart":3399,"lineEnd":3399},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-standard","label":"检验认识的标准","lineStart":3406,"lineEnd":3406},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-sensory","label":"感性认识的含义","lineStart":3414,"lineEnd":3414},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-concept","label":"从印象走向概念","lineStart":3415,"lineEnd":3415},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-unity","label":"感性与理性的联系","lineStart":3422,"lineEnd":3422},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-indirect","label":"直接经验与间接经验","lineStart":3429,"lineEnd":3429},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-material","label":"材料的丰富与真实","lineStart":3456,"lineEnd":3456},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-relation","label":"认识必须深化","lineStart":3466,"lineEnd":3466},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-return","label":"理论返回实践","lineStart":3473,"lineEnd":3473},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-test","label":"在行动中检验理论","lineStart":3473,"lineEnd":3473},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-development","label":"过程变化，认识也要发展","lineStart":3487,"lineEnd":3487},{"unitId":"practice","unitTitle":"实践论","output":"index.html","excerptId":"e-cycle","label":"循环中的深化","lineStart":3504,"lineEnd":3504}]}}</script>
