e":"第八章·德意志人国家的形成","output":"origin-08.html"},"excerpts":[{"id":"d-estimate","label":"d-estimate","lineStart":1186,"lineEnd":1186,"text":"据塔西佗说，德意志人是人口众多的民族。我们从凯撒的著作中可以得出一个关于各德意志民族人数的大致概念；他认为住在莱茵河左岸的乌济佩特人和邓克泰人的人口，包括妇女和儿童在内，共为18万人。因而，每个民族大约有10万人①，这已经大大超过例如易洛魁人在其全盛时代的总数，那时易洛魁人不到2万人，但已成为自大湖至俄亥俄河和波托马克河整个地区的可怕力量。如果我们根据现有材料，把莱茵河附近定居的比较著名的民族的位置在地图上画出来，那末每一个这样的民族所占的面积平均约等于普鲁士的一个行政区，即约为1万平方公里，或182平方地理里。但是，罗马人的G ermania M agna(大日耳曼尼亚)，直到维斯拉河为止，占有依整数计共50万平方公里的面积。如果一个民族的平均人口为10万人，那末整个Germania M agna的人口总数，应达500万；对于野蛮时代的民族集团来说，这是一个很大的数目，虽然就"},{"id":"d-assumption","label":"d-assumption","lineStart":1194,"lineEnd":1194,"text":"这是极其微小的数目。但是这并不包括生活在那个时候的全部德意志人。我们知道，沿喀尔巴阡山脉直至多瑙河口，都居住着哥特系的德意志民族一巴斯塔尔人、佩夫金人以及其他人，一它们的人数非常之多，因而，普林尼认为他们是德意志人的第五个基本集团1，而这些在公元前一百八十年已经替马其顿王柏修斯作过雇佣兵的部落，还在奥古斯都在位的初年就已突进到阿德里安堡附近了。假定他们的人数只有100万人，那末到公元初，德意志人的大概数目，就至少有600万了。"},{"id":"d-expansion","label":"d-expansion","lineStart":1195,"lineEnd":1195,"text":"在他们定居日耳曼尼亚以后，人口一定是日益迅速地增长的：单是上面提到的工业方面的进步，就足以证明这一点。在什列斯维希沼地所发现的古物，就其中的罗马硬币来判断，是属于三世纪的。由此可见，到这个时候，在波罗的海沿岸金属业和纺织业已经很发达了，跟罗马帝国已有频繁的商务往来，比较有钱的人已享有某些奢侈品，一这一切都是人口更为稠密的迹象。而在这个时期，德意志人在莱茵河、罗马边墙和多瑙河全线，从北海起到黑海止，也开始了总进攻，一这也是人口日益增多，竭力向外扩张的直接证明。斗争持续了三百年，在斗争期间，哥特民族的整个基本部分（斯堪的那维亚的哥特人和勃艮第人除外）向东南推进，形成了漫长的进攻线的左翼：进攻线的中央是高地德意志人（赫米奥南人)，向多瑙河上游突进：右翼是易斯卡伏南人即现今所谓法兰克人，沿莱茵河突进；征服不列颠的任务，就落在印格伏南人身上。到"},{"id":"d-roman-state","label":"d-roman-state","lineStart":1202,"lineEnd":1202,"text":"在这一文明的坟墓旁边了。罗马的世界霸权的刨子，刨削地中海盆地的所有地区已经有数百年之久。凡在希腊语未予抵抗的地方，一切民族语言都不得不让位于讹误百出的拉丁语；一切民族差别都消失了，高卢人、伊比利亚人、利古里亚人、诺里克人都不再存在，他们都变成罗马人了。罗马的行政和罗马法到处都摧毁了古代的血族团体，这样也就摧毁了地方的和民族的自主性的最后残余。新赐予的罗马公民权并未提供任何补偿；它并不表现任何民族性，它只是民族性缺乏的表现。新民族(neue N ationen)的要素到处都已具备；各行省的拉丁方言日益分歧；一度使意大利、高卢、西班牙、阿非利加成为独立区域的自然疆界依然存在，依然使人感觉得到。但是，任何地方都不具备能够把这些要素结成新民族(neue nation)的力量，任何地方都还没有显示出发展力或抵抗力的痕迹，更不用说创造力了。对于广大领土上的广大人群来说，只有一个把他们联结起来的纽带，这就是罗马国家，而这个国家随着时间的推移却成了他们最凶恶的敌人和压迫者。各行省摧毁了罗马，罗马本身变成了行省的城市，像其他城市一样：它虽然有特权，但已经不再是统治的了，已经不再是世界帝国的中心了，甚至也不再是皇帝和副皇帝的所在地了，他们现在住在君士坦丁堡、特利尔、米兰。罗马国家变成了一架庞大的复杂机器，专门用来榨取臣民的膏血。税捐、国家的差役和各种代役租使人民大众日益陷于穷困的深源：地方官、收税官以及兵士的勒索，更使压迫加重到使人不能忍受的地步。罗马国家及其世界霸权引起了这样的结果：它把自己的生存权建立在对内维持秩序对外防御野蛮人的基础上；然而它的秩序却比最坏的无秩序还要坏，它说是保护公民防御野蛮人的，而公民却把野蛮人奉为救星。"},{"id":"d-crisis","label":"d-crisis","lineStart":1207,"lineEnd":1207,"text":"社会状况也同样是绝望的。从共和制的末期起，罗马的统治已经建立在残酷剥削被征服的各行省的基础上；帝制不但没有消除这种剥削，反而把它变成了常规。帝国越是走向没落，税捐和赋役就越是增加，官吏就越是无耻地进行掠夺和勒索。商业和工业向来不是统治着各民族的罗马人的营生：只有在高利贷方面，他们才超过这些民族而空前绝后，商业所得到所保持的东西，都在官吏的勒索下毁灭了；而残存下来的东西，仅在帝国东部的希腊才有，不过，这一部分不在我们研究范围之内。普遍的贫困化，商业、手工业和艺术的衰落，人口的减少，都市的衰败，农业退回到更低的水平"},{"id":"d-estate","label":"d-estate","lineStart":1209,"lineEnd":1209,"text":"农业是整个古代世界的决定性的生产部门，现在它更是这样了。在意大利，从共和制衰亡的时候起就几乎遍布全境的面积巨大的大庄园①atifundien),是用两种方法加以利用的：或者当作牧场，在那里居民就被牛羊所代替，因为看管牛羊只用少数奴隶就行了；或者当作田庄，在那里使用大批奴隶经营大规模的园艺业，一部分地为了满足领主的奢侈生活，部分地为了在城市市场上出售。大牧场保存了下来，甚至还扩大了：但田庄田产及其园艺业却随着领主的贫穷和城市的衰落而衰败了。以奴隶劳动为基础的大庄园经济，已不再有利可图：而在当时它却是大规模农业的唯"},{"id":"d-tenancy","label":"d-tenancy","lineStart":1210,"lineEnd":1210,"text":"一可能的形式。现在小规模经营又成为唯一有利的耕作形式了。田庄一个一个地分成了小块土地，分别租给缴纳一定款项的世袭佃农，或专租给partiarii(分成制农民)，这种分成制农民只能获得他们一年劳动生产品的六分之一，或者仅仅九分之一，他们与其说是佃农，勿宁说是田产看管人。但是这种小块土地主要地却是租给隶农，他们每年缴纳一定的款项，附着在土地上，并且可以跟那块土"},{"id":"d-coloni","label":"d-coloni","lineStart":1215,"lineEnd":1215,"text":"地一起出售；这种隶农虽不是奴隶，但也不被认为是自由人，他们不能和自由人通婚，他们相互间的婚姻也不被认为是合法的，而是像奴隶的婚姻一样，只被看做简单的同居(contubernium)。他们是中世纪农奴的前辈。"},{"id":"d-slavery","label":"d-slavery","lineStart":1216,"lineEnd":1216,"text":"古代的奴隶制，已经过时了。无论在乡村的大规模农业方面，还是在城市的工场手工业方面，它都已经不能提供足以补偿所耗劳动的收益，因为销售它的产品的市场已经消失了。帝国繁荣时代的庞大的生产已收缩为小农业和小手工业，这种小农业和小手工业都不能容纳大量奴隶了。只有替富人做家务和供他过奢侈生活用的奴隶，还存留在社会上。但是，日趋灭亡的奴隶制却仍然能够使人认为，一切生产劳动都是奴隶的事，不配由自由的罗马人来做，而现在人人都是这种自由的罗马人了。因此，一方面，多余而成了累赘的被释放的奴隶的数目日益增加；另一方面，隶农和贫困化的自由人（就像从前美国各蓄奴州poor whites(白种贫民)一样)的数目也日益增多。基督教对于古代奴隶制的逐渐灭亡是完全没有关系的。它在罗马帝国和奴隶制和睦相处了好几世纪，以后也从来没有阻碍过基督徒买卖奴隶，一既没有阻碍过德意志人在北方或威尼斯人在地中海的买卖奴隶，也没有阻碍过"},{"id":"d-impasse","label":"d-impasse","lineStart":1217,"lineEnd":1217,"text":"后世的买卖黑奴。①奴隶制已不再有利，因而灭亡了。但是垂死的奴隶制却留下了它那有毒的刺，即鄙视自由人的生产劳动。于是罗马世界便陷入了绝境：奴隶制在经济上已经不可能了，而自由人的劳动却在道德上受鄙视。前者是已经不能成为社会生产的基本形"},{"id":"d-protection","label":"d-protection","lineStart":1224,"lineEnd":1224,"text":"各行省的情况，也不见得好些。我们所有的材料，以关于高卢的为最多。在这里，与隶农并存的，还有自由的小农。为了不受官吏、法官和高利贷者的粗暴蹂躏，他们往往托庇于有权势者以求保护；不仅农民个人这样做，而且整个公社也这样做，以致四世纪的皇帝们屡次发布命令，禁止这种行为。但是寻求保护的人这样做得到了什么好处呢？保护者向他们提出了这样的条件：他们把自己的土地所有权转让给他，而他则保证他们终身使用这块土地，一这也就是神圣的教会所注意到，并且在九和十世纪竭力用来扩张神的统治和教会地产的诡计。诚然，在那个时候，即公元475年左右，马赛的主教萨耳维安还愤怒地反对这种掠夺，说罗马官吏和大地主的压迫已经达到不可忍受的地步，以致许多“罗马人”纷纷逃往野蛮人所占领的地方，而移居那里的罗马公民最怕的是重新落入罗马统治之下。1那时常常发生父母因贫穷而把自己的子女卖为奴隶的事情，为禁止这种行为而颁布的法律就证明了这一点。"},{"id":"d-distribution","label":"d-distribution","lineStart":1225,"lineEnd":1225,"text":"德意志野蛮人把罗马人从他们自己的国家里解放了出来，为此他们便强夺了罗马人全部土地的三分之二来自己分配。这一分配是按照氏族制度进行的：由于征服者的人数比较少，所以有广大的土地未被分配，而是部分地归全体人民所有，部分地归各个部落和氏族所有。在每个氏族内，则用抽签方法把耕地和草地平均分给各户；后来是否进行过重新分配，我们不得而知，但无论如何，这样的做法在罗马各行省不久就取消了，单块的份地变为可以转让的私有财产即自主地。森林和牧场没有分配而共同使用：这种使用，以及所分得的耕地的耕种方式，都是按照古代的习俗和"},{"id":"d-mark","label":"d-mark","lineStart":1230,"lineEnd":1230,"text":"全体的决定来调整的。氏族在自己的村落里定居愈久，德意志人和罗马人愈是逐渐融合，亲属性质的联系就愈让位于地区性质的联系；氏族消失在马尔克公社中了，但在马尔克公社内，其成员间原先的亲属关系的痕迹还往往是很显著的。这样，至少在马尔克公社保存下来了的各个国家一在法国北部，在英国，在德国，在斯堪的那维亚，一氏族组织不知不觉地变成了地区组织，因而才能够和国家相适应。但是，它仍保存了它那种自然形成而为整个氏族制度所特有的民主性质；甚至在它后来被迫蜕变的时候，也还留下了氏族制度的片断，从而在被压迫者手中留下了一种武器，直到现代还有其生命力。"},{"id":"d-state","label":"d-state","lineStart":1231,"lineEnd":1231,"text":"这样，如果说氏族中的血缘关系很快就丧失了自己的意义，那末，这是氏族制度的机关在部落和整个民族Vok)内因征服而蜕变的结果。我们知道，对被征服者的统治，是和氏族制度不相容的。在这里我们可以大规模地看到这一点。各德意志民族做了罗马各行省的主人，就必须把所征服的地区加以组织。但是，它们既不能把大量的罗马人吸收到氏族团体里来，又不能通过氏族团体去统治他们。必须设置一种代替物来代替罗马国家，以领导起初大部分还继续存在的罗马地方行政机关，而这只有另一种国家才能胜任。因此，氏族制度的机关便必须转化为国家机关，并且为时势所迫，这种转化还得非常迅速地进行。但是，征服者民族的最近的代表人是军事首长。被征服地区对内对外的安全，要求增大他的权力。于是军事首长的权力变为王权的时机便来到了，这一转变也终于实现了。"},{"id":"d-crown","label":"d-crown","lineStart":1237,"lineEnd":1237,"text":"给大大小小的区域公社和马尔克公社的大片土地，特别是全部较大的森林地区。从一个普通的最高军事首长变成了真正君主的法兰克国王的第一件事，便是把这种人民的财产变为王室的财产，从人民方面把它盗窃过来而以礼物或恩赐的方式分给他的扈从队。这种起初由他的私人扈从以及其余的下级军事首长组成的扈从队，不久就膨胀了起来，这不仅由于其中补入了罗马人即罗马化的高卢人，这些人因为能书写、有教养，懂得罗曼口语、拉丁文言和当地法律而很快就变成他所离不了的人，而且还由于，其中也补入了奴隶、农奴和被释放的奴隶，这些人构成了他的宫廷，他就从他们中间挑选自己的宠幸者。所有这些人都得到了大片的人民的田地，这些田地起初多半是作为礼物送给他们，后来就以采邑的方式赐给他们一起初多半是享用到国王逝世时为止。12这样，就靠牺牲人民而造成了新贵族的基础。"},{"id":"d-council","label":"d-council","lineStart":1238,"lineEnd":1238,"text":"不仅如此。由于国家幅员广阔，所以就不能利用旧的氏族制度的工具来管理了；氏族首长议事会即使没有老早消失，也已经不能召集了，它很快就被国王的固定亲信所代替：旧的人民大会还继续存在着做做样子，但是也愈来愈变成纯粹是下级军事首长和新贵人的会议。正如从前共和制末期罗马的农民一样，法兰克的人民大众，即占有土地的自由农民，也由于连年内战和征服战争、特别是查理大帝时期的征服战争而弄得疲惫不堪和彻底破产了。这种起初构成全部军队，而在征服法兰西地区以后，又构成军队核心的农民，到九世纪之初，已穷困到五个人之中难得抽出一个人出去作战了。以前由国王直接召集的自由农民的自卫军，现在已经由新贵人的家仆所组成的军队代替。在这些家仆中，还有一些依附农民，他们是那些先前只知有国王而不知有其他主人，而更早一"},{"id":"d-dependence","label":"d-dependence","lineStart":1244,"lineEnd":1244,"text":"不仅从无力抵御外敌来说是这样，而且从内部社会的秩序(不如说是社会的无秩序)来说，差不多也是这样。自由的法兰克农民陷入了与他们的前辈即罗马的隶农一样的处境。被战争和掠夺弄得破产的他们，不得不去乞求新贵人或教会的保护，因为国王的权力太弱了，已不能保护他们：不过这种保护使他们不得不付出很高的代价。像以前高卢农民那样，他们必须将自己的土地所有权交给保护人，再以各种不同的和经常变化的租佃形式一不过总不外是力役和代役租一从他那里把这块土地作为租地而租回来。一经陷入这种依附形式，他们就逐渐地丧失了自己的人身自由；经过几代之后，他们大多数都变成了农奴。自由农民等级消灭得多么迅速，这从伊尔米农所编的圣热尔门一德一普雷修道院(当时在巴黎附近，现在在巴黎市内)的地产登记册4中可以得到证明。这个修道院的地产散布四周，面积极为广大。还在查理大帝在世的时候，就住有2788户人家，差不多全是取德意志名字的法兰克人。其中2080户是隶农，35户是半农奴，220户是奴隶，只有8户是自由的佃农！保护人让农民把自己的土地交归他所有，然后再将这块土地交给农民终身使用，这个曾被萨耳维安宣布为背神行为的习俗，如今到处被教会施加在农民身上了。现在日益盛行的"},{"id":"d-production","label":"d-production","lineStart":1250,"lineEnd":1250,"text":"然而，这不过证明：第一，没落时期罗马帝国的社会分化和财产分配，是跟当时的农业和工业的生产水平完全相适应的，因而是不可避免的：第二，这一生产水平在以后四百年间，并没有根本性的下降和上升，因此，才以同样的必然性重新产生了同样的财产分配和同样的居民阶级。在罗马帝国存在的最后数百年间，城市丧失了它从前对乡村的统治，而在德意志人统治地位的最初数百年间，也没有恢复这一统治。这是以农业与工业的发展程度很低为前提的。这样一个总的状况，必然产生占统治的大地主和依附的小农。要把使用奴隶劳动的罗马大庄园经济或使用徭役的新的大规模经营嫁接在这种社会上面是多么不可能，这可以从查理大帝的规模庞大的然而几乎没有留下痕迹的有名的皇室田庄的实验中得到证明。只有修道院才又继续了这种实验，也只是对修道院说来这种试验才有一些成效；但是修道院乃是以独身生活为基础的非正常的社会组织；它们可能会有例外的成绩，然而正因为如此，才不能不是一个例外。"},{"id":"d-difference","label":"d-difference","lineStart":1251,"lineEnd":1251,"text":"但在这四百年间，毕竟是前进了一步。即使我们在这一时期的末尾所看到的主要阶级差不多跟初期一样，但构成这些阶级的人毕竟已经不同了。古代的奴隶制已经消失了；破产的、贫穷的、视劳动为奴隶贱事的自由人也已经消失。介于罗马隶农和新的农奴之间的是自由的法兰克农民。正在灭亡中的罗马国粹，它的无益的回忆与徒然的斗争”已经死亡并且被埋葬了。九世纪的社会阶级，"},{"id":"d-new","label":"d-new","lineStart":1256,"lineEnd":1256,"text":"不是在垂死的文明的衰亡中，而是在新文明诞生的阵痛中形成的。新的世代，无论是主人还是仆从，跟他们的罗马前辈比较起来，已经是成年人的世代了。有权势的地主和服劳役的农民之间的关系，对罗马人来说曾经是古代世界毫无出路的没落形式，现在对新的世代来说成了新的发展的起点。其次，不论这四百年看起来多么像白白度过，可是却留下了一个重大的成果：这就是一些现代的民族(moderne N ationalitaten),亦即西欧人类为了未来的历史而实现的新的形成和新的组合。德意志人确实重新使欧洲有了生气，因此，日耳曼时期的国家破坏过程才不是以诺曼一萨拉秦人的征服而告终，而是以采邑制度和保护关系（依附制度6）的进一步发展为封建制度而告终，而人口也有了这样巨大的增长，以致能够完好无恙地经受了不到二百年后的十字军远征的大流血。①"},{"id":"d-no-race","label":"d-no-race","lineStart":1257,"lineEnd":1257,"text":"然而，德意志人究竞是用了什么灵丹妙药，给垂死的欧洲注入了新的生命力呢？是不是像我们的沙文主义的历史著作所虚构的那样，德意志种族天生有一种特别的魔力呢？决不是。德意志人，尤其在当时，是一个天资高的雅利安部落，并且正处在充满生命力的发展中。但是使欧洲返老还童的，并不是他们的特殊的民族特点，而只是他们的野蛮状态，他们的氏族制度而已。"},{"id":"d-women","label":"d-women","lineStart":1265,"lineEnd":1265,"text":"如果说，德意志人改革了一夫一妻制的古代形式缓和了男子在家庭中的统治，给了妇女以比古典世界任何时期都更高的地位，那末，使他们能够做到这一点的，如果不是他们的野蛮状态、他们的氏族习惯，如果不是他们仍有母权制时代的遗风，又是什么呢？"},{"id":"d-solidarity","label":"d-solidarity","lineStart":1266,"lineEnd":1266,"text":"如果说，他们至少在三个最重要的国度一德国、法国北部和英国一以马尔克公社的形式保存下来一部分真正的氏族制度，并把它带到封建国家里去，从而使被压迫阶级即农民甚至在中世纪农奴制的最残酷条件下，也能有地方性的团结和抵抗的手段，而这两种东西无论在古代的奴隶那里或者在近代的无产阶级那里都没有这样现成，那末，造成这种情况的，如果不是他们的野蛮状态、如果不是他们的纯粹野蛮人的按氏族定居的方式，又是什么呢？"},{"id":"d-emancipation","label":"d-emancipation","lineStart":1268,"lineEnd":1268,"text":"一发展起来，并提高到普及的地位，而这种隶属形式，正如傅立叶最早指出的”，给被奴役者提供了一个使自己作为阶级而逐渐获得解放的手段(fournit aux cultivateurs des moyensd'affranchisse-ment collectif et progressif①)，因此之故，这种形式大大胜过于奴隶制一在奴隶制下，只能有单个人不经过过渡状态而立即获得释放（古代是没有用胜利的起义来消灭奴隶制的事情的)，而中世纪的农奴实际上却作为阶级而逐渐实现了自己的解放，一如果是这样的话，那末，这一切如果不是归功于他们的野蛮状态（由于这种野蛮状态，他们还没有达到充分发展的奴"},{"id":"d-end","label":"d-end","lineStart":1275,"lineEnd":1275,"text":"凡德意志人给罗马世界注入的一切有生命力的和带来生命的东西，都是野蛮时代的东西。的确，只有野蛮人才能使一个在垂死的文明中挣扎的世界年轻起来。而德意志人在民族大迁徙之前所努力达到并已经达到的野蛮时代的高级阶段，对于这一过程恰好最为适宜。这就说明了一切。"}]}</script></body></html>
