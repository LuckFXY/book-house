},{"kind":"excerpt","label":"准确使用量项联项","href":"./logic-05.html#excerpt-e-appropriate"},{"kind":"ocr","label":"看 OCR 原书 · 准确使用量项联项","href":"./source.html#book=formal-logic-1976&from=660&to=660&ref=logic-05.html%23excerpt-e-appropriate"},{"kind":"excerpt","label":"全不与不全","href":"./logic-05.html#excerpt-e-notall"},{"kind":"ocr","label":"看 OCR 原书 · 全不与不全","href":"./source.html#book=formal-logic-1976&from=698&to=698&ref=logic-05.html%23excerpt-e-notall"},{"kind":"excerpt","label":"矛盾关系的真假约束","href":"./logic-05.html#excerpt-e-contradiction"},{"kind":"ocr","label":"看 OCR 原书 · 矛盾关系的真假约束","href":"./source.html#book=formal-logic-1976&from=721&to=721&ref=logic-05.html%23excerpt-e-contradiction"},{"kind":"excerpt","label":"全称肯定与特称否定","href":"./logic-05.html#excerpt-e-ai"},{"kind":"ocr","label":"看 OCR 原书 · 全称肯定与特称否定","href":"./source.html#book=formal-logic-1976&from=722&to=722&ref=logic-05.html%23excerpt-e-ai"},{"kind":"excerpt","label":"全称否定与特称肯定","href":"./logic-05.html#excerpt-e-ei"},{"kind":"ocr","label":"看 OCR 原书 · 全称否定与特称肯定","href":"./source.html#book=formal-logic-1976&from=727&to=727&ref=logic-05.html%23excerpt-e-ei"},{"kind":"excerpt","label":"关系比较的同项前提","href":"./logic-05.html#excerpt-e-same"},{"kind":"ocr","label":"看 OCR 原书 · 关系比较的同项前提","href":"./source.html#book=formal-logic-1976&from=749&to=749&ref=logic-05.html%23excerpt-e-same"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-05","title":"第五讲·怎样做到判断恰当（一）","output":"logic-05.html"},"excerpts":[{"id":"e-parts","label":"四个组成部分","lineStart":618,"lineEnd":618,"text":"简单判断一殷都具有上述四个组成部分，就是：主项、谓项、联项和量项。"},{"id":"e-link","label":"肯定联项","lineStart":616,"lineEnd":616,"text":"“是”用来断定作为主项的事物具有作为谓项的性质，、叫做肯定联项。"},{"id":"e-quantity","label":"量项的作用","lineStart":617,"lineEnd":617,"text":"它们是用来表示判断的对象即主项的数量或范围的，叫量项。"},{"id":"e-six","label":"六种基本形式","lineStart":632,"lineEnd":632,"text":"单称肯定判断，单称否定判断，特称肯定判断，特称否定判断，全称肯定判断，全称否定判断。"},{"id":"e-some","label":"有些不自动排除全部","lineStart":639,"lineEnd":639,"text":"特称量项“有些”或“有的”，在数量上是不确定的，它的意思是至少有一个。"},{"id":"e-all","label":"全称断定的范围","lineStart":642,"lineEnd":642,"text":"全称肯定判断是对一类事物的全部有所肯定，全称否定判断是对一类事物的全部有所否定。"},{"id":"e-appropriate","label":"准确使用量项联项","lineStart":660,"lineEnd":660,"text":"要准确地理解一句话的意思，确定它所表达的判断的形式，要作出恰当的判断，都必须准确地使用量项和联项。"},{"id":"e-notall","label":"全不与不全","lineStart":698,"lineEnd":698,"text":"前者表达了一个全称否定判断，“他的看法都不是对的。”而后者则相等于一个特称否定判断：“他有的看法不对。”"},{"id":"e-contradiction","label":"矛盾关系的真假约束","lineStart":721,"lineEnd":721,"text":"这两个判断是互相矛盾的，不能同真，也不可能同假。"},{"id":"e-ai","label":"全称肯定与特称否定","lineStart":722,"lineEnd":722,"text":"全称肯定判断与特称否定判断之间的关系，也是矛盾关系。"},{"id":"e-ei","label":"全称否定与特称肯定","lineStart":727,"lineEnd":727,"text":"全称否定判断与特称肯定判断之间的关系，也是矛盾关系。"},{"id":"e-contrary","label":"反对关系","lineStart":736,"lineEnd":736,"text":"甲、乙两判断不能同真，但是可能同假，因此甲、乙互相反对。"},{"id":"e-difference","label":"反对不是矛盾","lineStart":745,"lineEnd":745,"text":"因为可能同假，所以由一个判断假却不能断定另一个判断必真。"},{"id":"e-same","label":"关系比较的同项前提","lineStart":749,"lineEnd":749,"text":"上述两种关系，只存在于主项和谓项都相同的两个判断之间"}]}</script></body></html>
