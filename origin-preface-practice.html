":"看 OCR 原书 · 恩格斯说明主要由自己完成的章节","href":"./source.html#book=family-origin&from=31&to=31&ref=origin-preface.html%23excerpt-p-celtic"},{"kind":"excerpt","label":"经济论证重新改写","href":"./origin-preface.html#excerpt-p-economy"},{"kind":"ocr","label":"看 OCR 原书 · 经济论证重新改写","href":"./source.html#book=family-origin&from=32&to=32&ref=origin-preface.html%23excerpt-p-economy"},{"kind":"excerpt","label":"旧结构中的新社会成分","href":"./origin-preface.html#excerpt-p-new"},{"kind":"ocr","label":"看 OCR 原书 · 旧结构中的新社会成分","href":"./source.html#book=family-origin&from=24&to=24&ref=origin-preface.html%23excerpt-p-new"},{"kind":"excerpt","label":"作者概括血族组织至国家的转变","href":"./origin-preface.html#excerpt-p-transition"},{"kind":"ocr","label":"看 OCR 原书 · 作者概括血族组织至国家的转变","href":"./source.html#book=family-origin&from=24&to=24&ref=origin-preface.html%23excerpt-p-transition"},{"kind":"excerpt","label":"作者关于新社会家庭制度的判断","href":"./origin-preface.html#excerpt-p-ownership"},{"kind":"ocr","label":"看 OCR 原书 · 作者关于新社会家庭制度的判断","href":"./source.html#book=family-origin&from=24&to=24&ref=origin-preface.html%23excerpt-p-ownership"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-preface","title":"第一版序言","output":"origin-preface.html"},"excerpts":[{"id":"p-project","label":"恩格斯说明写作任务","lineStart":16,"lineEnd":16,"text":"我这本书，只能稍稍补偿我的亡友未能完成的工作。"},{"id":"p-notes","label":"马克思笔记与本书","lineStart":16,"lineEnd":16,"text":"不过，我手中有他写在摩尔根一书的详细摘要中的批语，这些批语我在本书中有关的地方就加以抄录。"},{"id":"p-production","label":"序言的理论出发点","lineStart":17,"lineEnd":17,"text":"根据唯物主义观点，历史中的决定性因素，归根结蒂是直接生活的生产和再生产。"},{"id":"p-material","label":"生活资料生产的内容","lineStart":24,"lineEnd":24,"text":"食物、衣服、住房以及为此所必需的工具的生产"},{"id":"p-reproduction","label":"作者所说的另一种生产","lineStart":24,"lineEnd":24,"text":"另一方面是人类自身的生产，即种的蕃衍。"},{"id":"p-constraints","label":"两种生产与社会制度","lineStart":24,"lineEnd":24,"text":"一定历史时代和一定地区内的人们生活于其下的社会制度，受着两种生产的制约：一方面受劳动的发展阶段的制约，另一方面受家庭的发展阶段的制约。"},{"id":"p-kinship","label":"作者解释血族关系的支配","lineStart":24,"lineEnd":24,"text":"劳动愈不发展，劳动产品的数量、从而社会的财富愈受限制，社会制度就愈是在较大程度上受血族关系的支配。"},{"id":"p-new","label":"旧结构中的新社会成分","lineStart":24,"lineEnd":24,"text":"劳动生产率日益发展起来；与此同时，私有制和交换、财产差别、使用他人劳动力的可能性，从而阶级对立的基础等等新的社会成分，也日益发展起来；"},{"id":"p-transition","label":"作者概括血族组织至国家的转变","lineStart":24,"lineEnd":24,"text":"以血族团体为基础的旧社会，由于新形成的社会各阶级的冲突而被炸毁；组成为国家的新社会取而代之，而国家的基层单位已经不是血族团体，而是地区团体了。"},{"id":"p-ownership","label":"作者关于新社会家庭制度的判断","lineStart":24,"lineEnd":24,"text":"在这种社会中，家庭制度完全受所有制的支配，阶级对立和阶级斗争从此自由开展起来"},{"id":"p-morgan","label":"恩格斯评价摩尔根的材料工作","lineStart":25,"lineEnd":25,"text":"他研究自己所得的材料，到完全掌握为止，前后大约有四十年。"},{"id":"p-additions","label":"恩格斯补充历史材料","lineStart":31,"lineEnd":31,"text":"在关于希腊和罗马历史的章节中，我没有局限于摩尔根的例证，而是补充了我所掌握的材料。"},{"id":"p-celtic","label":"恩格斯说明主要由自己完成的章节","lineStart":31,"lineEnd":31,"text":"关于克尔特人和德意志人的章节，基本上是属于我的；"},{"id":"p-economy","label":"经济论证重新改写","lineStart":32,"lineEnd":32,"text":"经济方面的论证，对摩尔根的目的来说已经很充分了，对我的目的来说就完全不够，所以我把它全部重新改写过了。"},{"id":"p-responsibility","label":"作者责任界限","lineStart":32,"lineEnd":32,"text":"最后，凡是没有明确引证摩尔根而做出的结论，当然都由我来负责。"}]}</script></body></html>
