ineStart":48,"lineEnd":48,"text":"从采用鱼类（虾类、贝壳类及其他水栖动物都包括在内)作为食物和使用火开始。"},{"id":"o-bow","label":"蒙昧高级阶段的作者界标","lineStart":49,"lineEnd":49,"text":"从弓箭的发明开始。"},{"id":"o-pottery","label":"野蛮低级阶段的作者界标","lineStart":56,"lineEnd":56,"text":"从学会制陶术开始。"},{"id":"o-region","label":"自然条件进入分期解释","lineStart":57,"lineEnd":57,"text":"随着野蛮时代的到来，我们达到了这样一个阶段，这时两大陆的自然条件上的差异，就有了意义。"},{"id":"o-different","label":"作者说明区域道路与界标差异","lineStart":62,"lineEnd":62,"text":"由于自然条件的这种差异，两个半球上的居民，从此以后，便各自循着自己独特的道路发展，而表示各个阶段的界标在两个半球也就各不相同了。"},{"id":"o-middle","label":"野蛮中级阶段的两地界标","lineStart":63,"lineEnd":63,"text":"在东大陆，是从驯养家畜开始：在西大陆，是从靠灌溉之助栽培食用植物以及在建筑上使用干砖（即用阳光晒干的生砖)和石头开始。"},{"id":"o-interruption","label":"作者叙述地区发展遭外部打断","lineStart":65,"lineEnd":65,"text":"西班牙人的征服打断了他们的任何进一步的独立发展。"},{"id":"o-crop","label":"作者用可能语气提出谷物起因推测","lineStart":72,"lineEnd":72,"text":"十分可能，谷物的种植在这里首先是由牲畜饲料的需要所引起的，只是到了后来，才成为人类食物的重要来源。"},{"id":"o-diet","label":"十九世纪人群与食物推测（原书判断）","lineStart":73,"lineEnd":73,"text":"雅利安人和闪米特人这两个人种的比较好的发展，或许应归功于他们的丰富的肉乳食物，特别是这种食物对于儿童发育的优良影响。"},{"id":"o-iron","label":"野蛮高级阶段及向文明时代过渡","lineStart":79,"lineEnd":79,"text":"从铁矿的冶炼开始，并由于文字的发明及其应用于文献记录而过渡到文明时代。"},{"id":"o-plough","label":"作者连接工具与生产变化","lineStart":80,"lineEnd":80,"text":"我们在这里初次看到了带有铁铧的用家畜拉的耕犁"},{"id":"o-confidence","label":"作者对自己图景的强评价","lineStart":89,"lineEnd":89,"text":"这些特征都是不可争辩的，因为它们是直接从生产中得来的。"},{"id":"o-gather","label":"本章结尾概括蒙昧时代","lineStart":89,"lineEnd":89,"text":"蒙昧时代是以获取现成的天然产物为主的时期；人工产品主要是用作获取天然产物的辅助工具。"},{"id":"o-cultivate","label":"本章结尾概括野蛮时代","lineStart":89,"lineEnd":89,"text":"野蛮时代是学会畜牧和农耕的时期，是学会靠人的活动来增加天然产物生产的方法的时期。"},{"id":"o-civilization","label":"作者对过渡终点的概括","lineStart":89,"lineEnd":89,"text":"文明时代是学会对天然产物进一步加工的时期，是真正的工业和艺术的时期。"}]}</script></body></html>
