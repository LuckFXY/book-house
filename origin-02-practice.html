496&to=496&ref=origin-02.html%23excerpt-c-legal-economic"},{"kind":"excerpt","label":"作者解释经济条件与法律关系","href":"./origin-02.html#excerpt-c-law-result"},{"kind":"ocr","label":"看 OCR 原书 · 作者解释经济条件与法律关系","href":"./source.html#book=family-origin&from=498&to=498&ref=origin-02.html%23excerpt-c-law-result"},{"kind":"excerpt","label":"作者提出公共劳动与家务经济条件","href":"./origin-02.html#excerpt-c-public-work"},{"kind":"ocr","label":"看 OCR 原书 · 作者提出公共劳动与家务经济条件","href":"./source.html#book=family-origin&from=503&to=503&ref=origin-02.html%23excerpt-c-public-work"},{"kind":"excerpt","label":"作者归纳三种主要婚姻形式，勿混同四个小节数量","href":"./origin-02.html#excerpt-c-three-main"},{"kind":"ocr","label":"看 OCR 原书 · 作者归纳三种主要婚姻形式，勿混同四个小节数量","href":"./source.html#book=family-origin&from=510&to=510&ref=origin-02.html%23excerpt-c-three-main"},{"kind":"excerpt","label":"作者对经济条件改变后单配偶关系的预测","href":"./origin-02.html#excerpt-c-future-monogamy"},{"kind":"ocr","label":"看 OCR 原书 · 作者对经济条件改变后单配偶关系的预测","href":"./source.html#book=family-origin&from=521&to=521&ref=origin-02.html%23excerpt-c-future-monogamy"},{"kind":"excerpt","label":"作者对家务与儿童照料社会化的展望","href":"./origin-02.html#excerpt-c-childcare"},{"kind":"ocr","label":"看 OCR 原书 · 作者对家务与儿童照料社会化的展望","href":"./source.html#book=family-origin&from=522&to=522&ref=origin-02.html%23excerpt-c-childcare"},{"kind":"excerpt","label":"作者预计将丧失的历史属性","href":"./origin-02.html#excerpt-c-end-features"},{"kind":"ocr","label":"看 OCR 原书 · 作者预计将丧失的历史属性","href":"./source.html#book=family-origin&from=578&to=578&ref=origin-02.html%23excerpt-c-end-features"},{"kind":"excerpt","label":"作者限制未来预测的强度","href":"./origin-02.html#excerpt-c-future-limit"},{"kind":"ocr","label":"看 OCR 原书 · 作者限制未来预测的强度","href":"./source.html#book=family-origin&from=579&to=579&ref=origin-02.html%23excerpt-c-future-limit"},{"kind":"excerpt","label":"摩尔根结尾引文的开放性","href":"./origin-02.html#excerpt-c-not-predict"},{"kind":"ocr","label":"看 OCR 原书 · 摩尔根结尾引文的开放性","href":"./source.html#book=family-origin&from=585&to=585&ref=origin-02.html%23excerpt-c-not-predict"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-02","title":"第二章·家庭","output":"origin-02.html"},"excerpts":[{"id":"c-inferred","label":"作者从称谓制度反推家庭形式的强断言","lineStart":111,"lineEnd":111,"text":"这一家庭形式的存在，现在我们已经在任何地方都不能证明了，但是它一定是存在过的"},{"id":"c-system-lag","label":"摩尔根关于家庭与亲属称谓变动不同步的解释","lineStart":112,"lineEnd":112,"text":"家庭，一摩尔根说，一是一个能动的要素；它从来不是静止不动的"},{"id":"c-lag","label":"摩尔根关于亲属制度滞后的解释","lineStart":112,"lineEnd":112,"text":"反之，亲属制度却是被动的：它只不过是过一个长久的时期把家庭逐渐发生的进步记录下来，并且只是在家庭已经急剧变化了的时候，它才发生急剧的变化。"},{"id":"c-remote","label":"作者对遥远原始状态的条件表达","lineStart":121,"lineEnd":121,"text":"那个原始社会阶段，即使确实存在过的话，也是属于非常遥远的时代"},{"id":"c-critical","label":"作者承认材料需批判审查","lineStart":138,"lineEnd":138,"text":"甚至我们关于蒙味时代人类部落的一切材料，也是多么矛盾，多么需要批判的检验和精选呵！"},{"id":"c-disorder","label":"术语解释，防止以现代含义偷换","lineStart":160,"lineEnd":160,"text":"所谓杂乱，是说后来由习俗所规定的那些限制那时还不存在。但是由此决不能说在这种关系的日常实践中也必然是乱得毫无秩序的。"},{"id":"c-attribution","label":"四小节讨论的理论归属和大概限定","lineStart":163,"lineEnd":163,"text":"按照摩尔根的意见，从这种杂乱性交关系的原始状态中，大概很早就发展出了以下几种家庭形式："},{"id":"c-blood","label":"作者对血缘家庭禁例的定义","lineStart":169,"lineEnd":169,"text":"仅仅排斥了祖先和子孙之间、双亲和子女之间互为夫妻的权利和义务（用现代的说法）。"},{"id":"c-blood-inferred","label":"血缘家庭属于作者从亲属制度作的反推","lineStart":177,"lineEnd":177,"text":"夏威夷的亲属制度这种制度至今还在整个波利尼西亚通行)，使我们不能不承认这种家庭一定是存在过的"},{"id":"c-punalua","label":"普那路亚家庭与禁例扩大的作者关系","lineStart":178,"lineEnd":178,"text":"如果说家庭组织上的第一个进步在于排除了父母和子女之间相互的性交关系，那末，第二个进步就在于对于姊妹和兄弟也排除了这种关系。"},{"id":"c-punalua-definition","label":"普那路亚形式的具体作者规定","lineStart":189,"lineEnd":189,"text":"它的主要特征是一定的家庭范围内相互的共夫和共妻，不过在这个家庭范围以内是把妻子的兄弟（起初是同胞的，以后更及于血统较远的)除外，另一方面也把丈夫的姊妹除外。"},{"id":"c-mother","label":"作者关于女系确认的论证","lineStart":215,"lineEnd":215,"text":"只要存在着群婚，那末世系就只能从母亲方面来确定，因此，也只承认女系。"},{"id":"c-maternal-term","label":"母权制术语不能直接当作法律权利","lineStart":215,"lineEnd":215,"text":"我仍然保留了这一名称；不过它是不大恰当的，因为在社会发展的这一阶段上，还谈不到法律意义上的权利。"},{"id":"c-gens","label":"家庭小节如何引向氏族概念","lineStart":217,"lineEnd":217,"text":"即组成一个确定的、彼此不能结婚的女系血缘亲属集团；"},{"id":"c-revision","label":"作者明确修正普那路亚普遍必经说","lineStart":223,"lineEnd":223,"text":"自从我们了解了群婚的一系列其他形式以后，现在才知道摩尔根在这里走得太远了。"},{"id":"c-open-research","label":"作者保留研究开放性","lineStart":243,"lineEnd":243,"text":"在这里，目下摆在我们面前的还是一个刚刚敞开而尚未有人进入的研究领域。"},{"id":"c-pairing","label":"对偶家庭的解除关系与世系","lineStart":250,"lineEnd":250,"text":"然而，婚姻关系是很容易由任何一方撕破的，而子女像以前一样仍然只属于母亲。"},{"id":"c-marriage-arrangement","label":"作者描述对偶婚中的亲属安排","lineStart":262,"lineEnd":262,"text":"缔结婚姻并不是当事人本人的事情（甚至往往不同他们商量），而是他们的母亲的事情。"},{"id":"c-communal","label":"对偶配对不等于独立个体家计","lineStart":267,"lineEnd":267,"text":"这种对偶家庭，本身还很脆弱，还很不稳定，不能使人需要有或者只是愿意有自己的家庭经济，因此它根本没有使早期传下来的共产制家庭经济解体。"},{"id":"c-work-status","label":"劳动负担不能直接等同社会地位","lineStart":274,"lineEnd":274,"text":"决定两性间的分工的原因，是同决定妇女社会地位的原因完全不同的。"},{"id":"c-social-motive","label":"从禁婚解释转向社会经济动力","lineStart":313,"lineEnd":313,"text":"如果没有新的、社会的动力发生作用，那末，从成对配偶制中就没有任何根据产生新的家庭形式了。"},{"id":"c-wealth","label":"作者引出财富与新社会关系","lineStart":315,"lineEnd":315,"text":"在旧大陆，家畜的驯养和畜群的繁殖，创造了前所未有的财富的来源，并产生了全新的社会关系。"},{"id":"c-inheritance","label":"母系氏族中的财产继承难题","lineStart":332,"lineEnd":332,"text":"他们不能继承自己的父亲，因为他们不属于父亲的氏族，而父亲的财产应该留在父亲自己的氏族内。"},{"id":"c-inheritance-intent","label":"作者解释财富、权力与继承改造的联系","lineStart":333,"lineEnd":333,"text":"随着财富的增加，它便一方面使丈夫在家庭中占居比妻子更重要的地位；另一方面，又产生了利用这个增强了的地位来改变传统的继承制度使之有利于子女的意图。"},{"id":"c-paternal-switch","label":"作者叙述的世系及继承变动","lineStart":338,"lineEnd":338,"text":"这样就废除了按女系计算世系的办法和母系的继承权，而确立了按男系计算世系的办法和父系的继承权。"},{"id":"c-unknown","label":"转变具体历史过程未知的承认","lineStart":338,"lineEnd":338,"text":"这一革命在文化民族中是怎样和在何时发生的，我们毫无所知。"},{"id":"c-defeat","label":"作者强历史评价，不能冒充独立核验","lineStart":346,"lineEnd":346,"text":"母权制的被推翻，乃是女性的具有世界历史意义的失败。"},{"id":"c-patriarchal","label":"家长制家庭主要标志，不能只等同多妻","lineStart":349,"lineEnd":349,"text":"这种家庭的主要标志，一是把非自由人包括在家庭以内，一是父权："},{"id":"c-assembly","label":"家长制家庭公社材料中的会议权力","lineStart":366,"lineEnd":366,"text":"最高权力集中在家庭会议，即全体成年男女的会议。"},{"id":"c-patriarchal-limit","label":"作者在补充研究中的内部保留","lineStart":369,"lineEnd":369,"text":"因此，家长的绝对权力，以及其他的家庭成员对家长的无权地位，近来是受到很大怀疑的。"},{"id":"c-polygamy-exception","label":"本章对多妻多夫形式的历史判断","lineStart":383,"lineEnd":383,"text":"不论多妻制或多夫制的婚姻形式都不能成为普遍通行的形式。"},{"id":"c-monogamy","label":"对偶与一夫一妻制历史形式的区别","lineStart":391,"lineEnd":391,"text":"一夫一妻制家庭和对偶婚不同的地方，就在于婚姻关系要坚固得多，这种关系现在已不能由双方任意解除了。"},{"id":"c-monogamy-goal","label":"父产继承与历史个体婚制","lineStart":391,"lineEnd":391,"text":"其明显的目的就是生育确凿无疑的出自一定父亲的子女；而确定出生自一定的父亲之所以必要，是因为子女将来要以亲生的继承人的资格继承他们父亲的财产。"},{"id":"c-economic-origin","label":"作者关于经济起源的核心判断","lineStart":415,"lineEnd":415,"text":"一夫一妻制是不以自然条件为基础，而以经济条件为基础，即以私有制对原始的自然长成的公有制的胜利为基础的第一个家庭形式。"},{"id":"c-asymmetry","label":"作者讨论婚外关系中的不对等标准","lineStart":436,"lineEnd":436,"text":"这种非难决不是针对着参与此事的男子，而只是针对着妇女"},{"id":"c-scope","label":"作者限定关于夫妻冲突所指的范围","lineStart":448,"lineEnd":448,"text":"我在这里所说的，只是指个体婚制的如下一些场合"},{"id":"c-geography","label":"作者明确保留地区与时代差异","lineStart":453,"lineEnd":453,"text":"个体家庭决不是在任何地方和任何时候都具有像希腊人中间所有的那种古典的粗野形式。"},{"id":"c-love-union","label":"个人性爱与历史婚制不是简单同一","lineStart":465,"lineEnd":465,"text":"这并不是说，现代的性爱完全或主要是作为夫妇相互的爱而在这一形式中发展起来的。"},{"id":"c-class-interests","label":"作者讨论其时代有产阶级婚姻","lineStart":479,"lineEnd":479,"text":"婚姻都是由双方的阶级地位来决定的，因此总是权衡利害的婚姻。"},{"id":"c-working-love","label":"作者对其时代阶级差异的判断","lineStart":481,"lineEnd":481,"text":"只有在被压迫阶级中间，而在今天就是在无产阶级中间，性爱才可能成为并且确实成为对妇女的关系的常规，不管这种关系是否为官方所认可。"},{"id":"c-proletarian-residue","label":"作者同时保留虐待残余这一限制","lineStart":488,"lineEnd":488,"text":"除了自一夫一妻制出现以来就扎下了根的对妻子的虐待也许还遗留一些以外"},{"id":"c-historical-meaning","label":"现代单配偶含义与作者历史制度概念不同","lineStart":489,"lineEnd":489,"text":"无产者的婚姻之为一夫一妻制，是在这个名词的词源学意义上说的，决不是在这个名词的历史意义上说的。"},{"id":"c-legal-economic","label":"作者区分形式同意与经济条件","lineStart":496,"lineEnd":496,"text":"这种契约的缔结之所以被认为出于自愿，只是因为法律在纸面上规定双方处于平等地位而已。"},{"id":"c-law-result","label":"作者解释经济条件与法律关系","lineStart":498,"lineEnd":498,"text":"两性的法律上的不平等，并不是妇女在经济上受压迫的原因，而是它的结果。"},{"id":"c-public-work","label":"作者提出公共劳动与家务经济条件","lineStart":503,"lineEnd":503,"text":"妇女解放的第一个先决条件就是一切女性重新回到公共的劳动中去；而要达到这一点，又要求个体家庭不再成为社会的经济单位。"},{"id":"c-three-main","label":"作者归纳三种主要婚姻形式，勿混同四个小节数量","lineStart":510,"lineEnd":510,"text":"群婚制是与蒙昧时代相适应的，对偶婚制是与野蛮时代相适应的，以通奸和卖淫为补充的一夫一妻制是与文明时代相适应的。"},{"id":"c-future-monogamy","label":"作者对经济条件改变后单配偶关系的预测","lineStart":521,"lineEnd":521,"text":"它不仅不会消失，而且相反地，只有那时它才能十足地实现。"},{"id":"c-childcare","label":"作者对家务与儿童照料社会化的展望","lineStart":522,"lineEnd":522,"text":"私人的家庭经济变为社会的劳动部门。孩子的抚养和教育成为公共的事业：社会同等地关怀一切儿童，无论是婚生的还是非婚生的。"},{"id":"c-mutual","label":"作者所说现代性爱的特征","lineStart":532,"lineEnd":532,"text":"它是以所爱者的互爱为前提的：在这方面，妇女处于同男子平等的地位"},{"id":"c-class-choice","label":"作者对契约自由范围的限定","lineStart":562,"lineEnd":562,"text":"婚姻仍然是阶级的婚姻，但在阶级内部则承认当事者都享有某种程度的选择的自由。"},{"id":"c-end-features","label":"作者预计将丧失的历史属性","lineStart":578,"lineEnd":578,"text":"第一，男子的统治，第二，婚姻的不可离异性。"},{"id":"c-future-limit","label":"作者限制未来预测的强度","lineStart":579,"lineEnd":579,"text":"我们现在关于资本主义生产行将消灭以后的两性关系的秩序所能推想的，主要是否定性质的，大都限于将要消失的东西。"},{"id":"c-not-predict","label":"摩尔根结尾引文的开放性","lineStart":585,"lineEnd":585,"text":"那就不能事先预言，它的后继者将具有什么性质了。"}]}</script></body></html>
