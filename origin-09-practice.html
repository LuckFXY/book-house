-use"},{"kind":"excerpt","label":"v-surplus","href":"./origin-09.html#excerpt-v-surplus"},{"kind":"ocr","label":"看 OCR 原书 · v-surplus","href":"./source.html#book=family-origin&from=1321&to=1321&ref=origin-09.html%23excerpt-v-surplus"},{"kind":"excerpt","label":"v-first-class","href":"./origin-09.html#excerpt-v-first-class"},{"kind":"ocr","label":"看 OCR 原书 · v-first-class","href":"./source.html#book=family-origin&from=1327&to=1327&ref=origin-09.html%23excerpt-v-first-class"},{"kind":"excerpt","label":"v-gender","href":"./origin-09.html#excerpt-v-gender"},{"kind":"ocr","label":"看 OCR 原书 · v-gender","href":"./source.html#book=family-origin&from=1328&to=1328&ref=origin-09.html%23excerpt-v-gender"},{"kind":"excerpt","label":"v-family","href":"./origin-09.html#excerpt-v-family"},{"kind":"ocr","label":"看 OCR 原书 · v-family","href":"./source.html#book=family-origin&from=1334&to=1334&ref=origin-09.html%23excerpt-v-family"},{"kind":"excerpt","label":"v-definition","href":"./origin-09.html#excerpt-v-definition"},{"kind":"ocr","label":"看 OCR 原书 · v-definition","href":"./source.html#book=family-origin&from=1416&to=1416&ref=origin-09.html%23excerpt-v-definition"},{"kind":"excerpt","label":"v-exchange","href":"./origin-09.html#excerpt-v-exchange"},{"kind":"ocr","label":"看 OCR 原书 · v-exchange","href":"./source.html#book=family-origin&from=1419&to=1419&ref=origin-09.html%23excerpt-v-exchange"},{"kind":"excerpt","label":"v-no-controller","href":"./origin-09.html#excerpt-v-no-controller"},{"kind":"ocr","label":"看 OCR 原书 · v-no-controller","href":"./source.html#book=family-origin&from=1424&to=1424&ref=origin-09.html%23excerpt-v-no-controller"},{"kind":"excerpt","label":"v-laws","href":"./origin-09.html#excerpt-v-laws"},{"kind":"ocr","label":"看 OCR 原书 · v-laws","href":"./source.html#book=family-origin&from=1425&to=1425&ref=origin-09.html%23excerpt-v-laws"},{"kind":"excerpt","label":"v-exploitation","href":"./origin-09.html#excerpt-v-exploitation"},{"kind":"ocr","label":"看 OCR 原书 · v-exploitation","href":"./source.html#book=family-origin&from=1432&to=1432&ref=origin-09.html%23excerpt-v-exploitation"},{"kind":"excerpt","label":"v-historical","href":"./origin-09.html#excerpt-v-historical"},{"kind":"ocr","label":"看 OCR 原书 · v-historical","href":"./source.html#book=family-origin&from=1409&to=1409&ref=origin-09.html%23excerpt-v-historical"},{"kind":"excerpt","label":"v-future","href":"./origin-09.html#excerpt-v-future"},{"kind":"ocr","label":"看 OCR 原书 · v-future","href":"./source.html#book=family-origin&from=1414&to=1414&ref=origin-09.html%23excerpt-v-future"},{"kind":"excerpt","label":"v-summary","href":"./origin-09.html#excerpt-v-summary"},{"kind":"ocr","label":"看 OCR 原书 · v-summary","href":"./source.html#book=family-origin&from=1435&to=1435&ref=origin-09.html%23excerpt-v-summary"},{"kind":"excerpt","label":"v-contradiction","href":"./origin-09.html#excerpt-v-contradiction"},{"kind":"ocr","label":"看 OCR 原书 · v-contradiction","href":"./source.html#book=family-origin&from=1444&to=1444&ref=origin-09.html%23excerpt-v-contradiction"},{"kind":"excerpt","label":"v-morgan","href":"./origin-09.html#excerpt-v-morgan"},{"kind":"ocr","label":"看 OCR 原书 · v-morgan","href":"./source.html#book=family-origin&from=1454&to=1454&ref=origin-09.html%23excerpt-v-morgan"},{"kind":"excerpt","label":"v-final","href":"./origin-09.html#excerpt-v-final"},{"kind":"ocr","label":"看 OCR 原书 · v-final","href":"./source.html#book=family-origin&from=1460&to=1460&ref=origin-09.html%23excerpt-v-final"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"origin-09","title":"第九章·野蛮时代和文明时代","output":"origin-09.html"},"excerpts":[{"id":"v-method","label":"v-method","lineStart":1281,"lineEnd":1281,"text":"我们已经根据希腊人、罗马人和德意志人这三大实例，探讨了民族制度的解体。最后，我们来研究一下那在野蛮时代高级阶段已经破坏了氏族社会组织，而随着文明时代的出现又把它完全消灭的一般经济条件。在这里，马克思的“资本论”对我们来说是和摩尔根的著作同样必要的。"},{"id":"v-limits","label":"v-limits","lineStart":1289,"lineEnd":1289,"text":"织起来的社会内部一切可能发生的冲突。对外的冲突，则由战争来解决；这种战争可能以部落的消灭而告终，但决不能以它的被奴役而告终。氏族制度的伟大，但同时也是它的局限性，就在于这里没有统治和奴役存在的余地。在氏族制度内部，权利和义务之间还没有任何差别参加公共事务，实行血族复仇或为此接受赎罪，究竟是权利还是义务这种问题，对印第安人来说是不存在的；在印第安人看来，这种问题正如吃饭、睡觉、打猎究竟是权利还是义务的问题一样荒谬。同样，部落和氏族分为不同的阶级也是不可能的。这就使我们不能不对这种社会状态的经济基础加以研究了。"},{"id":"v-household","label":"v-household","lineStart":1290,"lineEnd":1290,"text":"人口是极其稀少的；只有在部落的居住地才是比较稠密的，在这种居住地的周围，首先是一片广大的狩猎地带，其次是把这个部落同其他部落隔离开来的中立的防护森林。分工是纯粹自然产生的：它只存在于两性之间。男子作战、打猎、捕鱼，获取食物的原料，并制作为此所必需的工具。妇女管家，制备食物和衣服一做饭、纺织、缝纫。男女分别是自己活动领域的主人：男子是森林中的主人，妇女是家里的主人。男女分别是自己所制造的和所使用的工具的所有者：男子是武器、渔猎用具的所有者，妇女是家庭用具的所有者。家庭经济是共产制的，其中包括几个、往往是许多个家庭。①凡是共同制作和使用的东西，都是共同财产：如房屋、园圃、小船。这样，在这里，而且也只有在这里，才真正存在着文明社会的法学家和经济学家所捏造的“自己劳动所得的财产”一现代资本主义所有制还依恃着的最后的虚伪的法律根据。"},{"id":"v-first","label":"v-first","lineStart":1312,"lineEnd":1312,"text":"但是，人并不是到处都停留在这个阶段。在亚洲，他们发现了可以驯服和在驯服后可以繁殖的动物。野生的雌水牛，需要去猎取；但已经驯服的牛，每年可生一头小牛，此外还可以挤奶。有些最先进的部落一雅利安人、闪米特人，也许以至图兰人，其主要的劳动部门起初就是驯养牲畜，只是到后来才是繁殖和看管牲畜。游牧部落从其余的野蛮人群中分离出来一这是第一次社会大分工。游牧部落生产的生活资料，不仅比其余的野蛮人多，而且也不相同。同其余的野蛮人比较，他们不仅有数量多得多的牛乳、乳制品和肉类，而且有兽皮、绵羊毛、山羊毛和随着原料增多而日益增加的纺织物。这就第一次使经常的交换成为可能。在更早的阶段上，只能有偶然的交换；制造武器和工具的特殊技能，可能导致暂时的分工。例如，在许多地方，都发现石器时代晚期的石器作坊的不可置疑的遗迹：在这种作坊中发展了自己技能的匠人，大概是靠全体和为全体工作，正如印度的氏族公社的终身手艺人至今仍然如此一样。在这个阶段上，除了部落内部发生的交换以外，决不可能有其他的交换，而且，即使是部落内部的交换，也是一种例外的现象。相反地，自从游牧部落分离出来以后，我们就看到，各不同部落的成员之间进行交换以及它作为一种经常制度来发展和巩固的一切条件都具备了。起初是部落和部落之间通过各自的氏族首长来进行交换；但是当畜群开始变为特殊财产①的时候，个人和个人之间的交换便越来越占优势，终于成为交换的唯一形式。不过，游牧部落用来同他们的邻人交换的主要物品是牲畜；牲畜变成了一切商品都用它来估价并且到处乐于同它交换的"},{"id":"v-money-first","label":"v-money-first","lineStart":1318,"lineEnd":1318,"text":"商品一一句话，牲畜获得了货币的职能，在这个阶段上就已经当货币用了。在商品交换刚刚产生的时候，对货币商品的需求，就以这样的必然性和速度发展起来了。"},{"id":"v-use","label":"v-use","lineStart":1319,"lineEnd":1319,"text":"园圃种植业大概是野蛮低级阶段的亚洲人所不知道的，但它在那里作为农田耕作的先驱而出现不迟于中级阶段。在图兰平原的气候条件下，没有供漫长而严寒的冬季用的饲料储备，游牧生活是不可能的；因此，牧草栽培和谷物种植，在这里就成了必要条件。黑海以北的草原，也是如此。但谷物一旦作为家畜饲料而种植，它很快也成了人类的食物。耕地仍然是部落的财产，最初是交给氏族使用，后来由氏族交给家庭公社使用，最后①便交给个人使用；他们对耕地或许有一定的占有权，但是更多的权利是没有的。"},{"id":"v-surplus","label":"v-surplus","lineStart":1321,"lineEnd":1321,"text":"切部门一畜牧业、农业、家庭手工业一中生产的增加，使人的劳动力能够生产出超过维持劳动力所必需的产品。同时，这也增加了氏族、家庭公社或个体家庭的每个成员所担负的每日的劳动量。吸收新的劳动力成为人们向往的事情了。战争提供了新的劳动力：俘虏被变成了奴隶。第一次社会大分工，在使劳动生产率提高，从而使财富增加并且使生产场所扩大的同时，在既定的总的历史条件下，必然地带来了奴隶制。从第一次社会大分工中，也"},{"id":"v-first-class","label":"v-first-class","lineStart":1327,"lineEnd":1327,"text":"就产生了第一次社会大分裂，即分裂为两个阶级：主人和奴隶、剥削者和被剥削者。"},{"id":"v-gender","label":"v-gender","lineStart":1328,"lineEnd":1328,"text":"至于畜群怎样并且在什么时候从部落或氏族的共同占有变为各个家庭家长的财产，我们至今还不得而知。不过，基本上，这一过渡一定是在这个阶段上发生的。随着畜群和其他新的财富的出现，在家庭中便发生了革命。谋取生活资料总是男子的事情，谋取生活资料的工具是由男子制造的，并且是他们的财产。畜群是新的谋取生活资料的工具，最初对它们的驯养和以后对它们的照管都是男子的事情。因此，牲畜是属于他们的；用牲畜换来的商品和奴隶，也是属于他们的。这时谋生所得的全部剩余都归了男子；妇女参加它的消费，但在财产中没有她们的份儿。粗野的”战士和猎人，以在家中次于妇女而占第二位为满足，但“比较温和的”牧人，却依恃自己的财富挤上了首位，把妇女挤到了第二位。而妇女是不能抱怨的。家庭内的分工决定了男女之间的财产分配；这一分工仍然和以前一样，可是它现在仍然把迄今所存在的家庭关系完全颠倒了过来，这纯粹是因为家庭以外的分工已经不同了。从前保证妇女在家中占统治地位的同一原因一妇女只限于从事家务劳动，一现在却保证男子在家中占统治地位：妇女的家务劳动现在同男子谋取生活资料的劳动比较起来已经失掉了意义；男子的劳动就是一切，妇女的劳动是无足轻重的附属品。在这里就已经表明，只要妇女仍然被排除于社会的生产劳动之外而只限于从事家庭的私人劳动，那末妇女的解放，妇女同男子的平等，现在和将来都是不可能的。妇女的解放，只有在妇女可以大量地、社会规模地参加生产，而家务劳动只占她们极少的工夫的时候，才有可能。而这只有依靠现代大工业才能办到，现代大工业不仅容许大量的"},{"id":"v-family","label":"v-family","lineStart":1334,"lineEnd":1334,"text":"随着男子在家庭中的实际统治的确立，实行男子独裁的最后障碍便崩毁了。这种独裁，由于母权制的倾覆、父权制的实行、对偶婚制向一夫一妻制的逐步过渡而被确定下来，并且永久化了。但这样一来，在古代的氏族制度中就出现了一个裂口：个体家庭已成为一种力量，并且以威胁的姿态与氏族对抗了。"},{"id":"v-second","label":"v-second","lineStart":1335,"lineEnd":1335,"text":"下一步把我们引向野蛮时代高级阶段，一切文化民族都在这个时期经历了自己的英雄时代：铁剑时代，但同时也是铁犁和铁斧的时代。铁已在为人类服务，它是在历史上起过革命作用的各种原料中最后的和最重要的一种原料。所谓最后的，是指直到马铃薯的出现为止。铁使更大面积的农田耕作，开垦广阔的森林地区，成为可能；它给手工业工人提供了一种其坚固和锐利非石头或当时所知道的其他金属所能抵挡的工具。所有这些，都是逐渐实现的：最初的铁往往比青铜软。所以，石器只是慢慢地消失的；不仅在“希尔德布兰德之歌”中，而且在1066年的海斯丁斯会战中都还使用石斧。18但是，进步现在是不可遏止地、更少间断地、更加迅速地进行着。用石墙、城楼、雉堞围绕着石造或砖造房屋的城市，已经成为部落或部落联盟的中心：这是建筑艺术上的巨大进步，同时也是危险增加和防卫需要增加的标志。财富在迅速增加，但这是个人的财富；织布业、金属加工业以及其他一切彼此日益分离的手工业，显示出生产的日益多样化和生产技术的日益改进；农业现在除了提供谷物、豆科植物和水果以外，也提供植物油和葡萄酒，这些东西人们已经学会了制造。如此多样的活动，已经不能由同一个人来进行了；于是发生了第二次大分工：手工业和农业分"},{"id":"v-commodity","label":"v-commodity","lineStart":1340,"lineEnd":1340,"text":"离了。生产的不断增长以及随之而来的劳动生产率的不断增长，提高了人的劳动力的价值；在前一阶段上刚刚产生并且是零散现象的奴隶到，现在成为社会制度的一个本质的组成部分；奴隶们不再是简单的助手了；他们被成批地赶到田野和工场去劳动。随着生产分为农业和手工业这两大主要部门，便出现了直接以交换为目的的生产，即商品生产，随之而来的是贸易，不仅有部落内部和部落边界的贸易，而且还有海外贸易。然而，所有这一切都还很不发达；贵金属开始成为占优势的和普遍性的货币商品，但是还不是铸造的货币，只是简单地按重量交换罢了。"},{"id":"v-wealth","label":"v-wealth","lineStart":1341,"lineEnd":1341,"text":"除了自由人和奴隶之间的差别以外，又出现了富人和穷人间的差别，一随着新的分工，社会又有了新的阶级划分。各个家庭首长之间的财产差别，炸毁了各地仍然保存着的旧的共产制家庭公社；同时也炸毁了在这种公社范围内进行的共同耕作制。耕地起初是暂时地、后来便永久地分配给各个家庭使用，它向完全的私有财产的过渡，是逐渐完成的，是与对偶婚制向一夫一妻制的过渡平行地完成的。个体家庭开始成为社会的经济单位了。"},{"id":"v-military","label":"v-military","lineStart":1342,"lineEnd":1342,"text":"住得日益稠密的居民，对内和对外都不得不更紧密地团结起来。亲属部落的联盟，到处都成为必要的了；不久，各亲属部落的溶合，从而各个部落领土溶合为一个民族Nok)的共同领土，也成为必要的了。民族的军事首长一勒克斯，巴赛勒斯，提乌丹斯，一成了不可缺少的常设的公职人员。还不存在人民大会的地方，也出现了人民大会。军事首长、议事会和人民大会构成了发展为军事民主制的氏族社会的各机关。其所以称为军事民主制，是因为战争以及进行战争的组织现在已成为民族生活的正常职能。邻人的财富刺激了各民族的贪欲，在这些民族那里，获取财富已"},{"id":"v-warfare","label":"v-warfare","lineStart":1347,"lineEnd":1347,"text":"成为最重要的生活目的之一。他们是野蛮人：进行掠夺在他们看来是比进行创造的劳动更容易甚至更荣誉的事情。以前进行战争，只是为了对侵犯进行报复，或者是为了扩大已经感到不够的领土：现在进行战争，则纯粹是为了掠夺，战争成为经常的职业了。在新的设防城市的周围屹立着高峻的墙壁并非无故：它们的濠沟深陷为氏族制度的墓穴，而它们的城楼已经耸入文明时代了。内部也发生了同样的情形。掠夺战争加强了最高军事首长以及下级军事首长的权力；习惯地由同一家庭选出他们的后继者的办法，特别是从父权制确立以来，就逐渐转变为世袭制，人们最初是容忍，后来是要求，最后便僭取这种世袭制了；世袭王权和世袭贵族的基础奠定下来了。于是，氏族制度的机关就逐渐脱离了自己在人民、氏族、胞族和部落中的根子，而整个氏族制度就转化为自己的对立物：它从一个自由处理自己事务的部落组织转变为掠夺和压迫邻人的组织，而它的各机关也相应地从人民意志的工具转变为旨在反对自己人民的一个独立的统治和压迫机关了。但是，如果不是对财富的贪欲把氏族成员分成富人和穷人，如果不是“同一氏族内部的财产差别把利益的一致变为氏族成员之间的对抗”（马克思语)，如果不是奴隶制的盛行已经开始使人认为用劳动获取生存资料是只有奴隶才配做的、比掠夺更可耻的活动，那末这种情况是决不会发生的。"},{"id":"v-third","label":"v-third","lineStart":1354,"lineEnd":1354,"text":"财产，这种财产，到了成为相当数量的畜群的时候，就可以经常提供超出自身消费的若干余剩：同时，我们也看到了游牧民族和没有畜群的落后部落之间的分工，从而看到了两个并列的不同的生产阶段，从而也就看到了进行经常交换的条件。在野蛮时代高级阶段，进一步发生了农业和手工业之间的分工，从而发生了直接为了交换的、日益增加的一部分劳动产品的生产，从而使单个生产者之间的交换变成了社会的迫切需要。文明时代巩固并加强了所有这些在它以前发生的各次分工，特别是通过加剧城市和乡村的对立（或者是像古代那样，城市在经济上统治乡村，或者是像中世纪那样，乡村在经济上统治城市)而使之巩固和加强，此外它又加上了一个第三次的、它所特有的、有决定意义的重要分工：它创造了一个不从事生产而只从事产品交换的阶级一商人。在此以前阶级的形成的一切发端，都只是与生产相联系的；它们把从事生产的人分成了领导者和执行者，或者分成了较大规模的和较小规模的生产者。这里首次出现一个阶级，它根本不参予生产，但完全夺取了生产的领导权，并在经济上使生产者服从自己，它成了每两个生产者之间的不可缺少的中间人，并对他们两者进行剥削。在可以使生产者免除交换的辛劳和风险，可以使他们的产品的销路一直扩展到遥远的市场，从而可以使自己成为一个似乎最有用的居民阶级的借口下，一个寄生阶级，真正的社会寄生虫阶级形成了，它从国内和国外的生产上榨取油水，作为对自己的实际上非常有限的贡献的报酬，它很快就获得了大量的财富和相应的社会影响，正因为如此，它在文明时期便取得了愈来愈荣誉的地位和对生产的愈来愈大的统治权，直到最后它自己也生产出自己的产品一周期性的商业危机为止。"},{"id":"v-credit","label":"v-credit","lineStart":1359,"lineEnd":1359,"text":"不过，在我们正在考察的这个发展阶段上，年轻的商人阶级还丝毫没有预感到它所面临的伟大事业。但是这个阶级正在形成并且成为必不可少的东西，而这就够了。随着它，出现了金属货币即俦币，随着金属货币就出现了非生产者统治生产者及其生产的新手段。商品的商品被发现了，这种商品以隐蔽的方式包含着其他切商品，它是可以任意变为任何随心所欲的东西的魔法手段。准握有它，谁就统治了生产世界。但是准首先握有了它呢？商人。对货币的崇拜掌握在他手中是万无一失的。他尽心竭力地叫人们知道，切商品，从而一切商品生产者，都应该毕恭毕敬地匍匐在货币面前。他在实践上证明，其他一切财富形式，在这种财富本身的化身面前都不过是一个影子而已。以后货币的权力再也没有像在它的这个青年时代那样，以如此原始的粗野和横暴的形式表现出来。在使用货币购买商品之后，出现了货币借贷，随着货币借贷出现了利息和高利贷。后世的立法，没有一个像古雅典和古罗马的立法那样残酷无情地、无可挽救地把债务者投在高利贷债权者的脚下，一这两种立法，都是纯粹由于经济强制，作为习惯法而自发地产生的。"},{"id":"v-land","label":"v-land","lineStart":1360,"lineEnd":1360,"text":"除了表现为商品和奴隶的财富以外，除了货币财富以外，这时还出现了表现为地产的财富。各个人对于原来由氏族或部落给予他们的小块土地的占有权，现在变得如此牢固，以致这些小块土地作为世袭财产而属于他们了。他们最近首先力求实现的，正是要摆脱氏族公社索取这些小块土地的权利，这种权利对他们已成为桎梏了。这种桎梏他们是摆脱了，但是不久他们也失去了新的土地所有权。完全的、自由的土地所有权，不仅意味着毫无阻碍和毫无限制地占有土地的可能性，而且也意味着把它出让的可能性。只"},{"id":"v-mortgage","label":"v-mortgage","lineStart":1365,"lineEnd":1365,"text":"要土地是氏族的财产，这种可能性是不存在的。但是，当新的土地占有者彻底摆脱了氏族和部落的最高所有权这一桎梏的时候，他也就挣断了迄今把他同土地不可分割地连在一起的纽带。这意味着什么，和土地私有权同时被发明出来的货币，向他做了说明。土地现在可以成为出卖和抵押的商品了。土地所有权刚一确立，抵押制就被发明出来了（见关于雅典的一节）。像杂婚和卖淫紧紧跟着"},{"id":"v-concentration","label":"v-concentration","lineStart":1367,"lineEnd":1367,"text":"这样，随着贸易的扩大，随着货币和货币高利贷、土地所有权和抵押制的产生，财富便迅速地积聚和集中到一个人数很少的阶级手中，与此同时，大众日益贫困化，贫民的人数也日益增长。新的财富贵族，既然从一开始就己经同旧的部落贵族不相符合，就把部落贵族完全排挤到后面去了（在雅典，在罗马，以及在德意志人中间)。随着这种按照财富把自由人分成各个阶级的划分，奴隶的人数特别是在希腊便大大增加起来②，奴隶的强制性劳动成了整个社会的上层建筑所赖以建立的基础。"},{"id":"v-obsolete","label":"v-obsolete","lineStart":1375,"lineEnd":1375,"text":"地区中。这种情况早已不存在了。氏族和部落到处都杂居了起来，到处都有奴隶、被保护民和外地人在自由民中间居住着。直到野蛮时代中级阶段末期才达到的定居状态，由于居住地受商业活动、职业变换和土地所有权转让的影响而变动不定，所以时常遭到破坏。氏族团体的成员再也不能集会来处理自己的公共事务了；只有不重要的事情，例如宗教节日，还可勉强进行。除了氏族团体有责任并且能够予以保证的需要和利益以外，由于生产条件的变革及其所引起的社会结构中的变化，又产生了新的需要和利益，这些新的需要和利益不仅同旧的氏族制度格格不入，而且在各方面都是同它对立的。由于分工而产生的手工业集团的利益，同乡村对立而产生的城市的特殊需要，都要求有新的机关；但是，每一个这种集团都是由属于极不相同的氏族、胞族和部落的人们组成的，甚至还包括外地人在内：因此，这种机关必须在氏族制度以外，与它并列地形成，从而又是与它对立的。一而在每个氏族团体中，也表现出利益的冲突，这种冲突由于富人和穷人、高利贷者和债务人结合于同一氏族和同一部落中而达到最尖锐的地步。一此外，又加上了大批新的、与氏族公社无关的居民，他们在国内已经可以成为一种力量，像罗马的情况那样，同时他们人数太多，不可能被逐渐容纳到血缘亲属的氏族和部落中来。氏族公社作为一种闭关自守的享有特权的团体对抗着这一批居民；原始的自然产生的民主制变成了可憎的贵族制。一最后，氏族制度是从那种没有任何内部对立的社会中生长出来的，而且只适合于这种社会。除了舆论以外，它没有任何强制手段。但是现在产生了这样一个社会，它由于自己的全部经济生活条件而必然分裂为自由民和奴隶，进行剥削的富人和被剥削的穷人，而这个社会不仅再也不能调和"},{"id":"v-replaced","label":"v-replaced","lineStart":1380,"lineEnd":1380,"text":"这种对立，反而要使这些对立日益尖锐化。一个这样的社会，只能或者存在于这些阶级相互间连续不断的公开斗争中，或者存在于第三种力量的统治下，这第三种力量似乎站在相互斗争着的各阶级之上，压制它们的公开的冲突，顶多容许阶级斗争在经济领域内以所谓合法形式进行。氏族制度已经过时了。它被分工及其后果即社会之分裂为阶级所炸毁。它被国家代替了。"},{"id":"v-three-paths","label":"v-three-paths","lineStart":1381,"lineEnd":1381,"text":"前面我们已经分别研究了国家在氏族制度的废墟上兴起的三种主要形式。雅典是最纯粹、最典型的形式：在这里，国家是直接地和主要地从氏族社会本身内部发展起来的阶级对立中产生的。在罗马，氏族社会变成了闭关自守的贵族，贵族的四周则是人数众多的、站在这一社会之外的、没有权利只有义务的平民；平民的胜利炸毁了旧的氏族制度，并在它的废墟上面建立了国家，而氏族贵族和平民不久便完全溶化在国家中了。最后，在战胜了罗马帝国的德意志人中间，国家是作为征服外国广大领土的直接结果而产生的，氏族制度是不能提供任何手段来统治这样广阔的领土的。但是，由于同这种征服相联系的，既不是跟旧有居民的严重斗争，也不是更加进步的分工；由于被征服者和征服者差不多处于同一经济发展阶段，从而社会的经济基础仍然和从前一样，所以，氏族制度还能够以改变了的、地区的形式，即以马尔克制度的形式，继续存在几个世纪：甚至在以后的贵族氏族和城市望族的氏族中，甚至在农民的氏族中，例如在迪特马尔申①，还以削弱了的形式复兴了一个时期。"},{"id":"v-state","label":"v-state","lineStart":1387,"lineEnd":1387,"text":"可见，国家决不是从外部强加于社会的一种力量。国家也不像黑格尔所断言的是道德观念的现实”，“理性的形象和现实”。1s1勿宁说，国家是社会在一定发展阶段上的产物；国家是表示：这个社会陷入了不可解决的自我矛盾，分裂为不可调和的对立面而又无力摆脱这些对立面。而为了使这些对立面，这些经济利益互相冲突的阶级，不致在无谓的斗争中把自己和社会消灭，就需要有一种表面上驾于社会之上的力量，这种力量应当缓和冲突，把冲突保持在“秩序”的范围以内；这种从社会中产生但又自居于社会之上并且日益同社会脱离的力量，就是国家。"},{"id":"v-territory","label":"v-territory","lineStart":1388,"lineEnd":1388,"text":"国家和旧的氏族组织不同的地方，第一点就是它按地区来划分它的国民。由血缘关系形成和保持下去的旧的氏族公社，正如我们已经看到的，已经很不够了，这多半是因为它们是以氏族成员与一定地区的联系为前提的，而这种联系早已不复存在。地区依然，但人们已经是流动的了。因此，按地区来划分就被作为出发点，并允许公民在他们居住的地方实现他们的公共权利和义务，不管他们属于哪一氏族或哪一部落。这种按照居住地组织国民的办法，是一切国家共同的。因此，我们才觉得这种办法很自然：但是我们已经看到，当它在雅典和罗马能够代替按血族来组织的旧办法以前，曾经需要进行多么顽强而长久的斗争。"},{"id":"v-public","label":"v-public","lineStart":1389,"lineEnd":1389,"text":"第二个不同点，是公共权力的设立，这种公共权力已不再同自己组织为武装力量的居民直接符合了。这个特殊的公共权力之所以需要，是因为自从社会分裂为阶级以后，居民的自动的武装组织已经成为不可能了。奴隶也包括在居民以内；9万雅典公民，对于365000奴隶来说，只是一个特权阶级。雅典民主制的国民军，是种贵族的、用来对付奴隶的公共权力，它控制奴隶使之服从：但"},{"id":"v-coercion","label":"v-coercion","lineStart":1394,"lineEnd":1394,"text":"是如前所述，为了也控制公民使之服从，宪兵队也成为必要了。这种公共权力在每一个国家里都存在。构成这种权力的，不仅有武装的人，而且还有物质的附属物，如监狱和各种强制机关，这些东西都是以前的氏族社会所没有的。在阶级对立还没有发展起来的社会和僻远的地区，这种公共权力可能极其微小，几乎是若有若无的，像有时在美利坚合众国的某些地方所看到的那样。但是，随着国内阶级对立的尖锐化，随着彼此相邻的各国的扩大和它们人口的增加，公共权力就日益加强。就拿我们今天的欧洲来看吧，在这里，阶级斗争和侵略竞争已经把公共权力猛增到势将吞食整个社会甚至吞食国家的高度。"},{"id":"v-taxes","label":"v-taxes","lineStart":1395,"lineEnd":1395,"text":"为了维持这种公共权力，就需要公民缴纳费用一捐税。捐税是以前的氏族社会完全没有的。但是现在我们却十分熟悉它了。随着文明时代的向前进展，甚至捐税也不够了；国家就发行期票，借债，即发行公债。关于这点，老欧洲也已经有不少故事可讲了。"},{"id":"v-officials","label":"v-officials","lineStart":1396,"lineEnd":1396,"text":"官吏既然掌握着公共权力和征税权，他们就作为社会机关而驾于社会之上。从前人们对于氏族制度的机关的那种自由的、自愿的尊敬，即使他们能够获得，也不能使他们满足了；他们作为日益同社会脱离的权力的代表，一定要用特别的法律来取得尊敬，由于这种法律，他们就享有特殊神圣和不可侵犯的地位了。文明国家的一个最微不足道的警察，都拥有比氏族社会的全部机关加在一起还要大的权威”；但是文明时代最有势力的王公和最伟大的国家要人或统帅，也可能要羡慕最平凡的氏族首长所享有的，不是用强迫手段获得的，无可争辩的尊敬。后者是站在社会之中，而前者却不得不企图成为一种处于社会之外和社会之上的东西。"},{"id":"v-rule-exception","label":"v-rule-exception","lineStart":1401,"lineEnd":1401,"text":"由于国家是从控制阶级对立的需要中产生的，同时又是在这些阶级的冲突中产生的，所以，它照例是最强大的、在经济上占统治地位的阶级的国家，这个阶级借助于国家而在政治上也成为占统治地位的阶级，因而获得了镇压和剥削被压迫阶级的新手段。因此，古代的国家首先是奴隶主用来镇压奴隶的国家，封建国家是贵族用来镇压农奴和依附农的机关，现代的代议制的国家是资本剥削雇佣劳动的工具。但也例外地有这样的时期，那时互相斗争的各阶级达到了这样势均力敌的地步，以致国家权力作为表面上的调停人而暂时得到了对于两个阶级的某种独立性。十七世纪和"},{"id":"v-balance-cases","label":"v-balance-cases","lineStart":1402,"lineEnd":1402,"text":"十八世纪的专制君主制，就是这样，它使贵族和市民等级彼此保持平衡；法兰西第一帝国特别是第二帝国的波拿巴主义，也是这样，它唆使无产阶级去反对资产阶级，又唆使资产阶级来反对无产阶级。使统治者和被统治者都显得同样滑稽可笑的这方面的最新成就，就是俾斯麦民族的新德意志帝国：在这里，资本家和工人彼此保持平衡，并为了衣不蔽体的普鲁士土容克的利益而遭受同等的欺骗。"},{"id":"v-property-not-essential","label":"v-property-not-essential","lineStart":1403,"lineEnd":1403,"text":"此外，在历史上的大多数国家中，公民的权利是按照财产状况分级规定的，这直接地宣告国家是有产阶级用来防御无产者阶级的组织。在按照财产状况划分阶级的雅典和罗马，就已经是这样。在中世纪的封建国家中，也是这样，在这里，政治的权力地位是按照地产来排列的。这也表现在现代的代议制的国家的选举资格上面。但是，对财产差别的这种政治上的承认，决不是本质的东西。相反地，它标志着国家发展的低级阶段。国家的最高形式，民主共和国，在我们现代的社会条件下正日益成为一种不可避免的必然性，它是无产阶级和资产阶级之间的最后决定性斗争只能在"},{"id":"v-republic","label":"v-republic","lineStart":1408,"lineEnd":1408,"text":"其中进行到底的国家形式，一这种民主共和国已经不再正式讲什么财产差别了。在这种国家中，财富是间接地但也是更可靠地运用它的权力的：其形式一方面是直接收买官吏（美国是这方面典型例子)，另一方面是政府和交易所结成联盟，而公债愈增长，股份公司愈是不仅把运输业而且把生产本身集中在自己手中，愈是把交易所变成自己的中心，这一联盟就愈容易实现。除了美国以外，最新的法兰西共和国，也是这方面的一个显著例证，甚至一本正经的瑞士，在这方面也作出了一份贡献。不过，为了使政府和交易所结成这种兄弟般的联盟，并不一定要有民主共和国，除英国以外，新德意志帝国也证明了这一点，在德国，很难说普选制究竟是把谁拾得更高些，是把俾斯麦还是把布莱希勒德。最后，有产阶级是直接通过用普选制来统治的。只要被压迫阶级一在这里就是无产阶级一还没有成熟到能够自己解放自己，这个阶级的大多数人就仍将承认现存的社会秩序是唯一可能的秩序，而在政治上成为资本家阶级的尾巴，构成它的极左翼。但是，随着无产阶级成熟到能够自己解放自己，它就作为独立的党派结合起来，选举自己的代表，而不是选举资本家的代表了。因此，普选制是测量工人阶级成熟性的标尺。在现今的国家里，普选制不能而且永远不会提供更多的东西；不过，这也就足够了。在普选制的温度计标示出工人的沸点的那一天，他们以及资本家同样都知道该怎么办了。"},{"id":"v-historical","label":"v-historical","lineStart":1409,"lineEnd":1409,"text":"所以，国家并不是从来就有的。曾经有过不需要国家、而且根本不知国家和国家权力为何物的社会。在经济发展到一定阶段而必然使社会分裂为阶级时，国家就由于这种分裂而成为必要了。现在我们正在以迅速的步伐走向这样的生产发展阶段，在这个阶段上，这些阶级的存在不仅不再必要，而且成了生产的直接障碍。阶"},{"id":"v-future","label":"v-future","lineStart":1414,"lineEnd":1414,"text":"级不可避免地要消失，正如它们从前不可避免地产生一样。随着阶级的消失，国家也不可避免地要消失。以生产者自由平等的联合体为基础的、按新方式来组织生产的社会，将把全部国家机器放到它应该去的地方，即放到古物陈列馆去，同纺车和青铜斧陈列在"},{"id":"v-definition","label":"v-definition","lineStart":1416,"lineEnd":1416,"text":"所以，根据以上所述，文明时代乃是社会发展的一个阶段，在这个阶段上，分工，由分工而产生的个人之间的交换，以及把这两个过程结合起来的商品生产，得到了充分的发展，完全改变了先前的整个社会。"},{"id":"v-exchange","label":"v-exchange","lineStart":1419,"lineEnd":1419,"text":"随着商品生产，即不是为了自己消费而是为了交换的生产的出现，产品必然易手。生产者在交换的时候交出自己的产品；他不再知道产品的结局将会怎样。当货币以及随货币而来的商人作为"},{"id":"v-no-controller","label":"v-no-controller","lineStart":1424,"lineEnd":1424,"text":"生产者之间的中介人插进来的时候，交换过程就变得更加错综复杂，产品的最终命运就变得更加不确定了。商人是很多的，他们谁都不知道谁在做什么。商品现在已经不仅是从一手转到另一手，而且是从一个市场转到另一个市场；生产者丧失了对自己生活领域内全部生产的支配权，这种支配权商人也没有得到。产品和生产都任凭偶然性来摆布了。"},{"id":"v-laws","label":"v-laws","lineStart":1425,"lineEnd":1425,"text":"但是，偶然性只是相互依存性的一极，它的另一极叫做必然性。在似乎也是受偶然性支配的自然界中，我们早就证实在每一个领域内都有在这种偶然性中为自己开辟道路的内在的必然性和规律性。然而适用于自然界的，也适用于社会。一种社会活动，一系列社会过程，愈是越出人们的自觉的控制，愈是越出他们支配的范围，愈是显得受纯粹的偶然性的摆布，它所固有的内在规律就愈是以自然的必然性在这种偶然性中为自己开辟道路。这种规律也支配着商品生产和商品交换的偶然性：它们作为异己的、起初甚至是莫名其妙的、其本性尚待努力研究和认识的力量，同各个生产者和交换的参加者相对立。商品生产的这些经济规律，在这个生产形式的各个不同的发展阶段上都有所变化，但是总的说来，整个文明期都处在这些规律的支配之下。直到今天，产品仍然支配着生产者；直到今天，社会的全部生产仍然不是由共同制定的计划，而是由盲目的规律来调节，这些盲目的规律，以自发的力量，终归是在周期性商业危机的风暴中，起着自己的作用。"},{"id":"v-exploitation","label":"v-exploitation","lineStart":1432,"lineEnd":1432,"text":"随着在文明时代获得最充分发展的奴隶制的出现，就发生了社会分成剥削阶级和被剥削阶级的第一次大分裂。这种分裂继续存在于整个文明期。奴隶制是古代世界所固有的第一个剥削形式：继之而来的是中世纪的农奴制和近代的雇佣劳动制。这就是文明时代的三大时期所特有的三大奴役形式：公开的而近来是隐蔽的奴隶制始终伴随着文明时代。"},{"id":"v-summary","label":"v-summary","lineStart":1435,"lineEnd":1435,"text":"(2)出现了作为生产者之间的中介阶级的商人；(3)出现了土地私有制和抵押制；（④）出现了作为占统治地位的生产形式的奴隶劳动。与文明时代相适应并随着它而彻底确立了自己的统治地位的家庭形式是一夫一妻制、男子对妇女的统治，以及作为社会经济单位的个体家庭。国家是文明社会的概括，它在一切典型的时期毫无例外地都是统治阶级的国家，并且在一切场合在本质上都是镇压被压迫被剥削阶级的机器。此外，文明时代还有如下的特征：一方面，是把城市和乡村的对立作为整个社会分工的基础固定下来；另一方面，是实行所有者甚至在死后也能够据以处理自己财产的遗嘱制度。这种同古代氏族制度直接冲突的制度，在雅典直到梭伦时代之前还没有过；在罗马，它很早就已经实行了，究竟在什么时候我们不知道②；在德意志人中间，这种制度是"},{"id":"v-contradiction","label":"v-contradiction","lineStart":1444,"lineEnd":1444,"text":"由于文明时代的基础是一个阶级对另一个阶级的剥削，所以它的全部发展都是在经常的矛盾中进行的。生产的每一进步，同时也就是被压迫阶级即大多数人的生活状况的一个退步。对一些人是好事的，对另一些人必然是坏事，一个阶级的任何新的解放，必然是对另一个阶级的新的压迫。这一情况的最明显的例子就是机器的采用，其后果现在已是众所周知的了。如果说在野蛮人中间，像我们已经看到的那样，不大能够区别权利和义务，那末文明时代却使这两者之间的区别和对立连最愚蠢的人都能看得出来，因"},{"id":"v-morgan","label":"v-morgan","lineStart":1454,"lineEnd":1454,"text":"现在把摩尔根对文明时代的评断引在下面作一个结束：“自从进入文明时代以来，财富的增长是如此巨大，它的形式是如此繁多，它的用途是如此广泛，为了所有者的利益而对它进行的管理又是如此巧妙，以致这种财富对人民说来变成了一种无法控制的力量。人类的智慧在自己的创造物面前感到迷惘而不知所措了。然而，总有一天，人类的理智一定会强健到能够支配财富，一定会规定国家对它所保护的财产的关系，以及所有者的权利的范围。社会的利益绝对地高于个人的利益，必须使这两者处于一种公正而和谐的关系之中。只要进步仍将是未来的规律，像它对于过去那样，那末单纯追求财富就不是人类的最终的命运了。自从文明时代开始以来所经"},{"id":"v-final","label":"v-final","lineStart":1460,"lineEnd":1460,"text":"过的时间，只是人类已经经历过的生存时间的一小部分，只是人类将要经历的生存时间的一小部分。社会的分解，即将成为以财富为唯一的最终目的的那个历程的终结，因为这一历程包含着自我消灭的因素。管理上的民主，社会中的博爱，权利的平等，普及的教育，将揭开社会的下一个更高的阶段，经验、理智和科学正在不断向这个阶段努力。这将是古代氏族的自由、平等和博爱的复活，但却是在更高级形式上的复活。”（摩尔根“古代社会”第552页)183"}]}</script></body></html>
