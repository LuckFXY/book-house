-e-suf1"},{"kind":"ocr","label":"看 OCR 原书 · 充分条件：前件方向","href":"./source.html#book=formal-logic-1976&from=1152&to=1152&ref=logic-08.html%23excerpt-e-suf1"},{"kind":"excerpt","label":"假言推理","href":"./logic-08.html#excerpt-e-hypothetical"},{"kind":"ocr","label":"看 OCR 原书 · 假言推理","href":"./source.html#book=formal-logic-1976&from=1135&to=1135&ref=logic-08.html%23excerpt-e-hypothetical"},{"kind":"excerpt","label":"充分条件：后件方向","href":"./logic-08.html#excerpt-e-suf2"},{"kind":"ocr","label":"看 OCR 原书 · 充分条件：后件方向","href":"./source.html#book=formal-logic-1976&from=1153&to=1153&ref=logic-08.html%23excerpt-e-suf2"},{"kind":"excerpt","label":"省略前提也需核实","href":"./logic-08.html#excerpt-e-hidden"},{"kind":"ocr","label":"看 OCR 原书 · 省略前提也需核实","href":"./source.html#book=formal-logic-1976&from=1140&to=1140&ref=logic-08.html%23excerpt-e-hidden"}]},"reader":{"anchors":[],"paras":[]},"unit":{"id":"logic-08","title":"第八讲·怎样使推理有逻辑性（一）","output":"logic-08.html"},"excerpts":[{"id":"e-deduction","label":"本讲的演绎推理范围","lineStart":1020,"lineEnd":1020,"text":"演绎推理主要包括三段论、、假言推理、选言推理。"},{"id":"e-syllogism","label":"三段论结构","lineStart":1033,"lineEnd":1033,"text":"三段论就是由三个简单判断和三个不同的概念组成，并且有一个共同的概念在前提中起媒介作用的演绎推理。"},{"id":"e-terms","label":"中项的作用","lineStart":1034,"lineEnd":1034,"text":"结论中不出现而在前提中起媒介作用的那个共同概念叫中项"},{"id":"e-omission","label":"补全省略式","lineStart":1043,"lineEnd":1043,"text":"我们在听别人说话和阅读文章时，经会遇到大量的三段论表现为省略式：或者省略了大前提，或者省略了小前提，甚至省略了结论。"},{"id":"e-figure","label":"格由中项位置确定","lineStart":1076,"lineEnd":1076,"text":"三段论的格，就是由于中项在前提中位置不同所构成的各种不相同的三段论形式。"},{"id":"e-three","label":"防止中项偷换","lineStart":1103,"lineEnd":1103,"text":"一个三段论只能有三个不同的概念。"},{"id":"e-middle","label":"中项至少一次周延","lineStart":1109,"lineEnd":1109,"text":"中项在前提中至少有一次是周延的。"},{"id":"e-distributed","label":"周延的含义","lineStart":1109,"lineEnd":1109,"text":"周延问题，就是在一个判断中对于主项或谓项的外延断定了多少的问题。如果断定了全部那就是周延的，如果没有断定全部，那就是不周延的。"},{"id":"e-noexpand","label":"结论不可扩大周延范围","lineStart":1119,"lineEnd":1119,"text":"在前提中不周延的概念，在结论中也不应周延。"},{"id":"e-hypothetical","label":"假言推理","lineStart":1135,"lineEnd":1135,"text":"这种大前提是假言判断的推理，就叫假言推理。"},{"id":"e-hidden","label":"省略前提也需核实","lineStart":1140,"lineEnd":1140,"text":"当~·个假言推理以省略式出现时，我们要注意被省略的部分是什么，它的真实性如何。"},{"id":"e-suf1","label":"充分条件：前件方向","lineStart":1152,"lineEnd":1152,"text":"肯定前件，就能肯定后件，否定前件，不能否定后件，"},{"id":"e-suf2","label":"充分条件：后件方向","lineStart":1153,"lineEnd":1153,"text":"否定后件，就能否定前件，肯定后件，不能肯定前件。"},{"id":"e-nec1","label":"必要条件：前件方向","lineStart":1189,"lineEnd":1189,"text":"否定前件，就能否定后件，肯定前件，不能肯定后件："},{"id":"e-nec2","label":"必要条件：后件方向","lineStart":1190,"lineEnd":1190,"text":"肯定后件，就能肯定前件，否定后件，不能否定前件。"},{"id":"e-iff","label":"充分必要条件支持双向","lineStart":1230,"lineEnd":1230,"text":"充分必要条件假言判断的特点是：前件存在，后件就一定存在，前件不存在，后件也一定不存在。"},{"id":"e-recognize","label":"先辨条件类型","lineStart":1234,"lineEnd":1234,"text":"认清大前提，对于正确地进行假言推理具有重要意义。"},{"id":"e-exclusive","label":"不相容选言的保证","lineStart":1284,"lineEnd":1284,"text":"有一个支判断是真的，并且只能有一个支判断是真的。"},{"id":"e-inclusive","label":"相容选言规则","lineStart":1305,"lineEnd":1305,"text":"否定一部分支判断，就要肯定另一部分支判断，但是，肯定-一部分支判断，不能否定另一部分支判断。"},{"id":"e-remainder","label":"相容选言的本讲形式","lineStart":1306,"lineEnd":1306,"text":"相容的选言推理只有一个正确的形式，即否定肯定式"},{"id":"e-dilemma","label":"二难推理的组合","lineStart":1351,"lineEnd":1351,"text":"大前提是-一个包含两个支判断的选言判断，小前提是两个假言判断。"},{"id":"e-dilemmarule","label":"二难也受两类规则约束","lineStart":1358,"lineEnd":1358,"text":"由于二难推理是假言推理和选言推理的结合，因此，它必须分别遵守假言推理和选言推理的规则"}]}</script></body></html>
